autogenerate_revision_name:
    Type: TypeBool
    Description: |-
        If set to 'true', the revision name (template.metadata.name) will be omitted and
        autogenerated by Cloud Run. This cannot be set to 'true' while 'template.metadata.name'
        is also set.
        (For legacy support, if 'template.metadata.name' is unset in state while
        this field is set to false, the revision name will still autogenerate.)
    Computed: "true"
location:
    Type: TypeString
    Description: The location of the cloud run instance. eg us-central1
    Required: "true"
metadata:
    Type: TypeList
    Description: |-
        Metadata associated with this Service, including name, namespace, labels,
        and annotations.
    Computed: "true"
    Properties:
        annotations:
            Type: TypeMap
            Description: |-
                Annotations is a key value map stored with a resource that
                may be set by external tools to store and retrieve arbitrary metadata. More
                info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

                **Note**: The Cloud Run API may add additional annotations that were not provided in your config.
                If terraform plan shows a diff where a server-side annotation is added, you can add it to your config
                or apply the lifecycle.ignore_changes rule to the metadata.0.annotations field.

                Annotations with 'run.googleapis.com/' and 'autoscaling.knative.dev' are restricted. Use the following annotation
                keys to configure features on a Service:

                - 'run.googleapis.com/binary-authorization-breakglass' sets the [Binary Authorization breakglass](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--breakglass).
                - 'run.googleapis.com/binary-authorization' sets the [Binary Authorization](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--binary-authorization).
                - 'run.googleapis.com/client-name' sets the client name calling the Cloud Run API.
                - 'run.googleapis.com/custom-audiences' sets the [custom audiences](https://cloud.google.com/sdk/gcloud/reference/alpha/run/deploy#--add-custom-audiences)
                  that can be used in the audience field of ID token for authenticated requests.
                - 'run.googleapis.com/description' sets a user defined description for the Service.
                - 'run.googleapis.com/ingress' sets the [ingress settings](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--ingress)
                  for the Service. For example, '"run.googleapis.com/ingress" = "all"'.
                - 'run.googleapis.com/launch-stage' sets the [launch stage](https://cloud.google.com/run/docs/troubleshooting#launch-stage-validation)
                  when a preview feature is used. For example, '"run.googleapis.com/launch-stage": "BETA"'

                **Note**: This field is non-authoritative, and will only manage the annotations present in your configuration.
                Please refer to the field 'effective_annotations' for all of the annotations present on the resource.
            Computed: "true"
        effective_annotations:
            Type: TypeMap
            Description: All of annotations (key/value pairs) present on the resource in GCP, including the annotations configured through Terraform, other clients and services.
            Computed: "true"
        effective_labels:
            Type: TypeMap
            Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
            Computed: "true"
        generation:
            Type: TypeInt
            Description: A sequence number representing a specific generation of the desired state.
            Computed: "true"
        labels:
            Type: TypeMap
            Description: |-
                Map of string keys and values that can be used to organize and categorize
                (scope and select) objects. May match selectors of replication controllers
                and routes.

                **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
                Please refer to the field 'effective_labels' for all of the labels present on the resource.
            Computed: "true"
        namespace:
            Type: TypeString
            Description: |-
                In Cloud Run the namespace must be equal to either the
                project ID or project number.
            Computed: "true"
        resource_version:
            Type: TypeString
            Description: |-
                An opaque value that represents the internal version of this object that
                can be used by clients to determine when objects have changed. May be used
                for optimistic concurrency, change detection, and the watch operation on a
                resource or set of resources. They may only be valid for a
                particular resource or set of resources.
            Computed: "true"
        self_link:
            Type: TypeString
            Description: SelfLink is a URL representing this object.
            Computed: "true"
        terraform_labels:
            Type: TypeMap
            Description: |-
                The combination of labels configured directly on the resource
                 and default labels configured on the provider.
            Computed: "true"
        uid:
            Type: TypeString
            Description: |-
                UID is a unique id generated by the server on successful creation of a resource and is not
                allowed to change on PUT operations.
            Computed: "true"
name:
    Type: TypeString
    Description: |-
        Name must be unique within a Google Cloud project and region.
        Is required when creating resources. Name is primarily intended
        for creation idempotence and configuration definition. Cannot be updated.
        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
    Required: "true"
project:
    Type: TypeString
    Optional: "true"
status:
    Type: TypeList
    Description: The current status of the Service.
    Computed: "true"
    Properties:
        conditions:
            Type: TypeList
            Description: Array of observed Service Conditions, indicating the current ready state of the service.
            Computed: "true"
            Properties:
                message:
                    Type: TypeString
                    Description: Human readable message indicating details about the current status.
                    Computed: "true"
                reason:
                    Type: TypeString
                    Description: One-word CamelCase reason for the condition's current status.
                    Computed: "true"
                status:
                    Type: TypeString
                    Description: Status of the condition, one of True, False, Unknown.
                    Computed: "true"
                type:
                    Type: TypeString
                    Description: Type of domain mapping condition.
                    Computed: "true"
        latest_created_revision_name:
            Type: TypeString
            Description: |-
                From ConfigurationStatus. LatestCreatedRevisionName is the last revision that was created
                from this Service's Configuration. It might not be ready yet, for that use
                LatestReadyRevisionName.
            Computed: "true"
        latest_ready_revision_name:
            Type: TypeString
            Description: |-
                From ConfigurationStatus. LatestReadyRevisionName holds the name of the latest Revision
                stamped out from this Service's Configuration that has had its "Ready" condition become
                "True".
            Computed: "true"
        observed_generation:
            Type: TypeInt
            Description: |-
                ObservedGeneration is the 'Generation' of the Route that was last processed by the
                controller.

                Clients polling for completed reconciliation should poll until observedGeneration =
                metadata.generation and the Ready condition's status is True or False.
            Computed: "true"
        traffic:
            Type: TypeList
            Description: |-
                Traffic specifies how to distribute traffic over a collection of Knative Revisions
                and Configurations
            Computed: "true"
            Properties:
                latest_revision:
                    Type: TypeBool
                    Description: |-
                        LatestRevision may be optionally provided to indicate that the latest ready
                        Revision of the Configuration should be used for this traffic target. When
                        provided LatestRevision must be true if RevisionName is empty; it must be
                        false when RevisionName is non-empty.
                    Computed: "true"
                percent:
                    Type: TypeInt
                    Description: Percent specifies percent of the traffic to this Revision or Configuration.
                    Computed: "true"
                revision_name:
                    Type: TypeString
                    Description: RevisionName of a specific revision to which to send this portion of traffic.
                    Computed: "true"
                tag:
                    Type: TypeString
                    Description: Tag is optionally used to expose a dedicated url for referencing this target exclusively.
                    Computed: "true"
                url:
                    Type: TypeString
                    Description: |-
                        URL displays the URL for accessing tagged traffic targets. URL is displayed in status,
                        and is disallowed on spec. URL must contain a scheme (e.g. http://) and a hostname,
                        but may not contain anything else (e.g. basic auth, url path, etc.)
                    Computed: "true"
        url:
            Type: TypeString
            Description: |-
                From RouteStatus. URL holds the url that will distribute traffic over the provided traffic
                targets. It generally has the form
                https://{route-hash}-{project-hash}-{cluster-level-suffix}.a.run.app
            Computed: "true"
template:
    Type: TypeList
    Description: |-
        template holds the latest specification for the Revision to
        be stamped out. The template references the container image, and may also
        include labels and annotations that should be attached to the Revision.
        To correlate a Revision, and/or to force a Revision to be created when the
        spec doesn't otherwise change, a nonce label may be provided in the
        template metadata. For more details, see:
        https://github.com/knative/serving/blob/main/docs/client-conventions.md#associate-modifications-with-revisions

        Cloud Run does not currently support referencing a build that is
        responsible for materializing the container image from source.
    Computed: "true"
    Properties:
        metadata:
            Type: TypeList
            Description: |-
                Optional metadata for this Revision, including labels and annotations.
                Name will be generated by the Configuration. To set minimum instances
                for this revision, use the "autoscaling.knative.dev/minScale" annotation
                key. To set maximum instances for this revision, use the
                "autoscaling.knative.dev/maxScale" annotation key. To set Cloud SQL
                connections for the revision, use the "run.googleapis.com/cloudsql-instances"
                annotation key.
            Computed: "true"
            Properties:
                annotations:
                    Type: TypeMap
                    Description: |-
                        Annotations is a key value map stored with a resource that
                        may be set by external tools to store and retrieve arbitrary metadata. More
                        info: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations

                        **Note**: The Cloud Run API may add additional annotations that were not provided in your config.
                        If terraform plan shows a diff where a server-side annotation is added, you can add it to your config
                        or apply the lifecycle.ignore_changes rule to the metadata.0.annotations field.

                        Annotations with 'run.googleapis.com/' and 'autoscaling.knative.dev' are restricted. Use the following annotation
                        keys to configure features on a Revision template:

                        - 'autoscaling.knative.dev/maxScale' sets the [maximum number of container
                          instances](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--max-instances) of the Revision to run.
                        - 'autoscaling.knative.dev/minScale' sets the [minimum number of container
                          instances](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--min-instances) of the Revision to run.
                        - 'run.googleapis.com/client-name' sets the client name calling the Cloud Run API.
                        - 'run.googleapis.com/cloudsql-instances' sets the [Cloud SQL
                          instances](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--add-cloudsql-instances) the Revision connects to.
                        - 'run.googleapis.com/cpu-throttling' sets whether to throttle the CPU when the container is not actively serving
                          requests. See https://cloud.google.com/sdk/gcloud/reference/run/deploy#--[no-]cpu-throttling.
                        - 'run.googleapis.com/encryption-key-shutdown-hours' sets the number of hours to wait before an automatic shutdown
                          server after CMEK key revocation is detected.
                        - 'run.googleapis.com/encryption-key' sets the [CMEK key](https://cloud.google.com/run/docs/securing/using-cmek)
                          reference to encrypt the container with.
                        - 'run.googleapis.com/execution-environment' sets the [execution
                          environment](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--execution-environment)
                          where the application will run.
                        - 'run.googleapis.com/post-key-revocation-action-type' sets the
                          [action type](https://cloud.google.com/sdk/gcloud/reference/run/deploy#--post-key-revocation-action-type)
                          after CMEK key revocation.
                        - 'run.googleapis.com/secrets' sets a list of key-value pairs to set as
                          [secrets](https://cloud.google.com/run/docs/configuring/secrets#yaml).
                        - 'run.googleapis.com/sessionAffinity' sets whether to enable
                          [session affinity](https://cloud.google.com/sdk/gcloud/reference/beta/run/deploy#--[no-]session-affinity)
                          for connections to the Revision.
                        - 'run.googleapis.com/startup-cpu-boost' sets whether to allocate extra CPU to containers on startup.
                          See https://cloud.google.com/sdk/gcloud/reference/run/deploy#--[no-]cpu-boost.
                        - 'run.googleapis.com/vpc-access-connector' sets a [VPC connector](https://cloud.google.com/run/docs/configuring/connecting-vpc#terraform_1)
                          for the Revision.
                        - 'run.googleapis.com/vpc-access-egress' sets the outbound traffic to send through the VPC connector for this resource.
                          See https://cloud.google.com/sdk/gcloud/reference/run/deploy#--vpc-egress.
                    Computed: "true"
                generation:
                    Type: TypeInt
                    Description: A sequence number representing a specific generation of the desired state.
                    Computed: "true"
                labels:
                    Type: TypeMap
                    Description: |-
                        Map of string keys and values that can be used to organize and categorize
                        (scope and select) objects.
                    Computed: "true"
                name:
                    Type: TypeString
                    Description: |-
                        Name must be unique within a Google Cloud project and region.
                        Is required when creating resources. Name is primarily intended
                        for creation idempotence and configuration definition. Cannot be updated.
                    Computed: "true"
                namespace:
                    Type: TypeString
                    Description: |-
                        In Cloud Run the namespace must be equal to either the
                        project ID or project number. It will default to the resource's project.
                    Computed: "true"
                resource_version:
                    Type: TypeString
                    Description: |-
                        An opaque value that represents the internal version of this object that
                        can be used by clients to determine when objects have changed. May be used
                        for optimistic concurrency, change detection, and the watch operation on a
                        resource or set of resources. They may only be valid for a
                        particular resource or set of resources.
                    Computed: "true"
                self_link:
                    Type: TypeString
                    Description: SelfLink is a URL representing this object.
                    Computed: "true"
                uid:
                    Type: TypeString
                    Description: |-
                        UID is a unique id generated by the server on successful creation of a resource and is not
                        allowed to change on PUT operations.
                    Computed: "true"
        spec:
            Type: TypeList
            Description: RevisionSpec holds the desired state of the Revision (from the client).
            Computed: "true"
            Properties:
                container_concurrency:
                    Type: TypeInt
                    Description: |-
                        ContainerConcurrency specifies the maximum allowed in-flight (concurrent)
                        requests per container of the Revision. Values are:
                        - '0' thread-safe, the system should manage the max concurrency. This is
                            the default value.
                        - '1' not-thread-safe. Single concurrency
                        - '2-N' thread-safe, max concurrency of N
                    Computed: "true"
                containers:
                    Type: TypeList
                    Description: Containers defines the unit of execution for this Revision.
                    Computed: "true"
                    Properties:
                        args:
                            Type: TypeList
                            Description: |-
                                Arguments to the entrypoint.
                                The docker image's CMD is used if this is not provided.
                            Computed: "true"
                        command:
                            Type: TypeList
                            Description: |-
                                Entrypoint array. Not executed within a shell.
                                The docker image's ENTRYPOINT is used if this is not provided.
                            Computed: "true"
                        env:
                            Type: TypeSet
                            Description: List of environment variables to set in the container.
                            Computed: "true"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: Name of the environment variable.
                                    Computed: "true"
                                value:
                                    Type: TypeString
                                    Description: Defaults to "".
                                    Computed: "true"
                                value_from:
                                    Type: TypeList
                                    Description: Source for the environment variable's value. Only supports secret_key_ref.
                                    Computed: "true"
                                    Properties:
                                        secret_key_ref:
                                            Type: TypeList
                                            Description: Selects a key (version) of a secret in Secret Manager.
                                            Computed: "true"
                                            Properties:
                                                key:
                                                    Type: TypeString
                                                    Description: |-
                                                        A Cloud Secret Manager secret version. Must be 'latest' for the latest
                                                        version or an integer for a specific version.
                                                    Computed: "true"
                                                name:
                                                    Type: TypeString
                                                    Description: |-
                                                        The name of the secret in Cloud Secret Manager. By default, the secret is assumed to be in the same project.
                                                        If the secret is in another project, you must define an alias.
                                                        An alias definition has the form: :projects/{project-id|project-number}/secrets/.
                                                        If multiple alias definitions are needed, they must be separated by commas.
                                                        The alias definitions must be set on the run.googleapis.com/secrets annotation.
                                                    Computed: "true"
                        env_from:
                            Type: TypeList
                            Description: |-
                                List of sources to populate environment variables in the container.
                                All invalid keys will be reported as an event when the container is starting.
                                When a key exists in multiple sources, the value associated with the last source will
                                take precedence. Values defined by an Env with a duplicate key will take
                                precedence.
                            Computed: "true"
                            Properties:
                                config_map_ref:
                                    Type: TypeList
                                    Description: The ConfigMap to select from.
                                    Computed: "true"
                                    Properties:
                                        local_object_reference:
                                            Type: TypeList
                                            Description: The ConfigMap to select from.
                                            Computed: "true"
                                            Properties:
                                                name:
                                                    Type: TypeString
                                                    Description: Name of the referent.
                                                    Computed: "true"
                                        optional:
                                            Type: TypeBool
                                            Description: Specify whether the ConfigMap must be defined
                                            Computed: "true"
                                prefix:
                                    Type: TypeString
                                    Description: An optional identifier to prepend to each key in the ConfigMap.
                                    Computed: "true"
                                secret_ref:
                                    Type: TypeList
                                    Description: The Secret to select from.
                                    Computed: "true"
                                    Properties:
                                        local_object_reference:
                                            Type: TypeList
                                            Description: The Secret to select from.
                                            Computed: "true"
                                            Properties:
                                                name:
                                                    Type: TypeString
                                                    Description: Name of the referent.
                                                    Computed: "true"
                                        optional:
                                            Type: TypeBool
                                            Description: Specify whether the Secret must be defined
                                            Computed: "true"
                        image:
                            Type: TypeString
                            Description: |-
                                Docker image name. This is most often a reference to a container located
                                in the container registry, such as gcr.io/cloudrun/hello
                            Computed: "true"
                        liveness_probe:
                            Type: TypeList
                            Description: Periodic probe of container liveness. Container will be restarted if the probe fails.
                            Computed: "true"
                            Properties:
                                failure_threshold:
                                    Type: TypeInt
                                    Description: |-
                                        Minimum consecutive failures for the probe to be considered failed after
                                        having succeeded. Defaults to 3. Minimum value is 1.
                                    Computed: "true"
                                grpc:
                                    Type: TypeList
                                    Description: GRPC specifies an action involving a GRPC port.
                                    Computed: "true"
                                    Properties:
                                        port:
                                            Type: TypeInt
                                            Description: |-
                                                Port number to access on the container. Number must be in the range 1 to 65535.
                                                If not specified, defaults to the same value as container.ports[0].containerPort.
                                            Computed: "true"
                                        service:
                                            Type: TypeString
                                            Description: |-
                                                The name of the service to place in the gRPC HealthCheckRequest
                                                (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).
                                                If this is not specified, the default behavior is defined by gRPC.
                                            Computed: "true"
                                http_get:
                                    Type: TypeList
                                    Description: HttpGet specifies the http request to perform.
                                    Computed: "true"
                                    Properties:
                                        http_headers:
                                            Type: TypeList
                                            Description: Custom headers to set in the request. HTTP allows repeated headers.
                                            Computed: "true"
                                            Properties:
                                                name:
                                                    Type: TypeString
                                                    Description: The header field name.
                                                    Computed: "true"
                                                value:
                                                    Type: TypeString
                                                    Description: The header field value.
                                                    Computed: "true"
                                        path:
                                            Type: TypeString
                                            Description: Path to access on the HTTP server. If set, it should not be empty string.
                                            Computed: "true"
                                        port:
                                            Type: TypeInt
                                            Description: |-
                                                Port number to access on the container. Number must be in the range 1 to 65535.
                                                If not specified, defaults to the same value as container.ports[0].containerPort.
                                            Computed: "true"
                                initial_delay_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        Number of seconds after the container has started before the probe is
                                        initiated.
                                        Defaults to 0 seconds. Minimum value is 0. Maximum value is 3600.
                                    Computed: "true"
                                period_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        How often (in seconds) to perform the probe.
                                        Default to 10 seconds. Minimum value is 1. Maximum value is 3600.
                                    Computed: "true"
                                timeout_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        Number of seconds after which the probe times out.
                                        Defaults to 1 second. Minimum value is 1. Maximum value is 3600.
                                        Must be smaller than period_seconds.
                                    Computed: "true"
                        name:
                            Type: TypeString
                            Description: Name of the container
                            Computed: "true"
                        ports:
                            Type: TypeList
                            Description: List of open ports in the container.
                            Computed: "true"
                            Properties:
                                container_port:
                                    Type: TypeInt
                                    Description: Port number the container listens on. This must be a valid port number (between 1 and 65535). Defaults to "8080".
                                    Computed: "true"
                                name:
                                    Type: TypeString
                                    Description: If specified, used to specify which protocol to use. Allowed values are "http1" (HTTP/1) and "h2c" (HTTP/2 end-to-end). Defaults to "http1".
                                    Computed: "true"
                                protocol:
                                    Type: TypeString
                                    Description: Protocol for port. Must be "TCP". Defaults to "TCP".
                                    Computed: "true"
                        resources:
                            Type: TypeList
                            Description: Compute Resources required by this container. Used to set values such as max memory
                            Computed: "true"
                            Properties:
                                limits:
                                    Type: TypeMap
                                    Description: |-
                                        Limits describes the maximum amount of compute resources allowed.
                                        The values of the map is string form of the 'quantity' k8s type:
                                        https://github.com/kubernetes/kubernetes/blob/master/staging/src/k8s.io/apimachinery/pkg/api/resource/quantity.go
                                    Computed: "true"
                                requests:
                                    Type: TypeMap
                                    Description: |-
                                        Requests describes the minimum amount of compute resources required.
                                        If Requests is omitted for a container, it defaults to Limits if that is
                                        explicitly specified, otherwise to an implementation-defined value.
                                        The values of the map is string form of the 'quantity' k8s type:
                                        https://github.com/kubernetes/kubernetes/blob/master/staging/src/k8s.io/apimachinery/pkg/api/resource/quantity.go
                                    Computed: "true"
                        startup_probe:
                            Type: TypeList
                            Description: |-
                                Startup probe of application within the container.
                                All other probes are disabled if a startup probe is provided, until it
                                succeeds. Container will not be added to service endpoints if the probe fails.
                            Computed: "true"
                            Properties:
                                failure_threshold:
                                    Type: TypeInt
                                    Description: |-
                                        Minimum consecutive failures for the probe to be considered failed after
                                        having succeeded. Defaults to 3. Minimum value is 1.
                                    Computed: "true"
                                grpc:
                                    Type: TypeList
                                    Description: GRPC specifies an action involving a GRPC port.
                                    Computed: "true"
                                    Properties:
                                        port:
                                            Type: TypeInt
                                            Description: |-
                                                Port number to access on the container. Number must be in the range 1 to 65535.
                                                If not specified, defaults to the same value as container.ports[0].containerPort.
                                            Computed: "true"
                                        service:
                                            Type: TypeString
                                            Description: |-
                                                The name of the service to place in the gRPC HealthCheckRequest
                                                (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).
                                                If this is not specified, the default behavior is defined by gRPC.
                                            Computed: "true"
                                http_get:
                                    Type: TypeList
                                    Description: HttpGet specifies the http request to perform.
                                    Computed: "true"
                                    Properties:
                                        http_headers:
                                            Type: TypeList
                                            Description: Custom headers to set in the request. HTTP allows repeated headers.
                                            Computed: "true"
                                            Properties:
                                                name:
                                                    Type: TypeString
                                                    Description: The header field name.
                                                    Computed: "true"
                                                value:
                                                    Type: TypeString
                                                    Description: The header field value.
                                                    Computed: "true"
                                        path:
                                            Type: TypeString
                                            Description: Path to access on the HTTP server. If set, it should not be empty string.
                                            Computed: "true"
                                        port:
                                            Type: TypeInt
                                            Description: |-
                                                Port number to access on the container. Number must be in the range 1 to 65535.
                                                If not specified, defaults to the same value as container.ports[0].containerPort.
                                            Computed: "true"
                                initial_delay_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        Number of seconds after the container has started before the probe is
                                        initiated.
                                        Defaults to 0 seconds. Minimum value is 0. Maximum value is 240.
                                    Computed: "true"
                                period_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        How often (in seconds) to perform the probe.
                                        Default to 10 seconds. Minimum value is 1. Maximum value is 240.
                                    Computed: "true"
                                tcp_socket:
                                    Type: TypeList
                                    Description: TcpSocket specifies an action involving a TCP port.
                                    Computed: "true"
                                    Properties:
                                        port:
                                            Type: TypeInt
                                            Description: |-
                                                Port number to access on the container. Number must be in the range 1 to 65535.
                                                If not specified, defaults to the same value as container.ports[0].containerPort.
                                            Computed: "true"
                                timeout_seconds:
                                    Type: TypeInt
                                    Description: |-
                                        Number of seconds after which the probe times out.
                                        Defaults to 1 second. Minimum value is 1. Maximum value is 3600.
                                        Must be smaller than periodSeconds.
                                    Computed: "true"
                        volume_mounts:
                            Type: TypeList
                            Description: |-
                                Volume to mount into the container's filesystem.
                                Only supports SecretVolumeSources.
                            Computed: "true"
                            Properties:
                                mount_path:
                                    Type: TypeString
                                    Description: |-
                                        Path within the container at which the volume should be mounted.  Must
                                        not contain ':'.
                                    Computed: "true"
                                name:
                                    Type: TypeString
                                    Description: This must match the Name of a Volume.
                                    Computed: "true"
                        working_dir:
                            Type: TypeString
                            Description: |-
                                Container's working directory.
                                If not specified, the container runtime's default will be used, which
                                might be configured in the container image.
                            Computed: "true"
                service_account_name:
                    Type: TypeString
                    Description: |-
                        Email address of the IAM service account associated with the revision of the
                        service. The service account represents the identity of the running revision,
                        and determines what permissions the revision has. If not provided, the revision
                        will use the project's default service account.
                    Computed: "true"
                serving_state:
                    Type: TypeString
                    Description: |-
                        ServingState holds a value describing the state the resources
                        are in for this Revision.
                        It is expected
                        that the system will manipulate this based on routability and load.
                    Computed: "true"
                timeout_seconds:
                    Type: TypeInt
                    Description: TimeoutSeconds holds the max duration the instance is allowed for responding to a request.
                    Computed: "true"
                volumes:
                    Type: TypeList
                    Description: Volume represents a named volume in a container.
                    Computed: "true"
                    Properties:
                        csi:
                            Type: TypeList
                            Description: A filesystem specified by the Container Storage Interface (CSI).
                            Computed: "true"
                            Properties:
                                driver:
                                    Type: TypeString
                                    Description: |-
                                        Unique name representing the type of file system to be created. Cloud Run supports the following values:
                                          * gcsfuse.run.googleapis.com: Mount a Google Cloud Storage bucket using GCSFuse. This driver requires the
                                            run.googleapis.com/execution-environment annotation to be set to "gen2" and
                                            run.googleapis.com/launch-stage set to "BETA" or "ALPHA".
                                    Computed: "true"
                                read_only:
                                    Type: TypeBool
                                    Description: If true, all mounts created from this volume will be read-only.
                                    Computed: "true"
                                volume_attributes:
                                    Type: TypeMap
                                    Description: |-
                                        Driver-specific attributes. The following options are supported for available drivers:
                                          * gcsfuse.run.googleapis.com
                                            * bucketName: The name of the Cloud Storage Bucket that backs this volume. The Cloud Run Service identity must have access to this bucket.
                                    Computed: "true"
                        empty_dir:
                            Type: TypeList
                            Description: Ephemeral storage which can be backed by real disks (HD, SSD), network storage or memory (i.e. tmpfs). For now only in memory (tmpfs) is supported. It is ephemeral in the sense that when the sandbox is taken down, the data is destroyed with it (it does not persist across sandbox runs).
                            Computed: "true"
                            Properties:
                                medium:
                                    Type: TypeString
                                    Description: The medium on which the data is stored. The default is "" which means to use the node's default medium. Must be an empty string (default) or Memory.
                                    Computed: "true"
                                size_limit:
                                    Type: TypeString
                                    Description: 'Limit on the storage usable by this EmptyDir volume. The size limit is also applicable for memory medium. The maximum usage on memory medium EmptyDir would be the minimum value between the SizeLimit specified here and the sum of memory limits of all containers in a pod. This field''s values are of the ''Quantity'' k8s type: https://kubernetes.io/docs/reference/kubernetes-api/common-definitions/quantity/. The default is nil which means that the limit is undefined. More info: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir.'
                                    Computed: "true"
                        name:
                            Type: TypeString
                            Description: Volume's name.
                            Computed: "true"
                        secret:
                            Type: TypeList
                            Description: |-
                                The secret's value will be presented as the content of a file whose
                                name is defined in the item path. If no items are defined, the name of
                                the file is the secret_name.
                            Computed: "true"
                            Properties:
                                default_mode:
                                    Type: TypeInt
                                    Description: |-
                                        Mode bits to use on created files by default. Must be a value between 0000
                                        and 0777. Defaults to 0644. Directories within the path are not affected by
                                        this setting. This might be in conflict with other options that affect the
                                        file mode, like fsGroup, and the result can be other mode bits set.
                                    Computed: "true"
                                items:
                                    Type: TypeList
                                    Description: |-
                                        If unspecified, the volume will expose a file whose name is the
                                        secret_name.
                                        If specified, the key will be used as the version to fetch from Cloud
                                        Secret Manager and the path will be the name of the file exposed in the
                                        volume. When items are defined, they must specify a key and a path.
                                    Computed: "true"
                                    Properties:
                                        key:
                                            Type: TypeString
                                            Description: |-
                                                The Cloud Secret Manager secret version.
                                                Can be 'latest' for the latest value or an integer for a specific version.
                                            Computed: "true"
                                        mode:
                                            Type: TypeInt
                                            Description: |-
                                                Mode bits to use on this file, must be a value between 0000 and 0777. If
                                                not specified, the volume defaultMode will be used. This might be in
                                                conflict with other options that affect the file mode, like fsGroup, and
                                                the result can be other mode bits set.
                                            Computed: "true"
                                        path:
                                            Type: TypeString
                                            Description: |-
                                                The relative path of the file to map the key to.
                                                May not be an absolute path.
                                                May not contain the path element '..'.
                                                May not start with the string '..'.
                                            Computed: "true"
                                secret_name:
                                    Type: TypeString
                                    Description: |-
                                        The name of the secret in Cloud Secret Manager. By default, the secret
                                        is assumed to be in the same project.
                                        If the secret is in another project, you must define an alias.
                                        An alias definition has the form:
                                        {alias}:projects/{project-id|project-number}/secrets/{secret-name}.
                                        If multiple alias definitions are needed, they must be separated by
                                        commas.
                                        The alias definitions must be set on the run.googleapis.com/secrets
                                        annotation.
                                    Computed: "true"
traffic:
    Type: TypeList
    Description: |-
        Traffic specifies how to distribute traffic over a collection of Knative Revisions
        and Configurations
    Computed: "true"
    Properties:
        latest_revision:
            Type: TypeBool
            Description: |-
                LatestRevision may be optionally provided to indicate that the latest ready
                Revision of the Configuration should be used for this traffic target. When
                provided LatestRevision must be true if RevisionName is empty; it must be
                false when RevisionName is non-empty.
            Computed: "true"
        percent:
            Type: TypeInt
            Description: Percent specifies percent of the traffic to this Revision or Configuration.
            Computed: "true"
        revision_name:
            Type: TypeString
            Description: RevisionName of a specific revision to which to send this portion of traffic.
            Computed: "true"
        tag:
            Type: TypeString
            Description: Tag is optionally used to expose a dedicated url for referencing this target exclusively.
            Computed: "true"
        url:
            Type: TypeString
            Description: |-
                URL displays the URL for accessing tagged traffic targets. URL is displayed in status,
                and is disallowed on spec. URL must contain a scheme (e.g. http://) and a hostname,
                but may not contain anything else (e.g. basic auth, url path, etc.)
            Computed: "true"

