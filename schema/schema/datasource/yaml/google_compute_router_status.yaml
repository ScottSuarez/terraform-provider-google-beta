name:
    Type: TypeString
    Description: Name of the router to query.
    Required: "true"
network:
    Type: TypeString
    Description: URI of the network to which this router belongs.
    Computed: "true"
project:
    Type: TypeString
    Description: Project ID of the target router.
    Optional: "true"
region:
    Type: TypeString
    Description: Region of the target router.
    Computed: "true"
    Optional: "true"

