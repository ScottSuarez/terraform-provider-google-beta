channel_id:
    Type: TypeString
    Description: Required. Immutable. A unique ID within the site that identifies the channel.
    Required: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
expire_time:
    Type: TypeString
    Description: |-
        The time at which the channel will be automatically deleted. If null, the channel
        will not be automatically deleted. This field is present in the output whether it's
        set directly or via the 'ttl' field.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Text labels used for extra metadata and/or filtering

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Computed: "true"
name:
    Type: TypeString
    Description: |-
        The fully-qualified resource name for the channel, in the format:
        sites/SITE_ID/channels/CHANNEL_ID
    Computed: "true"
retained_release_count:
    Type: TypeInt
    Description: |-
        The number of previous releases to retain on the channel for rollback or other
        purposes. Must be a number between 1-100. Defaults to 10 for new channels.
    Computed: "true"
site_id:
    Type: TypeString
    Description: Required. The ID of the site in which to create this channel.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
ttl:
    Type: TypeString
    Description: |-
        Input only. A time-to-live for this channel. Sets 'expire_time' to the provided
        duration past the time of the request. A duration in seconds with up to nine fractional
        digits, terminated by 's'. Example: "86400s" (one day).
    Computed: "true"

