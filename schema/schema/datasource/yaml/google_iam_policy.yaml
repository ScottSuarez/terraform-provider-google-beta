audit_config:
    Type: TypeSet
    Optional: "true"
    Properties:
        audit_log_configs:
            Type: TypeSet
            Required: "true"
            Properties:
                exempted_members:
                    Type: TypeSet
                    Optional: "true"
                log_type:
                    Type: TypeString
                    Required: "true"
        service:
            Type: TypeString
            Required: "true"
binding:
    Type: TypeSet
    Optional: "true"
    Properties:
        condition:
            Type: TypeList
            Optional: "true"
            MaxItems: "1"
            Properties:
                description:
                    Type: TypeString
                    Optional: "true"
                expression:
                    Type: TypeString
                    Required: "true"
                title:
                    Type: TypeString
                    Required: "true"
        members:
            Type: TypeSet
            Required: "true"
        role:
            Type: TypeString
            Required: "true"
policy_data:
    Type: TypeString
    Computed: "true"

