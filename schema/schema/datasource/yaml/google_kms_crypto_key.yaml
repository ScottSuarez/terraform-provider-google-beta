destroy_scheduled_duration:
    Type: TypeString
    Description: |-
        The period of time that versions of this key spend in the DESTROY_SCHEDULED state before transitioning to DESTROYED.
        If not specified at creation time, the default duration is 24 hours.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
import_only:
    Type: TypeBool
    Description: Whether this key may contain imported versions only.
    Computed: "true"
key_ring:
    Type: TypeString
    Description: |-
        The KeyRing that this key belongs to.
        Format: ''projects/{{project}}/locations/{{location}}/keyRings/{{keyRing}}''.
    Required: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels with user-defined metadata to apply to this resource.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Computed: "true"
name:
    Type: TypeString
    Description: The resource name for the CryptoKey.
    Required: "true"
primary:
    Type: TypeList
    Description: |-
        A copy of the primary CryptoKeyVersion that will be used by cryptoKeys.encrypt when this CryptoKey is given in EncryptRequest.name.
        Keys with purpose ENCRYPT_DECRYPT may have a primary. For other keys, this field will be unset.
    Computed: "true"
    Properties:
        name:
            Type: TypeString
            Description: The resource name for this CryptoKeyVersion.
            Computed: "true"
        state:
            Type: TypeString
            Description: The current state of the CryptoKeyVersion.
            Computed: "true"
purpose:
    Type: TypeString
    Description: |-
        The immutable purpose of this CryptoKey. See the
        [purpose reference](https://cloud.google.com/kms/docs/reference/rest/v1/projects.locations.keyRings.cryptoKeys#CryptoKeyPurpose)
        for possible inputs.
        Default value is "ENCRYPT_DECRYPT".
    Computed: "true"
rotation_period:
    Type: TypeString
    Description: |-
        Every time this period passes, generate a new CryptoKeyVersion and set it as the primary.
        The first rotation will take place after the specified period. The rotation period has
        the format of a decimal number with up to 9 fractional digits, followed by the
        letter 's' (seconds). It must be greater than a day (ie, 86400).
    Computed: "true"
skip_initial_version_creation:
    Type: TypeBool
    Description: |-
        If set to true, the request will create a CryptoKey without any CryptoKeyVersions.
        You must use the 'google_kms_key_ring_import_job' resource to import the CryptoKeyVersion.
    Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
version_template:
    Type: TypeList
    Description: A template describing settings for new crypto key versions.
    Computed: "true"
    Properties:
        algorithm:
            Type: TypeString
            Description: |-
                The algorithm to use when creating a version based on this template.
                See the [algorithm reference](https://cloud.google.com/kms/docs/reference/rest/v1/CryptoKeyVersionAlgorithm) for possible inputs.
            Computed: "true"
        protection_level:
            Type: TypeString
            Description: The protection level to use when creating a version based on this template. Possible values include "SOFTWARE", "HSM", "EXTERNAL", "EXTERNAL_VPC". Defaults to "SOFTWARE".
            Computed: "true"

