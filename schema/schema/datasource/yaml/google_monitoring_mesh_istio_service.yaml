display_name:
    Type: TypeString
    Description: Name used for UI elements listing this Service.
    Computed: "true"
mesh_uid:
    Type: TypeString
    Description: |-
        Identifier for the mesh in which this Istio service is defined.
                                Corresponds to the meshUid metric label in Istio metrics.
    Required: "true"
name:
    Type: TypeString
    Description: |-
        The full resource name for this service. The syntax is:
        projects/[PROJECT_ID]/services/[SERVICE_ID].
    Computed: "true"
project:
    Type: TypeString
    Optional: "true"
service_id:
    Type: TypeString
    Description: |-
        An optional service ID to use. If not given, the server will generate a
        service ID.
    Computed: "true"
service_name:
    Type: TypeString
    Description: "The name of the Istio service underlying this service. \n                        Corresponds to the destination_service_name metric label in Istio metrics."
    Required: "true"
service_namespace:
    Type: TypeString
    Description: |-
        The namespace of the Istio service underlying this service.
                                Corresponds to the destination_service_namespace metric label in Istio metrics.
    Required: "true"
telemetry:
    Type: TypeList
    Description: Configuration for how to query telemetry on a Service.
    Computed: "true"
    Properties:
        resource_name:
            Type: TypeString
            Description: |-
                The full name of the resource that defines this service.
                Formatted as described in
                https://cloud.google.com/apis/design/resource_names.
            Computed: "true"
user_labels:
    Type: TypeMap
    Description: |-
        Labels which have been used to annotate the service. Label keys must start
        with a letter. Label keys and values may contain lowercase letters,
        numbers, underscores, and dashes. Label keys and values have a maximum
        length of 63 characters, and must be less than 128 bytes in size. Up to 64
        label entries may be stored. For labels which do not have a semantic value,
        the empty string may be supplied for the label value.
    Computed: "true"

