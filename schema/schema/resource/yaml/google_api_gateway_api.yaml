api_id:
    Type: TypeString
    Description: Identifier to assign to the API. Must be unique within scope of the parent resource(project)
    Required: "true"
create_time:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
display_name:
    Type: TypeString
    Description: A user-visible name for the API.
    Computed: "true"
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Resource labels to represent user-provided metadata.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
managed_service:
    Type: TypeString
    Description: |-
        Immutable. The name of a Google Managed Service ( https://cloud.google.com/service-infrastructure/docs/glossary#managed).
        If not specified, a new Service will automatically be created in the same project as this API.
    Computed: "true"
    Optional: "true"
name:
    Type: TypeString
    Description: The resource name of the API. Format 'projects/{{project}}/locations/global/apis/{{apiId}}'
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"

