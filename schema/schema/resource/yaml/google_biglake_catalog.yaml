create_time:
    Type: TypeString
    Description: |-
        Output only. The creation time of the catalog. A timestamp in RFC3339 UTC
        "Zulu" format, with nanosecond resolution and up to nine fractional
        digits.
    Computed: "true"
delete_time:
    Type: TypeString
    Description: |-
        Output only. The deletion time of the catalog. Only set after the catalog
        is deleted. A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
        resolution and up to nine fractional digits.
    Computed: "true"
expire_time:
    Type: TypeString
    Description: |-
        Output only. The time when this catalog is considered expired. Only set
        after the catalog is deleted. Only set after the catalog is deleted.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and
        up to nine fractional digits.
    Computed: "true"
location:
    Type: TypeString
    Description: The geographic location where the Catalog should reside.
    Required: "true"
name:
    Type: TypeString
    Description: |-
        The name of the Catalog. Format:
        projects/{project_id_or_number}/locations/{locationId}/catalogs/{catalogId}
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
update_time:
    Type: TypeString
    Description: |-
        Output only. The last modification time of the catalog. A timestamp in
        RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine
        fractional digits.
    Computed: "true"

