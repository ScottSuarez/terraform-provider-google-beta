catalog:
    Type: TypeString
    Description: The parent catalog.
    Required: "true"
create_time:
    Type: TypeString
    Description: |-
        Output only. The creation time of the database. A timestamp in RFC3339
        UTC "Zulu" format, with nanosecond resolution and up to nine fractional
        digits. Examples: "2014-10-02T15:01:23Z" and
        "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
delete_time:
    Type: TypeString
    Description: |-
        Output only. The deletion time of the database. Only set after the
        database is deleted. A timestamp in RFC3339 UTC "Zulu" format, with
        nanosecond resolution and up to nine fractional digits. Examples:
        "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
expire_time:
    Type: TypeString
    Description: |-
        Output only. The time when this database is considered expired. Only set
        after the database is deleted. A timestamp in RFC3339 UTC "Zulu" format,
        with nanosecond resolution and up to nine fractional digits. Examples:
        "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
hive_options:
    Type: TypeList
    Description: Options of a Hive database.
    Required: "true"
    MaxItems: "1"
    Properties:
        location_uri:
            Type: TypeString
            Description: Cloud Storage folder URI where the database data is stored, starting with "gs://".
            Optional: "true"
        parameters:
            Type: TypeMap
            Description: |-
                Stores user supplied Hive database parameters. An object containing a
                list of"key": value pairs.
                Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
            Optional: "true"
name:
    Type: TypeString
    Description: The name of the database.
    Required: "true"
type:
    Type: TypeString
    Description: The database type.
    Required: "true"
update_time:
    Type: TypeString
    Description: |-
        Output only. The last modification time of the database. A timestamp in
        RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine
        fractional digits. Examples: "2014-10-02T15:01:23Z" and
        "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

