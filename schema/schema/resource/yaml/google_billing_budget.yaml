all_updates_rule:
    Type: TypeList
    Description: |-
        Defines notifications that are sent on every update to the
        billing account's spend, regardless of the thresholds defined
        using threshold rules.
    Optional: "true"
    MaxItems: "1"
    Properties:
        disable_default_iam_recipients:
            Type: TypeBool
            Description: |-
                Boolean. When set to true, disables default notifications sent
                when a threshold is exceeded. Default recipients are
                those with Billing Account Administrators and Billing
                Account Users IAM roles for the target account.
            Optional: "true"
        monitoring_notification_channels:
            Type: TypeList
            Description: |-
                The full resource name of a monitoring notification
                channel in the form
                projects/{project_id}/notificationChannels/{channel_id}.
                A maximum of 5 channels are allowed.
            Optional: "true"
            AtLeastOneOf: all_updates_rule.0.pubsub_topic, all_updates_rule.0.monitoring_notification_channels
            MaxItems: "5"
        pubsub_topic:
            Type: TypeString
            Description: |-
                The name of the Cloud Pub/Sub topic where budget related
                messages will be published, in the form
                projects/{project_id}/topics/{topic_id}. Updates are sent
                at regular intervals to the topic.
            Optional: "true"
            AtLeastOneOf: all_updates_rule.0.pubsub_topic, all_updates_rule.0.monitoring_notification_channels
        schema_version:
            Type: TypeString
            Description: |-
                The schema version of the notification. Only "1.0" is
                accepted. It represents the JSON schema as defined in
                https://cloud.google.com/billing/docs/how-to/budgets#notification_format.
            Optional: "true"
amount:
    Type: TypeList
    Description: The budgeted amount for each usage period.
    Required: "true"
    MaxItems: "1"
    Properties:
        last_period_amount:
            Type: TypeBool
            Description: |-
                Configures a budget amount that is automatically set to 100% of
                last period's spend.
                Boolean. Set value to true to use. Do not set to false, instead
                use the 'specified_amount' block.
            Optional: "true"
            ExactlyOneOf: amount.0.specified_amount, amount.0.last_period_amount
        specified_amount:
            Type: TypeList
            Description: |-
                A specified amount to use as the budget. currencyCode is
                optional. If specified, it must match the currency of the
                billing account. The currencyCode is provided on output.
            Optional: "true"
            ExactlyOneOf: amount.0.specified_amount, amount.0.last_period_amount
            MaxItems: "1"
            Properties:
                currency_code:
                    Type: TypeString
                    Description: The 3-letter currency code defined in ISO 4217.
                    Computed: "true"
                    Optional: "true"
                nanos:
                    Type: TypeInt
                    Description: |-
                        Number of nano (10^-9) units of the amount.
                        The value must be between -999,999,999 and +999,999,999
                        inclusive. If units is positive, nanos must be positive or
                        zero. If units is zero, nanos can be positive, zero, or
                        negative. If units is negative, nanos must be negative or
                        zero. For example $-1.75 is represented as units=-1 and
                        nanos=-750,000,000.
                    Optional: "true"
                units:
                    Type: TypeString
                    Description: |-
                        The whole units of the amount. For example if currencyCode
                        is "USD", then 1 unit is one US dollar.
                    Optional: "true"
billing_account:
    Type: TypeString
    Description: ID of the billing account to set a budget on.
    Required: "true"
budget_filter:
    Type: TypeList
    Description: |-
        Filters that define which resources are used to compute the actual
        spend against the budget.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        calendar_period:
            Type: TypeString
            Description: |-
                A CalendarPeriod represents the abstract concept of a recurring time period that has a
                canonical start. Grammatically, "the start of the current CalendarPeriod".
                All calendar times begin at 12 AM US and Canadian Pacific Time (UTC-8).

                Exactly one of 'calendar_period', 'custom_period' must be provided. Possible values: ["MONTH", "QUARTER", "YEAR", "CALENDAR_PERIOD_UNSPECIFIED"]
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        credit_types:
            Type: TypeList
            Description: |-
                Optional. If creditTypesTreatment is INCLUDE_SPECIFIED_CREDITS,
                this is a list of credit types to be subtracted from gross cost to determine the spend for threshold calculations. See a list of acceptable credit type values.
                If creditTypesTreatment is not INCLUDE_SPECIFIED_CREDITS, this field must be empty.

                **Note:** If the field has a value in the config and needs to be removed, the field has to be an emtpy array in the config.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        credit_types_treatment:
            Type: TypeString
            Description: |-
                Specifies how credits should be treated when determining spend
                for threshold calculations. Default value: "INCLUDE_ALL_CREDITS" Possible values: ["INCLUDE_ALL_CREDITS", "EXCLUDE_ALL_CREDITS", "INCLUDE_SPECIFIED_CREDITS"]
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        custom_period:
            Type: TypeList
            Description: |-
                Specifies to track usage from any start date (required) to any end date (optional).
                This time period is static, it does not recur.

                Exactly one of 'calendar_period', 'custom_period' must be provided.
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
            MaxItems: "1"
            Properties:
                end_date:
                    Type: TypeList
                    Description: |-
                        Optional. The end date of the time period. Budgets with elapsed end date won't be processed.
                        If unset, specifies to track all usage incurred since the startDate.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        day:
                            Type: TypeInt
                            Description: Day of a month. Must be from 1 to 31 and valid for the year and month.
                            Required: "true"
                        month:
                            Type: TypeInt
                            Description: Month of a year. Must be from 1 to 12.
                            Required: "true"
                        year:
                            Type: TypeInt
                            Description: Year of the date. Must be from 1 to 9999.
                            Required: "true"
                start_date:
                    Type: TypeList
                    Description: A start date is required. The start date must be after January 1, 2017.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        day:
                            Type: TypeInt
                            Description: Day of a month. Must be from 1 to 31 and valid for the year and month.
                            Required: "true"
                        month:
                            Type: TypeInt
                            Description: Month of a year. Must be from 1 to 12.
                            Required: "true"
                        year:
                            Type: TypeInt
                            Description: Year of the date. Must be from 1 to 9999.
                            Required: "true"
        labels:
            Type: TypeMap
            Description: |-
                A single label and value pair specifying that usage from only
                this set of labeled resources should be included in the budget.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        projects:
            Type: TypeSet
            Description: |-
                A set of projects of the form projects/{project_number},
                specifying that usage from only this set of projects should be
                included in the budget. If omitted, the report will include
                all usage for the billing account, regardless of which project
                the usage occurred on.
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        resource_ancestors:
            Type: TypeSet
            Description: |-
                A set of folder and organization names of the form folders/{folderId} or organizations/{organizationId},
                specifying that usage from only this set of folders and organizations should be included in the budget.
                If omitted, the budget includes all usage that the billing account pays for. If the folder or organization
                contains projects that are paid for by a different Cloud Billing account, the budget doesn't apply to those projects.
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        services:
            Type: TypeList
            Description: |-
                A set of services of the form services/{service_id},
                specifying that usage from only this set of services should be
                included in the budget. If omitted, the report will include
                usage for all the services. The service names are available
                through the Catalog API:
                https://cloud.google.com/billing/v1/how-tos/catalog-api.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
        subaccounts:
            Type: TypeList
            Description: |-
                A set of subaccounts of the form billingAccounts/{account_id},
                specifying that usage from only this set of subaccounts should
                be included in the budget. If a subaccount is set to the name of
                the parent account, usage from the parent account will be included.
                If the field is omitted, the report will include usage from the parent
                account and all subaccounts, if they exist.

                **Note:** If the field has a value in the config and needs to be removed, the field has to be an emtpy array in the config.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: budget_filter.0.projects, budget_filter.0.resource_ancestors, budget_filter.0.credit_types_treatment, budget_filter.0.services, budget_filter.0.subaccounts, budget_filter.0.labels, budget_filter.0.calendar_period, budget_filter.0.custom_period
display_name:
    Type: TypeString
    Description: User data for display name in UI. Must be <= 60 chars.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        Resource name of the budget. The resource name
        implies the scope of a budget. Values are of the form
        billingAccounts/{billingAccountId}/budgets/{budgetId}.
    Computed: "true"
threshold_rules:
    Type: TypeList
    Description: |-
        Rules that trigger alerts (notifications of thresholds being
        crossed) when spend exceeds the specified percentages of the
        budget.
    Optional: "true"
    Properties:
        spend_basis:
            Type: TypeString
            Description: |-
                The type of basis used to determine if spend has passed
                the threshold. Default value: "CURRENT_SPEND" Possible values: ["CURRENT_SPEND", "FORECASTED_SPEND"]
            Optional: "true"
        threshold_percent:
            Type: TypeFloat
            Description: |-
                Send an alert when this threshold is exceeded. This is a
                1.0-based percentage, so 0.5 = 50%. Must be >= 0.
            Required: "true"

