admission_whitelist_patterns:
    Type: TypeList
    Description: |-
        A whitelist of image patterns to exclude from admission rules. If an
        image's name matches a whitelist pattern, the image's admission
        requests will always be permitted regardless of your admission rules.
    Optional: "true"
    Properties:
        name_pattern:
            Type: TypeString
            Description: |-
                An image name pattern to whitelist, in the form
                'registry/path/to/image'. This supports a trailing * as a
                wildcard, but this is allowed only in text after the registry/
                part.
            Required: "true"
cluster_admission_rules:
    Type: TypeSet
    Description: |-
        Per-cluster admission rules. An admission rule specifies either that
        all container images used in a pod creation request must be attested
        to by one or more attestors, that all pod creations will be allowed,
        or that all pod creations will be denied. There can be at most one
        admission rule per cluster spec.


        Identifier format: '{{location}}.{{clusterId}}'.
        A location is either a compute zone (e.g. 'us-central1-a') or a region
        (e.g. 'us-central1').
    Optional: "true"
    Properties:
        cluster:
            Type: TypeString
            Required: "true"
        enforcement_mode:
            Type: TypeString
            Description: 'The action when a pod creation is denied by the admission rule. Possible values: ["ENFORCED_BLOCK_AND_AUDIT_LOG", "DRYRUN_AUDIT_LOG_ONLY"]'
            Required: "true"
        evaluation_mode:
            Type: TypeString
            Description: 'How this admission rule will be evaluated. Possible values: ["ALWAYS_ALLOW", "REQUIRE_ATTESTATION", "ALWAYS_DENY"]'
            Required: "true"
        require_attestations_by:
            Type: TypeSet
            Description: |-
                The resource names of the attestors that must attest to a
                container image. If the attestor is in a different project from the
                policy, it should be specified in the format 'projects/*/attestors/*'.
                Each attestor must exist before a policy can reference it. To add an
                attestor to a policy the principal issuing the policy change
                request must be able to read the attestor resource.

                Note: this field must be non-empty when the evaluation_mode field
                specifies REQUIRE_ATTESTATION, otherwise it must be empty.
            Optional: "true"
default_admission_rule:
    Type: TypeList
    Description: |-
        Default admission rule for a cluster without a per-cluster admission
        rule.
    Required: "true"
    MaxItems: "1"
    Properties:
        enforcement_mode:
            Type: TypeString
            Description: 'The action when a pod creation is denied by the admission rule. Possible values: ["ENFORCED_BLOCK_AND_AUDIT_LOG", "DRYRUN_AUDIT_LOG_ONLY"]'
            Required: "true"
        evaluation_mode:
            Type: TypeString
            Description: 'How this admission rule will be evaluated. Possible values: ["ALWAYS_ALLOW", "REQUIRE_ATTESTATION", "ALWAYS_DENY"]'
            Required: "true"
        require_attestations_by:
            Type: TypeSet
            Description: |-
                The resource names of the attestors that must attest to a
                container image. If the attestor is in a different project from the
                policy, it should be specified in the format 'projects/*/attestors/*'.
                Each attestor must exist before a policy can reference it. To add an
                attestor to a policy the principal issuing the policy change
                request must be able to read the attestor resource.

                Note: this field must be non-empty when the evaluation_mode field
                specifies REQUIRE_ATTESTATION, otherwise it must be empty.
            Optional: "true"
description:
    Type: TypeString
    Description: A descriptive comment.
    Optional: "true"
global_policy_evaluation_mode:
    Type: TypeString
    Description: |-
        Controls the evaluation of a Google-maintained global admission policy
        for common system-level images. Images not covered by the global
        policy will be subject to the project admission policy. Possible values: ["ENABLE", "DISABLE"]
    Computed: "true"
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"

