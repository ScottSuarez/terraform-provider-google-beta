description:
    Type: TypeString
    Description: A human-readable description of the resource.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Set of label tags associated with the Certificate resource.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: The Certificate Manager location. If not specified, "global" is used.
    Optional: "true"
managed:
    Type: TypeList
    Description: |-
        Configuration and state of a Managed Certificate.
        Certificate Manager provisions and renews Managed Certificates
        automatically, for as long as it's authorized to do so.
    Optional: "true"
    ExactlyOneOf: self_managed, managed
    MaxItems: "1"
    Properties:
        authorization_attempt_info:
            Type: TypeList
            Description: |-
                Detailed state of the latest authorization attempt for each domain
                specified for this Managed Certificate.
            Computed: "true"
            Properties:
                details:
                    Type: TypeString
                    Description: |-
                        Human readable explanation for reaching the state. Provided to help
                        address the configuration issues.
                        Not guaranteed to be stable. For programmatic access use 'failure_reason' field.
                    Computed: "true"
                domain:
                    Type: TypeString
                    Description: Domain name of the authorization attempt.
                    Computed: "true"
                failure_reason:
                    Type: TypeString
                    Description: Reason for failure of the authorization attempt for the domain.
                    Computed: "true"
                state:
                    Type: TypeString
                    Description: State of the domain for managed certificate issuance.
                    Computed: "true"
        dns_authorizations:
            Type: TypeList
            Description: Authorizations that will be used for performing domain authorization. Either issuanceConfig or dnsAuthorizations should be specificed, but not both.
            Optional: "true"
        domains:
            Type: TypeList
            Description: |-
                The domains for which a managed SSL certificate will be generated.
                Wildcard domains are only supported with DNS challenge resolution
            Optional: "true"
        issuance_config:
            Type: TypeString
            Description: |-
                The resource name for a CertificateIssuanceConfig used to configure private PKI certificates in the format projects/*/locations/*/certificateIssuanceConfigs/*.
                If this field is not set, the certificates will instead be publicly signed as documented at https://cloud.google.com/load-balancing/docs/ssl-certificates/google-managed-certs#caa.
                Either issuanceConfig or dnsAuthorizations should be specificed, but not both.
            Optional: "true"
        provisioning_issue:
            Type: TypeList
            Description: Information about issues with provisioning this Managed Certificate.
            Computed: "true"
            Properties:
                details:
                    Type: TypeString
                    Description: |-
                        Human readable explanation about the issue. Provided to help address
                        the configuration issues.
                        Not guaranteed to be stable. For programmatic access use 'reason' field.
                    Computed: "true"
                reason:
                    Type: TypeString
                    Description: Reason for provisioning failures.
                    Computed: "true"
        state:
            Type: TypeString
            Description: A state of this Managed Certificate.
            Computed: "true"
name:
    Type: TypeString
    Description: |-
        A user-defined name of the certificate. Certificate names must be unique
        The name must be 1-64 characters long, and match the regular expression [a-zA-Z][a-zA-Z0-9_-]* which means the first character must be a letter,
        and all following characters must be a dash, underscore, letter or digit.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
scope:
    Type: TypeString
    Description: |-
        The scope of the certificate.

        DEFAULT: Certificates with default scope are served from core Google data centers.
        If unsure, choose this option.

        EDGE_CACHE: Certificates with scope EDGE_CACHE are special-purposed certificates, served from Edge Points of Presence.
        See https://cloud.google.com/vpc/docs/edge-locations.

        ALL_REGIONS: Certificates with ALL_REGIONS scope are served from all GCP regions (You can only use ALL_REGIONS with global certs).
        See https://cloud.google.com/compute/docs/regions-zones
    Optional: "true"
self_managed:
    Type: TypeList
    Description: |-
        Certificate data for a SelfManaged Certificate.
        SelfManaged Certificates are uploaded by the user. Updating such
        certificates before they expire remains the user's responsibility.
    Optional: "true"
    ExactlyOneOf: self_managed, managed
    MaxItems: "1"
    Properties:
        certificate_pem:
            Type: TypeString
            Description: |-
                The certificate chain in PEM-encoded form.

                Leaf certificate comes first, followed by intermediate ones if any.
            Optional: "true"
            ExactlyOneOf: self_managed.0.certificate_pem, self_managed.0.pem_certificate
        pem_certificate:
            Type: TypeString
            Description: |-
                The certificate chain in PEM-encoded form.

                Leaf certificate comes first, followed by intermediate ones if any.
            Optional: "true"
            ExactlyOneOf: self_managed.0.certificate_pem, self_managed.0.pem_certificate
        pem_private_key:
            Type: TypeString
            Description: The private key of the leaf certificate in PEM-encoded form.
            Optional: "true"
            ExactlyOneOf: self_managed.0.private_key_pem, self_managed.0.pem_private_key
        private_key_pem:
            Type: TypeString
            Description: The private key of the leaf certificate in PEM-encoded form.
            Optional: "true"
            ExactlyOneOf: self_managed.0.private_key_pem, self_managed.0.pem_private_key
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"

