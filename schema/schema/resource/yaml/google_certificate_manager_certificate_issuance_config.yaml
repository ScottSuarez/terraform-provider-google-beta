certificate_authority_config:
    Type: TypeList
    Description: The CA that issues the workload certificate. It includes the CA address, type, authentication to CA service, etc.
    Required: "true"
    MaxItems: "1"
    Properties:
        certificate_authority_service_config:
            Type: TypeList
            Description: Defines a CertificateAuthorityServiceConfig.
            Optional: "true"
            MaxItems: "1"
            Properties:
                ca_pool:
                    Type: TypeString
                    Description: |-
                        A CA pool resource used to issue a certificate.
                        The CA pool string has a relative resource path following the form
                        "projects/{project}/locations/{location}/caPools/{caPool}".
                    Required: "true"
create_time:
    Type: TypeString
    Description: |-
        The creation timestamp of a CertificateIssuanceConfig. Timestamp is in RFC3339 UTC "Zulu" format,
        accurate to nanoseconds with up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
description:
    Type: TypeString
    Description: One or more paragraphs of text description of a CertificateIssuanceConfig.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
key_algorithm:
    Type: TypeString
    Description: 'Key algorithm to use when generating the private key. Possible values: ["RSA_2048", "ECDSA_P256"]'
    Required: "true"
labels:
    Type: TypeMap
    Description: |-
        'Set of label tags associated with the CertificateIssuanceConfig resource.
         An object containing a list of "key": value pairs. Example: { "name": "wrench", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
lifetime:
    Type: TypeString
    Description: |-
        Lifetime of issued certificates. A duration in seconds with up to nine fractional digits, ending with 's'.
        Example: "1814400s". Valid values are from 21 days (1814400s) to 30 days (2592000s)
    Required: "true"
location:
    Type: TypeString
    Description: The Certificate Manager location. If not specified, "global" is used.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        A user-defined name of the certificate issuance config.
        CertificateIssuanceConfig names must be unique globally.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
rotation_window_percentage:
    Type: TypeInt
    Description: |-
        It specifies the percentage of elapsed time of the certificate lifetime to wait before renewing the certificate.
        Must be a number between 1-99, inclusive.
        You must set the rotation window percentage in relation to the certificate lifetime so that certificate renewal occurs at least 7 days after
        the certificate has been issued and at least 7 days before it expires.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: |-
        The last update timestamp of a CertificateIssuanceConfig. Timestamp is in RFC3339 UTC "Zulu" format,
        accurate to nanoseconds with up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

