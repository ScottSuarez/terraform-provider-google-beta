create_time:
    Type: TypeString
    Description: |-
        The creation timestamp of a TrustConfig.

        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
description:
    Type: TypeString
    Description: One or more paragraphs of text description of a trust config.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Set of label tags associated with the trust config.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: The trust config location.
    Required: "true"
name:
    Type: TypeString
    Description: A user-defined name of the trust config. Trust config names must be unique globally.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
trust_stores:
    Type: TypeList
    Description: |-
        Set of trust stores to perform validation against.
        This field is supported when TrustConfig is configured with Load Balancers, currently not supported for SPIFFE certificate validation.
    Optional: "true"
    Properties:
        intermediate_cas:
            Type: TypeList
            Description: |-
                Set of intermediate CA certificates used for the path building phase of chain validation.
                The field is currently not supported if trust config is used for the workload certificate feature.
            Optional: "true"
            Properties:
                pem_certificate:
                    Type: TypeString
                    Description: |-
                        PEM intermediate certificate used for building up paths for validation.
                        Each certificate provided in PEM format may occupy up to 5kB.
                    Optional: "true"
        trust_anchors:
            Type: TypeList
            Description: List of Trust Anchors to be used while performing validation against a given TrustStore.
            Optional: "true"
            Properties:
                pem_certificate:
                    Type: TypeString
                    Description: |-
                        PEM root certificate of the PKI used for validation.
                        Each certificate provided in PEM format may occupy up to 5kB.
                    Optional: "true"
update_time:
    Type: TypeString
    Description: |-
        The last update timestamp of a TrustConfig.

        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

