description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
interface:
    Type: TypeList
    Description: A list of interfaces on this external VPN gateway.
    Optional: "true"
    Properties:
        id:
            Type: TypeInt
            Description: |-
                The numeric ID for this interface. Allowed values are based on the redundancy type
                of this external VPN gateway
                * '0 - SINGLE_IP_INTERNALLY_REDUNDANT'
                * '0, 1 - TWO_IPS_REDUNDANCY'
                * '0, 1, 2, 3 - FOUR_IPS_REDUNDANCY'
            Optional: "true"
        ip_address:
            Type: TypeString
            Description: |-
                IP address of the interface in the external VPN gateway.
                Only IPv4 is supported. This IP address can be either from
                your on-premise gateway or another Cloud provider's VPN gateway,
                it cannot be an IP address from Google Compute Engine.
            Optional: "true"
label_fingerprint:
    Type: TypeString
    Description: |-
        The fingerprint used for optimistic locking of this resource.  Used
        internally during updates.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels for the external VPN gateway resource.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. Provided by the client when the resource is
        created. The name must be 1-63 characters long, and comply with
        RFC1035.  Specifically, the name must be 1-63 characters long and
        match the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which means
        the first character must be a lowercase letter, and all following
        characters must be a dash, lowercase letter, or digit, except the last
        character, which cannot be a dash.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
redundancy_type:
    Type: TypeString
    Description: 'Indicates the redundancy type of this external VPN gateway Possible values: ["FOUR_IPS_REDUNDANCY", "SINGLE_IP_INTERNALLY_REDUNDANT", "TWO_IPS_REDUNDANCY"]'
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"

