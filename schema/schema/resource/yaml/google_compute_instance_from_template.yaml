            Optional: "true"
            AtLeastOneOf: scheduling.0.on_host_maintenance, scheduling.0.automatic_restart, scheduling.0.preemptible, scheduling.0.node_affinities, scheduling.0.min_node_cpus, scheduling.0.provisioning_model, scheduling.0.instance_termination_action, scheduling.0.max_run_duration, scheduling.0.maintenance_interval, scheduling.0.local_ssd_recovery_timeout
