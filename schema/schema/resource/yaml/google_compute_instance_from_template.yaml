advanced_machine_features:
    Type: TypeList
    Description: Controls for advanced machine-related behavior features.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enable_nested_virtualization:
            Type: TypeBool
            Description: Whether to enable nested virtualization or not.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: advanced_machine_features.0.enable_nested_virtualization, advanced_machine_features.0.threads_per_core
        threads_per_core:
            Type: TypeInt
            Description: The number of threads per physical core. To disable simultaneous multithreading (SMT) set this to 1. If unset, the maximum number of threads supported per core by the underlying processor is assumed.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: advanced_machine_features.0.enable_nested_virtualization, advanced_machine_features.0.threads_per_core
        visible_core_count:
            Type: TypeInt
            Description: The number of physical cores to expose to an instance. Multiply by the number of threads per core to compute the total number of virtual CPUs to expose to the instance. If unset, the number of cores is inferred from the instance\'s nominal CPU count and the underlying platform\'s SMT width.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: advanced_machine_features.0.enable_nested_virtualization, advanced_machine_features.0.threads_per_core, advanced_machine_features.0.visible_core_count
allow_stopping_for_update:
    Type: TypeBool
    Description: If true, allows Terraform to stop the instance to update its properties. If you try to update a property that requires stopping the instance without setting this field, the update will fail.
    Computed: "true"
    Optional: "true"
attached_disk:
    Type: TypeList
    Description: List of disks attached to the instance
    Computed: "true"
    Optional: "true"
    Properties:
        device_name:
            Type: TypeString
            Description: Name with which the attached disk is accessible under /dev/disk/by-id/
            Computed: "true"
            Optional: "true"
        disk_encryption_key_raw:
            Type: TypeString
            Description: A 256-bit customer-supplied encryption key, encoded in RFC 4648 base64 to encrypt this disk. Only one of kms_key_self_link and disk_encryption_key_raw may be set.
            Computed: "true"
            Optional: "true"
        disk_encryption_key_sha256:
            Type: TypeString
            Description: The RFC 4648 base64 encoded SHA-256 hash of the customer-supplied encryption key that protects this resource.
            Computed: "true"
        kms_key_self_link:
            Type: TypeString
            Description: The self_link of the encryption key that is stored in Google Cloud KMS to encrypt this disk. Only one of kms_key_self_link and disk_encryption_key_raw may be set.
            Computed: "true"
            Optional: "true"
        mode:
            Type: TypeString
            Description: Read/write mode for the disk. One of "READ_ONLY" or "READ_WRITE".
            Computed: "true"
            Optional: "true"
        source:
            Type: TypeString
            Description: The name or self_link of the disk attached to this instance.
            Required: "true"
boot_disk:
    Type: TypeList
    Description: The boot disk for the instance.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        auto_delete:
            Type: TypeBool
            Description: Whether the disk will be auto-deleted when the instance is deleted.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
        device_name:
            Type: TypeString
            Description: Name with which attached disk will be accessible under /dev/disk/by-id/
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
        disk_encryption_key_raw:
            Type: TypeString
            Description: A 256-bit customer-supplied encryption key, encoded in RFC 4648 base64 to encrypt this disk. Only one of kms_key_self_link and disk_encryption_key_raw may be set.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
            ConflictsWith: boot_disk.0.kms_key_self_link
        disk_encryption_key_sha256:
            Type: TypeString
            Description: The RFC 4648 base64 encoded SHA-256 hash of the customer-supplied encryption key that protects this resource.
            Computed: "true"
        initialize_params:
            Type: TypeList
            Description: Parameters with which a disk was created alongside the instance.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
            MaxItems: "1"
            Properties:
                enable_confidential_compute:
                    Type: TypeBool
                    Description: A flag to enable confidential compute mode on boot disk
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                image:
                    Type: TypeString
                    Description: The image from which this disk was initialised.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                labels:
                    Type: TypeMap
                    Description: A set of key/value label pairs assigned to the disk.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                provisioned_iops:
                    Type: TypeInt
                    Description: Indicates how many IOPS to provision for the disk. This sets the number of I/O operations per second that the disk can handle. Values must be between 10,000 and 120,000.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                provisioned_throughput:
                    Type: TypeInt
                    Description: Indicates how much throughput to provision for the disk. This sets the number of throughput mb per second that the disk can handle. Values must be between 1 and 7,124.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                resource_manager_tags:
                    Type: TypeMap
                    Description: A map of resource manager tags. Resource manager tag keys and values have the same definition as resource manager tags. Keys must be in the format tagKeys/{tag_key_id}, and values are in the format tagValues/456. The field is ignored (both PUT & PATCH) when empty.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                size:
                    Type: TypeInt
                    Description: The size of the image in gigabytes.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
                type:
                    Type: TypeString
                    Description: The Google Compute Engine disk type. Such as pd-standard, pd-ssd or pd-balanced.
                    Computed: "true"
                    Optional: "true"
                    AtLeastOneOf: boot_disk.0.initialize_params.0.size, boot_disk.0.initialize_params.0.type, boot_disk.0.initialize_params.0.image, boot_disk.0.initialize_params.0.labels, boot_disk.0.initialize_params.0.resource_manager_tags, boot_disk.0.initialize_params.0.provisioned_iops, boot_disk.0.initialize_params.0.provisioned_throughput, boot_disk.0.initialize_params.0.enable_confidential_compute
        kms_key_self_link:
            Type: TypeString
            Description: The self_link of the encryption key that is stored in Google Cloud KMS to encrypt this disk. Only one of kms_key_self_link and disk_encryption_key_raw may be set.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
            ConflictsWith: boot_disk.0.disk_encryption_key_raw
        mode:
            Type: TypeString
            Description: Read/write mode for the disk. One of "READ_ONLY" or "READ_WRITE".
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
        source:
            Type: TypeString
            Description: The name or self_link of the disk attached to this instance.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: boot_disk.0.auto_delete, boot_disk.0.device_name, boot_disk.0.disk_encryption_key_raw, boot_disk.0.kms_key_self_link, boot_disk.0.initialize_params, boot_disk.0.mode, boot_disk.0.source
            ConflictsWith: boot_disk.initialize_params
can_ip_forward:
    Type: TypeBool
    Description: Whether sending and receiving of packets with non-matching source or destination IPs is allowed.
    Computed: "true"
    Optional: "true"
confidential_instance_config:
    Type: TypeList
    Description: The Confidential VM config being used by the instance.  on_host_maintenance has to be set to TERMINATE or this will fail to create.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        confidential_instance_type:
            Type: TypeString
            Description: |4-
                								Specifies which confidential computing technology to use.
                								This could be one of the following values: SEV, SEV_SNP.
                								If SEV_SNP, min_cpu_platform = "AMD Milan" is currently required.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: confidential_instance_config.0.enable_confidential_compute, confidential_instance_config.0.confidential_instance_type
        enable_confidential_compute:
            Type: TypeBool
            Description: Defines whether the instance should have confidential compute enabled. Field will be deprecated in a future release
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: confidential_instance_config.0.enable_confidential_compute, confidential_instance_config.0.confidential_instance_type
cpu_platform:
    Type: TypeString
    Description: The CPU platform used by this instance.
    Computed: "true"
current_status:
    Type: TypeString
    Description: |4-
        					Current status of the instance.
        					This could be one of the following values: PROVISIONING, STAGING, RUNNING, STOPPING, SUSPENDING, SUSPENDED, REPAIRING, and TERMINATED.
        					For more information about the status of the instance, see [Instance life cycle](https://cloud.google.com/compute/docs/instances/instance-life-cycle).
    Computed: "true"
deletion_protection:
    Type: TypeBool
    Description: Whether deletion protection is enabled on this instance.
    Computed: "true"
    Optional: "true"
description:
    Type: TypeString
    Description: A brief description of the resource.
    Computed: "true"
    Optional: "true"
desired_status:
    Type: TypeString
    Description: Desired status of the instance. Either "RUNNING" or "TERMINATED".
    Computed: "true"
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
enable_display:
    Type: TypeBool
    Description: Whether the instance has virtual displays enabled.
    Computed: "true"
    Optional: "true"
guest_accelerator:
    Type: TypeList
    Description: List of the type and count of accelerator cards attached to the instance.
    Computed: "true"
    Optional: "true"
    Properties:
        count:
            Type: TypeInt
            Description: The number of the guest accelerator cards exposed to this instance.
            Required: "true"
        type:
            Type: TypeString
            Description: The accelerator type resource exposed to this instance. E.g. nvidia-tesla-k80.
            Required: "true"
hostname:
    Type: TypeString
    Description: A custom hostname for the instance. Must be a fully qualified DNS name and RFC-1035-valid. Valid format is a series of labels 1-63 characters long matching the regular expression [a-z]([-a-z0-9]*[a-z0-9]), concatenated with periods. The entire hostname must not exceed 253 characters. Changing this forces a new resource to be created.
    Computed: "true"
    Optional: "true"
instance_id:
    Type: TypeString
    Description: The server-assigned unique identifier of this instance.
    Computed: "true"
label_fingerprint:
    Type: TypeString
    Description: The unique fingerprint of the labels.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        A set of key/value label pairs assigned to the instance.
        				
        				**Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        				Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Computed: "true"
    Optional: "true"
machine_type:
    Type: TypeString
    Description: The machine type to create.
    Computed: "true"
    Optional: "true"
metadata:
    Type: TypeMap
    Description: Metadata key/value pairs made available within the instance.
    Computed: "true"
    Optional: "true"
metadata_fingerprint:
    Type: TypeString
    Description: The unique fingerprint of the metadata.
    Computed: "true"
metadata_startup_script:
    Type: TypeString
    Description: Metadata startup scripts made available within the instance.
    Computed: "true"
    Optional: "true"
min_cpu_platform:
    Type: TypeString
    Description: The minimum CPU platform specified for the VM instance.
    Computed: "true"
    Optional: "true"
name:
    Type: TypeString
    Description: The name of the instance. One of name or self_link must be provided.
    Required: "true"
network_interface:
    Type: TypeList
    Description: The networks attached to the instance.
    Computed: "true"
    Optional: "true"
    Properties:
        access_config:
            Type: TypeList
            Description: Access configurations, i.e. IPs via which this instance can be accessed via the Internet.
            Computed: "true"
            Optional: "true"
            Properties:
                nat_ip:
                    Type: TypeString
                    Description: The IP address that is be 1:1 mapped to the instance's network ip.
                    Computed: "true"
                    Optional: "true"
                network_tier:
                    Type: TypeString
                    Description: The networking tier used for configuring this instance. One of PREMIUM or STANDARD.
                    Computed: "true"
                    Optional: "true"
                public_ptr_domain_name:
                    Type: TypeString
                    Description: The DNS domain name for the public PTR record.
                    Computed: "true"
                    Optional: "true"
                security_policy:
                    Type: TypeString
                    Description: A full or partial URL to a security policy to add to this instance. If this field is set to an empty string it will remove the associated security policy.
                    Computed: "true"
        alias_ip_range:
            Type: TypeList
            Description: An array of alias IP ranges for this network interface.
            Computed: "true"
            Optional: "true"
            Properties:
                ip_cidr_range:
                    Type: TypeString
                    Description: The IP CIDR range represented by this alias IP range.
                    Required: "true"
                subnetwork_range_name:
                    Type: TypeString
                    Description: The subnetwork secondary range name specifying the secondary range from which to allocate the IP CIDR range for this alias IP range.
                    Computed: "true"
                    Optional: "true"
        internal_ipv6_prefix_length:
            Type: TypeInt
            Description: The prefix length of the primary internal IPv6 range.
            Computed: "true"
            Optional: "true"
        ipv6_access_config:
            Type: TypeList
            Description: An array of IPv6 access configurations for this interface. Currently, only one IPv6 access config, DIRECT_IPV6, is supported. If there is no ipv6AccessConfig specified, then this instance will have no external IPv6 Internet access.
            Computed: "true"
            Optional: "true"
            Properties:
                external_ipv6:
                    Type: TypeString
                    Description: The first IPv6 address of the external IPv6 range associated with this instance, prefix length is stored in externalIpv6PrefixLength in ipv6AccessConfig. To use a static external IP address, it must be unused and in the same region as the instance's zone. If not specified, Google Cloud will automatically assign an external IPv6 address from the instance's subnetwork.
                    Computed: "true"
                    Optional: "true"
                external_ipv6_prefix_length:
                    Type: TypeString
                    Description: The prefix length of the external IPv6 range.
                    Computed: "true"
                    Optional: "true"
                name:
                    Type: TypeString
                    Description: The name of this access configuration. In ipv6AccessConfigs, the recommended name is External IPv6.
                    Computed: "true"
                    Optional: "true"
                network_tier:
                    Type: TypeString
                    Description: The service-level to be provided for IPv6 traffic when the subnet has an external subnet. Only PREMIUM tier is valid for IPv6
                    Required: "true"
                public_ptr_domain_name:
                    Type: TypeString
                    Description: The domain name to be used when creating DNSv6 records for the external IPv6 ranges.
                    Computed: "true"
                    Optional: "true"
                security_policy:
                    Type: TypeString
                    Description: A full or partial URL to a security policy to add to this instance. If this field is set to an empty string it will remove the associated security policy.
                    Computed: "true"
        ipv6_access_type:
            Type: TypeString
            Description: One of EXTERNAL, INTERNAL to indicate whether the IP can be accessed from the Internet. This field is always inherited from its subnetwork.
            Computed: "true"
        ipv6_address:
            Type: TypeString
            Description: An IPv6 internal network address for this network interface. If not specified, Google Cloud will automatically assign an internal IPv6 address from the instance's subnetwork.
            Computed: "true"
            Optional: "true"
        name:
            Type: TypeString
            Description: The name of the interface
            Computed: "true"
        network:
            Type: TypeString
            Description: The name or self_link of the network attached to this interface.
            Computed: "true"
            Optional: "true"
        network_attachment:
            Type: TypeString
            Description: 'The URL of the network attachment that this interface should connect to in the following format: projects/{projectNumber}/regions/{region_name}/networkAttachments/{network_attachment_name}.'
            Computed: "true"
            Optional: "true"
        network_ip:
            Type: TypeString
            Description: The private IP address assigned to the instance.
            Computed: "true"
            Optional: "true"
        nic_type:
            Type: TypeString
            Description: The type of vNIC to be used on this interface. Possible values:GVNIC, VIRTIO_NET
            Computed: "true"
            Optional: "true"
        queue_count:
            Type: TypeInt
            Description: The networking queue count that's specified by users for the network interface. Both Rx and Tx queues will be set to this number. It will be empty if not specified.
            Computed: "true"
            Optional: "true"
        security_policy:
            Type: TypeString
            Description: A full or partial URL to a security policy to add to this instance. If this field is set to an empty string it will remove the associated security policy.
            Computed: "true"
            Optional: "true"
        stack_type:
            Type: TypeString
            Description: The stack type for this network interface to identify whether the IPv6 feature is enabled or not. If not specified, IPV4_ONLY will be used.
            Computed: "true"
            Optional: "true"
        subnetwork:
            Type: TypeString
            Description: The name or self_link of the subnetwork attached to this interface.
            Computed: "true"
            Optional: "true"
        subnetwork_project:
            Type: TypeString
            Description: The project in which the subnetwork belongs.
            Computed: "true"
            Optional: "true"
network_performance_config:
    Type: TypeList
    Description: Configures network performance settings for the instance. If not specified, the instance will be created with its default network performance configuration.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        total_egress_bandwidth_tier:
            Type: TypeString
            Description: The egress bandwidth tier to enable. Possible values:TIER_1, DEFAULT
            Required: "true"
params:
    Type: TypeList
    Description: Stores additional params passed with the request, but not persisted as part of resource payload.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        resource_manager_tags:
            Type: TypeMap
            Description: A map of resource manager tags. Resource manager tag keys and values have the same definition as resource manager tags. Keys must be in the format tagKeys/{tag_key_id}, and values are in the format tagValues/456. The field is ignored (both PUT & PATCH) when empty.
            Computed: "true"
            Optional: "true"
project:
    Type: TypeString
    Description: The ID of the project in which the resource belongs. If self_link is provided, this value is ignored. If neither self_link nor project are provided, the provider project is used.
    Computed: "true"
    Optional: "true"
reservation_affinity:
    Type: TypeList
    Description: Specifies the reservations that this instance can consume from.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        specific_reservation:
            Type: TypeList
            Description: Specifies the label selector for the reservation to use.
            Computed: "true"
            Optional: "true"
            MaxItems: "1"
            Properties:
                key:
                    Type: TypeString
                    Description: Corresponds to the label key of a reservation resource. To target a SPECIFIC_RESERVATION by name, specify compute.googleapis.com/reservation-name as the key and specify the name of your reservation as the only value.
                    Required: "true"
                values:
                    Type: TypeList
                    Description: Corresponds to the label values of a reservation resource.
                    Required: "true"
        type:
            Type: TypeString
            Description: The type of reservation from which this instance can consume resources.
            Required: "true"
resource_policies:
    Type: TypeList
    Description: A list of self_links of resource policies to attach to the instance. Currently a max of 1 resource policy is supported.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
scheduling:
    Type: TypeList
    Description: The scheduling strategy being used by the instance.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        automatic_restart:
            Type: TypeBool
            Description: Specifies if the instance should be restarted if it was terminated by Compute Engine (not a user).
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: scheduling.0.on_host_maintenance, scheduling.0.automatic_restart, scheduling.0.preemptible, scheduling.0.node_affinities, scheduling.0.min_node_cpus, scheduling.0.provisioning_model, scheduling.0.instance_termination_action, scheduling.0.max_run_duration, scheduling.0.maintenance_interval, scheduling.0.local_ssd_recovery_timeout
        instance_termination_action:
            Type: TypeString
            Description: Specifies the action GCE should take when SPOT VM is preempted.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: scheduling.0.on_host_maintenance, scheduling.0.automatic_restart, scheduling.0.preemptible, scheduling.0.node_affinities, scheduling.0.min_node_cpus, scheduling.0.provisioning_model, scheduling.0.instance_termination_action, scheduling.0.max_run_duration, scheduling.0.maintenance_interval, scheduling.0.local_ssd_recovery_timeout
        local_ssd_recovery_timeout:
            Type: TypeList
            Description: |-
                Specifies the maximum amount of time a Local Ssd Vm should wait while
                  recovery of the Local Ssd state is attempted. Its value should be in
                  between 0 and 168 hours with hour granularity and the default value being 1
                  hour.
            Computed: "true"
            Optional: "true"
            MaxItems: "1"
            Properties:
                nanos:
                    Type: TypeInt
                    Description: |-
