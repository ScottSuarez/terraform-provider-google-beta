scratch_disk:
    Type: TypeList
    Description: The scratch disks attached to the instance.
    Computed: "true"
    Optional: "true"
    Properties:
        device_name:
            Type: TypeString
            Description: Name with which the attached disk is accessible under /dev/disk/by-id/
            Computed: "true"
            Optional: "true"
        interface:
            Type: TypeString
            Description: The disk interface used for attaching this disk. One of SCSI or NVME.
            Required: "true"
        size:
            Type: TypeInt
            Description: The size of the disk in gigabytes. One of 375 or 3000.
            Computed: "true"
            Optional: "true"
self_link:
    Type: TypeString
    Description: The URI of the created resource.
    Computed: "true"
service_account:
    Type: TypeList
    Description: The service account to attach to the instance.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        email:
            Type: TypeString
            Description: The service account e-mail address.
            Computed: "true"
            Optional: "true"
        scopes:
            Type: TypeSet
            Description: A list of service scopes.
            Required: "true"
shielded_instance_config:
    Type: TypeList
    Description: The shielded vm config being used by the instance.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enable_integrity_monitoring:
            Type: TypeBool
            Description: Whether integrity monitoring is enabled for the instance.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: shielded_instance_config.0.enable_secure_boot, shielded_instance_config.0.enable_vtpm, shielded_instance_config.0.enable_integrity_monitoring
        enable_secure_boot:
            Type: TypeBool
            Description: Whether secure boot is enabled for the instance.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: shielded_instance_config.0.enable_secure_boot, shielded_instance_config.0.enable_vtpm, shielded_instance_config.0.enable_integrity_monitoring
        enable_vtpm:
            Type: TypeBool
            Description: Whether the instance uses vTPM.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: shielded_instance_config.0.enable_secure_boot, shielded_instance_config.0.enable_vtpm, shielded_instance_config.0.enable_integrity_monitoring
source_instance_template:
    Type: TypeString
    Description: Name or self link of an instance template to create the instance based on.
    Required: "true"
tags:
    Type: TypeSet
    Description: The list of tags attached to the instance.
