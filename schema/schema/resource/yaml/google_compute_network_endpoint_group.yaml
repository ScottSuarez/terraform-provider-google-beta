default_port:
    Type: TypeInt
    Description: |-
        The default port used if the port number is not specified in the
        network endpoint.
    Optional: "true"
description:
    Type: TypeString
    Description: |-
        An optional description of this resource. Provide this property when
        you create the resource.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource; provided by the client when the resource is
        created. The name must be 1-63 characters long, and comply with
        RFC1035. Specifically, the name must be 1-63 characters long and match
        the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which means the
        first character must be a lowercase letter, and all following
        characters must be a dash, lowercase letter, or digit, except the last
        character, which cannot be a dash.
    Required: "true"
network:
    Type: TypeString
    Description: |-
        The network to which all network endpoints in the NEG belong.
        Uses "default" project network if unspecified.
    Required: "true"
network_endpoint_type:
    Type: TypeString
    Description: |-
        Type of network endpoints in this network endpoint group.
        NON_GCP_PRIVATE_IP_PORT is used for hybrid connectivity network
        endpoint groups (see https://cloud.google.com/load-balancing/docs/hybrid).
        Note that NON_GCP_PRIVATE_IP_PORT can only be used with Backend Services
        that 1) have the following load balancing schemes: EXTERNAL, EXTERNAL_MANAGED,
        INTERNAL_MANAGED, and INTERNAL_SELF_MANAGED and 2) support the RATE or
        CONNECTION balancing modes.

        Possible values include: GCE_VM_IP, GCE_VM_IP_PORT, NON_GCP_PRIVATE_IP_PORT, INTERNET_IP_PORT, INTERNET_FQDN_PORT, SERVERLESS, and PRIVATE_SERVICE_CONNECT. Default value: "GCE_VM_IP_PORT" Possible values: ["GCE_VM_IP", "GCE_VM_IP_PORT", "NON_GCP_PRIVATE_IP_PORT", "INTERNET_IP_PORT", "INTERNET_FQDN_PORT", "SERVERLESS", "PRIVATE_SERVICE_CONNECT"]
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
size:
    Type: TypeInt
    Description: Number of network endpoints in the network endpoint group.
    Computed: "true"
subnetwork:
    Type: TypeString
    Description: Optional subnetwork to which all network endpoints in the NEG belong.
    Optional: "true"
zone:
    Type: TypeString
    Description: Zone where the network endpoint group is located.
    Computed: "true"
    Optional: "true"

