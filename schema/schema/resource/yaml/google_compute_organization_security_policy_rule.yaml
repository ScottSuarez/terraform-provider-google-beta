action:
    Type: TypeString
    Description: |-
        The Action to perform when the client connection triggers the rule. Can currently be either
        "allow", "deny" or "goto_next".
    Required: "true"
description:
    Type: TypeString
    Description: A description of the rule.
    Optional: "true"
direction:
    Type: TypeString
    Description: 'The direction in which this rule applies. If unspecified an INGRESS rule is created. Possible values: ["INGRESS", "EGRESS"]'
    Optional: "true"
enable_logging:
    Type: TypeBool
    Description: |-
        Denotes whether to enable logging for a particular rule.
        If logging is enabled, logs will be exported to the
        configured export destination in Stackdriver.
    Optional: "true"
match:
    Type: TypeList
    Description: A match condition that incoming traffic is evaluated against. If it evaluates to true, the corresponding 'action' is enforced.
    Required: "true"
    MaxItems: "1"
    Properties:
        config:
            Type: TypeList
            Description: The configuration options for matching the rule.
            Required: "true"
            MaxItems: "1"
            Properties:
                dest_ip_ranges:
                    Type: TypeList
                    Description: |-
                        Destination IP address range in CIDR format. Required for
                        EGRESS rules.
                    Optional: "true"
                    ExactlyOneOf: match.0.config.0.src_ip_ranges, match.0.config.0.dest_ip_ranges
                layer4_config:
                    Type: TypeList
                    Description: Pairs of IP protocols and ports that the rule should match.
                    Required: "true"
                    Properties:
                        ip_protocol:
                            Type: TypeString
                            Description: |-
                                The IP protocol to which this rule applies. The protocol
                                type is required when creating a firewall rule.
                                This value can either be one of the following well
                                known protocol strings (tcp, udp, icmp, esp, ah, ipip, sctp),
                                or the IP protocol number.
                            Required: "true"
                        ports:
                            Type: TypeList
                            Description: |-
                                An optional list of ports to which this rule applies. This field
                                is only applicable for UDP or TCP protocol. Each entry must be
                                either an integer or a range. If not specified, this rule
                                applies to connections through any port.

                                Example inputs include: ["22"], ["80","443"], and
                                ["12345-12349"].
                            Optional: "true"
                src_ip_ranges:
                    Type: TypeList
                    Description: |-
                        Source IP address range in CIDR format. Required for
                        INGRESS rules.
                    Optional: "true"
                    ExactlyOneOf: match.0.config.0.src_ip_ranges, match.0.config.0.dest_ip_ranges
        description:
            Type: TypeString
            Description: A description of the rule.
            Optional: "true"
        versioned_expr:
            Type: TypeString
            Description: |-
                Preconfigured versioned expression. For organization security policy rules,
                the only supported type is "FIREWALL". Default value: "FIREWALL" Possible values: ["FIREWALL"]
            Optional: "true"
policy_id:
    Type: TypeString
    Description: The ID of the OrganizationSecurityPolicy this rule applies to.
    Required: "true"
preview:
    Type: TypeBool
    Description: If set to true, the specified action is not enforced.
    Optional: "true"
priority:
    Type: TypeInt
    Description: |-
        An integer indicating the priority of a rule in the list. The priority must be a value
        between 0 and 2147483647. Rules are evaluated from highest to lowest priority where 0 is the
        highest priority and 2147483647 is the lowest prority.
    Required: "true"
target_resources:
    Type: TypeList
    Description: |-
        A list of network resource URLs to which this rule applies.
        This field allows you to control which network's VMs get
        this rule. If this field is left blank, all VMs
        within the organization will receive the rule.
    Optional: "true"
target_service_accounts:
    Type: TypeList
    Description: |-
        A list of service accounts indicating the sets of
        instances that are applied with this rule.
    Optional: "true"

