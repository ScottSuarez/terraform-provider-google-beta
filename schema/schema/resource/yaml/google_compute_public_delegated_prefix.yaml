description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
ip_cidr_range:
    Type: TypeString
    Description: The IPv4 address range, in CIDR format, represented by this public advertised prefix.
    Required: "true"
is_live_migration:
    Type: TypeBool
    Description: If true, the prefix will be live migrated.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. The name must be 1-63 characters long, and
        comply with RFC1035. Specifically, the name must be 1-63 characters
        long and match the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?'
        which means the first character must be a lowercase letter, and all
        following characters must be a dash, lowercase letter, or digit,
        except the last character, which cannot be a dash.
    Required: "true"
parent_prefix:
    Type: TypeString
    Description: The URL of parent prefix. Either PublicAdvertisedPrefix or PublicDelegatedPrefix.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: A region where the prefix will reside.
    Required: "true"
self_link:
    Type: TypeString
    Computed: "true"

