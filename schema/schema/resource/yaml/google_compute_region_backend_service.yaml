affinity_cookie_ttl_sec:
    Type: TypeInt
    Description: |-
        Lifetime of cookies in seconds if session_affinity is
        GENERATED_COOKIE. If set to 0, the cookie is non-persistent and lasts
        only until the end of the browser session (or equivalent). The
        maximum allowed value for TTL is one day.

        When the load balancing scheme is INTERNAL, this field is not used.
    Optional: "true"
backend:
    Type: TypeSet
    Description: The set of backends that serve this RegionBackendService.
    Optional: "true"
    Properties:
        balancing_mode:
            Type: TypeString
            Description: |-
                Specifies the balancing mode for this backend.

                See the [Backend Services Overview](https://cloud.google.com/load-balancing/docs/backend-service#balancing-mode)
                for an explanation of load balancing modes. Default value: "CONNECTION" Possible values: ["UTILIZATION", "RATE", "CONNECTION"]
            Optional: "true"
        capacity_scaler:
            Type: TypeFloat
            Description: |-
                A multiplier applied to the group's maximum servicing capacity
                (based on UTILIZATION, RATE or CONNECTION).

                ~>**NOTE**: This field cannot be set for
                INTERNAL region backend services (default loadBalancingScheme),
                but is required for non-INTERNAL backend service. The total
                capacity_scaler for all backends must be non-zero.

                A setting of 0 means the group is completely drained, offering
                0% of its available Capacity. Valid range is [0.0,1.0].
            Optional: "true"
        description:
            Type: TypeString
            Description: |-
                An optional description of this resource.
                Provide this property when you create the resource.
            Optional: "true"
        failover:
            Type: TypeBool
            Description: |-
                This field designates whether this is a failover backend. More
                than one failover backend can be configured for a given RegionBackendService.
            Computed: "true"
            Optional: "true"
        group:
            Type: TypeString
            Description: |-
                The fully-qualified URL of an Instance Group or Network Endpoint
                Group resource. In case of instance group this defines the list
                of instances that serve traffic. Member virtual machine
                instances from each instance group must live in the same zone as
                the instance group itself. No two backends in a backend service
                are allowed to use same Instance Group resource.

                For Network Endpoint Groups this defines list of endpoints. All
                endpoints of Network Endpoint Group must be hosted on instances
                located in the same zone as the Network Endpoint Group.

                Backend services cannot mix Instance Group and
                Network Endpoint Group backends.

                When the 'load_balancing_scheme' is INTERNAL, only instance groups
                are supported.

                Note that you must specify an Instance Group or Network Endpoint
                Group resource using the fully-qualified URL, rather than a
                partial URL.
            Required: "true"
        max_connections:
            Type: TypeInt
            Description: |-
                The max number of simultaneous connections for the group. Can
                be used with either CONNECTION or UTILIZATION balancing modes.
                Cannot be set for INTERNAL backend services.

                For CONNECTION mode, either maxConnections or one
                of maxConnectionsPerInstance or maxConnectionsPerEndpoint,
                as appropriate for group type, must be set.
            Optional: "true"
        max_connections_per_endpoint:
            Type: TypeInt
            Description: |-
                The max number of simultaneous connections that a single backend
                network endpoint can handle. Cannot be set
                for INTERNAL backend services.

                This is used to calculate the capacity of the group. Can be
                used in either CONNECTION or UTILIZATION balancing modes. For
                CONNECTION mode, either maxConnections or
                maxConnectionsPerEndpoint must be set.
            Optional: "true"
        max_connections_per_instance:
            Type: TypeInt
            Description: |-
                The max number of simultaneous connections that a single
                backend instance can handle. Cannot be set for INTERNAL backend
                services.

                This is used to calculate the capacity of the group.
                Can be used in either CONNECTION or UTILIZATION balancing modes.
                For CONNECTION mode, either maxConnections or
                maxConnectionsPerInstance must be set.
            Optional: "true"
        max_rate:
            Type: TypeInt
            Description: |-
                The max requests per second (RPS) of the group. Cannot be set
                for INTERNAL backend services.

                Can be used with either RATE or UTILIZATION balancing modes,
                but required if RATE mode. Either maxRate or one
                of maxRatePerInstance or maxRatePerEndpoint, as appropriate for
                group type, must be set.
            Optional: "true"
        max_rate_per_endpoint:
            Type: TypeFloat
            Description: |-
                The max requests per second (RPS) that a single backend network
                endpoint can handle. This is used to calculate the capacity of
                the group. Can be used in either balancing mode. For RATE mode,
                either maxRate or maxRatePerEndpoint must be set. Cannot be set
                for INTERNAL backend services.
            Optional: "true"
        max_rate_per_instance:
            Type: TypeFloat
            Description: |-
                The max requests per second (RPS) that a single backend
                instance can handle. This is used to calculate the capacity of
                the group. Can be used in either balancing mode. For RATE mode,
                either maxRate or maxRatePerInstance must be set. Cannot be set
                for INTERNAL backend services.
            Optional: "true"
        max_utilization:
            Type: TypeFloat
            Description: |-
                Used when balancingMode is UTILIZATION. This ratio defines the
                CPU utilization target for the group. Valid range is [0.0, 1.0].
                Cannot be set for INTERNAL backend services.
            Optional: "true"
cdn_policy:
    Type: TypeList
    Description: Cloud CDN configuration for this BackendService.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        cache_key_policy:
            Type: TypeList
            Description: The CacheKeyPolicy for this CdnPolicy.
            Optional: "true"
            AtLeastOneOf: cdn_policy.0.cache_key_policy, cdn_policy.0.signed_url_cache_max_age_sec
            MaxItems: "1"
            Properties:
                include_host:
                    Type: TypeBool
                    Description: If true requests to different hosts will be cached separately.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
                include_named_cookies:
                    Type: TypeList
                    Description: Names of cookies to include in cache keys.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
                include_protocol:
                    Type: TypeBool
                    Description: If true, http and https requests will be cached separately.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
                include_query_string:
                    Type: TypeBool
                    Description: |-
                        If true, include query string parameters in the cache key
                        according to query_string_whitelist and
                        query_string_blacklist. If neither is set, the entire query
                        string will be included.

                        If false, the query string will be excluded from the cache
                        key entirely.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
                query_string_blacklist:
                    Type: TypeSet
                    Description: |-
                        Names of query string parameters to exclude in cache keys.

                        All other parameters will be included. Either specify
                        query_string_whitelist or query_string_blacklist, not both.
                        '&' and '=' will be percent encoded and not treated as
                        delimiters.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
                query_string_whitelist:
                    Type: TypeSet
                    Description: |-
                        Names of query string parameters to include in cache keys.

                        All other parameters will be excluded. Either specify
                        query_string_whitelist or query_string_blacklist, not both.
                        '&' and '=' will be percent encoded and not treated as
                        delimiters.
                    Optional: "true"
                    AtLeastOneOf: cdn_policy.0.cache_key_policy.0.include_host, cdn_policy.0.cache_key_policy.0.include_protocol, cdn_policy.0.cache_key_policy.0.include_query_string, cdn_policy.0.cache_key_policy.0.query_string_blacklist, cdn_policy.0.cache_key_policy.0.query_string_whitelist, cdn_policy.0.cache_key_policy.0.include_named_cookies
        cache_mode:
            Type: TypeString
            Description: |-
                Specifies the cache setting for all responses from this backend.
                The possible values are: USE_ORIGIN_HEADERS, FORCE_CACHE_ALL and CACHE_ALL_STATIC Possible values: ["USE_ORIGIN_HEADERS", "FORCE_CACHE_ALL", "CACHE_ALL_STATIC"]
            Computed: "true"
            Optional: "true"
        client_ttl:
            Type: TypeInt
            Description: Specifies the maximum allowed TTL for cached content served by this origin.
            Computed: "true"
            Optional: "true"
        default_ttl:
            Type: TypeInt
            Description: |-
                Specifies the default TTL for cached content served by this origin for responses
                that do not have an existing valid TTL (max-age or s-max-age).
            Computed: "true"
            Optional: "true"
        max_ttl:
            Type: TypeInt
            Description: Specifies the maximum allowed TTL for cached content served by this origin.
            Computed: "true"
            Optional: "true"
        negative_caching:
            Type: TypeBool
            Description: Negative caching allows per-status code TTLs to be set, in order to apply fine-grained caching for common errors or redirects.
            Computed: "true"
            Optional: "true"
        negative_caching_policy:
            Type: TypeList
            Description: |-
                Sets a cache TTL for the specified HTTP status code. negativeCaching must be enabled to configure negativeCachingPolicy.
                Omitting the policy and leaving negativeCaching enabled will use Cloud CDN's default cache TTLs.
            Optional: "true"
            Properties:
                code:
                    Type: TypeInt
                    Description: |-
                        The HTTP status code to define a TTL against. Only HTTP status codes 300, 301, 308, 404, 405, 410, 421, 451 and 501
                        can be specified as values, and you cannot specify a status code more than once.
                    Optional: "true"
                ttl:
                    Type: TypeInt
                    Description: |-
                        The TTL (in seconds) for which to cache responses with the corresponding status code. The maximum allowed value is 1800s
                        (30 minutes), noting that infrequently accessed objects may be evicted from the cache before the defined TTL.
                    Optional: "true"
        serve_while_stale:
            Type: TypeInt
            Description: Serve existing content from the cache (if available) when revalidating content with the origin, or when an error is encountered when refreshing the cache.
            Computed: "true"
            Optional: "true"
        signed_url_cache_max_age_sec:
            Type: TypeInt
            Description: |-
                Maximum number of seconds the response to a signed URL request
                will be considered fresh, defaults to 1hr (3600s). After this
                time period, the response will be revalidated before
                being served.

                When serving responses to signed URL requests, Cloud CDN will
                internally behave as though all responses from this backend had a
                "Cache-Control: public, max-age=[TTL]" header, regardless of any
                existing Cache-Control header. The actual headers served in
                responses will not be altered.
            Optional: "true"
            AtLeastOneOf: cdn_policy.0.cache_key_policy, cdn_policy.0.signed_url_cache_max_age_sec
circuit_breakers:
    Type: TypeList
    Description: |-
        Settings controlling the volume of connections to a backend service. This field
        is applicable only when the 'load_balancing_scheme' is set to INTERNAL_MANAGED
        and the 'protocol' is set to HTTP, HTTPS, or HTTP2.
    Optional: "true"
    MaxItems: "1"
    Properties:
        connect_timeout:
            Type: TypeList
            Description: The timeout for new network connections to hosts.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
            MaxItems: "1"
            Properties:
                nanos:
                    Type: TypeInt
                    Description: |-
                        Span of time that's a fraction of a second at nanosecond
                        resolution. Durations less than one second are represented
                        with a 0 seconds field and a positive nanos field. Must
                        be from 0 to 999,999,999 inclusive.
                    Optional: "true"
                seconds:
                    Type: TypeInt
                    Description: |-
                        Span of time at a resolution of a second.
                        Must be from 0 to 315,576,000,000 inclusive.
                    Required: "true"
        max_connections:
            Type: TypeInt
            Description: |-
                The maximum number of connections to the backend cluster.
                Defaults to 1024.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
        max_pending_requests:
            Type: TypeInt
            Description: |-
                The maximum number of pending requests to the backend cluster.
                Defaults to 1024.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
        max_requests:
            Type: TypeInt
            Description: |-
                The maximum number of parallel requests to the backend cluster.
                Defaults to 1024.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
        max_requests_per_connection:
            Type: TypeInt
            Description: |-
                Maximum requests for a single backend connection. This parameter
                is respected by both the HTTP/1.1 and HTTP/2 implementations. If
                not specified, there is no limit. Setting this parameter to 1
                will effectively disable keep alive.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
        max_retries:
            Type: TypeInt
            Description: |-
                The maximum number of parallel retries to the backend cluster.
                Defaults to 3.
            Optional: "true"
            AtLeastOneOf: circuit_breakers.0.connect_timeout, circuit_breakers.0.max_requests_per_connection, circuit_breakers.0.max_connections, circuit_breakers.0.max_pending_requests, circuit_breakers.0.max_requests, circuit_breakers.0.max_retries
connection_draining_timeout_sec:
    Type: TypeInt
    Description: |-
        Time for which instance will be drained (not accept new
        connections, but still work to finish started).
    Optional: "true"
connection_tracking_policy:
    Type: TypeList
    Description: |-
        Connection Tracking configuration for this BackendService.
        This is available only for Layer 4 Internal Load Balancing and
        Network Load Balancing.
    Optional: "true"
    MaxItems: "1"
    Properties:
        connection_persistence_on_unhealthy_backends:
            Type: TypeString
            Description: |-
                Specifies connection persistence when backends are unhealthy.

                If set to 'DEFAULT_FOR_PROTOCOL', the existing connections persist on
                unhealthy backends only for connection-oriented protocols (TCP and SCTP)
                and only if the Tracking Mode is PER_CONNECTION (default tracking mode)
                or the Session Affinity is configured for 5-tuple. They do not persist
                for UDP.

                If set to 'NEVER_PERSIST', after a backend becomes unhealthy, the existing
                connections on the unhealthy backend are never persisted on the unhealthy
                backend. They are always diverted to newly selected healthy backends
                (unless all backends are unhealthy).

                If set to 'ALWAYS_PERSIST', existing connections always persist on
                unhealthy backends regardless of protocol and session affinity. It is
                generally not recommended to use this mode overriding the default. Default value: "DEFAULT_FOR_PROTOCOL" Possible values: ["DEFAULT_FOR_PROTOCOL", "NEVER_PERSIST", "ALWAYS_PERSIST"]
            Optional: "true"
        enable_strong_affinity:
            Type: TypeBool
            Description: Enable Strong Session Affinity for Network Load Balancing. This option is not available publicly.
            Optional: "true"
        idle_timeout_sec:
            Type: TypeInt
            Description: |-
                Specifies how long to keep a Connection Tracking entry while there is
                no matching traffic (in seconds).

                For L4 ILB the minimum(default) is 10 minutes and maximum is 16 hours.

                For NLB the minimum(default) is 60 seconds and the maximum is 16 hours.
            Computed: "true"
            Optional: "true"
        tracking_mode:
            Type: TypeString
            Description: |-
                Specifies the key used for connection tracking. There are two options:
                'PER_CONNECTION': The Connection Tracking is performed as per the
                Connection Key (default Hash Method) for the specific protocol.

                'PER_SESSION': The Connection Tracking is performed as per the
                configured Session Affinity. It matches the configured Session Affinity. Default value: "PER_CONNECTION" Possible values: ["PER_CONNECTION", "PER_SESSION"]
            Optional: "true"
consistent_hash:
    Type: TypeList
    Description: |-
        Consistent Hash-based load balancing can be used to provide soft session
        affinity based on HTTP headers, cookies or other properties. This load balancing
        policy is applicable only for HTTP connections. The affinity to a particular
        destination host will be lost when one or more hosts are added/removed from the
        destination service. This field specifies parameters that control consistent
        hashing.
        This field only applies when all of the following are true -
          * 'load_balancing_scheme' is set to INTERNAL_MANAGED
          * 'protocol' is set to HTTP, HTTPS, or HTTP2
          * 'locality_lb_policy' is set to MAGLEV or RING_HASH
    Optional: "true"
    MaxItems: "1"
    Properties:
        http_cookie:
            Type: TypeList
            Description: |-
                Hash is based on HTTP Cookie. This field describes a HTTP cookie
                that will be used as the hash key for the consistent hash load
                balancer. If the cookie is not present, it will be generated.
                This field is applicable if the sessionAffinity is set to HTTP_COOKIE.
            Optional: "true"
            AtLeastOneOf: consistent_hash.0.http_cookie, consistent_hash.0.http_header_name, consistent_hash.0.minimum_ring_size
            MaxItems: "1"
            Properties:
                name:
                    Type: TypeString
                    Description: Name of the cookie.
                    Optional: "true"
                    AtLeastOneOf: consistent_hash.0.http_cookie.0.ttl, consistent_hash.0.http_cookie.0.name, consistent_hash.0.http_cookie.0.path
                path:
                    Type: TypeString
                    Description: Path to set for the cookie.
                    Optional: "true"
                    AtLeastOneOf: consistent_hash.0.http_cookie.0.ttl, consistent_hash.0.http_cookie.0.name, consistent_hash.0.http_cookie.0.path
                ttl:
                    Type: TypeList
                    Description: Lifetime of the cookie.
                    Optional: "true"
                    AtLeastOneOf: consistent_hash.0.http_cookie.0.ttl, consistent_hash.0.http_cookie.0.name, consistent_hash.0.http_cookie.0.path
                    MaxItems: "1"
                    Properties:
                        nanos:
                            Type: TypeInt
                            Description: |-
                                Span of time that's a fraction of a second at nanosecond
                                resolution. Durations less than one second are represented
                                with a 0 seconds field and a positive nanos field. Must
                                be from 0 to 999,999,999 inclusive.
                            Optional: "true"
                        seconds:
                            Type: TypeInt
                            Description: |-
                                Span of time at a resolution of a second.
                                Must be from 0 to 315,576,000,000 inclusive.
                            Required: "true"
        http_header_name:
            Type: TypeString
            Description: |-
                The hash based on the value of the specified header field.
                This field is applicable if the sessionAffinity is set to HEADER_FIELD.
            Optional: "true"
            AtLeastOneOf: consistent_hash.0.http_cookie, consistent_hash.0.http_header_name, consistent_hash.0.minimum_ring_size
        minimum_ring_size:
            Type: TypeInt
            Description: |-
                The minimum number of virtual nodes to use for the hash ring.
                Larger ring sizes result in more granular load
                distributions. If the number of hosts in the load balancing pool
                is larger than the ring size, each host will be assigned a single
                virtual node.
                Defaults to 1024.
            Optional: "true"
            AtLeastOneOf: consistent_hash.0.http_cookie, consistent_hash.0.http_header_name, consistent_hash.0.minimum_ring_size
creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
enable_cdn:
    Type: TypeBool
    Description: If true, enable Cloud CDN for this RegionBackendService.
    Optional: "true"
failover_policy:
    Type: TypeList
    Description: Policy for failovers.
    Optional: "true"
    MaxItems: "1"
    Properties:
        disable_connection_drain_on_failover:
            Type: TypeBool
            Description: |-
                On failover or failback, this field indicates whether connection drain
                will be honored. Setting this to true has the following effect: connections
                to the old active pool are not drained. Connections to the new active pool
                use the timeout of 10 min (currently fixed). Setting to false has the
                following effect: both old and new connections will have a drain timeout
                of 10 min.
                This can be set to true only if the protocol is TCP.
                The default is false.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: failover_policy.0.disable_connection_drain_on_failover, failover_policy.0.drop_traffic_if_unhealthy, failover_policy.0.failover_ratio
        drop_traffic_if_unhealthy:
            Type: TypeBool
            Description: |-
                This option is used only when no healthy VMs are detected in the primary
                and backup instance groups. When set to true, traffic is dropped. When
                set to false, new connections are sent across all VMs in the primary group.
                The default is false.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: failover_policy.0.disable_connection_drain_on_failover, failover_policy.0.drop_traffic_if_unhealthy, failover_policy.0.failover_ratio
        failover_ratio:
            Type: TypeFloat
            Description: |-
                The value of the field must be in [0, 1]. If the ratio of the healthy
                VMs in the primary backend is at or below this number, traffic arriving
                at the load-balanced IP will be directed to the failover backend.
                In case where 'failoverRatio' is not set or all the VMs in the backup
                backend are unhealthy, the traffic will be directed back to the primary
                backend in the "force" mode, where traffic will be spread to the healthy
                VMs with the best effort, or to all VMs when no VM is healthy.
                This field is only used with l4 load balancing.
            Optional: "true"
            AtLeastOneOf: failover_policy.0.disable_connection_drain_on_failover, failover_policy.0.drop_traffic_if_unhealthy, failover_policy.0.failover_ratio
fingerprint:
    Type: TypeString
    Description: |-
        Fingerprint of this resource. A hash of the contents stored in this
        object. This field is used in optimistic locking.
    Computed: "true"
health_checks:
    Type: TypeSet
    Description: |-
        The set of URLs to HealthCheck resources for health checking
        this RegionBackendService. Currently at most one health
        check can be specified.

        A health check must be specified unless the backend service uses an internet
        or serverless NEG as a backend.
    Optional: "true"
    MaxItems: "1"
    MinItems: "1"
iap:
    Type: TypeList
    Description: Settings for enabling Cloud Identity Aware Proxy
    Optional: "true"
    MaxItems: "1"
    Properties:
        oauth2_client_id:
            Type: TypeString
            Description: OAuth2 Client ID for IAP
            Required: "true"
        oauth2_client_secret:
            Type: TypeString
            Description: OAuth2 Client Secret for IAP
            Required: "true"
        oauth2_client_secret_sha256:
            Type: TypeString
            Description: OAuth2 Client Secret SHA-256 for IAP
            Computed: "true"
load_balancing_scheme:
    Type: TypeString
    Description: |-
        Indicates what kind of load balancing this regional backend service
        will be used for. A backend service created for one type of load
        balancing cannot be used with the other(s). For more information, refer to
        [Choosing a load balancer](https://cloud.google.com/load-balancing/docs/backend-service). Default value: "INTERNAL" Possible values: ["EXTERNAL", "EXTERNAL_MANAGED", "INTERNAL", "INTERNAL_MANAGED"]
    Optional: "true"
locality_lb_policy:
    Type: TypeString
    Description: |-
        The load balancing algorithm used within the scope of the locality.
        The possible values are:

        * 'ROUND_ROBIN': This is a simple policy in which each healthy backend
                         is selected in round robin order.

        * 'LEAST_REQUEST': An O(1) algorithm which selects two random healthy
                           hosts and picks the host which has fewer active requests.

        * 'RING_HASH': The ring/modulo hash load balancer implements consistent
                       hashing to backends. The algorithm has the property that the
                       addition/removal of a host from a set of N hosts only affects
                       1/N of the requests.

        * 'RANDOM': The load balancer selects a random healthy host.

        * 'ORIGINAL_DESTINATION': Backend host is selected based on the client
                                  connection metadata, i.e., connections are opened
                                  to the same address as the destination address of
                                  the incoming connection before the connection
                                  was redirected to the load balancer.

        * 'MAGLEV': used as a drop in replacement for the ring hash load balancer.
                    Maglev is not as stable as ring hash but has faster table lookup
                    build times and host selection times. For more information about
                    Maglev, refer to https://ai.google/research/pubs/pub44824

        * 'WEIGHTED_MAGLEV': Per-instance weighted Load Balancing via health check
                             reported weights. If set, the Backend Service must
                             configure a non legacy HTTP-based Health Check, and
                             health check replies are expected to contain
                             non-standard HTTP response header field
                             X-Load-Balancing-Endpoint-Weight to specify the
                             per-instance weights. If set, Load Balancing is weight
                             based on the per-instance weights reported in the last
                             processed health check replies, as long as every
                             instance either reported a valid weight or had
                             UNAVAILABLE_WEIGHT. Otherwise, Load Balancing remains
                             equal-weight.


        This field is applicable to either:

        * A regional backend service with the service_protocol set to HTTP, HTTPS, or HTTP2,
          and loadBalancingScheme set to INTERNAL_MANAGED.
        * A global backend service with the load_balancing_scheme set to INTERNAL_SELF_MANAGED.
        * A regional backend service with loadBalancingScheme set to EXTERNAL (External Network
          Load Balancing). Only MAGLEV and WEIGHTED_MAGLEV values are possible for External
          Network Load Balancing. The default is MAGLEV.


        If session_affinity is not NONE, and this field is not set to MAGLEV, WEIGHTED_MAGLEV,
        or RING_HASH, session affinity settings will not take effect.

        Only ROUND_ROBIN and RING_HASH are supported when the backend service is referenced
        by a URL map that is bound to target gRPC proxy that has validate_for_proxyless
        field set to true. Possible values: ["ROUND_ROBIN", "LEAST_REQUEST", "RING_HASH", "RANDOM", "ORIGINAL_DESTINATION", "MAGLEV", "WEIGHTED_MAGLEV"]
    Optional: "true"
log_config:
    Type: TypeList
    Description: |-
        This field denotes the logging options for the load balancer traffic served by this backend service.
        If logging is enabled, logs will be exported to Stackdriver.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enable:
            Type: TypeBool
            Description: Whether to enable logging for the load balancer traffic served by this backend service.
            Optional: "true"
            AtLeastOneOf: log_config.0.enable, log_config.0.sample_rate
        sample_rate:
            Type: TypeFloat
            Description: |-
                This field can only be specified if logging is enabled for this backend service. The value of
                the field must be in [0, 1]. This configures the sampling rate of requests to the load balancer
                where 1.0 means all logged requests are reported and 0.0 means no logged requests are reported.
                The default value is 1.0.
            Optional: "true"
            AtLeastOneOf: log_config.0.enable, log_config.0.sample_rate
name:
    Type: TypeString
    Description: |-
        Name of the resource. Provided by the client when the resource is
        created. The name must be 1-63 characters long, and comply with
        RFC1035. Specifically, the name must be 1-63 characters long and match
        the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which means the
        first character must be a lowercase letter, and all following
        characters must be a dash, lowercase letter, or digit, except the last
        character, which cannot be a dash.
    Required: "true"
network:
    Type: TypeString
    Description: |-
        The URL of the network to which this backend service belongs.
        This field can only be specified when the load balancing scheme is set to INTERNAL.
    Optional: "true"
outlier_detection:
    Type: TypeList
    Description: |-
        Settings controlling eviction of unhealthy hosts from the load balancing pool.
        This field is applicable only when the 'load_balancing_scheme' is set
        to INTERNAL_MANAGED and the 'protocol' is set to HTTP, HTTPS, or HTTP2.
    Optional: "true"
    MaxItems: "1"
    Properties:
        base_ejection_time:
            Type: TypeList
            Description: |-
                The base time that a host is ejected for. The real time is equal to the base
                time multiplied by the number of times the host has been ejected. Defaults to
                30000ms or 30s.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
            MaxItems: "1"
            Properties:
                nanos:
                    Type: TypeInt
                    Description: |-
                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                        less than one second are represented with a 0 'seconds' field and a positive
                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                    Optional: "true"
                seconds:
                    Type: TypeInt
                    Description: |-
                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                        inclusive.
                    Required: "true"
        consecutive_errors:
            Type: TypeInt
            Description: |-
                Number of errors before a host is ejected from the connection pool. When the
                backend host is accessed over HTTP, a 5xx return code qualifies as an error.
                Defaults to 5.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        consecutive_gateway_failure:
            Type: TypeInt
            Description: |-
                The number of consecutive gateway failures (502, 503, 504 status or connection
                errors that are mapped to one of those status codes) before a consecutive
                gateway failure ejection occurs. Defaults to 5.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        enforcing_consecutive_errors:
            Type: TypeInt
            Description: |-
                The percentage chance that a host will be actually ejected when an outlier
                status is detected through consecutive 5xx. This setting can be used to disable
                ejection or to ramp it up slowly. Defaults to 100.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        enforcing_consecutive_gateway_failure:
            Type: TypeInt
            Description: |-
                The percentage chance that a host will be actually ejected when an outlier
                status is detected through consecutive gateway failures. This setting can be
                used to disable ejection or to ramp it up slowly. Defaults to 0.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        enforcing_success_rate:
            Type: TypeInt
            Description: |-
                The percentage chance that a host will be actually ejected when an outlier
                status is detected through success rate statistics. This setting can be used to
                disable ejection or to ramp it up slowly. Defaults to 100.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        interval:
            Type: TypeList
            Description: |-
                Time interval between ejection sweep analysis. This can result in both new
                ejections as well as hosts being returned to service. Defaults to 10 seconds.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
            MaxItems: "1"
            Properties:
                nanos:
                    Type: TypeInt
                    Description: |-
                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                        less than one second are represented with a 0 'seconds' field and a positive
                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                    Optional: "true"
                seconds:
                    Type: TypeInt
                    Description: |-
                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                        inclusive.
                    Required: "true"
        max_ejection_percent:
            Type: TypeInt
            Description: |-
                Maximum percentage of hosts in the load balancing pool for the backend service
                that can be ejected. Defaults to 10%.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        success_rate_minimum_hosts:
            Type: TypeInt
            Description: |-
                The number of hosts in a cluster that must have enough request volume to detect
                success rate outliers. If the number of hosts is less than this setting, outlier
                detection via success rate statistics is not performed for any host in the
                cluster. Defaults to 5.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        success_rate_request_volume:
            Type: TypeInt
            Description: |-
                The minimum number of total requests that must be collected in one interval (as
                defined by the interval duration above) to include this host in success rate
                based outlier detection. If the volume is lower than this setting, outlier
                detection via success rate statistics is not performed for that host. Defaults
                to 100.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
        success_rate_stdev_factor:
            Type: TypeInt
            Description: |-
                This factor is used to determine the ejection threshold for success rate outlier
                ejection. The ejection threshold is the difference between the mean success
                rate, and the product of this factor and the standard deviation of the mean
                success rate: mean - (stdev * success_rate_stdev_factor). This factor is divided
                by a thousand to get a double. That is, if the desired factor is 1.9, the
                runtime value should be 1900. Defaults to 1900.
            Optional: "true"
            AtLeastOneOf: outlier_detection.0.base_ejection_time, outlier_detection.0.consecutive_errors, outlier_detection.0.consecutive_gateway_failure, outlier_detection.0.enforcing_consecutive_errors, outlier_detection.0.enforcing_consecutive_gateway_failure, outlier_detection.0.enforcing_success_rate, outlier_detection.0.interval, outlier_detection.0.max_ejection_percent, outlier_detection.0.success_rate_minimum_hosts, outlier_detection.0.success_rate_request_volume, outlier_detection.0.success_rate_stdev_factor
port_name:
    Type: TypeString
    Description: |-
        A named port on a backend instance group representing the port for
        communication to the backend VMs in that group. Required when the
        loadBalancingScheme is EXTERNAL, EXTERNAL_MANAGED, INTERNAL_MANAGED, or INTERNAL_SELF_MANAGED
        and the backends are instance groups. The named port must be defined on each
        backend instance group. This parameter has no meaning if the backends are NEGs. API sets a
        default of "http" if not given.
        Must be omitted when the loadBalancingScheme is INTERNAL (Internal TCP/UDP Load Balancing).
    Computed: "true"
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
protocol:
    Type: TypeString
    Description: |-
        The protocol this RegionBackendService uses to communicate with backends.
        The default is HTTP. **NOTE**: HTTP2 is only valid for beta HTTP/2 load balancer
        types and may result in errors if used with the GA API. Possible values: ["HTTP", "HTTPS", "HTTP2", "SSL", "TCP", "UDP", "GRPC", "UNSPECIFIED"]
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: |-
        The Region in which the created backend service should reside.
        If it is not provided, the provider region is used.
    Computed: "true"
    Optional: "true"
security_policy:
    Type: TypeString
    Description: The security policy associated with this backend service.
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
session_affinity:
    Type: TypeString
    Description: |-
        Type of session affinity to use. The default is NONE. Session affinity is
        not applicable if the protocol is UDP. Possible values: ["NONE", "CLIENT_IP", "CLIENT_IP_PORT_PROTO", "CLIENT_IP_PROTO", "GENERATED_COOKIE", "HEADER_FIELD", "HTTP_COOKIE", "CLIENT_IP_NO_DESTINATION"]
    Computed: "true"
    Optional: "true"
subsetting:
    Type: TypeList
    Description: Subsetting configuration for this BackendService. Currently this is applicable only for Internal TCP/UDP load balancing and Internal HTTP(S) load balancing.
    Optional: "true"
    MaxItems: "1"
    Properties:
        policy:
            Type: TypeString
            Description: 'The algorithm used for subsetting. Possible values: ["CONSISTENT_HASH_SUBSETTING"]'
            Required: "true"
timeout_sec:
    Type: TypeInt
    Description: |-
        How many seconds to wait for the backend before considering it a
        failed request. Default is 30 seconds. Valid range is [1, 86400].
    Computed: "true"
    Optional: "true"

