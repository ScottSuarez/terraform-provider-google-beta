auto_renew:
    Type: TypeBool
    Description: |-
        Specifies whether to enable automatic renewal for the commitment.
        The default value is false if not specified.
        If the field is set to true, the commitment will be automatically renewed for either
        one or three years according to the terms of the existing commitment.
    Computed: "true"
    Optional: "true"
category:
    Type: TypeString
    Description: |-
        The category of the commitment. Category MACHINE specifies commitments composed of
        machine resources such as VCPU or MEMORY, listed in resources. Category LICENSE
        specifies commitments composed of software licenses, listed in licenseResources.
        Note that only MACHINE commitments should have a Type specified. Possible values: ["LICENSE", "MACHINE"]
    Computed: "true"
    Optional: "true"
commitment_id:
    Type: TypeInt
    Description: Unique identifier for the resource.
    Computed: "true"
creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
end_timestamp:
    Type: TypeString
    Description: Commitment end time in RFC3339 text format.
    Computed: "true"
license_resource:
    Type: TypeList
    Description: The license specification required as part of a license commitment.
    Optional: "true"
    MaxItems: "1"
    Properties:
        amount:
            Type: TypeString
            Description: The number of licenses purchased.
            Optional: "true"
        cores_per_license:
            Type: TypeString
            Description: Specifies the core range of the instance for which this license applies.
            Optional: "true"
        license:
            Type: TypeString
            Description: Any applicable license URI.
            Required: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. The name must be 1-63 characters long and match
        the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which means the
        first character must be a lowercase letter, and all following
        characters must be a dash, lowercase letter, or digit, except the last
        character, which cannot be a dash.
    Required: "true"
plan:
    Type: TypeString
    Description: |-
        The plan for this commitment, which determines duration and discount rate.
        The currently supported plans are TWELVE_MONTH (1 year), and THIRTY_SIX_MONTH (3 years). Possible values: ["TWELVE_MONTH", "THIRTY_SIX_MONTH"]
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: URL of the region where this commitment may be used.
    Computed: "true"
    Optional: "true"
resources:
    Type: TypeList
    Description: |-
        A list of commitment amounts for particular resources.
        Note that VCPU and MEMORY resource commitments must occur together.
    Optional: "true"
    Properties:
        accelerator_type:
            Type: TypeString
            Description: Name of the accelerator type resource. Applicable only when the type is ACCELERATOR.
            Optional: "true"
        amount:
            Type: TypeString
            Description: |-
                The amount of the resource purchased (in a type-dependent unit,
                such as bytes). For vCPUs, this can just be an integer. For memory,
                this must be provided in MB. Memory must be a multiple of 256 MB,
                with up to 6.5GB of memory per every vCPU.
            Optional: "true"
        type:
            Type: TypeString
            Description: |-
                Type of resource for which this commitment applies.
                Possible values are VCPU, MEMORY, LOCAL_SSD, and ACCELERATOR.
            Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
start_timestamp:
    Type: TypeString
    Description: Commitment start time in RFC3339 text format.
    Computed: "true"
status:
    Type: TypeString
    Description: |-
        Status of the commitment with regards to eventual expiration
        (each commitment has an end date defined).
    Computed: "true"
status_message:
    Type: TypeString
    Description: A human-readable explanation of the status.
    Computed: "true"
type:
    Type: TypeString
    Description: |-
        The type of commitment, which affects the discount rate and the eligible resources.
        The type could be one of the following value: 'MEMORY_OPTIMIZED', 'ACCELERATOR_OPTIMIZED',
        'GENERAL_PURPOSE_N1', 'GENERAL_PURPOSE_N2', 'GENERAL_PURPOSE_N2D', 'GENERAL_PURPOSE_E2',
        'GENERAL_PURPOSE_T2D', 'GENERAL_PURPOSE_C3', 'COMPUTE_OPTIMIZED_C2', 'COMPUTE_OPTIMIZED_C2D' and
        'GRAPHICS_OPTIMIZED_G2'
    Computed: "true"
    Optional: "true"

