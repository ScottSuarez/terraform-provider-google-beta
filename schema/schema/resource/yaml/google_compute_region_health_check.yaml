            Optional: "true"
            AtLeastOneOf: http2_health_check.0.host, http2_health_check.0.request_path, http2_health_check.0.response, http2_health_check.0.port, http2_health_check.0.port_name, http2_health_check.0.proxy_header, http2_health_check.0.port_specification
