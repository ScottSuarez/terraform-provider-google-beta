deletion_policy:
    Type: TypeString
    Description: |-
        The deletion policy for the shared VPC service. Setting ABANDON allows the resource
        				to be abandoned rather than deleted. Possible values are: "ABANDON".
    Optional: "true"
host_project:
    Type: TypeString
    Description: The ID of a host project to associate.
    Required: "true"
service_project:
    Type: TypeString
    Description: The ID of the project that will serve as a Shared VPC service project.
    Required: "true"

