allow_subnet_cidr_routes_overlap:
    Type: TypeBool
    Description: |-
        Typically packets destined to IPs within the subnetwork range that do not match
        existing resources are dropped and prevented from leaving the VPC.
        Setting this field to true will allow these packets to match dynamic routes injected
        via BGP even if their destinations match existing subnet ranges.
    Computed: "true"
    Optional: "true"
creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: |-
        An optional description of this resource. Provide this property when
        you create the resource. This field can be set only at resource
        creation time.
    Optional: "true"
external_ipv6_prefix:
    Type: TypeString
    Description: The range of external IPv6 addresses that are owned by this subnetwork.
    Computed: "true"
    Optional: "true"
fingerprint:
    Type: TypeString
    Description: Fingerprint of this resource. This field is used internally during updates of this resource.
    Computed: "true"
gateway_address:
    Type: TypeString
    Description: |-
        The gateway address for default routes to reach destination addresses
        outside this subnetwork.
    Computed: "true"
internal_ipv6_prefix:
    Type: TypeString
    Description: The internal IPv6 address range that is assigned to this subnetwork.
    Computed: "true"
ip_cidr_range:
    Type: TypeString
    Description: |-
        The range of internal addresses that are owned by this subnetwork.
        Provide this property when you create the subnetwork. For example,
        10.0.0.0/8 or 192.168.0.0/16. Ranges must be unique and
        non-overlapping within a network. Only IPv4 is supported.
    Required: "true"
ipv6_access_type:
    Type: TypeString
    Description: |-
        The access type of IPv6 address this subnet holds. It's immutable and can only be specified during creation
        or the first time the subnet is updated into IPV4_IPV6 dual stack. If the ipv6_type is EXTERNAL then this subnet
        cannot enable direct path. Possible values: ["EXTERNAL", "INTERNAL"]
    Optional: "true"
ipv6_cidr_range:
    Type: TypeString
    Description: The range of internal IPv6 addresses that are owned by this subnetwork.
    Computed: "true"
log_config:
    Type: TypeList
    Description: |-
        This field denotes the VPC flow logging options for this subnetwork. If
        logging is enabled, logs are exported to Cloud Logging. Flow logging
        isn't supported if the subnet 'purpose' field is set to subnetwork is
        'REGIONAL_MANAGED_PROXY' or 'GLOBAL_MANAGED_PROXY'.
    Optional: "true"
    MaxItems: "1"
    Properties:
        aggregation_interval:
            Type: TypeString
            Description: |-
                Can only be specified if VPC flow logging for this subnetwork is enabled.
                Toggles the aggregation interval for collecting flow logs. Increasing the
                interval time will reduce the amount of generated flow logs for long
                lasting connections. Default is an interval of 5 seconds per connection. Default value: "INTERVAL_5_SEC" Possible values: ["INTERVAL_5_SEC", "INTERVAL_30_SEC", "INTERVAL_1_MIN", "INTERVAL_5_MIN", "INTERVAL_10_MIN", "INTERVAL_15_MIN"]
            Optional: "true"
            AtLeastOneOf: log_config.0.aggregation_interval, log_config.0.flow_sampling, log_config.0.metadata, log_config.0.filter_expr
        filter_expr:
            Type: TypeString
            Description: |-
                Export filter used to define which VPC flow logs should be logged, as as CEL expression. See
                https://cloud.google.com/vpc/docs/flow-logs#filtering for details on how to format this field.
                The default value is 'true', which evaluates to include everything.
            Optional: "true"
            AtLeastOneOf: log_config.0.aggregation_interval, log_config.0.flow_sampling, log_config.0.metadata, log_config.0.filter_expr
        flow_sampling:
            Type: TypeFloat
            Description: |-
                Can only be specified if VPC flow logging for this subnetwork is enabled.
                The value of the field must be in [0, 1]. Set the sampling rate of VPC
                flow logs within the subnetwork where 1.0 means all collected logs are
                reported and 0.0 means no logs are reported. Default is 0.5 which means
                half of all collected logs are reported.
            Optional: "true"
            AtLeastOneOf: log_config.0.aggregation_interval, log_config.0.flow_sampling, log_config.0.metadata, log_config.0.filter_expr
        metadata:
            Type: TypeString
            Description: |-
                Can only be specified if VPC flow logging for this subnetwork is enabled.
                Configures whether metadata fields should be added to the reported VPC
                flow logs. Default value: "INCLUDE_ALL_METADATA" Possible values: ["EXCLUDE_ALL_METADATA", "INCLUDE_ALL_METADATA", "CUSTOM_METADATA"]
            Optional: "true"
            AtLeastOneOf: log_config.0.aggregation_interval, log_config.0.flow_sampling, log_config.0.metadata, log_config.0.filter_expr
        metadata_fields:
            Type: TypeSet
            Description: |-
                List of metadata fields that should be added to reported logs.
                Can only be specified if VPC flow logs for this subnetwork is enabled and "metadata" is set to CUSTOM_METADATA.
            Optional: "true"
name:
    Type: TypeString
    Description: |-
        The name of the resource, provided by the client when initially
        creating the resource. The name must be 1-63 characters long, and
        comply with RFC1035. Specifically, the name must be 1-63 characters
        long and match the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which
        means the first character must be a lowercase letter, and all
        following characters must be a dash, lowercase letter, or digit,
        except the last character, which cannot be a dash.
    Required: "true"
network:
    Type: TypeString
    Description: |-
        The network this subnet belongs to.
        Only networks that are in the distributed mode can have subnetworks.
    Required: "true"
private_ip_google_access:
    Type: TypeBool
    Description: |-
        When enabled, VMs in this subnetwork without external IP addresses can
        access Google APIs and services by using Private Google Access.
    Computed: "true"
    Optional: "true"
private_ipv6_google_access:
    Type: TypeString
    Description: The private IPv6 google access type for the VMs in this subnet.
    Computed: "true"
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
purpose:
    Type: TypeString
    Description: |-
        The purpose of the resource. This field can be either 'PRIVATE_RFC_1918', 'REGIONAL_MANAGED_PROXY', 'GLOBAL_MANAGED_PROXY', 'PRIVATE_SERVICE_CONNECT' or 'PRIVATE_NAT'([Beta](https://terraform.io/docs/providers/google/guides/provider_versions.html)).
        A subnet with purpose set to 'REGIONAL_MANAGED_PROXY' is a user-created subnetwork that is reserved for regional Envoy-based load balancers.
        A subnetwork in a given region with purpose set to 'GLOBAL_MANAGED_PROXY' is a proxy-only subnet and is shared between all the cross-regional Envoy-based load balancers.
        A subnetwork with purpose set to 'PRIVATE_SERVICE_CONNECT' reserves the subnet for hosting a Private Service Connect published service.
        A subnetwork with purpose set to 'PRIVATE_NAT' is used as source range for Private NAT gateways.
        Note that 'REGIONAL_MANAGED_PROXY' is the preferred setting for all regional Envoy load balancers.
        If unspecified, the purpose defaults to 'PRIVATE_RFC_1918'.
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: The GCP region for this subnetwork.
    Computed: "true"
    Optional: "true"
role:
    Type: TypeString
    Description: |-
        The role of subnetwork.
        Currently, this field is only used when 'purpose' is 'REGIONAL_MANAGED_PROXY'.
        The value can be set to 'ACTIVE' or 'BACKUP'.
        An 'ACTIVE' subnetwork is one that is currently being used for Envoy-based load balancers in a region.
        A 'BACKUP' subnetwork is one that is ready to be promoted to 'ACTIVE' or is currently draining. Possible values: ["ACTIVE", "BACKUP"]
    Optional: "true"
secondary_ip_range:
    Type: TypeList
    Description: |-
        An array of configurations for secondary IP ranges for VM instances
        contained in this subnetwork. The primary IP of such VM must belong
        to the primary ipCidrRange of the subnetwork. The alias IPs may belong
        to either primary or secondary ranges.

        **Note**: This field uses [attr-as-block mode](https://www.terraform.io/docs/configuration/attr-as-blocks.html) to avoid
        breaking users during the 0.12 upgrade. To explicitly send a list
        of zero objects you must use the following syntax:
        'example=[]'
        For more details about this behavior, see [this section](https://www.terraform.io/docs/configuration/attr-as-blocks.html#defining-a-fixed-object-collection-value).
    Computed: "true"
    Optional: "true"
    Properties:
        ip_cidr_range:
            Type: TypeString
            Description: |-
                The range of IP addresses belonging to this subnetwork secondary
                range. Provide this property when you create the subnetwork.
                Ranges must be unique and non-overlapping with all primary and
                secondary IP ranges within a network. Only IPv4 is supported.
            Required: "true"
        range_name:
            Type: TypeString
            Description: |-
                The name associated with this subnetwork secondary range, used
                when adding an alias IP range to a VM instance. The name must
                be 1-63 characters long, and comply with RFC1035. The name
                must be unique within the subnetwork.
            Required: "true"
self_link:
    Type: TypeString
    Computed: "true"
stack_type:
    Type: TypeString
    Description: |-
        The stack type for this subnet to identify whether the IPv6 feature is enabled or not.
        If not specified IPV4_ONLY will be used. Possible values: ["IPV4_ONLY", "IPV4_IPV6"]
    Computed: "true"
    Optional: "true"

