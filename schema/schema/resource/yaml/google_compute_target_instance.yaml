creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
instance:
    Type: TypeString
    Description: |-
        The Compute instance VM handling traffic for this target instance.
        Accepts the instance self-link, relative path
        (e.g. 'projects/project/zones/zone/instances/instance') or name. If
        name is given, the zone will default to the given zone or
        the provider-default zone and the project will default to the
        provider-level project.
    Required: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. Provided by the client when the resource is
        created. The name must be 1-63 characters long, and comply with
        RFC1035. Specifically, the name must be 1-63 characters long and match
        the regular expression '[a-z]([-a-z0-9]*[a-z0-9])?' which means the
        first character must be a lowercase letter, and all following
        characters must be a dash, lowercase letter, or digit, except the last
        character, which cannot be a dash.
    Required: "true"
nat_policy:
    Type: TypeString
    Description: |-
        NAT option controlling how IPs are NAT'ed to the instance.
        Currently only NO_NAT (default value) is supported. Default value: "NO_NAT" Possible values: ["NO_NAT"]
    Optional: "true"
network:
    Type: TypeString
    Description: The URL of the network this target instance uses to forward traffic. If not specified, the traffic will be forwarded to the network that the default network interface belongs to.
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
security_policy:
    Type: TypeString
    Description: The resource URL for the security policy associated with this target instance.
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
zone:
    Type: TypeString
    Description: URL of the zone where the target instance resides.
    Computed: "true"
    Optional: "true"

