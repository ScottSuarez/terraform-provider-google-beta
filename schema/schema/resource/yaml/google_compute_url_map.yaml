creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
default_route_action:
    Type: TypeList
    Description: |-
        defaultRouteAction takes effect when none of the hostRules match. The load balancer performs advanced routing actions
        like URL rewrites, header transformations, etc. prior to forwarding the request to the selected backend.
        If defaultRouteAction specifies any weightedBackendServices, defaultService must not be set. Conversely if defaultService
        is set, defaultRouteAction cannot contain any weightedBackendServices.

        Only one of defaultRouteAction or defaultUrlRedirect must be set.
    Optional: "true"
    ConflictsWith: default_url_redirect
    MaxItems: "1"
    Properties:
        cors_policy:
            Type: TypeList
            Description: |-
                The specification for allowing client side cross-origin requests. Please see
                [W3C Recommendation for Cross Origin Resource Sharing](https://www.w3.org/TR/cors/)
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                allow_credentials:
                    Type: TypeBool
                    Description: |-
                        In response to a preflight request, setting this to true indicates that the actual request can include user credentials.
                        This translates to the Access-Control-Allow-Credentials header.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                allow_headers:
                    Type: TypeList
                    Description: Specifies the content for the Access-Control-Allow-Headers header.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                allow_methods:
                    Type: TypeList
                    Description: Specifies the content for the Access-Control-Allow-Methods header.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                allow_origin_regexes:
                    Type: TypeList
                    Description: |-
                        Specifies the regular expression patterns that match allowed origins. For regular expression grammar
                        please see en.cppreference.com/w/cpp/regex/ecmascript
                        An origin is allowed if it matches either an item in allowOrigins or an item in allowOriginRegexes.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                allow_origins:
                    Type: TypeList
                    Description: |-
                        Specifies the list of origins that will be allowed to do CORS requests.
                        An origin is allowed if it matches either an item in allowOrigins or an item in allowOriginRegexes.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                disabled:
                    Type: TypeBool
                    Description: If true, specifies the CORS policy is disabled. The default value is false, which indicates that the CORS policy is in effect.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                expose_headers:
                    Type: TypeList
                    Description: Specifies the content for the Access-Control-Expose-Headers header.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
                max_age:
                    Type: TypeInt
                    Description: |-
                        Specifies how long results of a preflight request can be cached in seconds.
                        This translates to the Access-Control-Max-Age header.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.cors_policy.0.allow_origins, default_route_action.0.cors_policy.0.allow_origin_regexes, default_route_action.0.cors_policy.0.allow_methods, default_route_action.0.cors_policy.0.allow_headers, default_route_action.0.cors_policy.0.expose_headers, default_route_action.0.cors_policy.0.max_age, default_route_action.0.cors_policy.0.allow_credentials, default_route_action.0.cors_policy.0.disabled
        fault_injection_policy:
            Type: TypeList
            Description: |-
                The specification for fault injection introduced into traffic to test the resiliency of clients to backend service failure.
                As part of fault injection, when clients send requests to a backend service, delays can be introduced by Loadbalancer on a
                percentage of requests before sending those request to the backend service. Similarly requests from clients can be aborted
                by the Loadbalancer for a percentage of requests.

                timeout and retryPolicy will be ignored by clients that are configured with a faultInjectionPolicy.
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                abort:
                    Type: TypeList
                    Description: The specification for how client requests are aborted as part of fault injection.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay, default_route_action.0.fault_injection_policy.0.abort
                    MaxItems: "1"
                    Properties:
                        http_status:
                            Type: TypeInt
                            Description: |-
                                The HTTP status code used to abort the request.
                                The value must be between 200 and 599 inclusive.
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.fault_injection_policy.0.abort.0.http_status, default_route_action.0.fault_injection_policy.0.abort.0.percentage
                        percentage:
                            Type: TypeFloat
                            Description: |-
                                The percentage of traffic (connections/operations/requests) which will be aborted as part of fault injection.
                                The value must be between 0.0 and 100.0 inclusive.
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.fault_injection_policy.0.abort.0.http_status, default_route_action.0.fault_injection_policy.0.abort.0.percentage
                delay:
                    Type: TypeList
                    Description: The specification for how client requests are delayed as part of fault injection, before being sent to a backend service.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay, default_route_action.0.fault_injection_policy.0.abort
                    MaxItems: "1"
                    Properties:
                        fixed_delay:
                            Type: TypeList
                            Description: Specifies the value of the fixed delay interval.
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay, default_route_action.0.fault_injection_policy.0.delay.0.percentage
                            MaxItems: "1"
                            Properties:
                                nanos:
                                    Type: TypeInt
                                    Description: |-
                                        Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are
                                        represented with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                                    Optional: "true"
                                    AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay.0.seconds, default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay.0.nanos
                                seconds:
                                    Type: TypeString
                                    Description: |-
                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                                        Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                                    Optional: "true"
                                    AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay.0.seconds, default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay.0.nanos
                        percentage:
                            Type: TypeFloat
                            Description: |-
                                The percentage of traffic (connections/operations/requests) on which delay will be introduced as part of fault injection.
                                The value must be between 0.0 and 100.0 inclusive.
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.fault_injection_policy.0.delay.0.fixed_delay, default_route_action.0.fault_injection_policy.0.delay.0.percentage
        request_mirror_policy:
            Type: TypeList
            Description: |-
                Specifies the policy on how requests intended for the route's backends are shadowed to a separate mirrored backend service.
                Loadbalancer does not wait for responses from the shadow service. Prior to sending traffic to the shadow service,
                the host / authority header is suffixed with -shadow.
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                backend_service:
                    Type: TypeString
                    Description: The full or partial URL to the BackendService resource being mirrored to.
                    Required: "true"
        retry_policy:
            Type: TypeList
            Description: Specifies the retry policy associated with this route.
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                num_retries:
                    Type: TypeInt
                    Description: Specifies the allowed number retries. This number must be > 0. If not specified, defaults to 1.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.retry_policy.0.retry_conditions, default_route_action.0.retry_policy.0.num_retries, default_route_action.0.retry_policy.0.per_try_timeout
                per_try_timeout:
                    Type: TypeList
                    Description: |-
                        Specifies a non-zero timeout per retry attempt.

                        If not specified, will use the timeout set in HttpRouteAction. If timeout in HttpRouteAction is not set,
                        will use the largest timeout among all backend services associated with the route.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.retry_policy.0.retry_conditions, default_route_action.0.retry_policy.0.num_retries, default_route_action.0.retry_policy.0.per_try_timeout
                    MaxItems: "1"
                    Properties:
                        nanos:
                            Type: TypeInt
                            Description: |-
                                Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are
                                represented with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.retry_policy.0.per_try_timeout.0.seconds, default_route_action.0.retry_policy.0.per_try_timeout.0.nanos
                        seconds:
                            Type: TypeString
                            Description: |-
                                Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                                Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                            Optional: "true"
                            AtLeastOneOf: default_route_action.0.retry_policy.0.per_try_timeout.0.seconds, default_route_action.0.retry_policy.0.per_try_timeout.0.nanos
                retry_conditions:
                    Type: TypeList
                    Description: |-
                        Specfies one or more conditions when this retry rule applies. Valid values are:

                        * 5xx: Loadbalancer will attempt a retry if the backend service responds with any 5xx response code,
                          or if the backend service does not respond at all, example: disconnects, reset, read timeout,
                        * connection failure, and refused streams.
                        * gateway-error: Similar to 5xx, but only applies to response codes 502, 503 or 504.
                        * connect-failure: Loadbalancer will retry on failures connecting to backend services,
                          for example due to connection timeouts.
                        * retriable-4xx: Loadbalancer will retry for retriable 4xx response codes.
                          Currently the only retriable error supported is 409.
                        * refused-stream:Loadbalancer will retry if the backend service resets the stream with a REFUSED_STREAM error code.
                          This reset type indicates that it is safe to retry.
                        * cancelled: Loadbalancer will retry if the gRPC status code in the response header is set to cancelled
                        * deadline-exceeded: Loadbalancer will retry if the gRPC status code in the response header is set to deadline-exceeded
                        * resource-exhausted: Loadbalancer will retry if the gRPC status code in the response header is set to resource-exhausted
                        * unavailable: Loadbalancer will retry if the gRPC status code in the response header is set to unavailable
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.retry_policy.0.retry_conditions, default_route_action.0.retry_policy.0.num_retries, default_route_action.0.retry_policy.0.per_try_timeout
        timeout:
            Type: TypeList
            Description: |-
                Specifies the timeout for the selected route. Timeout is computed from the time the request has been
                fully processed (i.e. end-of-stream) up until the response has been completely processed. Timeout includes all retries.

                If not specified, will use the largest timeout among all backend services associated with the route.
            Computed: "true"
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                nanos:
                    Type: TypeInt
                    Description: |-
                        Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are represented
                        with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.timeout.0.seconds, default_route_action.0.timeout.0.nanos
                seconds:
                    Type: TypeString
                    Description: |-
                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                        Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.timeout.0.seconds, default_route_action.0.timeout.0.nanos
        url_rewrite:
            Type: TypeList
            Description: The spec to modify the URL of the request, prior to forwarding the request to the matched service.
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            MaxItems: "1"
            Properties:
                host_rewrite:
                    Type: TypeString
                    Description: |-
                        Prior to forwarding the request to the selected service, the request's host header is replaced
                        with contents of hostRewrite.

                        The value must be between 1 and 255 characters.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.url_rewrite.0.path_prefix_rewrite, default_route_action.0.url_rewrite.0.host_rewrite
                path_prefix_rewrite:
                    Type: TypeString
                    Description: |-
                        Prior to forwarding the request to the selected backend service, the matching portion of the
                        request's path is replaced by pathPrefixRewrite.

                        The value must be between 1 and 1024 characters.
                    Optional: "true"
                    AtLeastOneOf: default_route_action.0.url_rewrite.0.path_prefix_rewrite, default_route_action.0.url_rewrite.0.host_rewrite
        weighted_backend_services:
            Type: TypeList
            Description: |-
                A list of weighted backend services to send traffic to when a route match occurs.
                The weights determine the fraction of traffic that flows to their corresponding backend service.
                If all traffic needs to go to a single backend service, there must be one weightedBackendService
                with weight set to a non 0 number.

                Once a backendService is identified and before forwarding the request to the backend service,
                advanced routing actions like Url rewrites and header transformations are applied depending on
                additional settings specified in this HttpRouteAction.
            Optional: "true"
            AtLeastOneOf: default_route_action.0.weighted_backend_services, default_route_action.0.url_rewrite, default_route_action.0.timeout, default_route_action.0.retry_policy, default_route_action.0.request_mirror_policy, default_route_action.0.cors_policy, default_route_action.0.fault_injection_policy
            ExactlyOneOf: default_service, default_url_redirect, default_route_action.0.weighted_backend_services
            Properties:
                backend_service:
                    Type: TypeString
                    Description: |-
                        The full or partial URL to the default BackendService resource. Before forwarding the
                        request to backendService, the loadbalancer applies any relevant headerActions
                        specified as part of this backendServiceWeight.
                    Optional: "true"
                header_action:
                    Type: TypeList
                    Description: |-
                        Specifies changes to request and response headers that need to take effect for
                        the selected backendService.

                        headerAction specified here take effect before headerAction in the enclosing
                        HttpRouteRule, PathMatcher and UrlMap.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        request_headers_to_add:
                            Type: TypeList
                            Description: Headers to add to a matching request prior to forwarding the request to the backendService.
                            Optional: "true"
                            Properties:
                                header_name:
                                    Type: TypeString
                                    Description: The name of the header to add.
                                    Optional: "true"
                                header_value:
                                    Type: TypeString
                                    Description: The value of the header to add.
                                    Optional: "true"
                                replace:
                                    Type: TypeBool
                                    Description: |-
                                        If false, headerValue is appended to any values that already exist for the header.
                                        If true, headerValue is set for the header, discarding any values that were set for that header.
                                    Optional: "true"
                        request_headers_to_remove:
                            Type: TypeList
                            Description: |-
                                A list of header names for headers that need to be removed from the request prior to
                                forwarding the request to the backendService.
                            Optional: "true"
                        response_headers_to_add:
                            Type: TypeList
                            Description: Headers to add the response prior to sending the response back to the client.
                            Optional: "true"
                            Properties:
                                header_name:
                                    Type: TypeString
                                    Description: The name of the header to add.
                                    Optional: "true"
                                header_value:
                                    Type: TypeString
                                    Description: The value of the header to add.
                                    Optional: "true"
                                replace:
                                    Type: TypeBool
                                    Description: |-
                                        If false, headerValue is appended to any values that already exist for the header.
                                        If true, headerValue is set for the header, discarding any values that were set for that header.
                                    Optional: "true"
                        response_headers_to_remove:
                            Type: TypeList
                            Description: |-
                                A list of header names for headers that need to be removed from the response prior to sending the
                                response back to the client.
                            Optional: "true"
                weight:
                    Type: TypeInt
                    Description: |-
                        Specifies the fraction of traffic sent to backendService, computed as
                        weight / (sum of all weightedBackendService weights in routeAction) .

                        The selection of a backend service is determined only for new traffic. Once a user's request
                        has been directed to a backendService, subsequent requests will be sent to the same backendService
                        as determined by the BackendService's session affinity policy.

                        The value must be between 0 and 1000
                    Optional: "true"
default_service:
    Type: TypeString
    Description: The backend service or backend bucket to use when none of the given rules match.
    Optional: "true"
    ExactlyOneOf: default_service, default_url_redirect, default_route_action.0.weighted_backend_services
default_url_redirect:
    Type: TypeList
    Description: |-
        When none of the specified hostRules match, the request is redirected to a URL specified
        by defaultUrlRedirect. If defaultUrlRedirect is specified, defaultService or
        defaultRouteAction must not be set.
    Optional: "true"
    ExactlyOneOf: default_service, default_url_redirect, default_route_action.0.weighted_backend_services
    ConflictsWith: default_route_action
    MaxItems: "1"
    Properties:
        host_redirect:
            Type: TypeString
            Description: |-
                The host that will be used in the redirect response instead of the one that was
                supplied in the request. The value must be between 1 and 255 characters.
            Optional: "true"
        https_redirect:
            Type: TypeBool
            Description: |-
                If set to true, the URL scheme in the redirected request is set to https. If set to
                false, the URL scheme of the redirected request will remain the same as that of the
                request. This must only be set for UrlMaps used in TargetHttpProxys. Setting this
                true for TargetHttpsProxy is not permitted. The default is set to false.
            Optional: "true"
        path_redirect:
            Type: TypeString
            Description: |-
                The path that will be used in the redirect response instead of the one that was
                supplied in the request. pathRedirect cannot be supplied together with
                prefixRedirect. Supply one alone or neither. If neither is supplied, the path of the
                original request will be used for the redirect. The value must be between 1 and 1024
                characters.
            Optional: "true"
        prefix_redirect:
            Type: TypeString
            Description: |-
                The prefix that replaces the prefixMatch specified in the HttpRouteRuleMatch,
                retaining the remaining portion of the URL before redirecting the request.
                prefixRedirect cannot be supplied together with pathRedirect. Supply one alone or
                neither. If neither is supplied, the path of the original request will be used for
                the redirect. The value must be between 1 and 1024 characters.
            Optional: "true"
        redirect_response_code:
            Type: TypeString
            Description: |-
                The HTTP Status code to use for this RedirectAction. Supported values are:

                * MOVED_PERMANENTLY_DEFAULT, which is the default value and corresponds to 301.

                * FOUND, which corresponds to 302.

                * SEE_OTHER which corresponds to 303.

                * TEMPORARY_REDIRECT, which corresponds to 307. In this case, the request method
                will be retained.

                * PERMANENT_REDIRECT, which corresponds to 308. In this case,
                the request method will be retained. Possible values: ["FOUND", "MOVED_PERMANENTLY_DEFAULT", "PERMANENT_REDIRECT", "SEE_OTHER", "TEMPORARY_REDIRECT"]
            Optional: "true"
        strip_query:
            Type: TypeBool
            Description: |-
                If set to true, any accompanying query portion of the original URL is removed prior
                to redirecting the request. If set to false, the query portion of the original URL is
                retained. The default is set to false.
                 This field is required to ensure an empty block is not set. The normal default value is false.
            Required: "true"
description:
    Type: TypeString
    Description: |-
        An optional description of this resource. Provide this property when you create
        the resource.
    Optional: "true"
fingerprint:
    Type: TypeString
    Description: |-
        Fingerprint of this resource. A hash of the contents stored in this object. This
        field is used in optimistic locking.
    Computed: "true"
header_action:
    Type: TypeList
    Description: |-
        Specifies changes to request and response headers that need to take effect for
        the selected backendService. The headerAction specified here take effect after
        headerAction specified under pathMatcher.
    Optional: "true"
    MaxItems: "1"
    Properties:
        request_headers_to_add:
            Type: TypeList
            Description: |-
                Headers to add to a matching request prior to forwarding the request to the
                backendService.
            Optional: "true"
            AtLeastOneOf: header_action.0.request_headers_to_add, header_action.0.request_headers_to_remove, header_action.0.response_headers_to_add, header_action.0.response_headers_to_remove
            Properties:
                header_name:
                    Type: TypeString
                    Description: The name of the header.
                    Required: "true"
                header_value:
                    Type: TypeString
                    Description: The value of the header to add.
                    Required: "true"
                replace:
                    Type: TypeBool
                    Description: |-
                        If false, headerValue is appended to any values that already exist for the
                        header. If true, headerValue is set for the header, discarding any values that
                        were set for that header.
                    Required: "true"
        request_headers_to_remove:
            Type: TypeList
            Description: |-
                A list of header names for headers that need to be removed from the request
                prior to forwarding the request to the backendService.
            Optional: "true"
            AtLeastOneOf: header_action.0.request_headers_to_add, header_action.0.request_headers_to_remove, header_action.0.response_headers_to_add, header_action.0.response_headers_to_remove
        response_headers_to_add:
            Type: TypeList
            Description: Headers to add the response prior to sending the response back to the client.
            Optional: "true"
            AtLeastOneOf: header_action.0.request_headers_to_add, header_action.0.request_headers_to_remove, header_action.0.response_headers_to_add, header_action.0.response_headers_to_remove
            Properties:
                header_name:
                    Type: TypeString
                    Description: The name of the header.
                    Required: "true"
                header_value:
                    Type: TypeString
                    Description: The value of the header to add.
                    Required: "true"
                replace:
                    Type: TypeBool
                    Description: |-
                        If false, headerValue is appended to any values that already exist for the
                        header. If true, headerValue is set for the header, discarding any values that
                        were set for that header.
                    Required: "true"
        response_headers_to_remove:
            Type: TypeList
            Description: |-
                A list of header names for headers that need to be removed from the response
                prior to sending the response back to the client.
            Optional: "true"
            AtLeastOneOf: header_action.0.request_headers_to_add, header_action.0.request_headers_to_remove, header_action.0.response_headers_to_add, header_action.0.response_headers_to_remove
host_rule:
    Type: TypeSet
    Description: The list of HostRules to use against the URL.
    Optional: "true"
    Properties:
        description:
            Type: TypeString
            Description: |-
                An optional description of this resource. Provide this property when you create
                the resource.
            Optional: "true"
        hosts:
            Type: TypeSet
            Description: |-
                The list of host patterns to match. They must be valid hostnames, except * will
                match any string of ([a-z0-9-.]*). In that case, * must be the first character
                and must be followed in the pattern by either - or ..
            Required: "true"
        path_matcher:
            Type: TypeString
            Description: |-
                The name of the PathMatcher to use to match the path portion of the URL if the
                hostRule matches the URL's host portion.
            Required: "true"
map_id:
    Type: TypeInt
    Description: The unique identifier for the resource.
    Computed: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. Provided by the client when the resource is created. The
        name must be 1-63 characters long, and comply with RFC1035. Specifically, the
        name must be 1-63 characters long and match the regular expression
        '[a-z]([-a-z0-9]*[a-z0-9])?' which means the first character must be a lowercase
        letter, and all following characters must be a dash, lowercase letter, or digit,
        except the last character, which cannot be a dash.
    Required: "true"
path_matcher:
    Type: TypeList
    Description: The list of named PathMatchers to use against the URL.
    Optional: "true"
    Properties:
        default_route_action:
            Type: TypeList
            Description: |-
                defaultRouteAction takes effect when none of the pathRules or routeRules match. The load balancer performs
                advanced routing actions like URL rewrites, header transformations, etc. prior to forwarding the request
                to the selected backend. If defaultRouteAction specifies any weightedBackendServices, defaultService must not be set.
                Conversely if defaultService is set, defaultRouteAction cannot contain any weightedBackendServices.

                Only one of defaultRouteAction or defaultUrlRedirect must be set.
            Optional: "true"
            MaxItems: "1"
            Properties:
                cors_policy:
                    Type: TypeList
                    Description: |-
                        The specification for allowing client side cross-origin requests. Please see
                        [W3C Recommendation for Cross Origin Resource Sharing](https://www.w3.org/TR/cors/)
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allow_credentials:
                            Type: TypeBool
                            Description: |-
                                In response to a preflight request, setting this to true indicates that the actual request can include user credentials.
                                This translates to the Access-Control-Allow-Credentials header.
                            Optional: "true"
                        allow_headers:
                            Type: TypeList
                            Description: Specifies the content for the Access-Control-Allow-Headers header.
                            Optional: "true"
                        allow_methods:
                            Type: TypeList
                            Description: Specifies the content for the Access-Control-Allow-Methods header.
                            Optional: "true"
                        allow_origin_regexes:
                            Type: TypeList
                            Description: |-
                                Specifies the regular expression patterns that match allowed origins. For regular expression grammar
                                please see en.cppreference.com/w/cpp/regex/ecmascript
                                An origin is allowed if it matches either an item in allowOrigins or an item in allowOriginRegexes.
                            Optional: "true"
                        allow_origins:
                            Type: TypeList
                            Description: |-
                                Specifies the list of origins that will be allowed to do CORS requests.
                                An origin is allowed if it matches either an item in allowOrigins or an item in allowOriginRegexes.
                            Optional: "true"
                        disabled:
                            Type: TypeBool
                            Description: If true, specifies the CORS policy is disabled. The default value is false, which indicates that the CORS policy is in effect.
                            Optional: "true"
                        expose_headers:
                            Type: TypeList
                            Description: Specifies the content for the Access-Control-Expose-Headers header.
                            Optional: "true"
                        max_age:
                            Type: TypeInt
                            Description: |-
                                Specifies how long results of a preflight request can be cached in seconds.
                                This translates to the Access-Control-Max-Age header.
                            Optional: "true"
                fault_injection_policy:
                    Type: TypeList
                    Description: |-
                        The specification for fault injection introduced into traffic to test the resiliency of clients to backend service failure.
                        As part of fault injection, when clients send requests to a backend service, delays can be introduced by Loadbalancer on a
                        percentage of requests before sending those request to the backend service. Similarly requests from clients can be aborted
                        by the Loadbalancer for a percentage of requests.

                        timeout and retryPolicy will be ignored by clients that are configured with a faultInjectionPolicy.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        abort:
                            Type: TypeList
                            Description: The specification for how client requests are aborted as part of fault injection.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                http_status:
                                    Type: TypeInt
                                    Description: |-
                                        The HTTP status code used to abort the request.
                                        The value must be between 200 and 599 inclusive.
                                    Optional: "true"
                                percentage:
                                    Type: TypeFloat
                                    Description: |-
                                        The percentage of traffic (connections/operations/requests) which will be aborted as part of fault injection.
                                        The value must be between 0.0 and 100.0 inclusive.
                                    Optional: "true"
                        delay:
                            Type: TypeList
                            Description: The specification for how client requests are delayed as part of fault injection, before being sent to a backend service.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                fixed_delay:
                                    Type: TypeList
                                    Description: Specifies the value of the fixed delay interval.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        nanos:
                                            Type: TypeInt
                                            Description: |-
                                                Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are
                                                represented with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                                            Optional: "true"
                                        seconds:
                                            Type: TypeString
                                            Description: |-
                                                Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                                                Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                                            Optional: "true"
                                percentage:
                                    Type: TypeFloat
                                    Description: |-
                                        The percentage of traffic (connections/operations/requests) on which delay will be introduced as part of fault injection.
                                        The value must be between 0.0 and 100.0 inclusive.
                                    Optional: "true"
                request_mirror_policy:
                    Type: TypeList
                    Description: |-
                        Specifies the policy on how requests intended for the route's backends are shadowed to a separate mirrored backend service.
                        Loadbalancer does not wait for responses from the shadow service. Prior to sending traffic to the shadow service,
                        the host / authority header is suffixed with -shadow.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        backend_service:
                            Type: TypeString
                            Description: The full or partial URL to the BackendService resource being mirrored to.
                            Required: "true"
                retry_policy:
                    Type: TypeList
                    Description: Specifies the retry policy associated with this route.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        num_retries:
                            Type: TypeInt
                            Description: Specifies the allowed number retries. This number must be > 0. If not specified, defaults to 1.
                            Optional: "true"
                        per_try_timeout:
                            Type: TypeList
                            Description: |-
                                Specifies a non-zero timeout per retry attempt.

                                If not specified, will use the timeout set in HttpRouteAction. If timeout in HttpRouteAction is not set,
                                will use the largest timeout among all backend services associated with the route.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                nanos:
                                    Type: TypeInt
                                    Description: |-
                                        Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are
                                        represented with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                                    Optional: "true"
                                seconds:
                                    Type: TypeString
                                    Description: |-
                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                                        Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                                    Optional: "true"
                        retry_conditions:
                            Type: TypeList
                            Description: |-
                                Specfies one or more conditions when this retry rule applies. Valid values are:

                                * 5xx: Loadbalancer will attempt a retry if the backend service responds with any 5xx response code,
                                  or if the backend service does not respond at all, example: disconnects, reset, read timeout,
                                * connection failure, and refused streams.
                                * gateway-error: Similar to 5xx, but only applies to response codes 502, 503 or 504.
                                * connect-failure: Loadbalancer will retry on failures connecting to backend services,
                                  for example due to connection timeouts.
                                * retriable-4xx: Loadbalancer will retry for retriable 4xx response codes.
                                  Currently the only retriable error supported is 409.
                                * refused-stream:Loadbalancer will retry if the backend service resets the stream with a REFUSED_STREAM error code.
                                  This reset type indicates that it is safe to retry.
                                * cancelled: Loadbalancer will retry if the gRPC status code in the response header is set to cancelled
                                * deadline-exceeded: Loadbalancer will retry if the gRPC status code in the response header is set to deadline-exceeded
                                * resource-exhausted: Loadbalancer will retry if the gRPC status code in the response header is set to resource-exhausted
                                * unavailable: Loadbalancer will retry if the gRPC status code in the response header is set to unavailable
                            Optional: "true"
                timeout:
                    Type: TypeList
                    Description: |-
                        Specifies the timeout for the selected route. Timeout is computed from the time the request has been
                        fully processed (i.e. end-of-stream) up until the response has been completely processed. Timeout includes all retries.

                        If not specified, will use the largest timeout among all backend services associated with the route.
                    Computed: "true"
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        nanos:
                            Type: TypeInt
                            Description: |-
                                Span of time that's a fraction of a second at nanosecond resolution. Durations less than one second are represented
                                with a 0 seconds field and a positive nanos field. Must be from 0 to 999,999,999 inclusive.
                            Optional: "true"
                        seconds:
                            Type: TypeString
                            Description: |-
                                Span of time at a resolution of a second. Must be from 0 to 315,576,000,000 inclusive.
                                Note: these bounds are computed from: 60 sec/min * 60 min/hr * 24 hr/day * 365.25 days/year * 10000 years
                            Optional: "true"
                url_rewrite:
                    Type: TypeList
                    Description: The spec to modify the URL of the request, prior to forwarding the request to the matched service.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        host_rewrite:
                            Type: TypeString
                            Description: |-
                                Prior to forwarding the request to the selected service, the request's host header is replaced
                                with contents of hostRewrite.

                                The value must be between 1 and 255 characters.
                            Optional: "true"
                        path_prefix_rewrite:
                            Type: TypeString
                            Description: |-
                                Prior to forwarding the request to the selected backend service, the matching portion of the
                                request's path is replaced by pathPrefixRewrite.

                                The value must be between 1 and 1024 characters.
                            Optional: "true"
                weighted_backend_services:
                    Type: TypeList
                    Description: |-
                        A list of weighted backend services to send traffic to when a route match occurs.
                        The weights determine the fraction of traffic that flows to their corresponding backend service.
                        If all traffic needs to go to a single backend service, there must be one weightedBackendService
                        with weight set to a non 0 number.

                        Once a backendService is identified and before forwarding the request to the backend service,
                        advanced routing actions like Url rewrites and header transformations are applied depending on
                        additional settings specified in this HttpRouteAction.
                    Optional: "true"
                    Properties:
                        backend_service:
                            Type: TypeString
                            Description: |-
                                The full or partial URL to the default BackendService resource. Before forwarding the
                                request to backendService, the loadbalancer applies any relevant headerActions
                                specified as part of this backendServiceWeight.
                            Optional: "true"
                        header_action:
                            Type: TypeList
                            Description: |-
                                Specifies changes to request and response headers that need to take effect for
                                the selected backendService.

                                headerAction specified here take effect before headerAction in the enclosing
                                HttpRouteRule, PathMatcher and UrlMap.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                request_headers_to_add:
                                    Type: TypeList
                                    Description: Headers to add to a matching request prior to forwarding the request to the backendService.
                                    Optional: "true"
                                    Properties:
                                        header_name:
                                            Type: TypeString
                                            Description: The name of the header to add.
                                            Optional: "true"
                                        header_value:
                                            Type: TypeString
                                            Description: The value of the header to add.
                                            Optional: "true"
                                        replace:
                                            Type: TypeBool
                                            Description: |-
                                                If false, headerValue is appended to any values that already exist for the header.
                                                If true, headerValue is set for the header, discarding any values that were set for that header.
                                            Optional: "true"
                                request_headers_to_remove:
                                    Type: TypeList
                                    Description: |-
                                        A list of header names for headers that need to be removed from the request prior to
                                        forwarding the request to the backendService.
                                    Optional: "true"
                                response_headers_to_add:
                                    Type: TypeList
                                    Description: Headers to add the response prior to sending the response back to the client.
                                    Optional: "true"
                                    Properties:
                                        header_name:
                                            Type: TypeString
                                            Description: The name of the header to add.
                                            Optional: "true"
                                        header_value:
                                            Type: TypeString
                                            Description: The value of the header to add.
                                            Optional: "true"
                                        replace:
                                            Type: TypeBool
                                            Description: |-
                                                If false, headerValue is appended to any values that already exist for the header.
                                                If true, headerValue is set for the header, discarding any values that were set for that header.
                                            Optional: "true"
                                response_headers_to_remove:
                                    Type: TypeList
                                    Description: |-
                                        A list of header names for headers that need to be removed from the response prior to sending the
                                        response back to the client.
                                    Optional: "true"
                        weight:
                            Type: TypeInt
                            Description: |-
                                Specifies the fraction of traffic sent to backendService, computed as
                                weight / (sum of all weightedBackendService weights in routeAction) .

                                The selection of a backend service is determined only for new traffic. Once a user's request
                                has been directed to a backendService, subsequent requests will be sent to the same backendService
                                as determined by the BackendService's session affinity policy.

                                The value must be between 0 and 1000
                            Optional: "true"
        default_service:
            Type: TypeString
            Description: The backend service or backend bucket to use when none of the given paths match.
            Optional: "true"
        default_url_redirect:
            Type: TypeList
            Description: |-
                When none of the specified hostRules match, the request is redirected to a URL specified
                by defaultUrlRedirect. If defaultUrlRedirect is specified, defaultService or
                defaultRouteAction must not be set.
            Optional: "true"
            MaxItems: "1"
            Properties:
                host_redirect:
                    Type: TypeString
                    Description: |-
                        The host that will be used in the redirect response instead of the one that was
                        supplied in the request. The value must be between 1 and 255 characters.
                    Optional: "true"
                https_redirect:
                    Type: TypeBool
                    Description: |-
                        If set to true, the URL scheme in the redirected request is set to https. If set to
                        false, the URL scheme of the redirected request will remain the same as that of the
                        request. This must only be set for UrlMaps used in TargetHttpProxys. Setting this
                        true for TargetHttpsProxy is not permitted. The default is set to false.
                    Optional: "true"
                path_redirect:
                    Type: TypeString
                    Description: |-
                        The path that will be used in the redirect response instead of the one that was
                        supplied in the request. pathRedirect cannot be supplied together with
                        prefixRedirect. Supply one alone or neither. If neither is supplied, the path of the
                        original request will be used for the redirect. The value must be between 1 and 1024
                        characters.
                    Optional: "true"
                prefix_redirect:
                    Type: TypeString
                    Description: |-
                        The prefix that replaces the prefixMatch specified in the HttpRouteRuleMatch,
                        retaining the remaining portion of the URL before redirecting the request.
                        prefixRedirect cannot be supplied together with pathRedirect. Supply one alone or
                        neither. If neither is supplied, the path of the original request will be used for
                        the redirect. The value must be between 1 and 1024 characters.
                    Optional: "true"
                redirect_response_code:
                    Type: TypeString
                    Description: |-
                        The HTTP Status code to use for this RedirectAction. Supported values are:

                        * MOVED_PERMANENTLY_DEFAULT, which is the default value and corresponds to 301.

                        * FOUND, which corresponds to 302.

                        * SEE_OTHER which corresponds to 303.

                        * TEMPORARY_REDIRECT, which corresponds to 307. In this case, the request method
                        will be retained.

                        * PERMANENT_REDIRECT, which corresponds to 308. In this case,
                        the request method will be retained. Possible values: ["FOUND", "MOVED_PERMANENTLY_DEFAULT", "PERMANENT_REDIRECT", "SEE_OTHER", "TEMPORARY_REDIRECT"]
                    Optional: "true"
                strip_query:
                    Type: TypeBool
                    Description: |-
                        If set to true, any accompanying query portion of the original URL is removed prior
                        to redirecting the request. If set to false, the query portion of the original URL is
                        retained.
                         This field is required to ensure an empty block is not set. The normal default value is false.
                    Required: "true"
        description:
            Type: TypeString
            Description: |-
                An optional description of this resource. Provide this property when you create
                the resource.
            Optional: "true"
        header_action:
            Type: TypeList
            Description: |-
                Specifies changes to request and response headers that need to take effect for
                the selected backendService. HeaderAction specified here are applied after the
                matching HttpRouteRule HeaderAction and before the HeaderAction in the UrlMap
            Optional: "true"
            MaxItems: "1"
            Properties:
                request_headers_to_add:
                    Type: TypeList
                    Description: |-
                        Headers to add to a matching request prior to forwarding the request to the
                        backendService.
                    Optional: "true"
                    Properties:
                        header_name:
                            Type: TypeString
                            Description: The name of the header.
                            Required: "true"
                        header_value:
                            Type: TypeString
                            Description: The value of the header to add.
                            Required: "true"
                        replace:
                            Type: TypeBool
                            Description: |-
                                If false, headerValue is appended to any values that already exist for the
                                header. If true, headerValue is set for the header, discarding any values that
                                were set for that header.
                            Required: "true"
                request_headers_to_remove:
                    Type: TypeList
                    Description: |-
                        A list of header names for headers that need to be removed from the request
                        prior to forwarding the request to the backendService.
                    Optional: "true"
                response_headers_to_add:
                    Type: TypeList
                    Description: Headers to add the response prior to sending the response back to the client.
                    Optional: "true"
                    Properties:
                        header_name:
                            Type: TypeString
                            Description: The name of the header.
                            Required: "true"
                        header_value:
                            Type: TypeString
                            Description: The value of the header to add.
                            Required: "true"
                        replace:
                            Type: TypeBool
                            Description: |-
                                If false, headerValue is appended to any values that already exist for the
                                header. If true, headerValue is set for the header, discarding any values that
                                were set for that header.
                            Required: "true"
                response_headers_to_remove:
                    Type: TypeList
                    Description: |-
                        A list of header names for headers that need to be removed from the response
                        prior to sending the response back to the client.
                    Optional: "true"
        name:
            Type: TypeString
            Description: The name to which this PathMatcher is referred by the HostRule.
            Required: "true"
        path_rule:
            Type: TypeList
            Description: |-
                The list of path rules. Use this list instead of routeRules when routing based
                on simple path matching is all that's required. The order by which path rules
                are specified does not matter. Matches are always done on the longest-path-first
                basis. For example: a pathRule with a path /a/b/c/* will match before /a/b/*
                irrespective of the order in which those paths appear in this list. Within a
                given pathMatcher, only one of pathRules or routeRules must be set.
            Optional: "true"
            Properties:
                paths:
                    Type: TypeSet
                    Description: |-
                        The list of path patterns to match. Each must start with / and the only place a
                        \* is allowed is at the end following a /. The string fed to the path matcher
                        does not include any text after the first ? or #, and those chars are not
                        allowed here.
                    Required: "true"
                route_action:
                    Type: TypeList
                    Description: |-
                        In response to a matching path, the load balancer performs advanced routing
                        actions like URL rewrites, header transformations, etc. prior to forwarding the
                        request to the selected backend. If routeAction specifies any
                        weightedBackendServices, service must not be set. Conversely if service is set,
                        routeAction cannot contain any  weightedBackendServices. Only one of routeAction
                        or urlRedirect must be set.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        cors_policy:
                            Type: TypeList
                            Description: |-
                                The specification for allowing client side cross-origin requests. Please see W3C
                                Recommendation for Cross Origin Resource Sharing
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                allow_credentials:
                                    Type: TypeBool
                                    Description: |-
                                        In response to a preflight request, setting this to true indicates that the
                                        actual request can include user credentials. This translates to the Access-
                                        Control-Allow-Credentials header. Defaults to false.
                                    Optional: "true"
                                allow_headers:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Allow-Headers header.
                                    Optional: "true"
                                allow_methods:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Allow-Methods header.
                                    Optional: "true"
                                allow_origin_regexes:
                                    Type: TypeList
                                    Description: |-
                                        Specifies the regular expression patterns that match allowed origins. For
                                        regular expression grammar please see en.cppreference.com/w/cpp/regex/ecmascript
                                        An origin is allowed if it matches either allow_origins or allow_origin_regex.
                                    Optional: "true"
                                allow_origins:
                                    Type: TypeList
                                    Description: |-
                                        Specifies the list of origins that will be allowed to do CORS requests. An
                                        origin is allowed if it matches either allow_origins or allow_origin_regex.
                                    Optional: "true"
                                disabled:
                                    Type: TypeBool
                                    Description: If true, specifies the CORS policy is disabled.
                                    Required: "true"
                                expose_headers:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Expose-Headers header.
                                    Optional: "true"
                                max_age:
                                    Type: TypeInt
                                    Description: |-
                                        Specifies how long the results of a preflight request can be cached. This
                                        translates to the content for the Access-Control-Max-Age header.
                                    Optional: "true"
                        fault_injection_policy:
                            Type: TypeList
                            Description: |-
                                The specification for fault injection introduced into traffic to test the
                                resiliency of clients to backend service failure. As part of fault injection,
                                when clients send requests to a backend service, delays can be introduced by
                                Loadbalancer on a percentage of requests before sending those request to the
                                backend service. Similarly requests from clients can be aborted by the
                                Loadbalancer for a percentage of requests. timeout and retry_policy will be
                                ignored by clients that are configured with a fault_injection_policy.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                abort:
                                    Type: TypeList
                                    Description: |-
                                        The specification for how client requests are aborted as part of fault
                                        injection.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        http_status:
                                            Type: TypeInt
                                            Description: |-
                                                The HTTP status code used to abort the request. The value must be between 200
                                                and 599 inclusive.
                                            Required: "true"
                                        percentage:
                                            Type: TypeFloat
                                            Description: |-
                                                The percentage of traffic (connections/operations/requests) which will be
                                                aborted as part of fault injection. The value must be between 0.0 and 100.0
                                                inclusive.
                                            Required: "true"
                                delay:
                                    Type: TypeList
                                    Description: |-
                                        The specification for how client requests are delayed as part of fault
                                        injection, before being sent to a backend service.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        fixed_delay:
                                            Type: TypeList
                                            Description: Specifies the value of the fixed delay interval.
                                            Required: "true"
                                            MaxItems: "1"
                                            Properties:
                                                nanos:
                                                    Type: TypeInt
                                                    Description: |-
                                                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                                                        less than one second are represented with a 0 'seconds' field and a positive
                                                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                                    Optional: "true"
                                                seconds:
                                                    Type: TypeString
                                                    Description: |-
                                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                                        inclusive.
                                                    Required: "true"
                                        percentage:
                                            Type: TypeFloat
                                            Description: |-
                                                The percentage of traffic (connections/operations/requests) on which delay will
                                                be introduced as part of fault injection. The value must be between 0.0 and
                                                100.0 inclusive.
                                            Required: "true"
                        request_mirror_policy:
                            Type: TypeList
                            Description: |-
                                Specifies the policy on how requests intended for the route's backends are
                                shadowed to a separate mirrored backend service. Loadbalancer does not wait for
                                responses from the shadow service. Prior to sending traffic to the shadow
                                service, the host / authority header is suffixed with -shadow.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                backend_service:
                                    Type: TypeString
                                    Description: The BackendService resource being mirrored to.
                                    Required: "true"
                        retry_policy:
                            Type: TypeList
                            Description: Specifies the retry policy associated with this route.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                num_retries:
                                    Type: TypeInt
                                    Description: Specifies the allowed number retries. This number must be > 0.
                                    Optional: "true"
                                per_try_timeout:
                                    Type: TypeList
                                    Description: Specifies a non-zero timeout per retry attempt.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        nanos:
                                            Type: TypeInt
                                            Description: |-
                                                Span of time that's a fraction of a second at nanosecond resolution. Durations
                                                less than one second are represented with a 0 'seconds' field and a positive
                                                'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                            Optional: "true"
                                        seconds:
                                            Type: TypeString
                                            Description: |-
                                                Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                                inclusive.
                                            Required: "true"
                                retry_conditions:
                                    Type: TypeList
                                    Description: |-
                                        Specifies one or more conditions when this retry rule applies. Valid values are:

                                        * 5xx: Loadbalancer will attempt a retry if the backend service responds with
                                        any 5xx response code, or if the backend service does not respond at all,
                                        example: disconnects, reset, read timeout, connection failure, and refused
                                        streams.
                                        * gateway-error: Similar to 5xx, but only applies to response codes
                                        502, 503 or 504.
                                        * connect-failure: Loadbalancer will retry on failures
                                        connecting to backend services, for example due to connection timeouts.
                                        * retriable-4xx: Loadbalancer will retry for retriable 4xx response codes.
                                        Currently the only retriable error supported is 409.
                                        * refused-stream: Loadbalancer will retry if the backend service resets the stream with a
                                        REFUSED_STREAM error code. This reset type indicates that it is safe to retry.
                                        * cancelled: Loadbalancer will retry if the gRPC status code in the response
                                        header is set to cancelled
                                        * deadline-exceeded: Loadbalancer will retry if the
                                        gRPC status code in the response header is set to deadline-exceeded
                                        * resource-exhausted: Loadbalancer will retry if the gRPC status code in the response
                                        header is set to resource-exhausted
                                        * unavailable: Loadbalancer will retry if
                                        the gRPC status code in the response header is set to unavailable
                                    Optional: "true"
                        timeout:
                            Type: TypeList
                            Description: |-
                                Specifies the timeout for the selected route. Timeout is computed from the time
                                the request is has been fully processed (i.e. end-of-stream) up until the
                                response has been completely processed. Timeout includes all retries. If not
                                specified, the default value is 15 seconds.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                nanos:
                                    Type: TypeInt
                                    Description: |-
                                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                                        less than one second are represented with a 0 'seconds' field and a positive
                                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                    Optional: "true"
                                seconds:
                                    Type: TypeString
                                    Description: |-
                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                        inclusive.
                                    Required: "true"
                        url_rewrite:
                            Type: TypeList
                            Description: |-
                                The spec to modify the URL of the request, prior to forwarding the request to
                                the matched service
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                host_rewrite:
                                    Type: TypeString
                                    Description: |-
                                        Prior to forwarding the request to the selected service, the request's host
                                        header is replaced with contents of hostRewrite. The value must be between 1 and
                                        255 characters.
                                    Optional: "true"
                                path_prefix_rewrite:
                                    Type: TypeString
                                    Description: |-
                                        Prior to forwarding the request to the selected backend service, the matching
                                        portion of the request's path is replaced by pathPrefixRewrite. The value must
                                        be between 1 and 1024 characters.
                                    Optional: "true"
                        weighted_backend_services:
                            Type: TypeList
                            Description: |-
                                A list of weighted backend services to send traffic to when a route match
                                occurs. The weights determine the fraction of traffic that flows to their
                                corresponding backend service. If all traffic needs to go to a single backend
                                service, there must be one  weightedBackendService with weight set to a non 0
                                number. Once a backendService is identified and before forwarding the request to
                                the backend service, advanced routing actions like Url rewrites and header
                                transformations are applied depending on additional settings specified in this
                                HttpRouteAction.
                            Optional: "true"
                            Properties:
                                backend_service:
                                    Type: TypeString
                                    Description: |-
                                        The default BackendService resource. Before
                                        forwarding the request to backendService, the loadbalancer applies any relevant
                                        headerActions specified as part of this backendServiceWeight.
                                    Required: "true"
                                header_action:
                                    Type: TypeList
                                    Description: |-
                                        Specifies changes to request and response headers that need to take effect for
                                        the selected backendService. headerAction specified here take effect before
                                        headerAction in the enclosing HttpRouteRule, PathMatcher and UrlMap.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        request_headers_to_add:
                                            Type: TypeList
                                            Description: |-
                                                Headers to add to a matching request prior to forwarding the request to the
                                                backendService.
                                            Optional: "true"
                                            Properties:
                                                header_name:
                                                    Type: TypeString
                                                    Description: The name of the header.
                                                    Required: "true"
                                                header_value:
                                                    Type: TypeString
                                                    Description: The value of the header to add.
                                                    Required: "true"
                                                replace:
                                                    Type: TypeBool
                                                    Description: |-
                                                        If false, headerValue is appended to any values that already exist for the
                                                        header. If true, headerValue is set for the header, discarding any values that
                                                        were set for that header.
                                                    Required: "true"
                                        request_headers_to_remove:
                                            Type: TypeList
                                            Description: |-
                                                A list of header names for headers that need to be removed from the request
                                                prior to forwarding the request to the backendService.
                                            Optional: "true"
                                        response_headers_to_add:
                                            Type: TypeList
                                            Description: Headers to add the response prior to sending the response back to the client.
                                            Optional: "true"
                                            Properties:
                                                header_name:
                                                    Type: TypeString
                                                    Description: The name of the header.
                                                    Required: "true"
                                                header_value:
                                                    Type: TypeString
                                                    Description: The value of the header to add.
                                                    Required: "true"
                                                replace:
                                                    Type: TypeBool
                                                    Description: |-
                                                        If false, headerValue is appended to any values that already exist for the
                                                        header. If true, headerValue is set for the header, discarding any values that
                                                        were set for that header.
                                                    Required: "true"
                                        response_headers_to_remove:
                                            Type: TypeList
                                            Description: |-
                                                A list of header names for headers that need to be removed from the response
                                                prior to sending the response back to the client.
                                            Optional: "true"
                                weight:
                                    Type: TypeInt
                                    Description: |-
                                        Specifies the fraction of traffic sent to backendService, computed as weight /
                                        (sum of all weightedBackendService weights in routeAction) . The selection of a
                                        backend service is determined only for new traffic. Once a user's request has
                                        been directed to a backendService, subsequent requests will be sent to the same
                                        backendService as determined by the BackendService's session affinity policy.
                                        The value must be between 0 and 1000
                                    Required: "true"
                service:
                    Type: TypeString
                    Description: The backend service or backend bucket to use if any of the given paths match.
                    Optional: "true"
                url_redirect:
                    Type: TypeList
                    Description: |-
                        When a path pattern is matched, the request is redirected to a URL specified
                        by urlRedirect. If urlRedirect is specified, service or routeAction must not
                        be set.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        host_redirect:
                            Type: TypeString
                            Description: |-
                                The host that will be used in the redirect response instead of the one
                                that was supplied in the request. The value must be between 1 and 255
                                characters.
                            Optional: "true"
                        https_redirect:
                            Type: TypeBool
                            Description: |-
                                If set to true, the URL scheme in the redirected request is set to https.
                                If set to false, the URL scheme of the redirected request will remain the
                                same as that of the request. This must only be set for UrlMaps used in
                                TargetHttpProxys. Setting this true for TargetHttpsProxy is not
                                permitted. The default is set to false.
                            Optional: "true"
                        path_redirect:
                            Type: TypeString
                            Description: |-
                                The path that will be used in the redirect response instead of the one
                                that was supplied in the request. pathRedirect cannot be supplied
                                together with prefixRedirect. Supply one alone or neither. If neither is
                                supplied, the path of the original request will be used for the redirect.
                                The value must be between 1 and 1024 characters.
                            Optional: "true"
                        prefix_redirect:
                            Type: TypeString
                            Description: |-
                                The prefix that replaces the prefixMatch specified in the
                                HttpRouteRuleMatch, retaining the remaining portion of the URL before
                                redirecting the request. prefixRedirect cannot be supplied together with
                                pathRedirect. Supply one alone or neither. If neither is supplied, the
                                path of the original request will be used for the redirect. The value
                                must be between 1 and 1024 characters.
                            Optional: "true"
                        redirect_response_code:
                            Type: TypeString
                            Description: |-
                                The HTTP Status code to use for this RedirectAction. Supported values are:

                                * MOVED_PERMANENTLY_DEFAULT, which is the default value and corresponds to 301.

                                * FOUND, which corresponds to 302.

                                * SEE_OTHER which corresponds to 303.

                                * TEMPORARY_REDIRECT, which corresponds to 307. In this case, the request method
                                will be retained.

                                * PERMANENT_REDIRECT, which corresponds to 308. In this case,
                                the request method will be retained. Possible values: ["FOUND", "MOVED_PERMANENTLY_DEFAULT", "PERMANENT_REDIRECT", "SEE_OTHER", "TEMPORARY_REDIRECT"]
                            Optional: "true"
                        strip_query:
                            Type: TypeBool
                            Description: |-
                                If set to true, any accompanying query portion of the original URL is
                                removed prior to redirecting the request. If set to false, the query
                                portion of the original URL is retained.
                                 This field is required to ensure an empty block is not set. The normal default value is false.
                            Required: "true"
        route_rules:
            Type: TypeList
            Description: |-
                The list of ordered HTTP route rules. Use this list instead of pathRules when
                advanced route matching and routing actions are desired. The order of specifying
                routeRules matters: the first rule that matches will cause its specified routing
                action to take effect. Within a given pathMatcher, only one of pathRules or
                routeRules must be set. routeRules are not supported in UrlMaps intended for
                External load balancers.
            Optional: "true"
            Properties:
                header_action:
                    Type: TypeList
                    Description: |-
                        Specifies changes to request and response headers that need to take effect for
                        the selected backendService. The headerAction specified here are applied before
                        the matching pathMatchers[].headerAction and after pathMatchers[].routeRules[].r
                        outeAction.weightedBackendService.backendServiceWeightAction[].headerAction
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        request_headers_to_add:
                            Type: TypeList
                            Description: |-
                                Headers to add to a matching request prior to forwarding the request to the
                                backendService.
                            Optional: "true"
                            Properties:
                                header_name:
                                    Type: TypeString
                                    Description: The name of the header.
                                    Required: "true"
                                header_value:
                                    Type: TypeString
                                    Description: The value of the header to add.
                                    Required: "true"
                                replace:
                                    Type: TypeBool
                                    Description: |-
                                        If false, headerValue is appended to any values that already exist for the
                                        header. If true, headerValue is set for the header, discarding any values that
                                        were set for that header.
                                    Required: "true"
                        request_headers_to_remove:
                            Type: TypeList
                            Description: |-
                                A list of header names for headers that need to be removed from the request
                                prior to forwarding the request to the backendService.
                            Optional: "true"
                        response_headers_to_add:
                            Type: TypeList
                            Description: Headers to add the response prior to sending the response back to the client.
                            Optional: "true"
                            Properties:
                                header_name:
                                    Type: TypeString
                                    Description: The name of the header.
                                    Required: "true"
                                header_value:
                                    Type: TypeString
                                    Description: The value of the header to add.
                                    Required: "true"
                                replace:
                                    Type: TypeBool
                                    Description: |-
                                        If false, headerValue is appended to any values that already exist for the
                                        header. If true, headerValue is set for the header, discarding any values that
                                        were set for that header.
                                    Required: "true"
                        response_headers_to_remove:
                            Type: TypeList
                            Description: |-
                                A list of header names for headers that need to be removed from the response
                                prior to sending the response back to the client.
                            Optional: "true"
                match_rules:
                    Type: TypeList
                    Description: The rules for determining a match.
                    Optional: "true"
                    Properties:
                        full_path_match:
                            Type: TypeString
                            Description: |-
                                For satisfying the matchRule condition, the path of the request must exactly
                                match the value specified in fullPathMatch after removing any query parameters
                                and anchor that may be part of the original URL. FullPathMatch must be between 1
                                and 1024 characters. Only one of prefixMatch, fullPathMatch or regexMatch must
                                be specified.
                            Optional: "true"
                        header_matches:
                            Type: TypeList
                            Description: |-
                                Specifies a list of header match criteria, all of which must match corresponding
                                headers in the request.
                            Optional: "true"
                            Properties:
                                exact_match:
                                    Type: TypeString
                                    Description: |-
                                        The value should exactly match contents of exactMatch. Only one of exactMatch,
                                        prefixMatch, suffixMatch, regexMatch, presentMatch or rangeMatch must be set.
                                    Optional: "true"
                                header_name:
                                    Type: TypeString
                                    Description: |-
                                        The name of the HTTP header to match. For matching against the HTTP request's
                                        authority, use a headerMatch with the header name ":authority". For matching a
                                        request's method, use the headerName ":method".
                                    Required: "true"
                                invert_match:
                                    Type: TypeBool
                                    Description: |-
                                        If set to false, the headerMatch is considered a match if the match criteria
                                        above are met. If set to true, the headerMatch is considered a match if the
                                        match criteria above are NOT met. Defaults to false.
                                    Optional: "true"
                                prefix_match:
                                    Type: TypeString
                                    Description: |-
                                        The value of the header must start with the contents of prefixMatch. Only one of
                                        exactMatch, prefixMatch, suffixMatch, regexMatch, presentMatch or rangeMatch
                                        must be set.
                                    Optional: "true"
                                present_match:
                                    Type: TypeBool
                                    Description: |-
                                        A header with the contents of headerName must exist. The match takes place
                                        whether or not the request's header has a value or not. Only one of exactMatch,
                                        prefixMatch, suffixMatch, regexMatch, presentMatch or rangeMatch must be set.
                                    Optional: "true"
                                range_match:
                                    Type: TypeList
                                    Description: |-
                                        The header value must be an integer and its value must be in the range specified
                                        in rangeMatch. If the header does not contain an integer, number or is empty,
                                        the match fails. For example for a range [-5, 0]   - -3 will match.  - 0 will
                                        not match.  - 0.25 will not match.  - -3someString will not match.   Only one of
                                        exactMatch, prefixMatch, suffixMatch, regexMatch, presentMatch or rangeMatch
                                        must be set.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        range_end:
                                            Type: TypeInt
                                            Description: The end of the range (exclusive).
                                            Required: "true"
                                        range_start:
                                            Type: TypeInt
                                            Description: The start of the range (inclusive).
                                            Required: "true"
                                regex_match:
                                    Type: TypeString
                                    Description: |-
                                        The value of the header must match the regular expression specified in
                                        regexMatch. For regular expression grammar, please see:
                                        en.cppreference.com/w/cpp/regex/ecmascript  For matching against a port
                                        specified in the HTTP request, use a headerMatch with headerName set to PORT and
                                        a regular expression that satisfies the RFC2616 Host header's port specifier.
                                        Only one of exactMatch, prefixMatch, suffixMatch, regexMatch, presentMatch or
                                        rangeMatch must be set.
                                    Optional: "true"
                                suffix_match:
                                    Type: TypeString
                                    Description: |-
                                        The value of the header must end with the contents of suffixMatch. Only one of
                                        exactMatch, prefixMatch, suffixMatch, regexMatch, presentMatch or rangeMatch
                                        must be set.
                                    Optional: "true"
                        ignore_case:
                            Type: TypeBool
                            Description: |-
                                Specifies that prefixMatch and fullPathMatch matches are case sensitive.
                                Defaults to false.
                            Optional: "true"
                        metadata_filters:
                            Type: TypeList
                            Description: |-
                                Opaque filter criteria used by Loadbalancer to restrict routing configuration to
                                a limited set xDS compliant clients. In their xDS requests to Loadbalancer, xDS
                                clients present node metadata. If a match takes place, the relevant routing
                                configuration is made available to those proxies. For each metadataFilter in
                                this list, if its filterMatchCriteria is set to MATCH_ANY, at least one of the
                                filterLabels must match the corresponding label provided in the metadata. If its
                                filterMatchCriteria is set to MATCH_ALL, then all of its filterLabels must match
                                with corresponding labels in the provided metadata. metadataFilters specified
                                here can be overrides those specified in ForwardingRule that refers to this
                                UrlMap. metadataFilters only applies to Loadbalancers that have their
                                loadBalancingScheme set to INTERNAL_SELF_MANAGED.
                            Optional: "true"
                            Properties:
                                filter_labels:
                                    Type: TypeList
                                    Description: |-
                                        The list of label value pairs that must match labels in the provided metadata
                                        based on filterMatchCriteria  This list must not be empty and can have at the
                                        most 64 entries.
                                    Required: "true"
                                    MaxItems: "64"
                                    MinItems: "1"
                                    Properties:
                                        name:
                                            Type: TypeString
                                            Description: |-
                                                Name of metadata label. The name can have a maximum length of 1024 characters
                                                and must be at least 1 character long.
                                            Required: "true"
                                        value:
                                            Type: TypeString
                                            Description: |-
                                                The value of the label must match the specified value. value can have a maximum
                                                length of 1024 characters.
                                            Required: "true"
                                filter_match_criteria:
                                    Type: TypeString
                                    Description: |-
                                        Specifies how individual filterLabel matches within the list of filterLabels
                                        contribute towards the overall metadataFilter match. Supported values are:
                                          - MATCH_ANY: At least one of the filterLabels must have a matching label in the
                                        provided metadata.
                                          - MATCH_ALL: All filterLabels must have matching labels in
                                        the provided metadata. Possible values: ["MATCH_ALL", "MATCH_ANY"]
                                    Required: "true"
                        path_template_match:
                            Type: TypeString
                            Description: |-
                                For satisfying the matchRule condition, the path of the request
                                must match the wildcard pattern specified in pathTemplateMatch
                                after removing any query parameters and anchor that may be part
                                of the original URL.

                                pathTemplateMatch must be between 1 and 255 characters
                                (inclusive).  The pattern specified by pathTemplateMatch may
                                have at most 5 wildcard operators and at most 5 variable
                                captures in total.
                            Optional: "true"
                        prefix_match:
                            Type: TypeString
                            Description: |-
                                For satisfying the matchRule condition, the request's path must begin with the
                                specified prefixMatch. prefixMatch must begin with a /. The value must be
                                between 1 and 1024 characters. Only one of prefixMatch, fullPathMatch or
                                regexMatch must be specified.
                            Optional: "true"
                        query_parameter_matches:
                            Type: TypeList
                            Description: |-
                                Specifies a list of query parameter match criteria, all of which must match
                                corresponding query parameters in the request.
                            Optional: "true"
                            Properties:
                                exact_match:
                                    Type: TypeString
                                    Description: |-
                                        The queryParameterMatch matches if the value of the parameter exactly matches
                                        the contents of exactMatch. Only one of presentMatch, exactMatch and regexMatch
                                        must be set.
                                    Optional: "true"
                                name:
                                    Type: TypeString
                                    Description: |-
                                        The name of the query parameter to match. The query parameter must exist in the
                                        request, in the absence of which the request match fails.
                                    Required: "true"
                                present_match:
                                    Type: TypeBool
                                    Description: |-
                                        Specifies that the queryParameterMatch matches if the request contains the query
                                        parameter, irrespective of whether the parameter has a value or not. Only one of
                                        presentMatch, exactMatch and regexMatch must be set.
                                    Optional: "true"
                                regex_match:
                                    Type: TypeString
                                    Description: |-
                                        The queryParameterMatch matches if the value of the parameter matches the
                                        regular expression specified by regexMatch. For the regular expression grammar,
                                        please see en.cppreference.com/w/cpp/regex/ecmascript  Only one of presentMatch,
                                        exactMatch and regexMatch must be set.
                                    Optional: "true"
                        regex_match:
                            Type: TypeString
                            Description: |-
                                For satisfying the matchRule condition, the path of the request must satisfy the
                                regular expression specified in regexMatch after removing any query parameters
                                and anchor supplied with the original URL. For regular expression grammar please
                                see en.cppreference.com/w/cpp/regex/ecmascript  Only one of prefixMatch,
                                fullPathMatch or regexMatch must be specified.
                            Optional: "true"
                priority:
                    Type: TypeInt
                    Description: |-
                        For routeRules within a given pathMatcher, priority determines the order
                        in which load balancer will interpret routeRules. RouteRules are evaluated
                        in order of priority, from the lowest to highest number. The priority of
                        a rule decreases as its number increases (1, 2, 3, N+1). The first rule
                        that matches the request is applied.

                        You cannot configure two or more routeRules with the same priority.
                        Priority for each rule must be set to a number between 0 and
                        2147483647 inclusive.

                        Priority numbers can have gaps, which enable you to add or remove rules
                        in the future without affecting the rest of the rules. For example,
                        1, 2, 3, 4, 5, 9, 12, 16 is a valid series of priority numbers to which
                        you could add rules numbered from 6 to 8, 10 to 11, and 13 to 15 in the
                        future without any impact on existing rules.
                    Required: "true"
                route_action:
                    Type: TypeList
                    Description: |-
                        In response to a matching matchRule, the load balancer performs advanced routing
                        actions like URL rewrites, header transformations, etc. prior to forwarding the
                        request to the selected backend. If  routeAction specifies any
                        weightedBackendServices, service must not be set. Conversely if service is set,
                        routeAction cannot contain any  weightedBackendServices. Only one of routeAction
                        or urlRedirect must be set.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        cors_policy:
                            Type: TypeList
                            Description: |-
                                The specification for allowing client side cross-origin requests. Please see W3C
                                Recommendation for Cross Origin Resource Sharing
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                allow_credentials:
                                    Type: TypeBool
                                    Description: |-
                                        In response to a preflight request, setting this to true indicates that the
                                        actual request can include user credentials. This translates to the Access-
                                        Control-Allow-Credentials header. Defaults to false.
                                    Optional: "true"
                                allow_headers:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Allow-Headers header.
                                    Optional: "true"
                                allow_methods:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Allow-Methods header.
                                    Optional: "true"
                                allow_origin_regexes:
                                    Type: TypeList
                                    Description: |-
                                        Specifies the regular expression patterns that match allowed origins. For
                                        regular expression grammar please see en.cppreference.com/w/cpp/regex/ecmascript
                                        An origin is allowed if it matches either allow_origins or allow_origin_regex.
                                    Optional: "true"
                                allow_origins:
                                    Type: TypeList
                                    Description: |-
                                        Specifies the list of origins that will be allowed to do CORS requests. An
                                        origin is allowed if it matches either allow_origins or allow_origin_regex.
                                    Optional: "true"
                                disabled:
                                    Type: TypeBool
                                    Description: |-
                                        If true, specifies the CORS policy is disabled.
                                        which indicates that the CORS policy is in effect. Defaults to false.
                                    Optional: "true"
                                expose_headers:
                                    Type: TypeList
                                    Description: Specifies the content for the Access-Control-Expose-Headers header.
                                    Optional: "true"
                                max_age:
                                    Type: TypeInt
                                    Description: |-
                                        Specifies how long the results of a preflight request can be cached. This
                                        translates to the content for the Access-Control-Max-Age header.
                                    Optional: "true"
                        fault_injection_policy:
                            Type: TypeList
                            Description: |-
                                The specification for fault injection introduced into traffic to test the
                                resiliency of clients to backend service failure. As part of fault injection,
                                when clients send requests to a backend service, delays can be introduced by
                                Loadbalancer on a percentage of requests before sending those request to the
                                backend service. Similarly requests from clients can be aborted by the
                                Loadbalancer for a percentage of requests. timeout and retry_policy will be
                                ignored by clients that are configured with a fault_injection_policy.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                abort:
                                    Type: TypeList
                                    Description: |-
                                        The specification for how client requests are aborted as part of fault
                                        injection.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        http_status:
                                            Type: TypeInt
                                            Description: |-
                                                The HTTP status code used to abort the request. The value must be between 200
                                                and 599 inclusive.
                                            Optional: "true"
                                        percentage:
                                            Type: TypeFloat
                                            Description: |-
                                                The percentage of traffic (connections/operations/requests) which will be
                                                aborted as part of fault injection. The value must be between 0.0 and 100.0
                                                inclusive.
                                            Optional: "true"
                                delay:
                                    Type: TypeList
                                    Description: |-
                                        The specification for how client requests are delayed as part of fault
                                        injection, before being sent to a backend service.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        fixed_delay:
                                            Type: TypeList
                                            Description: Specifies the value of the fixed delay interval.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                nanos:
                                                    Type: TypeInt
                                                    Description: |-
                                                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                                                        less than one second are represented with a 0 'seconds' field and a positive
                                                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                                    Optional: "true"
                                                seconds:
                                                    Type: TypeString
                                                    Description: |-
                                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                                        inclusive.
                                                    Required: "true"
                                        percentage:
                                            Type: TypeFloat
                                            Description: |-
                                                The percentage of traffic (connections/operations/requests) on which delay will
                                                be introduced as part of fault injection. The value must be between 0.0 and
                                                100.0 inclusive.
                                            Optional: "true"
                        request_mirror_policy:
                            Type: TypeList
                            Description: |-
                                Specifies the policy on how requests intended for the route's backends are
                                shadowed to a separate mirrored backend service. Loadbalancer does not wait for
                                responses from the shadow service. Prior to sending traffic to the shadow
                                service, the host / authority header is suffixed with -shadow.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                backend_service:
                                    Type: TypeString
                                    Description: The BackendService resource being mirrored to.
                                    Required: "true"
                        retry_policy:
                            Type: TypeList
                            Description: Specifies the retry policy associated with this route.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                num_retries:
                                    Type: TypeInt
                                    Description: Specifies the allowed number retries. This number must be > 0.
                                    Required: "true"
                                per_try_timeout:
                                    Type: TypeList
                                    Description: |-
                                        Specifies a non-zero timeout per retry attempt.
                                        If not specified, will use the timeout set in HttpRouteAction. If timeout in HttpRouteAction
                                        is not set, will use the largest timeout among all backend services associated with the route.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        nanos:
                                            Type: TypeInt
                                            Description: |-
                                                Span of time that's a fraction of a second at nanosecond resolution. Durations
                                                less than one second are represented with a 0 'seconds' field and a positive
                                                'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                            Optional: "true"
                                        seconds:
                                            Type: TypeString
                                            Description: |-
                                                Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                                inclusive.
                                            Required: "true"
                                retry_conditions:
                                    Type: TypeList
                                    Description: |-
                                        Specfies one or more conditions when this retry rule applies. Valid values are:

                                        * 5xx: Loadbalancer will attempt a retry if the backend service responds with
                                          any 5xx response code, or if the backend service does not respond at all,
                                          example: disconnects, reset, read timeout, connection failure, and refused
                                          streams.
                                        * gateway-error: Similar to 5xx, but only applies to response codes
                                          502, 503 or 504.
                                        * connect-failure: Loadbalancer will retry on failures
                                          connecting to backend services, for example due to connection timeouts.
                                        * retriable-4xx: Loadbalancer will retry for retriable 4xx response codes.
                                          Currently the only retriable error supported is 409.
                                        * refused-stream: Loadbalancer will retry if the backend service resets the stream with a
                                          REFUSED_STREAM error code. This reset type indicates that it is safe to retry.
                                        * cancelled: Loadbalancer will retry if the gRPC status code in the response
                                          header is set to cancelled
                                        * deadline-exceeded: Loadbalancer will retry if the
                                          gRPC status code in the response header is set to deadline-exceeded
                                        * resource-exhausted: Loadbalancer will retry if the gRPC status code in the response
                                          header is set to resource-exhausted
                                        * unavailable: Loadbalancer will retry if the gRPC status code in
                                          the response header is set to unavailable
                                    Optional: "true"
                        timeout:
                            Type: TypeList
                            Description: |-
                                Specifies the timeout for the selected route. Timeout is computed from the time
                                the request is has been fully processed (i.e. end-of-stream) up until the
                                response has been completely processed. Timeout includes all retries. If not
                                specified, the default value is 15 seconds.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                nanos:
                                    Type: TypeInt
                                    Description: |-
                                        Span of time that's a fraction of a second at nanosecond resolution. Durations
                                        less than one second are represented with a 0 'seconds' field and a positive
                                        'nanos' field. Must be from 0 to 999,999,999 inclusive.
                                    Optional: "true"
                                seconds:
                                    Type: TypeString
                                    Description: |-
                                        Span of time at a resolution of a second. Must be from 0 to 315,576,000,000
                                        inclusive.
                                    Required: "true"
                        url_rewrite:
                            Type: TypeList
                            Description: |-
                                The spec to modify the URL of the request, prior to forwarding the request to
                                the matched service
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                host_rewrite:
                                    Type: TypeString
                                    Description: |-
                                        Prior to forwarding the request to the selected service, the request's host
                                        header is replaced with contents of hostRewrite. The value must be between 1 and
                                        255 characters.
                                    Optional: "true"
                                path_prefix_rewrite:
                                    Type: TypeString
                                    Description: |-
                                        Prior to forwarding the request to the selected backend service, the matching
                                        portion of the request's path is replaced by pathPrefixRewrite. The value must
                                        be between 1 and 1024 characters.
                                    Optional: "true"
                                path_template_rewrite:
                                    Type: TypeString
                                    Description: |-
                                        Prior to forwarding the request to the selected origin, if the
                                        request matched a pathTemplateMatch, the matching portion of the
                                        request's path is replaced re-written using the pattern specified
                                        by pathTemplateRewrite.

                                        pathTemplateRewrite must be between 1 and 255 characters
                                        (inclusive), must start with a '/', and must only use variables
                                        captured by the route's pathTemplate matchers.

                                        pathTemplateRewrite may only be used when all of a route's
                                        MatchRules specify pathTemplate.

                                        Only one of pathPrefixRewrite and pathTemplateRewrite may be
                                        specified.
                                    Optional: "true"
                        weighted_backend_services:
                            Type: TypeList
                            Description: |-
                                A list of weighted backend services to send traffic to when a route match
                                occurs. The weights determine the fraction of traffic that flows to their
                                corresponding backend service. If all traffic needs to go to a single backend
                                service, there must be one  weightedBackendService with weight set to a non 0
                                number. Once a backendService is identified and before forwarding the request to
                                the backend service, advanced routing actions like Url rewrites and header
                                transformations are applied depending on additional settings specified in this
                                HttpRouteAction.
                            Optional: "true"
                            Properties:
                                backend_service:
                                    Type: TypeString
                                    Description: |-
                                        The default BackendService resource. Before
                                        forwarding the request to backendService, the loadbalancer applies any relevant
                                        headerActions specified as part of this backendServiceWeight.
                                    Required: "true"
                                header_action:
                                    Type: TypeList
                                    Description: |-
                                        Specifies changes to request and response headers that need to take effect for
                                        the selected backendService. headerAction specified here take effect before
                                        headerAction in the enclosing HttpRouteRule, PathMatcher and UrlMap.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        request_headers_to_add:
                                            Type: TypeList
                                            Description: |-
                                                Headers to add to a matching request prior to forwarding the request to the
                                                backendService.
                                            Optional: "true"
                                            Properties:
                                                header_name:
                                                    Type: TypeString
                                                    Description: The name of the header.
                                                    Required: "true"
                                                header_value:
                                                    Type: TypeString
                                                    Description: The value of the header to add.
                                                    Required: "true"
                                                replace:
                                                    Type: TypeBool
                                                    Description: |-
                                                        If false, headerValue is appended to any values that already exist for the
                                                        header. If true, headerValue is set for the header, discarding any values that
                                                        were set for that header.
                                                    Required: "true"
                                        request_headers_to_remove:
                                            Type: TypeList
                                            Description: |-
                                                A list of header names for headers that need to be removed from the request
                                                prior to forwarding the request to the backendService.
                                            Optional: "true"
                                        response_headers_to_add:
                                            Type: TypeList
                                            Description: Headers to add the response prior to sending the response back to the client.
                                            Optional: "true"
                                            Properties:
                                                header_name:
                                                    Type: TypeString
                                                    Description: The name of the header.
                                                    Required: "true"
                                                header_value:
                                                    Type: TypeString
                                                    Description: The value of the header to add.
                                                    Required: "true"
                                                replace:
                                                    Type: TypeBool
                                                    Description: |-
                                                        If false, headerValue is appended to any values that already exist for the
                                                        header. If true, headerValue is set for the header, discarding any values that
                                                        were set for that header.
                                                    Required: "true"
                                        response_headers_to_remove:
                                            Type: TypeList
                                            Description: |-
                                                A list of header names for headers that need to be removed from the response
                                                prior to sending the response back to the client.
                                            Optional: "true"
                                weight:
                                    Type: TypeInt
                                    Description: |-
                                        Specifies the fraction of traffic sent to backendService, computed as weight /
                                        (sum of all weightedBackendService weights in routeAction) . The selection of a
                                        backend service is determined only for new traffic. Once a user's request has
                                        been directed to a backendService, subsequent requests will be sent to the same
                                        backendService as determined by the BackendService's session affinity policy.
                                        The value must be between 0 and 1000
                                    Required: "true"
                service:
                    Type: TypeString
                    Description: |-
                        The backend service resource to which traffic is
                        directed if this rule is matched. If routeAction is additionally specified,
                        advanced routing actions like URL Rewrites, etc. take effect prior to sending
                        the request to the backend. However, if service is specified, routeAction cannot
                        contain any weightedBackendService s. Conversely, if routeAction specifies any
                        weightedBackendServices, service must not be specified. Only one of urlRedirect,
                        service or routeAction.weightedBackendService must be set.
                    Optional: "true"
                url_redirect:
                    Type: TypeList
                    Description: |-
                        When this rule is matched, the request is redirected to a URL specified by
                        urlRedirect. If urlRedirect is specified, service or routeAction must not be
                        set.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        host_redirect:
                            Type: TypeString
                            Description: |-
                                The host that will be used in the redirect response instead of the one that was
                                supplied in the request. The value must be between 1 and 255 characters.
                            Optional: "true"
                        https_redirect:
                            Type: TypeBool
                            Description: |-
                                If set to true, the URL scheme in the redirected request is set to https. If set
                                to false, the URL scheme of the redirected request will remain the same as that
                                of the request. This must only be set for UrlMaps used in TargetHttpProxys.
                                Setting this true for TargetHttpsProxy is not permitted. Defaults to false.
                            Optional: "true"
                        path_redirect:
                            Type: TypeString
                            Description: |-
                                The path that will be used in the redirect response instead of the one that was
                                supplied in the request. Only one of pathRedirect or prefixRedirect must be
                                specified. The value must be between 1 and 1024 characters.
                            Optional: "true"
                        prefix_redirect:
                            Type: TypeString
                            Description: |-
                                The prefix that replaces the prefixMatch specified in the HttpRouteRuleMatch,
                                retaining the remaining portion of the URL before redirecting the request.
                            Optional: "true"
                        redirect_response_code:
                            Type: TypeString
                            Description: |-
                                The HTTP Status code to use for this RedirectAction. Supported values are:

                                * MOVED_PERMANENTLY_DEFAULT, which is the default value and corresponds to 301.

                                * FOUND, which corresponds to 302.

                                * SEE_OTHER which corresponds to 303.

                                * TEMPORARY_REDIRECT, which corresponds to 307. In this case, the request method will be retained.

                                * PERMANENT_REDIRECT, which corresponds to 308. In this case, the request method will be retained. Possible values: ["FOUND", "MOVED_PERMANENTLY_DEFAULT", "PERMANENT_REDIRECT", "SEE_OTHER", "TEMPORARY_REDIRECT"]
                            Optional: "true"
                        strip_query:
                            Type: TypeBool
                            Description: |-
                                If set to true, any accompanying query portion of the original URL is removed
                                prior to redirecting the request. If set to false, the query portion of the
                                original URL is retained. Defaults to false.
                            Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
test:
    Type: TypeList
    Description: |-
        The list of expected URL mapping tests. Request to update this UrlMap will
        succeed only if all of the test cases pass. You can specify a maximum of 100
        tests per UrlMap.
    Optional: "true"
    Properties:
        description:
            Type: TypeString
            Description: Description of this test case.
            Optional: "true"
        host:
            Type: TypeString
            Description: Host portion of the URL.
            Required: "true"
        path:
            Type: TypeString
            Description: Path portion of the URL.
            Required: "true"
        service:
            Type: TypeString
            Description: The backend service or backend bucket link that should be matched by this test.
            Required: "true"

