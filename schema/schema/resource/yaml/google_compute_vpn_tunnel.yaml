creation_timestamp:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
detailed_status:
    Type: TypeString
    Description: Detailed status message for the VPN tunnel.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
ike_version:
    Type: TypeInt
    Description: |-
        IKE protocol version to use when establishing the VPN tunnel with
        peer VPN gateway.
        Acceptable IKE versions are 1 or 2. Default version is 2.
    Optional: "true"
label_fingerprint:
    Type: TypeString
    Description: |-
        The fingerprint used for optimistic locking of this resource.  Used
        internally during updates.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels to apply to this VpnTunnel.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
local_traffic_selector:
    Type: TypeSet
    Description: |-
        Local traffic selector to use when establishing the VPN tunnel with
        peer VPN gateway. The value should be a CIDR formatted string,
        for example '192.168.0.0/16'. The ranges should be disjoint.
        Only IPv4 is supported.
    Computed: "true"
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        Name of the resource. The name must be 1-63 characters long, and
        comply with RFC1035. Specifically, the name must be 1-63
        characters long and match the regular expression
        '[a-z]([-a-z0-9]*[a-z0-9])?' which means the first character
        must be a lowercase letter, and all following characters must
        be a dash, lowercase letter, or digit,
        except the last character, which cannot be a dash.
    Required: "true"
peer_external_gateway:
    Type: TypeString
    Description: URL of the peer side external VPN gateway to which this VPN tunnel is connected.
    Optional: "true"
    ConflictsWith: peer_gcp_gateway
peer_external_gateway_interface:
    Type: TypeInt
    Description: The interface ID of the external VPN gateway to which this VPN tunnel is connected.
    Optional: "true"
peer_gcp_gateway:
    Type: TypeString
    Description: |-
        URL of the peer side HA GCP VPN gateway to which this VPN tunnel is connected.
        If provided, the VPN tunnel will automatically use the same vpn_gateway_interface
        ID in the peer GCP VPN gateway.
        This field must reference a 'google_compute_ha_vpn_gateway' resource.
    Optional: "true"
    ConflictsWith: peer_external_gateway
peer_ip:
    Type: TypeString
    Description: IP address of the peer VPN gateway. Only IPv4 is supported.
    Computed: "true"
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: The region where the tunnel is located. If unset, is set to the region of 'target_vpn_gateway'.
    Computed: "true"
    Optional: "true"
remote_traffic_selector:
    Type: TypeSet
    Description: |-
        Remote traffic selector to use when establishing the VPN tunnel with
        peer VPN gateway. The value should be a CIDR formatted string,
        for example '192.168.0.0/16'. The ranges should be disjoint.
        Only IPv4 is supported.
    Computed: "true"
    Optional: "true"
router:
    Type: TypeString
    Description: URL of router resource to be used for dynamic routing.
    Optional: "true"
self_link:
    Type: TypeString
    Computed: "true"
shared_secret:
    Type: TypeString
    Description: |-
        Shared secret used to set the secure session between the Cloud VPN
        gateway and the peer VPN gateway.
    Required: "true"
shared_secret_hash:
    Type: TypeString
    Description: Hash of the shared secret.
    Computed: "true"
target_vpn_gateway:
    Type: TypeString
    Description: |-
        URL of the Target VPN gateway with which this VPN tunnel is
        associated.
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
tunnel_id:
    Type: TypeString
    Description: The unique identifier for the resource. This identifier is defined by the server.
    Computed: "true"
vpn_gateway:
    Type: TypeString
    Description: |-
        URL of the VPN gateway with which this VPN tunnel is associated.
        This must be used if a High Availability VPN gateway resource is created.
        This field must reference a 'google_compute_ha_vpn_gateway' resource.
    Optional: "true"
vpn_gateway_interface:
    Type: TypeInt
    Description: The interface ID of the VPN gateway with which this VPN tunnel is associated.
    Optional: "true"

