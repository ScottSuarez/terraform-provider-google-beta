description:
    Type: TypeString
    Description: A description of the inspect template.
    Optional: "true"
display_name:
    Type: TypeString
    Description: User set display name of the inspect template.
    Optional: "true"
inspect_config:
    Type: TypeList
    Description: The core content of the template.
    Optional: "true"
    MaxItems: "1"
    Properties:
        content_options:
            Type: TypeList
            Description: 'List of options defining data content to scan. If empty, text, images, and other content will be included. Possible values: ["CONTENT_TEXT", "CONTENT_IMAGE"]'
            Optional: "true"
        custom_info_types:
            Type: TypeList
            Description: Custom info types to be used. See https://cloud.google.com/dlp/docs/creating-custom-infotypes to learn more.
            Optional: "true"
            Properties:
                dictionary:
                    Type: TypeList
                    Description: Dictionary which defines the rule.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        cloud_storage_path:
                            Type: TypeList
                            Description: Newline-delimited file of words in Cloud Storage. Only a single file is accepted.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                path:
                                    Type: TypeString
                                    Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                                    Required: "true"
                        word_list:
                            Type: TypeList
                            Description: List of words or phrases to search for.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                words:
                                    Type: TypeList
                                    Description: |-
                                        Words or phrases defining the dictionary. The dictionary must contain at least one
                                        phrase and every phrase must contain at least 2 characters that are letters or digits.
                                    Required: "true"
                exclusion_type:
                    Type: TypeString
                    Description: 'If set to EXCLUSION_TYPE_EXCLUDE this infoType will not cause a finding to be returned. It still can be used for rules matching. Possible values: ["EXCLUSION_TYPE_EXCLUDE"]'
                    Optional: "true"
                info_type:
                    Type: TypeList
                    Description: |-
                        CustomInfoType can either be a new infoType, or an extension of built-in infoType, when the name matches one of existing
                        infoTypes and that infoType is specified in 'info_types' field. Specifying the latter adds findings to the
                        one detected by the system. If built-in info type is not specified in 'info_types' list then the name is
                        treated as a custom info type.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        name:
                            Type: TypeString
                            Description: |-
                                Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names
                                listed at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                            Required: "true"
                        sensitivity_score:
                            Type: TypeList
                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                score:
                                    Type: TypeString
                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                    Required: "true"
                        version:
                            Type: TypeString
                            Description: Version name for this InfoType.
                            Optional: "true"
                likelihood:
                    Type: TypeString
                    Description: |-
                        Likelihood to return for this CustomInfoType. This base value can be altered by a detection rule if the finding meets the criteria
                        specified by the rule. Default value: "VERY_LIKELY" Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]
                    Optional: "true"
                regex:
                    Type: TypeList
                    Description: Regular expression which defines the rule.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        group_indexes:
                            Type: TypeList
                            Description: The index of the submatch to extract as findings. When not specified, the entire match is returned. No more than 3 may be included.
                            Optional: "true"
                        pattern:
                            Type: TypeString
                            Description: |-
                                Pattern defining the regular expression.
                                Its syntax (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                            Required: "true"
                sensitivity_score:
                    Type: TypeList
                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        score:
                            Type: TypeString
                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                            Required: "true"
                stored_type:
                    Type: TypeList
                    Description: A reference to a StoredInfoType to use with scanning.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        name:
                            Type: TypeString
                            Description: |-
                                Resource name of the requested StoredInfoType, for example 'organizations/433245324/storedInfoTypes/432452342'
                                or 'projects/project-id/storedInfoTypes/432452342'.
                            Required: "true"
                surrogate_type:
                    Type: TypeList
                    Description: Message for detecting output from deidentification transformations that support reversing.
                    Optional: "true"
                    MaxItems: "1"
                    Properties: {}
        exclude_info_types:
            Type: TypeBool
            Description: When true, excludes type information of the findings.
            Optional: "true"
        include_quote:
            Type: TypeBool
            Description: When true, a contextual quote from the data that triggered a finding is included in the response.
            Optional: "true"
        info_types:
            Type: TypeList
            Description: |-
                Restricts what infoTypes to look for. The values must correspond to InfoType values returned by infoTypes.list
                or listed at https://cloud.google.com/dlp/docs/infotypes-reference.

                When no InfoTypes or CustomInfoTypes are specified in a request, the system may automatically choose what detectors to run.
                By default this may be all types, but may change over time as detectors are updated.
            Optional: "true"
            Properties:
                name:
                    Type: TypeString
                    Description: |-
                        Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                        at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                    Required: "true"
                sensitivity_score:
                    Type: TypeList
                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        score:
                            Type: TypeString
                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                            Required: "true"
                version:
                    Type: TypeString
                    Description: Version of the information type to use. By default, the version is set to stable
                    Optional: "true"
        limits:
            Type: TypeList
            Description: Configuration to control the number of findings returned.
            Optional: "true"
            MaxItems: "1"
            Properties:
                max_findings_per_info_type:
                    Type: TypeList
                    Description: Configuration of findings limit given for specified infoTypes.
                    Optional: "true"
                    Properties:
                        info_type:
                            Type: TypeList
                            Description: |-
                                Type of information the findings limit applies to. Only one limit per infoType should be provided. If InfoTypeLimit does
                                not have an infoType, the DLP API applies the limit against all infoTypes that are found but not
                                specified in another InfoTypeLimit.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: |-
                                        Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                        at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                    Required: "true"
                                sensitivity_score:
                                    Type: TypeList
                                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        score:
                                            Type: TypeString
                                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                            Required: "true"
                                version:
                                    Type: TypeString
                                    Description: Version name for this InfoType.
                                    Optional: "true"
                        max_findings:
                            Type: TypeInt
                            Description: Max findings limit for the given infoType.
                            Required: "true"
                max_findings_per_item:
                    Type: TypeInt
                    Description: Max number of findings that will be returned for each item scanned. The maximum returned is 2000.
                    Required: "true"
                max_findings_per_request:
                    Type: TypeInt
                    Description: Max number of findings that will be returned per request/job. The maximum returned is 2000.
                    Required: "true"
        min_likelihood:
            Type: TypeString
            Description: 'Only returns findings equal or above this threshold. See https://cloud.google.com/dlp/docs/likelihood for more info Default value: "POSSIBLE" Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]'
            Optional: "true"
        rule_set:
            Type: TypeList
            Description: |-
                Set of rules to apply to the findings for this InspectConfig. Exclusion rules, contained in the set are executed in the end,
                other rules are executed in the order they are specified for each info type.
            Optional: "true"
            Properties:
                info_types:
                    Type: TypeList
                    Description: List of infoTypes this rule set is applied to.
                    Required: "true"
                    Properties:
                        name:
                            Type: TypeString
                            Description: |-
                                Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                            Required: "true"
                        sensitivity_score:
                            Type: TypeList
                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                score:
                                    Type: TypeString
                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                    Required: "true"
                        version:
                            Type: TypeString
                            Description: Version name for this InfoType.
                            Optional: "true"
                rules:
                    Type: TypeList
                    Description: Set of rules to be applied to infoTypes. The rules are applied in order.
                    Required: "true"
                    Properties:
                        exclusion_rule:
                            Type: TypeList
                            Description: The rule that specifies conditions when findings of infoTypes specified in InspectionRuleSet are removed from results.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                dictionary:
                                    Type: TypeList
                                    Description: Dictionary which defines the rule.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        cloud_storage_path:
                                            Type: TypeList
                                            Description: Newline-delimited file of words in Cloud Storage. Only a single file is accepted.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                path:
                                                    Type: TypeString
                                                    Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                                                    Required: "true"
                                        word_list:
                                            Type: TypeList
                                            Description: List of words or phrases to search for.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                words:
                                                    Type: TypeList
                                                    Description: |-
                                                        Words or phrases defining the dictionary. The dictionary must contain at least one
                                                        phrase and every phrase must contain at least 2 characters that are letters or digits.
                                                    Required: "true"
                                exclude_by_hotword:
                                    Type: TypeList
                                    Description: |-
                                        Drop if the hotword rule is contained in the proximate context.
                                        For tabular data, the context includes the column name.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        hotword_regex:
                                            Type: TypeList
                                            Description: Regular expression pattern defining what qualifies as a hotword.
                                            Required: "true"
                                            MaxItems: "1"
                                            Properties:
                                                group_indexes:
                                                    Type: TypeList
                                                    Description: |-
                                                        The index of the submatch to extract as findings. When not specified,
                                                        the entire match is returned. No more than 3 may be included.
                                                    Optional: "true"
                                                pattern:
                                                    Type: TypeString
                                                    Description: |-
                                                        Pattern defining the regular expression. Its syntax
                                                        (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                                    Required: "true"
                                        proximity:
                                            Type: TypeList
                                            Description: |-
                                                Proximity of the finding within which the entire hotword must reside. The total length of the window cannot
                                                exceed 1000 characters. Note that the finding itself will be included in the window, so that hotwords may be
                                                used to match substrings of the finding itself. For example, the certainty of a phone number regex
                                                '(\d{3}) \d{3}-\d{4}' could be adjusted upwards if the area code is known to be the local area code of a company
                                                office using the hotword regex '(xxx)', where 'xxx' is the area code in question.
                                            Required: "true"
                                            MaxItems: "1"
                                            Properties:
                                                window_after:
                                                    Type: TypeInt
                                                    Description: Number of characters after the finding to consider.
                                                    Optional: "true"
                                                window_before:
                                                    Type: TypeInt
                                                    Description: Number of characters before the finding to consider.
                                                    Optional: "true"
                                exclude_info_types:
                                    Type: TypeList
                                    Description: Set of infoTypes for which findings would affect this rule.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        info_types:
                                            Type: TypeList
                                            Description: If a finding is matched by any of the infoType detectors listed here, the finding will be excluded from the scan results.
                                            Required: "true"
                                            Properties:
                                                name:
                                                    Type: TypeString
                                                    Description: |-
                                                        Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                                        at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                                    Required: "true"
                                                sensitivity_score:
                                                    Type: TypeList
                                                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                                    Optional: "true"
                                                    MaxItems: "1"
                                                    Properties:
                                                        score:
                                                            Type: TypeString
                                                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                                            Required: "true"
                                                version:
                                                    Type: TypeString
                                                    Description: Version name for this InfoType.
                                                    Optional: "true"
                                matching_type:
                                    Type: TypeString
                                    Description: 'How the rule is applied. See the documentation for more information: https://cloud.google.com/dlp/docs/reference/rest/v2/InspectConfig#MatchingType Possible values: ["MATCHING_TYPE_FULL_MATCH", "MATCHING_TYPE_PARTIAL_MATCH", "MATCHING_TYPE_INVERSE_MATCH"]'
                                    Required: "true"
                                regex:
                                    Type: TypeList
                                    Description: Regular expression which defines the rule.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        group_indexes:
                                            Type: TypeList
                                            Description: The index of the submatch to extract as findings. When not specified, the entire match is returned. No more than 3 may be included.
                                            Optional: "true"
                                        pattern:
                                            Type: TypeString
                                            Description: |-
                                                Pattern defining the regular expression.
                                                Its syntax (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                            Required: "true"
                        hotword_rule:
                            Type: TypeList
                            Description: Hotword-based detection rule.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                hotword_regex:
                                    Type: TypeList
                                    Description: Regular expression pattern defining what qualifies as a hotword.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        group_indexes:
                                            Type: TypeList
                                            Description: |-
                                                The index of the submatch to extract as findings. When not specified,
                                                the entire match is returned. No more than 3 may be included.
                                            Optional: "true"
                                        pattern:
                                            Type: TypeString
                                            Description: |-
                                                Pattern defining the regular expression. Its syntax
                                                (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                            Required: "true"
                                likelihood_adjustment:
                                    Type: TypeList
                                    Description: Likelihood adjustment to apply to all matching findings.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        fixed_likelihood:
                                            Type: TypeString
                                            Description: 'Set the likelihood of a finding to a fixed value. Either this or relative_likelihood can be set. Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]'
                                            Optional: "true"
                                        relative_likelihood:
                                            Type: TypeInt
                                            Description: |-
                                                Increase or decrease the likelihood by the specified number of levels. For example,
                                                if a finding would be POSSIBLE without the detection rule and relativeLikelihood is 1,
                                                then it is upgraded to LIKELY, while a value of -1 would downgrade it to UNLIKELY.
                                                Likelihood may never drop below VERY_UNLIKELY or exceed VERY_LIKELY, so applying an
                                                adjustment of 1 followed by an adjustment of -1 when base likelihood is VERY_LIKELY
                                                will result in a final likelihood of LIKELY. Either this or fixed_likelihood can be set.
                                            Optional: "true"
                                proximity:
                                    Type: TypeList
                                    Description: |-
                                        Proximity of the finding within which the entire hotword must reside. The total length of the window cannot
                                        exceed 1000 characters. Note that the finding itself will be included in the window, so that hotwords may be
                                        used to match substrings of the finding itself. For example, the certainty of a phone number regex
                                        '(\d{3}) \d{3}-\d{4}' could be adjusted upwards if the area code is known to be the local area code of a company
                                        office using the hotword regex '(xxx)', where 'xxx' is the area code in question.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        window_after:
                                            Type: TypeInt
                                            Description: Number of characters after the finding to consider. Either this or window_before must be specified
                                            Optional: "true"
                                        window_before:
                                            Type: TypeInt
                                            Description: Number of characters before the finding to consider. Either this or window_after must be specified
                                            Optional: "true"
name:
    Type: TypeString
    Description: The resource name of the inspect template. Set by the server.
    Computed: "true"
parent:
    Type: TypeString
    Description: |-
        The parent of the inspect template in any of the following formats:

        * 'projects/{{project}}'
        * 'projects/{{project}}/locations/{{location}}'
        * 'organizations/{{organization_id}}'
        * 'organizations/{{organization_id}}/locations/{{location}}'
    Required: "true"
template_id:
    Type: TypeString
    Description: |-
        The template id can contain uppercase and lowercase letters, numbers, and hyphens;
        that is, it must match the regular expression: [a-zA-Z\d-_]+. The maximum length is
        100 characters. Can be empty to allow the system to generate one.
    Computed: "true"
    Optional: "true"

