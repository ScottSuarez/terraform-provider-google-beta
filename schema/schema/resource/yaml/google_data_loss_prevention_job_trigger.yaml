create_time:
    Type: TypeString
    Description: The creation timestamp of an inspectTemplate. Set by the server.
    Computed: "true"
description:
    Type: TypeString
    Description: A description of the job trigger.
    Optional: "true"
display_name:
    Type: TypeString
    Description: User set display name of the job trigger.
    Optional: "true"
inspect_job:
    Type: TypeList
    Description: Controls what and how to inspect for findings.
    Optional: "true"
    MaxItems: "1"
    Properties:
        actions:
            Type: TypeList
            Description: Configuration block for the actions to execute on the completion of a job. Can be specified multiple times, but only one for each type. Each action block supports fields documented below. This argument is processed in [attribute-as-blocks mode](https://www.terraform.io/docs/configuration/attr-as-blocks.html).
            Optional: "true"
            Properties:
                deidentify:
                    Type: TypeList
                    Description: Create a de-identified copy of the requested table or files.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        cloud_storage_output:
                            Type: TypeString
                            Description: |-
                                User settable Cloud Storage bucket and folders to store de-identified files.

                                This field must be set for cloud storage deidentification.

                                The output Cloud Storage bucket must be different from the input bucket.

                                De-identified files will overwrite files in the output path.

                                Form of: gs://bucket/folder/ or gs://bucket
                            Required: "true"
                        file_types_to_transform:
                            Type: TypeList
                            Description: |-
                                List of user-specified file type groups to transform. If specified, only the files with these filetypes will be transformed.

                                If empty, all supported files will be transformed. Supported types may be automatically added over time.

                                If a file type is set in this field that isn't supported by the Deidentify action then the job will fail and will not be successfully created/started. Possible values: ["IMAGE", "TEXT_FILE", "CSV", "TSV"]
                            Optional: "true"
                        transformation_config:
                            Type: TypeList
                            Description: User specified deidentify templates and configs for structured, unstructured, and image files.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                deidentify_template:
                                    Type: TypeString
                                    Description: If this template is specified, it will serve as the default de-identify template.
                                    Optional: "true"
                                image_redact_template:
                                    Type: TypeString
                                    Description: If this template is specified, it will serve as the de-identify template for images.
                                    Optional: "true"
                                structured_deidentify_template:
                                    Type: TypeString
                                    Description: If this template is specified, it will serve as the de-identify template for structured content such as delimited files and tables.
                                    Optional: "true"
                        transformation_details_storage_config:
                            Type: TypeList
                            Description: Config for storing transformation details.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                table:
                                    Type: TypeList
                                    Description: The BigQuery table in which to store the output.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        dataset_id:
                                            Type: TypeString
                                            Description: The ID of the dataset containing this table.
                                            Required: "true"
                                        project_id:
                                            Type: TypeString
                                            Description: The ID of the project containing this table.
                                            Required: "true"
                                        table_id:
                                            Type: TypeString
                                            Description: |-
                                                The ID of the table. The ID must contain only letters (a-z,
                                                A-Z), numbers (0-9), or underscores (_). The maximum length
                                                is 1,024 characters.
                                            Optional: "true"
                job_notification_emails:
                    Type: TypeList
                    Description: Sends an email when the job completes. The email goes to IAM project owners and technical Essential Contacts.
                    Optional: "true"
                    MaxItems: "1"
                    Properties: {}
                pub_sub:
                    Type: TypeList
                    Description: Publish a message into a given Pub/Sub topic when the job completes.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        topic:
                            Type: TypeString
                            Description: Cloud Pub/Sub topic to send notifications to.
                            Required: "true"
                publish_findings_to_cloud_data_catalog:
                    Type: TypeList
                    Description: Publish findings of a DlpJob to Data Catalog.
                    Optional: "true"
                    MaxItems: "1"
                    Properties: {}
                publish_summary_to_cscc:
                    Type: TypeList
                    Description: Publish the result summary of a DlpJob to the Cloud Security Command Center.
                    Optional: "true"
                    MaxItems: "1"
                    Properties: {}
                publish_to_stackdriver:
                    Type: TypeList
                    Description: Enable Stackdriver metric dlp.googleapis.com/findingCount.
                    Optional: "true"
                    MaxItems: "1"
                    Properties: {}
                save_findings:
                    Type: TypeList
                    Description: 'If set, the detailed findings will be persisted to the specified OutputStorageConfig. Only a single instance of this action can be specified. Compatible with: Inspect, Risk'
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        output_config:
                            Type: TypeList
                            Description: Information on where to store output
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                output_schema:
                                    Type: TypeString
                                    Description: |-
                                        Schema used for writing the findings for Inspect jobs. This field is only used for
                                        Inspect and must be unspecified for Risk jobs. Columns are derived from the Finding
                                        object. If appending to an existing table, any columns from the predefined schema
                                        that are missing will be added. No columns in the existing table will be deleted.

                                        If unspecified, then all available columns will be used for a new table or an (existing)
                                        table with no schema, and no changes will be made to an existing table that has a schema.
                                        Only for use with external storage. Possible values: ["BASIC_COLUMNS", "GCS_COLUMNS", "DATASTORE_COLUMNS", "BIG_QUERY_COLUMNS", "ALL_COLUMNS"]
                                    Optional: "true"
                                table:
                                    Type: TypeList
                                    Description: Information on the location of the target BigQuery Table.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        dataset_id:
                                            Type: TypeString
                                            Description: Dataset ID of the table.
                                            Required: "true"
                                        project_id:
                                            Type: TypeString
                                            Description: The Google Cloud Platform project ID of the project containing the table.
                                            Required: "true"
                                        table_id:
                                            Type: TypeString
                                            Description: |-
                                                Name of the table. If is not set a new one will be generated for you with the following format:
                                                'dlp_googleapis_yyyy_mm_dd_[dlp_job_id]'. Pacific timezone will be used for generating the date details.
                                            Optional: "true"
        inspect_config:
            Type: TypeList
            Description: The core content of the template.
            Optional: "true"
            MaxItems: "1"
            Properties:
                custom_info_types:
                    Type: TypeList
                    Description: Custom info types to be used. See https://cloud.google.com/dlp/docs/creating-custom-infotypes to learn more.
                    Optional: "true"
                    Properties:
                        dictionary:
                            Type: TypeList
                            Description: Dictionary which defines the rule.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                cloud_storage_path:
                                    Type: TypeList
                                    Description: Newline-delimited file of words in Cloud Storage. Only a single file is accepted.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        path:
                                            Type: TypeString
                                            Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                                            Required: "true"
                                word_list:
                                    Type: TypeList
                                    Description: List of words or phrases to search for.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        words:
                                            Type: TypeList
                                            Description: |-
                                                Words or phrases defining the dictionary. The dictionary must contain at least one
                                                phrase and every phrase must contain at least 2 characters that are letters or digits.
                                            Required: "true"
                        exclusion_type:
                            Type: TypeString
                            Description: 'If set to EXCLUSION_TYPE_EXCLUDE this infoType will not cause a finding to be returned. It still can be used for rules matching. Possible values: ["EXCLUSION_TYPE_EXCLUDE"]'
                            Optional: "true"
                        info_type:
                            Type: TypeList
                            Description: |-
                                CustomInfoType can either be a new infoType, or an extension of built-in infoType, when the name matches one of existing
                                infoTypes and that infoType is specified in 'info_types' field. Specifying the latter adds findings to the
                                one detected by the system. If built-in info type is not specified in 'info_types' list then the name is
                                treated as a custom info type.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: |-
                                        Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names
                                        listed at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                    Required: "true"
                                sensitivity_score:
                                    Type: TypeList
                                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        score:
                                            Type: TypeString
                                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                            Required: "true"
                                version:
                                    Type: TypeString
                                    Description: Version of the information type to use. By default, the version is set to stable.
                                    Optional: "true"
                        likelihood:
                            Type: TypeString
                            Description: |-
                                Likelihood to return for this CustomInfoType. This base value can be altered by a detection rule if the finding meets the criteria
                                specified by the rule. Default value: "VERY_LIKELY" Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]
                            Optional: "true"
                        regex:
                            Type: TypeList
                            Description: Regular expression which defines the rule.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                group_indexes:
                                    Type: TypeList
                                    Description: The index of the submatch to extract as findings. When not specified, the entire match is returned. No more than 3 may be included.
                                    Optional: "true"
                                pattern:
                                    Type: TypeString
                                    Description: |-
                                        Pattern defining the regular expression.
                                        Its syntax (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                    Required: "true"
                        sensitivity_score:
                            Type: TypeList
                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                score:
                                    Type: TypeString
                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                    Required: "true"
                        stored_type:
                            Type: TypeList
                            Description: A reference to a StoredInfoType to use with scanning.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                create_time:
                                    Type: TypeString
                                    Description: The creation timestamp of an inspectTemplate. Set by the server.
                                    Computed: "true"
                                name:
                                    Type: TypeString
                                    Description: |-
                                        Resource name of the requested StoredInfoType, for example 'organizations/433245324/storedInfoTypes/432452342'
                                        or 'projects/project-id/storedInfoTypes/432452342'.
                                    Required: "true"
                        surrogate_type:
                            Type: TypeList
                            Description: Message for detecting output from deidentification transformations that support reversing.
                            Optional: "true"
                            MaxItems: "1"
                            Properties: {}
                exclude_info_types:
                    Type: TypeBool
                    Description: When true, excludes type information of the findings.
                    Optional: "true"
                include_quote:
                    Type: TypeBool
                    Description: When true, a contextual quote from the data that triggered a finding is included in the response.
                    Optional: "true"
                info_types:
                    Type: TypeList
                    Description: |-
                        Restricts what infoTypes to look for. The values must correspond to InfoType values returned by infoTypes.list
                        or listed at https://cloud.google.com/dlp/docs/infotypes-reference.

                        When no InfoTypes or CustomInfoTypes are specified in a request, the system may automatically choose what detectors to run.
                        By default this may be all types, but may change over time as detectors are updated.
                    Optional: "true"
                    Properties:
                        name:
                            Type: TypeString
                            Description: |-
                                Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                            Required: "true"
                        sensitivity_score:
                            Type: TypeList
                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                score:
                                    Type: TypeString
                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                    Required: "true"
                        version:
                            Type: TypeString
                            Description: Version of the information type to use. By default, the version is set to stable
                            Optional: "true"
                limits:
                    Type: TypeList
                    Description: Configuration to control the number of findings returned.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        max_findings_per_info_type:
                            Type: TypeList
                            Description: Configuration of findings limit given for specified infoTypes.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.inspect_config.0.limits.0.max_findings_per_item, inspect_job.0.inspect_config.0.limits.0.max_findings_per_request, inspect_job.0.inspect_config.0.limits.0.max_findings_per_info_type
                            Properties:
                                info_type:
                                    Type: TypeList
                                    Description: |-
                                        Type of information the findings limit applies to. Only one limit per infoType should be provided. If InfoTypeLimit does
                                        not have an infoType, the DLP API applies the limit against all infoTypes that are found but not
                                        specified in another InfoTypeLimit.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        name:
                                            Type: TypeString
                                            Description: |-
                                                Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                                at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                            Required: "true"
                                        sensitivity_score:
                                            Type: TypeList
                                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                score:
                                                    Type: TypeString
                                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                                    Required: "true"
                                        version:
                                            Type: TypeString
                                            Description: Version of the information type to use. By default, the version is set to stable
                                            Optional: "true"
                                max_findings:
                                    Type: TypeInt
                                    Description: Max findings limit for the given infoType.
                                    Optional: "true"
                        max_findings_per_item:
                            Type: TypeInt
                            Description: Max number of findings that will be returned for each item scanned. The maximum returned is 2000.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.inspect_config.0.limits.0.max_findings_per_item, inspect_job.0.inspect_config.0.limits.0.max_findings_per_request, inspect_job.0.inspect_config.0.limits.0.max_findings_per_info_type
                        max_findings_per_request:
                            Type: TypeInt
                            Description: Max number of findings that will be returned per request/job. The maximum returned is 2000.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.inspect_config.0.limits.0.max_findings_per_item, inspect_job.0.inspect_config.0.limits.0.max_findings_per_request, inspect_job.0.inspect_config.0.limits.0.max_findings_per_info_type
                min_likelihood:
                    Type: TypeString
                    Description: 'Only returns findings equal or above this threshold. See https://cloud.google.com/dlp/docs/likelihood for more info Default value: "POSSIBLE" Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]'
                    Optional: "true"
                rule_set:
                    Type: TypeList
                    Description: |-
                        Set of rules to apply to the findings for this InspectConfig. Exclusion rules, contained in the set are executed in the end,
                        other rules are executed in the order they are specified for each info type.
                    Optional: "true"
                    Properties:
                        info_types:
                            Type: TypeList
                            Description: List of infoTypes this rule set is applied to.
                            Optional: "true"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: |-
                                        Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                        at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                    Required: "true"
                                sensitivity_score:
                                    Type: TypeList
                                    Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        score:
                                            Type: TypeString
                                            Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                            Required: "true"
                                version:
                                    Type: TypeString
                                    Description: Version of the information type to use. By default, the version is set to stable.
                                    Optional: "true"
                        rules:
                            Type: TypeList
                            Description: Set of rules to be applied to infoTypes. The rules are applied in order.
                            Required: "true"
                            Properties:
                                exclusion_rule:
                                    Type: TypeList
                                    Description: The rule that specifies conditions when findings of infoTypes specified in InspectionRuleSet are removed from results.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        dictionary:
                                            Type: TypeList
                                            Description: Dictionary which defines the rule.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                cloud_storage_path:
                                                    Type: TypeList
                                                    Description: Newline-delimited file of words in Cloud Storage. Only a single file is accepted.
                                                    Optional: "true"
                                                    MaxItems: "1"
                                                    Properties:
                                                        path:
                                                            Type: TypeString
                                                            Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                                                            Required: "true"
                                                word_list:
                                                    Type: TypeList
                                                    Description: List of words or phrases to search for.
                                                    Optional: "true"
                                                    MaxItems: "1"
                                                    Properties:
                                                        words:
                                                            Type: TypeList
                                                            Description: |-
                                                                Words or phrases defining the dictionary. The dictionary must contain at least one
                                                                phrase and every phrase must contain at least 2 characters that are letters or digits.
                                                            Required: "true"
                                        exclude_by_hotword:
                                            Type: TypeList
                                            Description: Drop if the hotword rule is contained in the proximate context.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                hotword_regex:
                                                    Type: TypeList
                                                    Description: Regular expression pattern defining what qualifies as a hotword.
                                                    Optional: "true"
                                                    MaxItems: "1"
                                                    Properties:
                                                        group_indexes:
                                                            Type: TypeList
                                                            Description: |-
                                                                The index of the submatch to extract as findings. When not specified,
                                                                the entire match is returned. No more than 3 may be included.
                                                            Optional: "true"
                                                        pattern:
                                                            Type: TypeString
                                                            Description: |-
                                                                Pattern defining the regular expression. Its syntax
                                                                (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                                            Optional: "true"
                                                proximity:
                                                    Type: TypeList
                                                    Description: |-
                                                        Proximity of the finding within which the entire hotword must reside. The total length of the window cannot
                                                        exceed 1000 characters. Note that the finding itself will be included in the window, so that hotwords may be
                                                        used to match substrings of the finding itself. For example, the certainty of a phone number regex
                                                        '(\d{3}) \d{3}-\d{4}' could be adjusted upwards if the area code is known to be the local area code of a company
                                                        office using the hotword regex '(xxx)', where 'xxx' is the area code in question.
                                                    Optional: "true"
                                                    MaxItems: "1"
                                                    Properties:
                                                        window_after:
                                                            Type: TypeInt
                                                            Description: Number of characters after the finding to consider. Either this or window_before must be specified
                                                            Optional: "true"
                                                        window_before:
                                                            Type: TypeInt
                                                            Description: Number of characters before the finding to consider. Either this or window_after must be specified
                                                            Optional: "true"
                                        exclude_info_types:
                                            Type: TypeList
                                            Description: Set of infoTypes for which findings would affect this rule.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                info_types:
                                                    Type: TypeList
                                                    Description: If a finding is matched by any of the infoType detectors listed here, the finding will be excluded from the scan results.
                                                    Required: "true"
                                                    Properties:
                                                        name:
                                                            Type: TypeString
                                                            Description: |-
                                                                Name of the information type. Either a name of your choosing when creating a CustomInfoType, or one of the names listed
                                                                at https://cloud.google.com/dlp/docs/infotypes-reference when specifying a built-in type.
                                                            Required: "true"
                                                        sensitivity_score:
                                                            Type: TypeList
                                                            Description: Optional custom sensitivity for this InfoType. This only applies to data profiling.
                                                            Optional: "true"
                                                            MaxItems: "1"
                                                            Properties:
                                                                score:
                                                                    Type: TypeString
                                                                    Description: 'The sensitivity score applied to the resource. Possible values: ["SENSITIVITY_LOW", "SENSITIVITY_MODERATE", "SENSITIVITY_HIGH"]'
                                                                    Required: "true"
                                                        version:
                                                            Type: TypeString
                                                            Description: Version of the information type to use. By default, the version is set to stable.
                                                            Optional: "true"
                                        matching_type:
                                            Type: TypeString
                                            Description: 'How the rule is applied. See the documentation for more information: https://cloud.google.com/dlp/docs/reference/rest/v2/InspectConfig#MatchingType Possible values: ["MATCHING_TYPE_FULL_MATCH", "MATCHING_TYPE_PARTIAL_MATCH", "MATCHING_TYPE_INVERSE_MATCH"]'
                                            Required: "true"
                                        regex:
                                            Type: TypeList
                                            Description: Regular expression which defines the rule.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                group_indexes:
                                                    Type: TypeList
                                                    Description: The index of the submatch to extract as findings. When not specified, the entire match is returned. No more than 3 may be included.
                                                    Optional: "true"
                                                pattern:
                                                    Type: TypeString
                                                    Description: |-
                                                        Pattern defining the regular expression.
                                                        Its syntax (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                                    Required: "true"
                                hotword_rule:
                                    Type: TypeList
                                    Description: Hotword-based detection rule.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        hotword_regex:
                                            Type: TypeList
                                            Description: Regular expression pattern defining what qualifies as a hotword.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                group_indexes:
                                                    Type: TypeList
                                                    Description: |-
                                                        The index of the submatch to extract as findings. When not specified,
                                                        the entire match is returned. No more than 3 may be included.
                                                    Optional: "true"
                                                pattern:
                                                    Type: TypeString
                                                    Description: |-
                                                        Pattern defining the regular expression. Its syntax
                                                        (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
                                                    Optional: "true"
                                        likelihood_adjustment:
                                            Type: TypeList
                                            Description: Likelihood adjustment to apply to all matching findings.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                fixed_likelihood:
                                                    Type: TypeString
                                                    Description: 'Set the likelihood of a finding to a fixed value. Either this or relative_likelihood can be set. Possible values: ["VERY_UNLIKELY", "UNLIKELY", "POSSIBLE", "LIKELY", "VERY_LIKELY"]'
                                                    Optional: "true"
                                                relative_likelihood:
                                                    Type: TypeInt
                                                    Description: |-
                                                        Increase or decrease the likelihood by the specified number of levels. For example,
                                                        if a finding would be POSSIBLE without the detection rule and relativeLikelihood is 1,
                                                        then it is upgraded to LIKELY, while a value of -1 would downgrade it to UNLIKELY.
                                                        Likelihood may never drop below VERY_UNLIKELY or exceed VERY_LIKELY, so applying an
                                                        adjustment of 1 followed by an adjustment of -1 when base likelihood is VERY_LIKELY
                                                        will result in a final likelihood of LIKELY. Either this or fixed_likelihood can be set.
                                                    Optional: "true"
                                        proximity:
                                            Type: TypeList
                                            Description: |-
                                                Proximity of the finding within which the entire hotword must reside. The total length of the window cannot
                                                exceed 1000 characters. Note that the finding itself will be included in the window, so that hotwords may be
                                                used to match substrings of the finding itself. For example, the certainty of a phone number regex
                                                '(\d{3}) \d{3}-\d{4}' could be adjusted upwards if the area code is known to be the local area code of a company
                                                office using the hotword regex '(xxx)', where 'xxx' is the area code in question.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                window_after:
                                                    Type: TypeInt
                                                    Description: Number of characters after the finding to consider. Either this or window_before must be specified
                                                    Optional: "true"
                                                window_before:
                                                    Type: TypeInt
                                                    Description: Number of characters before the finding to consider. Either this or window_after must be specified
                                                    Optional: "true"
        inspect_template_name:
            Type: TypeString
            Description: The name of the template to run when this job is triggered.
            Optional: "true"
        storage_config:
            Type: TypeList
            Description: Information on where to inspect
            Required: "true"
            MaxItems: "1"
            Properties:
                big_query_options:
                    Type: TypeList
                    Description: Options defining BigQuery table and row identifiers.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        excluded_fields:
                            Type: TypeList
                            Description: |-
                                References to fields excluded from scanning.
                                This allows you to skip inspection of entire columns which you know have no findings.
                            Optional: "true"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: Name describing the field excluded from scanning.
                                    Required: "true"
                        identifying_fields:
                            Type: TypeList
                            Description: |-
                                Specifies the BigQuery fields that will be returned with findings.
                                If not specified, no identifying fields will be returned for findings.
                            Optional: "true"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: Name of a BigQuery field to be returned with the findings.
                                    Required: "true"
                        included_fields:
                            Type: TypeList
                            Description: Limit scanning only to these fields.
                            Optional: "true"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: Name describing the field to which scanning is limited.
                                    Required: "true"
                        rows_limit:
                            Type: TypeInt
                            Description: |-
                                Max number of rows to scan. If the table has more rows than this value, the rest of the rows are omitted.
                                If not set, or if set to 0, all rows will be scanned. Only one of rowsLimit and rowsLimitPercent can be
                                specified. Cannot be used in conjunction with TimespanConfig.
                            Optional: "true"
                        rows_limit_percent:
                            Type: TypeInt
                            Description: |-
                                Max percentage of rows to scan. The rest are omitted. The number of rows scanned is rounded down.
                                Must be between 0 and 100, inclusively. Both 0 and 100 means no limit. Defaults to 0. Only one of
                                rowsLimit and rowsLimitPercent can be specified. Cannot be used in conjunction with TimespanConfig.
                            Optional: "true"
                        sample_method:
                            Type: TypeString
                            Description: |-
                                How to sample rows if not all rows are scanned. Meaningful only when used in conjunction with either
                                rowsLimit or rowsLimitPercent. If not specified, rows are scanned in the order BigQuery reads them. Default value: "TOP" Possible values: ["TOP", "RANDOM_START"]
                            Optional: "true"
                        table_reference:
                            Type: TypeList
                            Description: Set of files to scan.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                dataset_id:
                                    Type: TypeString
                                    Description: The dataset ID of the table.
                                    Required: "true"
                                project_id:
                                    Type: TypeString
                                    Description: The Google Cloud Platform project ID of the project containing the table.
                                    Required: "true"
                                table_id:
                                    Type: TypeString
                                    Description: The name of the table.
                                    Required: "true"
                cloud_storage_options:
                    Type: TypeList
                    Description: Options defining a file or a set of files within a Google Cloud Storage bucket.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        bytes_limit_per_file:
                            Type: TypeInt
                            Description: |-
                                Max number of bytes to scan from a file. If a scanned file's size is bigger than this value
                                then the rest of the bytes are omitted.
                            Optional: "true"
                        bytes_limit_per_file_percent:
                            Type: TypeInt
                            Description: |-
                                Max percentage of bytes to scan from a file. The rest are omitted. The number of bytes scanned is rounded down.
                                Must be between 0 and 100, inclusively. Both 0 and 100 means no limit.
                            Optional: "true"
                        file_set:
                            Type: TypeList
                            Description: Set of files to scan.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                regex_file_set:
                                    Type: TypeList
                                    Description: The regex-filtered set of files to scan.
                                    Optional: "true"
                                    ExactlyOneOf: inspect_job.0.storage_config.0.cloud_storage_options.0.file_set.0.url, inspect_job.0.storage_config.0.cloud_storage_options.0.file_set.0.regex_file_set
                                    MaxItems: "1"
                                    Properties:
                                        bucket_name:
                                            Type: TypeString
                                            Description: The name of a Cloud Storage bucket.
                                            Required: "true"
                                        exclude_regex:
                                            Type: TypeList
                                            Description: |-
                                                A list of regular expressions matching file paths to exclude. All files in the bucket that match at
                                                least one of these regular expressions will be excluded from the scan.
                                            Optional: "true"
                                        include_regex:
                                            Type: TypeList
                                            Description: |-
                                                A list of regular expressions matching file paths to include. All files in the bucket
                                                that match at least one of these regular expressions will be included in the set of files,
                                                except for those that also match an item in excludeRegex. Leaving this field empty will
                                                match all files by default (this is equivalent to including .* in the list)
                                            Optional: "true"
                                url:
                                    Type: TypeString
                                    Description: |-
                                        The Cloud Storage url of the file(s) to scan, in the format 'gs://<bucket>/<path>'. Trailing wildcard
                                        in the path is allowed.

                                        If the url ends in a trailing slash, the bucket or directory represented by the url will be scanned
                                        non-recursively (content in sub-directories will not be scanned). This means that 'gs://mybucket/' is
                                        equivalent to 'gs://mybucket/*', and 'gs://mybucket/directory/' is equivalent to 'gs://mybucket/directory/*'.
                                    Optional: "true"
                                    ExactlyOneOf: inspect_job.0.storage_config.0.cloud_storage_options.0.file_set.0.url, inspect_job.0.storage_config.0.cloud_storage_options.0.file_set.0.regex_file_set
                        file_types:
                            Type: TypeList
                            Description: |-
                                List of file type groups to include in the scan. If empty, all files are scanned and available data
                                format processors are applied. In addition, the binary content of the selected files is always scanned as well.
                                Images are scanned only as binary if the specified region does not support image inspection and no fileTypes were specified. Possible values: ["BINARY_FILE", "TEXT_FILE", "IMAGE", "WORD", "PDF", "AVRO", "CSV", "TSV", "POWERPOINT", "EXCEL"]
                            Optional: "true"
                        files_limit_percent:
                            Type: TypeInt
                            Description: |-
                                Limits the number of files to scan to this percentage of the input FileSet. Number of files scanned is rounded down.
                                Must be between 0 and 100, inclusively. Both 0 and 100 means no limit.
                            Optional: "true"
                        sample_method:
                            Type: TypeString
                            Description: |-
                                How to sample bytes if not all bytes are scanned. Meaningful only when used in conjunction with bytesLimitPerFile.
                                If not specified, scanning would start from the top. Possible values: ["TOP", "RANDOM_START"]
                            Optional: "true"
                datastore_options:
                    Type: TypeList
                    Description: Options defining a data set within Google Cloud Datastore.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        kind:
                            Type: TypeList
                            Description: A representation of a Datastore kind.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: The name of the Datastore kind.
                                    Required: "true"
                        partition_id:
                            Type: TypeList
                            Description: |-
                                Datastore partition ID. A partition ID identifies a grouping of entities. The grouping
                                is always by project and namespace, however the namespace ID may be empty.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                namespace_id:
                                    Type: TypeString
                                    Description: If not empty, the ID of the namespace to which the entities belong.
                                    Optional: "true"
                                project_id:
                                    Type: TypeString
                                    Description: The ID of the project to which the entities belong.
                                    Required: "true"
                hybrid_options:
                    Type: TypeList
                    Description: Configuration to control jobs where the content being inspected is outside of Google Cloud Platform.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        description:
                            Type: TypeString
                            Description: A short description of where the data is coming from. Will be stored once in the job. 256 max length.
                            Optional: "true"
                        labels:
                            Type: TypeMap
                            Description: |-
                                To organize findings, these labels will be added to each finding.

                                Label keys must be between 1 and 63 characters long and must conform to the following regular expression: '[a-z]([-a-z0-9]*[a-z0-9])?'.

                                Label values must be between 0 and 63 characters long and must conform to the regular expression '([a-z]([-a-z0-9]*[a-z0-9])?)?'.

                                No more than 10 labels can be associated with a given finding.

                                Examples:
                                * '"environment" : "production"'
                                * '"pipeline" : "etl"'
                            Optional: "true"
                        required_finding_label_keys:
                            Type: TypeList
                            Description: |-
                                These are labels that each inspection request must include within their 'finding_labels' map. Request
                                may contain others, but any missing one of these will be rejected.

                                Label keys must be between 1 and 63 characters long and must conform to the following regular expression: '[a-z]([-a-z0-9]*[a-z0-9])?'.

                                No more than 10 keys can be required.
                            Optional: "true"
                        table_options:
                            Type: TypeList
                            Description: If the container is a table, additional information to make findings meaningful such as the columns that are primary keys.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                identifying_fields:
                                    Type: TypeList
                                    Description: |-
                                        The columns that are the primary keys for table objects included in ContentItem. A copy of this
                                        cell's value will stored alongside alongside each finding so that the finding can be traced to
                                        the specific row it came from. No more than 3 may be provided.
                                    Optional: "true"
                                    Properties:
                                        name:
                                            Type: TypeString
                                            Description: Name describing the field.
                                            Required: "true"
                timespan_config:
                    Type: TypeList
                    Description: Configuration of the timespan of the items to include in scanning
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        enable_auto_population_of_timespan_config:
                            Type: TypeBool
                            Description: |-
                                When the job is started by a JobTrigger we will automatically figure out a valid startTime to avoid
                                scanning files that have not been modified since the last time the JobTrigger executed. This will
                                be based on the time of the execution of the last run of the JobTrigger or the timespan endTime
                                used in the last run of the JobTrigger.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.storage_config.0.timespan_config.0.start_time, inspect_job.0.storage_config.0.timespan_config.0.end_time, inspect_job.0.storage_config.0.timespan_config.0.enable_auto_population_of_timespan_config
                            ConflictsWith: inspect_job.0.storage_config.0.timespan_config.0.start_time
                        end_time:
                            Type: TypeString
                            Description: Exclude files, tables, or rows newer than this value. If not set, no upper time limit is applied.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.storage_config.0.timespan_config.0.start_time, inspect_job.0.storage_config.0.timespan_config.0.end_time, inspect_job.0.storage_config.0.timespan_config.0.enable_auto_population_of_timespan_config
                        start_time:
                            Type: TypeString
                            Description: Exclude files, tables, or rows older than this value. If not set, no lower time limit is applied.
                            Optional: "true"
                            AtLeastOneOf: inspect_job.0.storage_config.0.timespan_config.0.start_time, inspect_job.0.storage_config.0.timespan_config.0.end_time, inspect_job.0.storage_config.0.timespan_config.0.enable_auto_population_of_timespan_config
                            ConflictsWith: inspect_job.0.storage_config.0.timespan_config.0.enable_auto_population_of_timespan_config
                        timestamp_field:
                            Type: TypeList
                            Description: Specification of the field containing the timestamp of scanned items.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                name:
                                    Type: TypeString
                                    Description: |-
                                        Specification of the field containing the timestamp of scanned items. Used for data sources like Datastore and BigQuery.

                                        For BigQuery: Required to filter out rows based on the given start and end times. If not specified and the table was
                                        modified between the given start and end times, the entire table will be scanned. The valid data types of the timestamp
                                        field are: INTEGER, DATE, TIMESTAMP, or DATETIME BigQuery column.

                                        For Datastore. Valid data types of the timestamp field are: TIMESTAMP. Datastore entity will be scanned if the
                                        timestamp property does not exist or its value is empty or invalid.
                                    Required: "true"
last_run_time:
    Type: TypeString
    Description: The timestamp of the last time this trigger executed.
    Computed: "true"
name:
    Type: TypeString
    Description: The resource name of the job trigger. Set by the server.
    Computed: "true"
parent:
    Type: TypeString
    Description: |-
        The parent of the trigger, either in the format 'projects/{{project}}'
        or 'projects/{{project}}/locations/{{location}}'
    Required: "true"
status:
    Type: TypeString
    Description: 'Whether the trigger is currently active. Default value: "HEALTHY" Possible values: ["PAUSED", "HEALTHY", "CANCELLED"]'
    Optional: "true"
trigger_id:
    Type: TypeString
    Description: |-
        The trigger id can contain uppercase and lowercase letters, numbers, and hyphens;
        that is, it must match the regular expression: [a-zA-Z\d-_]+.
        The maximum length is 100 characters. Can be empty to allow the system to generate one.
    Computed: "true"
    Optional: "true"
triggers:
    Type: TypeList
    Description: What event needs to occur for a new job to be started.
    Required: "true"
    Properties:
        manual:
            Type: TypeList
            Description: For use with hybrid jobs. Jobs must be manually created and finished.
            Optional: "true"
            MaxItems: "1"
            Properties: {}
        schedule:
            Type: TypeList
            Description: Schedule for triggered jobs
            Optional: "true"
            MaxItems: "1"
            Properties:
                recurrence_period_duration:
                    Type: TypeString
                    Description: |-
                        With this option a job is started a regular periodic basis. For example: every day (86400 seconds).

                        A scheduled start time will be skipped if the previous execution has not ended when its scheduled time occurs.

                        This value must be set to a time duration greater than or equal to 1 day and can be no longer than 60 days.

                        A duration in seconds with up to nine fractional digits, terminated by 's'. Example: "3.5s".
                    Optional: "true"
update_time:
    Type: TypeString
    Description: The last update timestamp of an inspectTemplate. Set by the server.
    Computed: "true"

