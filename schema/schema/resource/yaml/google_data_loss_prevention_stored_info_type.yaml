description:
    Type: TypeString
    Description: A description of the info type.
    Optional: "true"
dictionary:
    Type: TypeList
    Description: Dictionary which defines the rule.
    Optional: "true"
    ExactlyOneOf: dictionary, regex, large_custom_dictionary
    MaxItems: "1"
    Properties:
        cloud_storage_path:
            Type: TypeList
            Description: Newline-delimited file of words in Cloud Storage. Only a single file is accepted.
            Optional: "true"
            ExactlyOneOf: dictionary.0.word_list, dictionary.0.cloud_storage_path
            MaxItems: "1"
            Properties:
                path:
                    Type: TypeString
                    Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                    Required: "true"
        word_list:
            Type: TypeList
            Description: List of words or phrases to search for.
            Optional: "true"
            ExactlyOneOf: dictionary.0.word_list, dictionary.0.cloud_storage_path
            MaxItems: "1"
            Properties:
                words:
                    Type: TypeList
                    Description: |-
                        Words or phrases defining the dictionary. The dictionary must contain at least one
                        phrase and every phrase must contain at least 2 characters that are letters or digits.
                    Required: "true"
display_name:
    Type: TypeString
    Description: User set display name of the info type.
    Optional: "true"
large_custom_dictionary:
    Type: TypeList
    Description: Dictionary which defines the rule.
    Optional: "true"
    ExactlyOneOf: dictionary, regex, large_custom_dictionary
    MaxItems: "1"
    Properties:
        big_query_field:
            Type: TypeList
            Description: Field in a BigQuery table where each cell represents a dictionary phrase.
            Optional: "true"
            ExactlyOneOf: large_custom_dictionary.0.cloud_storage_file_set, large_custom_dictionary.0.big_query_field
            MaxItems: "1"
            Properties:
                field:
                    Type: TypeList
                    Description: Designated field in the BigQuery table.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        name:
                            Type: TypeString
                            Description: Name describing the field.
                            Required: "true"
                table:
                    Type: TypeList
                    Description: Field in a BigQuery table where each cell represents a dictionary phrase.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        dataset_id:
                            Type: TypeString
                            Description: The dataset ID of the table.
                            Required: "true"
                        project_id:
                            Type: TypeString
                            Description: The Google Cloud Platform project ID of the project containing the table.
                            Required: "true"
                        table_id:
                            Type: TypeString
                            Description: The name of the table.
                            Required: "true"
        cloud_storage_file_set:
            Type: TypeList
            Description: Set of files containing newline-delimited lists of dictionary phrases.
            Optional: "true"
            ExactlyOneOf: large_custom_dictionary.0.cloud_storage_file_set, large_custom_dictionary.0.big_query_field
            MaxItems: "1"
            Properties:
                url:
                    Type: TypeString
                    Description: The url, in the format 'gs://<bucket>/<path>'. Trailing wildcard in the path is allowed.
                    Required: "true"
        output_path:
            Type: TypeList
            Description: |-
                Location to store dictionary artifacts in Google Cloud Storage. These files will only be accessible by project owners and the DLP API.
                If any of these artifacts are modified, the dictionary is considered invalid and can no longer be used.
            Required: "true"
            MaxItems: "1"
            Properties:
                path:
                    Type: TypeString
                    Description: 'A url representing a file or path (no wildcards) in Cloud Storage. Example: ''gs://[BUCKET_NAME]/dictionary.txt'''
                    Required: "true"
name:
    Type: TypeString
    Description: The resource name of the info type. Set by the server.
    Computed: "true"
parent:
    Type: TypeString
    Description: |-
        The parent of the info type in any of the following formats:

        * 'projects/{{project}}'
        * 'projects/{{project}}/locations/{{location}}'
        * 'organizations/{{organization_id}}'
        * 'organizations/{{organization_id}}/locations/{{location}}'
    Required: "true"
regex:
    Type: TypeList
    Description: Regular expression which defines the rule.
    Optional: "true"
    ExactlyOneOf: dictionary, regex, large_custom_dictionary
    MaxItems: "1"
    Properties:
        group_indexes:
            Type: TypeList
            Description: The index of the submatch to extract as findings. When not specified, the entire match is returned. No more than 3 may be included.
            Optional: "true"
        pattern:
            Type: TypeString
            Description: |-
                Pattern defining the regular expression.
                Its syntax (https://github.com/google/re2/wiki/Syntax) can be found under the google/re2 repository on GitHub.
            Required: "true"
stored_info_type_id:
    Type: TypeString
    Description: |-
        The storedInfoType ID can contain uppercase and lowercase letters, numbers, and hyphens;
        that is, it must match the regular expression: [a-zA-Z\d-_]+. The maximum length is 100
        characters. Can be empty to allow the system to generate one.
    Computed: "true"
    Optional: "true"

