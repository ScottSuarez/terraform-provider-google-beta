                            Type: TypeString
                            Description: Database name.
                            Required: "true"
backfill_none:
    Type: TypeList
    Description: Backfill strategy to disable automatic backfill for the Stream's objects.
    Optional: "true"
    ExactlyOneOf: backfill_all, backfill_none
    MaxItems: "1"
    Properties: {}
customer_managed_encryption_key:
    Type: TypeString
    Description: |-
        A reference to a KMS encryption key. If provided, it will be used to encrypt the data. If left blank, data
        will be encrypted using an internal Stream-specific encryption key provisioned through KMS.
    Optional: "true"
desired_state:
    Type: TypeString
    Description: Desired state of the Stream. Set this field to 'RUNNING' to start the stream, and 'PAUSED' to pause the stream.
    Optional: "true"
destination_config:
    Type: TypeList
    Description: Destination connection profile configuration.
    Required: "true"
    MaxItems: "1"
    Properties:
        bigquery_destination_config:
            Type: TypeList
            Description: A configuration for how data should be loaded to Cloud Storage.
            Optional: "true"
            ExactlyOneOf: destination_config.0.gcs_destination_config, destination_config.0.bigquery_destination_config
            MaxItems: "1"
            Properties:
                data_freshness:
                    Type: TypeString
                    Description: |-
                        The guaranteed data freshness (in seconds) when querying tables created by the stream.
                        Editing this field will only affect new tables created in the future, but existing tables
                        will not be impacted. Lower values mean that queries will return fresher data, but may result in higher cost.
                        A duration in seconds with up to nine fractional digits, terminated by 's'. Example: "3.5s". Defaults to 900s.
                    Optional: "true"
                single_target_dataset:
                    Type: TypeList
                    Description: A single target dataset to which all data will be streamed.
                    Optional: "true"
                    ExactlyOneOf: destination_config.0.bigquery_destination_config.0.single_target_dataset, destination_config.0.bigquery_destination_config.0.source_hierarchy_datasets
                    MaxItems: "1"
                    Properties:
                        dataset_id:
                            Type: TypeString
                            Description: |-
                                Dataset ID in the format projects/{project}/datasets/{dataset_id} or
                                {project}:{dataset_id}
                            Required: "true"
                source_hierarchy_datasets:
                    Type: TypeList
                    Description: Destination datasets are created so that hierarchy of the destination data objects matches the source hierarchy.
                    Optional: "true"
                    ExactlyOneOf: destination_config.0.bigquery_destination_config.0.single_target_dataset, destination_config.0.bigquery_destination_config.0.source_hierarchy_datasets
                    MaxItems: "1"
                    Properties:
                        dataset_template:
                            Type: TypeList
                            Description: Dataset template used for dynamic dataset creation.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                dataset_id_prefix:
                                    Type: TypeString
                                    Description: |-
                                        If supplied, every created dataset will have its name prefixed by the provided value.
                                        The prefix and name will be separated by an underscore. i.e. _.
                                    Optional: "true"
                                kms_key_name:
                                    Type: TypeString
                                    Description: |-
                                        Describes the Cloud KMS encryption key that will be used to protect destination BigQuery
                                        table. The BigQuery Service Account associated with your project requires access to this
                                        encryption key. i.e. projects/{project}/locations/{location}/keyRings/{key_ring}/cryptoKeys/{cryptoKey}.
                                        See https://cloud.google.com/bigquery/docs/customer-managed-encryption for more information.
                                    Optional: "true"
                                location:
                                    Type: TypeString
                                    Description: |-
                                        The geographic location where the dataset should reside.
                                        See https://cloud.google.com/bigquery/docs/locations for supported locations.
                                    Required: "true"
        destination_connection_profile:
            Type: TypeString
            Description: 'Destination connection profile resource. Format: projects/{project}/locations/{location}/connectionProfiles/{name}'
            Required: "true"
        gcs_destination_config:
            Type: TypeList
            Description: A configuration for how data should be loaded to Cloud Storage.
            Optional: "true"
            ExactlyOneOf: destination_config.0.gcs_destination_config, destination_config.0.bigquery_destination_config
            MaxItems: "1"
            Properties:
                avro_file_format:
                    Type: TypeList
                    Description: AVRO file format configuration.
                    Optional: "true"
                    ExactlyOneOf: destination_config.0.gcs_destination_config.0.avro_file_format, destination_config.0.gcs_destination_config.0.json_file_format
                    MaxItems: "1"
                    Properties: {}
                file_rotation_interval:
                    Type: TypeString
                    Description: |-
                        The maximum duration for which new events are added before a file is closed and a new file is created.
                        A duration in seconds with up to nine fractional digits, terminated by 's'. Example: "3.5s". Defaults to 900s.
                    Computed: "true"
                    Optional: "true"
                file_rotation_mb:
                    Type: TypeInt
                    Description: The maximum file size to be saved in the bucket.
                    Computed: "true"
                    Optional: "true"
                json_file_format:
                    Type: TypeList
                    Description: JSON file format configuration.
                    Optional: "true"
                    ExactlyOneOf: destination_config.0.gcs_destination_config.0.avro_file_format, destination_config.0.gcs_destination_config.0.json_file_format
                    MaxItems: "1"
                    Properties:
                        compression:
                            Type: TypeString
                            Description: 'Compression of the loaded JSON file. Possible values: ["NO_COMPRESSION", "GZIP"]'
                            Optional: "true"
                        schema_file_format:
                            Type: TypeString
                            Description: 'The schema file format along JSON data files. Possible values: ["NO_SCHEMA_FILE", "AVRO_SCHEMA_FILE"]'
                            Optional: "true"
                path:
                    Type: TypeString
                    Description: Path inside the Cloud Storage bucket to write data to.
                    Optional: "true"
