                                            MinItems: "1"
                                            Properties:
                                                column:
                                                    Type: TypeString
                                                    Description: Column name.
                                                    Optional: "true"
                                                data_type:
                                                    Type: TypeString
                                                    Description: |-
                                                        The PostgreSQL data type. Full data types list can be found here:
                                                        https://www.postgresql.org/docs/current/datatype.html
                                                    Optional: "true"
                                                length:
                                                    Type: TypeInt
                                                    Description: Column length.
                                                    Computed: "true"
                                                nullable:
                                                    Type: TypeBool
                                                    Description: Whether or not the column can accept a null value.
                                                    Optional: "true"
                                                ordinal_position:
                                                    Type: TypeInt
                                                    Description: The ordinal position of the column in the table.
                                                    Optional: "true"
                                                precision:
                                                    Type: TypeInt
                                                    Description: Column precision.
                                                    Computed: "true"
                                                primary_key:
                                                    Type: TypeBool
                                                    Description: Whether or not the column represents a primary key.
                                                    Optional: "true"
                                                scale:
                                                    Type: TypeInt
                                                    Description: Column scale.
                                                    Computed: "true"
                                        table:
                                            Type: TypeString
                                            Description: Table name.
                                            Required: "true"
                                schema:
                                    Type: TypeString
                                    Description: Database name.
                                    Required: "true"
                max_concurrent_backfill_tasks:
                    Type: TypeInt
                    Description: |-
                        Maximum number of concurrent backfill tasks. The number should be non
                        negative. If not set (or set to 0), the system's default value will be used.
                    Computed: "true"
                    Optional: "true"
                publication:
                    Type: TypeString
                    Description: |-
                        The name of the publication that includes the set of all tables
                        that are defined in the stream's include_objects.
                    Required: "true"
                replication_slot:
                    Type: TypeString
                    Description: |-
                        The name of the logical replication slot that's configured with
                        the pgoutput plugin.
                    Required: "true"
        source_connection_profile:
            Type: TypeString
            Description: 'Source connection profile resource. Format: projects/{project}/locations/{location}/connectionProfiles/{name}'
            Required: "true"
state:
    Type: TypeString
    Description: The state of the stream.
    Computed: "true"
stream_id:
    Type: TypeString
    Description: The stream identifier.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"

