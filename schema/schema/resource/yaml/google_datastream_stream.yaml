backfill_all:
    Type: TypeList
    Description: Backfill strategy to automatically backfill the Stream's objects. Specific objects can be excluded.
    Optional: "true"
    ExactlyOneOf: backfill_all, backfill_none
    MaxItems: "1"
    Properties:
        mysql_excluded_objects:
            Type: TypeList
            Description: MySQL data source objects to avoid backfilling.
            Optional: "true"
            MaxItems: "1"
            Properties:
                mysql_databases:
                    Type: TypeList
                    Description: MySQL databases on the server
                    Required: "true"
                    MinItems: "1"
                    Properties:
                        database:
                            Type: TypeString
                            Description: Database name.
                            Required: "true"
                        mysql_tables:
                            Type: TypeList
                            Description: Tables in the database.
                            Optional: "true"
                            MinItems: "1"
                            Properties:
                                mysql_columns:
                                    Type: TypeList
                                    Description: MySQL columns in the schema. When unspecified as part of include/exclude objects, includes/excludes everything.
                                    Optional: "true"
                                    MinItems: "1"
                                    Properties:
                                        collation:
                                            Type: TypeString
                                            Description: Column collation.
                                            Optional: "true"
                                        column:
                                            Type: TypeString
                                            Description: Column name.
                                            Optional: "true"
                                        data_type:
                                            Type: TypeString
                                            Description: |-
                                                The MySQL data type. Full data types list can be found here:
                                                https://dev.mysql.com/doc/refman/8.0/en/data-types.html
                                            Optional: "true"
                                        length:
                                            Type: TypeInt
                                            Description: Column length.
                                            Computed: "true"
                                        nullable:
                                            Type: TypeBool
                                            Description: Whether or not the column can accept a null value.
                                            Optional: "true"
                                        ordinal_position:
                                            Type: TypeInt
                                            Description: The ordinal position of the column in the table.
                                            Optional: "true"
                                        primary_key:
                                            Type: TypeBool
                                            Description: Whether or not the column represents a primary key.
                                            Optional: "true"
                                table:
                                    Type: TypeString
                                    Description: Table name.
                                    Required: "true"
        oracle_excluded_objects:
            Type: TypeList
            Description: PostgreSQL data source objects to avoid backfilling.
            Optional: "true"
            MaxItems: "1"
            Properties:
                oracle_schemas:
                    Type: TypeList
                    Description: Oracle schemas/databases in the database server
                    Required: "true"
                    MinItems: "1"
                    Properties:
                        oracle_tables:
                            Type: TypeList
                            Description: Tables in the database.
                            Optional: "true"
                            MinItems: "1"
                            Properties:
                                oracle_columns:
                                    Type: TypeList
                                    Description: Oracle columns in the schema. When unspecified as part of include/exclude objects, includes/excludes everything.
                                    Optional: "true"
                                    MinItems: "1"
                                    Properties:
                                        column:
                                            Type: TypeString
                                            Description: Column name.
                                            Optional: "true"
                                        data_type:
                                            Type: TypeString
                                            Description: |-
                                                The Oracle data type. Full data types list can be found here:
                                                https://docs.oracle.com/en/database/oracle/oracle-database/21/sqlrf/Data-Types.html
                                            Optional: "true"
                                        encoding:
                                            Type: TypeString
                                            Description: Column encoding.
                                            Computed: "true"
                                        length:
                                            Type: TypeInt
                                            Description: Column length.
                                            Computed: "true"
                                        nullable:
                                            Type: TypeBool
                                            Description: Whether or not the column can accept a null value.
                                            Computed: "true"
                                        ordinal_position:
                                            Type: TypeInt
                                            Description: The ordinal position of the column in the table.
                                            Computed: "true"
                                        precision:
                                            Type: TypeInt
                                            Description: Column precision.
                                            Computed: "true"
                                        primary_key:
                                            Type: TypeBool
                                            Description: Whether or not the column represents a primary key.
                                            Computed: "true"
                                        scale:
                                            Type: TypeInt
                                            Description: Column scale.
                                            Computed: "true"
                                table:
                                    Type: TypeString
                                    Description: Table name.
                                    Required: "true"
                        schema:
                            Type: TypeString
                            Description: Schema name.
                            Required: "true"
        postgresql_excluded_objects:
            Type: TypeList
            Description: PostgreSQL data source objects to avoid backfilling.
            Optional: "true"
            MaxItems: "1"
            Properties:
                postgresql_schemas:
                    Type: TypeList
                    Description: PostgreSQL schemas on the server
                    Required: "true"
                    MinItems: "1"
                    Properties:
                        postgresql_tables:
                            Type: TypeList
                            Description: Tables in the schema.
                            Optional: "true"
                            MinItems: "1"
                            Properties:
                                postgresql_columns:
                                    Type: TypeList
                                    Description: PostgreSQL columns in the schema. When unspecified as part of include/exclude objects, includes/excludes everything.
                                    Optional: "true"
                                    MinItems: "1"
