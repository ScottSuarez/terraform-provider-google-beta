create_policy:
    Type: TypeString
    Description: |-
        Set the policy to use for creating new resources. Only used on
        create and update. Valid values are 'CREATE_OR_ACQUIRE' (default) or
        'ACQUIRE'. If set to 'ACQUIRE' and resources do not already exist,
        the deployment will fail. Note that updating this field does not
        actually affect the deployment, just how it is updated. Default value: "CREATE_OR_ACQUIRE" Possible values: ["ACQUIRE", "CREATE_OR_ACQUIRE"]
    Optional: "true"
delete_policy:
    Type: TypeString
    Description: |-
        Set the policy to use for deleting new resources on update/delete.
        Valid values are 'DELETE' (default) or 'ABANDON'. If 'DELETE',
        resource is deleted after removal from Deployment Manager. If
        'ABANDON', the resource is only removed from Deployment Manager
        and is not actually deleted. Note that updating this field does not
        actually change the deployment, just how it is updated. Default value: "DELETE" Possible values: ["ABANDON", "DELETE"]
    Optional: "true"
deployment_id:
    Type: TypeString
    Description: Unique identifier for deployment. Output only.
    Computed: "true"
description:
    Type: TypeString
    Description: Optional user-provided description of deployment.
    Optional: "true"
labels:
    Type: TypeSet
    Description: Key-value pairs to apply to this labels.
    Optional: "true"
    Properties:
        key:
            Type: TypeString
            Description: Key for label.
            Optional: "true"
        value:
            Type: TypeString
            Description: Value of label.
            Optional: "true"
manifest:
    Type: TypeString
    Description: |-
        Output only. URL of the manifest representing the last manifest that
        was successfully deployed.
    Computed: "true"
name:
    Type: TypeString
    Description: Unique name for the deployment
    Required: "true"
preview:
    Type: TypeBool
    Description: |-
        If set to true, a deployment is created with "shell" resources
        that are not actually instantiated. This allows you to preview a
        deployment. It can be updated to false to actually deploy
        with real resources.
         ~>**NOTE:** Deployment Manager does not allow update
        of a deployment in preview (unless updating to preview=false). Thus,
        Terraform will force-recreate deployments if either preview is updated
        to true or if other fields are updated while preview is true.
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
self_link:
    Type: TypeString
    Description: Output only. Server defined URL for the resource.
    Computed: "true"
target:
    Type: TypeList
    Description: |-
        Parameters that define your deployment, including the deployment
        configuration and relevant templates.
    Required: "true"
    MaxItems: "1"
    Properties:
        config:
            Type: TypeList
            Description: The root configuration file to use for this deployment.
            Required: "true"
            MaxItems: "1"
            Properties:
                content:
                    Type: TypeString
                    Description: The full YAML contents of your configuration file.
                    Required: "true"
        imports:
            Type: TypeList
            Description: |-
                Specifies import files for this configuration. This can be
                used to import templates or other files. For example, you might
                import a text file in order to use the file in a template.
            Optional: "true"
            Properties:
                content:
                    Type: TypeString
                    Description: The full contents of the template that you want to import.
                    Optional: "true"
                name:
                    Type: TypeString
                    Description: |-
                        The name of the template to import, as declared in the YAML
                        configuration.
                    Optional: "true"

