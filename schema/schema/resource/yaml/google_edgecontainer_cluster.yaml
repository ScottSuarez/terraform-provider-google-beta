authorization:
    Type: TypeList
    Description: RBAC policy that will be applied and managed by GEC.
    Required: "true"
    MaxItems: "1"
    Properties:
        admin_users:
            Type: TypeList
            Description: |-
                User that will be granted the cluster-admin role on the cluster, providing
                full access to the cluster. Currently, this is a singular field, but will
                be expanded to allow multiple admins in the future.
            Required: "true"
            MaxItems: "1"
            Properties:
                username:
                    Type: TypeString
                    Description: An active Google username.
                    Required: "true"
cluster_ca_certificate:
    Type: TypeString
    Description: The PEM-encoded public certificate of the cluster's CA.
    Computed: "true"
control_plane:
    Type: TypeList
    Description: The configuration of the cluster control plane.
    Optional: "true"
    MaxItems: "1"
    Properties:
        local:
            Type: TypeList
            Description: Local control plane configuration.
            Computed: "true"
            Optional: "true"
            ExactlyOneOf: control_plane.0.remote, control_plane.0.local
            MaxItems: "1"
            Properties:
                machine_filter:
                    Type: TypeString
                    Description: |-
                        Only machines matching this filter will be allowed to host control
                        plane nodes. The filtering language accepts strings like "name=<name>",
                        and is documented here: [AIP-160](https://google.aip.dev/160).
                    Optional: "true"
                node_count:
                    Type: TypeInt
                    Description: |-
                        The number of nodes to serve as replicas of the Control Plane.
                        Only 1 and 3 are supported.
                    Computed: "true"
                    Optional: "true"
                node_location:
                    Type: TypeString
                    Description: |-
                        Name of the Google Distributed Cloud Edge zones where this node pool
                        will be created. For example: 'us-central1-edge-customer-a'.
                    Computed: "true"
                    Optional: "true"
                shared_deployment_policy:
                    Type: TypeString
                    Description: 'Policy configuration about how user applications are deployed. Possible values: ["SHARED_DEPLOYMENT_POLICY_UNSPECIFIED", "ALLOWED", "DISALLOWED"]'
                    Computed: "true"
                    Optional: "true"
        remote:
            Type: TypeList
            Description: Remote control plane configuration.
            Computed: "true"
            Optional: "true"
            ExactlyOneOf: control_plane.0.remote, control_plane.0.local
            MaxItems: "1"
            Properties:
                node_location:
                    Type: TypeString
                    Description: |-
                        Name of the Google Distributed Cloud Edge zones where this node pool
                        will be created. For example: 'us-central1-edge-customer-a'.
                    Computed: "true"
                    Optional: "true"
control_plane_encryption:
    Type: TypeList
    Description: |-
        Remote control plane disk encryption options. This field is only used when
        enabling CMEK support.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        kms_key:
            Type: TypeString
            Description: |-
                The Cloud KMS CryptoKey e.g.
                projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{cryptoKey}
                to use for protecting control plane disks. If not specified, a
                Google-managed key will be used instead.
            Computed: "true"
            Optional: "true"
        kms_key_active_version:
            Type: TypeString
            Description: |-
                The Cloud KMS CryptoKeyVersion currently in use for protecting control
                plane disks. Only applicable if kms_key is set.
            Computed: "true"
        kms_key_state:
            Type: TypeString
            Description: |-
                Availability of the Cloud KMS CryptoKey. If not 'KEY_AVAILABLE', then
                nodes may go offline as they cannot access their local data. This can be
                caused by a lack of permissions to use the key, or if the key is disabled
                or deleted.
            Computed: "true"
        kms_status:
            Type: TypeList
            Description: |-
                Error status returned by Cloud KMS when using this key. This field may be
                populated only if 'kms_key_state' is not 'KMS_KEY_STATE_KEY_AVAILABLE'.
                If populated, this field contains the error status reported by Cloud KMS.
            Computed: "true"
            Properties:
                code:
                    Type: TypeInt
                    Description: The status code, which should be an enum value of google.rpc.Code.
                    Computed: "true"
                message:
                    Type: TypeString
                    Description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the google.rpc.Status.details field, or localized by the client.
                    Computed: "true"
control_plane_version:
    Type: TypeString
    Description: The control plane release version.
    Computed: "true"
create_time:
    Type: TypeString
    Description: The time the cluster was created, in RFC3339 text format.
    Computed: "true"
default_max_pods_per_node:
    Type: TypeInt
    Description: |-
        The default maximum number of pods per node used if a maximum value is not
        specified explicitly for a node pool in this cluster. If unspecified, the
        Kubernetes default value will be used.
    Computed: "true"
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
endpoint:
    Type: TypeString
    Description: The IP address of the Kubernetes API server.
    Computed: "true"
external_load_balancer_ipv4_address_pools:
    Type: TypeList
    Description: Address pools for cluster data plane external load balancing.
    Computed: "true"
    Optional: "true"
fleet:
    Type: TypeList
    Description: |-
        Fleet related configuration.
        Fleets are a Google Cloud concept for logically organizing clusters,
        letting you use and manage multi-cluster capabilities and apply
        consistent policies across your systems.
    Required: "true"
    MaxItems: "1"
    Properties:
        membership:
            Type: TypeString
            Description: |-
                The name of the managed Hub Membership resource associated to this cluster.
                Membership names are formatted as
                'projects/<project-number>/locations/global/membership/<cluster-id>'.
            Computed: "true"
        project:
            Type: TypeString
            Description: |-
                The name of the Fleet host project where this cluster will be registered.
                Project names are formatted as
                'projects/<project-number>'.
            Required: "true"
labels:
    Type: TypeMap
    Description: |-
        User-defined labels for the edgecloud cluster.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: The location of the resource.
    Required: "true"
maintenance_events:
    Type: TypeList
    Description: |-
        All the maintenance events scheduled for the cluster, including the ones
        ongoing, planned for the future and done in the past (up to 90 days).
    Computed: "true"
    Properties:
        create_time:
            Type: TypeString
            Description: The time when the maintenance event request was created.
            Computed: "true"
        end_time:
            Type: TypeString
            Description: |-
                The time when the maintenance event ended, either successfully or not. If
                the maintenance event is split into multiple maintenance windows,
                end_time is only updated when the whole flow ends.
            Computed: "true"
        operation:
            Type: TypeString
            Description: |-
                The operation for running the maintenance event. Specified in the format
                projects/*/locations/*/operations/*. If the maintenance event is split
                into multiple operations (e.g. due to maintenance windows), the latest
                one is recorded.
            Computed: "true"
        schedule:
            Type: TypeString
            Description: The schedule of the maintenance event.
            Computed: "true"
        start_time:
            Type: TypeString
            Description: The time when the maintenance event started.
            Computed: "true"
        state:
            Type: TypeString
            Description: Indicates the maintenance event state.
            Computed: "true"
        target_version:
            Type: TypeString
            Description: The target version of the cluster.
            Computed: "true"
        type:
            Type: TypeString
            Description: Indicates the maintenance event type.
            Computed: "true"
        update_time:
            Type: TypeString
            Description: The time when the maintenance event message was updated.
            Computed: "true"
        uuid:
            Type: TypeString
            Description: UUID of the maintenance event.
            Computed: "true"
maintenance_policy:
    Type: TypeList
    Description: Cluster-wide maintenance policy configuration.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        window:
            Type: TypeList
            Description: Specifies the maintenance window in which maintenance may be performed.
            Required: "true"
            MaxItems: "1"
            Properties:
                recurring_window:
                    Type: TypeList
                    Description: Represents an arbitrary window of time that recurs.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        recurrence:
                            Type: TypeString
                            Description: |-
                                An RRULE (https://tools.ietf.org/html/rfc5545#section-3.8.5.3) for how
                                this window recurs. They go on for the span of time between the start and
                                end time.
                            Computed: "true"
                            Optional: "true"
                        window:
                            Type: TypeList
                            Description: Represents an arbitrary window of time.
                            Computed: "true"
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                end_time:
                                    Type: TypeString
                                    Description: |-
                                        The time that the window ends. The end time must take place after the
                                        start time.
                                    Computed: "true"
                                    Optional: "true"
                                start_time:
                                    Type: TypeString
                                    Description: The time that the window first starts.
                                    Computed: "true"
                                    Optional: "true"
name:
    Type: TypeString
    Description: The GDCE cluster name.
    Required: "true"
networking:
    Type: TypeList
    Description: |-
        Fleet related configuration.
        Fleets are a Google Cloud concept for logically organizing clusters,
        letting you use and manage multi-cluster capabilities and apply
        consistent policies across your systems.
    Required: "true"
    MaxItems: "1"
    Properties:
        cluster_ipv4_cidr_blocks:
            Type: TypeList
            Description: |-
                All pods in the cluster are assigned an RFC1918 IPv4 address from these
                blocks. Only a single block is supported. This field cannot be changed
                after creation.
            Required: "true"
        cluster_ipv6_cidr_blocks:
            Type: TypeList
            Description: |-
                If specified, dual stack mode is enabled and all pods in the cluster are
                assigned an IPv6 address from these blocks alongside from an IPv4
                address. Only a single block is supported. This field cannot be changed
                after creation.
            Optional: "true"
        network_type:
            Type: TypeString
            Description: IP addressing type of this cluster i.e. SINGLESTACK_V4 vs DUALSTACK_V4_V6.
            Computed: "true"
        services_ipv4_cidr_blocks:
            Type: TypeList
            Description: |-
                All services in the cluster are assigned an RFC1918 IPv4 address from these
                blocks. Only a single block is supported. This field cannot be changed
                after creation.
            Required: "true"
        services_ipv6_cidr_blocks:
            Type: TypeList
            Description: |-
                If specified, dual stack mode is enabled and all services in the cluster are
                assigned an IPv6 address from these blocks alongside from an IPv4
                address. Only a single block is supported. This field cannot be changed
                after creation.
            Optional: "true"
node_version:
    Type: TypeString
    Description: |-
        The lowest release version among all worker nodes. This field can be empty
        if the cluster does not have any worker nodes.
    Computed: "true"
port:
    Type: TypeInt
    Description: The port number of the Kubernetes API server.
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
release_channel:
    Type: TypeString
    Description: 'The release channel a cluster is subscribed to. Possible values: ["RELEASE_CHANNEL_UNSPECIFIED", "NONE", "REGULAR"]'
    Computed: "true"
    Optional: "true"
status:
    Type: TypeString
    Description: Indicates the status of the cluster.
    Computed: "true"
system_addons_config:
    Type: TypeList
    Description: Config that customers are allowed to define for GDCE system add-ons.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        ingress:
            Type: TypeList
            Description: |-
                Config for the Ingress add-on which allows customers to create an Ingress
                object to manage external access to the servers in a cluster. The add-on
                consists of istiod and istio-ingress.
            Computed: "true"
            Optional: "true"
            MaxItems: "1"
            Properties:
                disabled:
                    Type: TypeBool
                    Description: Whether Ingress is disabled.
                    Computed: "true"
                    Optional: "true"
                ipv4_vip:
                    Type: TypeString
                    Description: Ingress VIP.
                    Computed: "true"
                    Optional: "true"
target_version:
    Type: TypeString
    Description: 'The target cluster version. For example: "1.5.0".'
    Computed: "true"
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: The time the cluster was last updated, in RFC3339 text format.
    Computed: "true"

