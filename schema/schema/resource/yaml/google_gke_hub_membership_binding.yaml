create_time:
    Type: TypeString
    Description: Time the MembershipBinding was created in UTC.
    Computed: "true"
delete_time:
    Type: TypeString
    Description: Time the MembershipBinding was deleted in UTC.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels for this Membership binding.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: Location of the membership
    Required: "true"
membership_binding_id:
    Type: TypeString
    Description: The client-provided identifier of the membership binding.
    Required: "true"
membership_id:
    Type: TypeString
    Description: Id of the membership
    Required: "true"
name:
    Type: TypeString
    Description: The resource name for the membershipbinding itself
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
scope:
    Type: TypeString
    Description: |-
        A Workspace resource name in the format
        'projects/*/locations/*/scopes/*'.
    Required: "true"
state:
    Type: TypeList
    Description: State of the membership binding resource.
    Computed: "true"
    Properties:
        code:
            Type: TypeString
            Description: Code describes the state of a MembershipBinding resource.
            Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
uid:
    Type: TypeString
    Description: Google-generated UUID for this resource.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the MembershipBinding was updated in UTC.
    Computed: "true"

