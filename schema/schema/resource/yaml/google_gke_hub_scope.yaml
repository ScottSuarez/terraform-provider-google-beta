create_time:
    Type: TypeString
    Description: Time the Scope was created in UTC.
    Computed: "true"
delete_time:
    Type: TypeString
    Description: Time the Scope was deleted in UTC.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels for this Scope.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
name:
    Type: TypeString
    Description: The unique identifier of the scope
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
scope_id:
    Type: TypeString
    Description: The client-provided identifier of the scope.
    Required: "true"
state:
    Type: TypeList
    Description: State of the scope resource.
    Computed: "true"
    Properties:
        code:
            Type: TypeString
            Description: Code describes the state of a Scope resource.
            Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
uid:
    Type: TypeString
    Description: Google-generated UUID for this resource.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the Scope was updated in UTC.
    Computed: "true"

