create_time:
    Type: TypeString
    Description: Time the RBAC Role Binding was created in UTC.
    Computed: "true"
delete_time:
    Type: TypeString
    Description: Time the RBAC Role Binding was deleted in UTC.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
group:
    Type: TypeString
    Description: |-
        Principal that is be authorized in the cluster (at least of one the oneof
        is required). Updating one will unset the other automatically.
        group is the group, as seen by the kubernetes cluster.
    Optional: "true"
    ExactlyOneOf: user, group
labels:
    Type: TypeMap
    Description: |-
        Labels for this ScopeRBACRoleBinding.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
name:
    Type: TypeString
    Description: The resource name for the RBAC Role Binding
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
role:
    Type: TypeList
    Description: Role to bind to the principal.
    Required: "true"
    MaxItems: "1"
    Properties:
        predefined_role:
            Type: TypeString
            Description: 'PredefinedRole is an ENUM representation of the default Kubernetes Roles Possible values: ["UNKNOWN", "ADMIN", "EDIT", "VIEW"]'
            Optional: "true"
scope_id:
    Type: TypeString
    Description: Id of the scope
    Required: "true"
scope_rbac_role_binding_id:
    Type: TypeString
    Description: The client-provided identifier of the RBAC Role Binding.
    Required: "true"
state:
    Type: TypeList
    Description: State of the RBAC Role Binding resource.
    Computed: "true"
    Properties:
        code:
            Type: TypeString
            Description: Code describes the state of a RBAC Role Binding resource.
            Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
uid:
    Type: TypeString
    Description: Google-generated UUID for this resource.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the RBAC Role Binding was updated in UTC.
    Computed: "true"
user:
    Type: TypeString
    Description: |-
        Principal that is be authorized in the cluster (at least of one the oneof
        is required). Updating one will unset the other automatically.
        user is the name of the user as seen by the kubernetes cluster, example
        "alice" or "alice@domain.tld"
    Optional: "true"
    ExactlyOneOf: user, group

