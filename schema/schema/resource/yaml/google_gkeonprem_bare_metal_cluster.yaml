admin_cluster_membership:
    Type: TypeString
    Description: |-
        The Admin Cluster this Bare Metal User Cluster belongs to.
        This is the full resource name of the Admin Cluster's hub membership.
    Required: "true"
annotations:
    Type: TypeMap
    Description: |-
        Annotations on the Bare Metal User Cluster.
        This field has the same restrictions as Kubernetes annotations.
        The total size of all keys and values combined is limited to 256k.
        Key can have 2 segments: prefix (optional) and name (required),
        separated by a slash (/).
        Prefix must be a DNS subdomain.
        Name must be 63 characters or less, begin and end with alphanumerics,
        with dashes (-), underscores (_), dots (.), and alphanumerics between.


        **Note**: This field is non-authoritative, and will only manage the annotations present in your configuration.
        Please refer to the field 'effective_annotations' for all of the annotations present on the resource.
    Optional: "true"
bare_metal_version:
    Type: TypeString
    Description: A human readable description of this Bare Metal User Cluster.
    Required: "true"
binary_authorization:
    Type: TypeList
    Description: Binary Authorization related configurations.
    Optional: "true"
    MaxItems: "1"
    Properties:
        evaluation_mode:
            Type: TypeString
            Description: |-
                Mode of operation for binauthz policy evaluation. If unspecified,
                defaults to DISABLED. Possible values: ["DISABLED", "PROJECT_SINGLETON_POLICY_ENFORCE"]
            Optional: "true"
cluster_operations:
    Type: TypeList
    Description: Specifies the User Cluster's observability infrastructure.
    Optional: "true"
    MaxItems: "1"
    Properties:
        enable_application_logs:
            Type: TypeBool
            Description: Whether collection of application logs/metrics should be enabled (in addition to system logs/metrics).
            Optional: "true"
control_plane:
    Type: TypeList
    Description: Specifies the control plane configuration.
    Required: "true"
    MaxItems: "1"
    Properties:
        api_server_args:
            Type: TypeList
            Description: |-
                Customizes the default API server args. Only a subset of
                customized flags are supported. Please refer to the API server
                documentation below to know the exact format:
                https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/
            Optional: "true"
            Properties:
                argument:
                    Type: TypeString
                    Description: The argument name as it appears on the API Server command line please make sure to remove the leading dashes.
                    Required: "true"
                value:
                    Type: TypeString
                    Description: The value of the arg as it will be passed to the API Server command line.
                    Required: "true"
        control_plane_node_pool_config:
            Type: TypeList
            Description: Configures the node pool running the control plane. If specified the corresponding NodePool will be created for the cluster's control plane. The NodePool will have the same name and namespace as the cluster.
            Required: "true"
            MaxItems: "1"
            Properties:
                node_pool_config:
                    Type: TypeList
                    Description: The generic configuration for a node pool running the control plane.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        labels:
                            Type: TypeMap
                            Description: |-
                                The map of Kubernetes labels (key/value pairs) to be applied to
                                each node. These will added in addition to any default label(s)
                                that Kubernetes may apply to the node. In case of conflict in
                                label keys, the applied set may differ depending on the Kubernetes
                                version -- it's best to assume the behavior is undefined and
                                conflicts should be avoided. For more information, including usage
                                and the valid values, see:
                                  http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                An object containing a list of "key": value pairs.
                                Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                            Computed: "true"
                            Optional: "true"
                        node_configs:
                            Type: TypeList
                            Description: The list of machine addresses in the Bare Metal Node Pool.
                            Optional: "true"
                            Properties:
                                labels:
                                    Type: TypeMap
                                    Description: |-
                                        The map of Kubernetes labels (key/value pairs) to be applied to
                                        each node. These will added in addition to any default label(s)
                                        that Kubernetes may apply to the node. In case of conflict in
                                        label keys, the applied set may differ depending on the Kubernetes
                                        version -- it's best to assume the behavior is undefined and
                                        conflicts should be avoided. For more information, including usage
                                        and the valid values, see:
                                          http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                        An object containing a list of "key": value pairs.
                                        Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                                    Optional: "true"
                                node_ip:
                                    Type: TypeString
                                    Description: |-
                                        The default IPv4 address for SSH access and Kubernetes node.
                                        Example: 192.168.0.1
                                    Optional: "true"
                        operating_system:
                            Type: TypeString
                            Description: 'Specifies the nodes operating system (default: LINUX).'
                            Optional: "true"
                        taints:
                            Type: TypeList
                            Description: The initial taints assigned to nodes of this node pool.
                            Computed: "true"
                            Optional: "true"
                            Properties:
                                effect:
                                    Type: TypeString
                                    Description: 'Specifies the nodes operating system (default: LINUX). Possible values: ["EFFECT_UNSPECIFIED", "PREFER_NO_SCHEDULE", "NO_EXECUTE"]'
                                    Optional: "true"
                                key:
                                    Type: TypeString
                                    Description: Key associated with the effect.
                                    Optional: "true"
                                value:
                                    Type: TypeString
                                    Description: Value associated with the effect.
                                    Optional: "true"
create_time:
    Type: TypeString
    Description: The time the cluster was created, in RFC3339 text format.
    Computed: "true"
delete_time:
    Type: TypeString
    Description: The time the cluster was deleted, in RFC3339 text format.
    Computed: "true"
description:
    Type: TypeString
    Description: A human readable description of this Bare Metal User Cluster.
    Optional: "true"
effective_annotations:
    Type: TypeMap
    Description: All of annotations (key/value pairs) present on the resource in GCP, including the annotations configured through Terraform, other clients and services.
    Computed: "true"
endpoint:
    Type: TypeString
    Description: The IP address name of Bare Metal User Cluster's API server.
    Computed: "true"
etag:
    Type: TypeString
    Description: |-
        This checksum is computed by the server based on the value of other
        fields, and may be sent on update and delete requests to ensure the
        client has an up-to-date value before proceeding.
        Allows clients to perform consistent read-modify-writes
        through optimistic concurrency control.
    Computed: "true"
fleet:
    Type: TypeList
    Description: |-
        Fleet related configuration.
        Fleets are a Google Cloud concept for logically organizing clusters,
        letting you use and manage multi-cluster capabilities and apply
        consistent policies across your systems.
        See [Anthos Fleets](https://cloud.google.com/anthos/multicluster-management/fleets) for
        more details on Anthos multi-cluster capabilities using Fleets.
    Computed: "true"
    Properties:
        membership:
            Type: TypeString
            Description: |-
                The name of the managed Hub Membership resource associated to this cluster.
                Membership names are formatted as
                'projects/<project-number>/locations/<location>/memberships/<cluster-id>'.
            Computed: "true"
load_balancer:
    Type: TypeList
    Description: Specifies the load balancer configuration.
    Required: "true"
    MaxItems: "1"
    Properties:
        bgp_lb_config:
            Type: TypeList
            Description: Configuration for BGP typed load balancers.
            Optional: "true"
            ExactlyOneOf: load_balancer.0.metal_lb_config, load_balancer.0.manual_lb_config, load_balancer.0.bgp_lb_config
            MaxItems: "1"
            Properties:
                address_pools:
                    Type: TypeList
                    Description: |-
                        AddressPools is a list of non-overlapping IP pools used by load balancer
                        typed services. All addresses must be routable to load balancer nodes.
                        IngressVIP must be included in the pools.
                    Required: "true"
                    Properties:
                        addresses:
                            Type: TypeList
                            Description: The addresses that are part of this pool. Each address must be either in the CIDR form (1.2.3.0/24) or range form (1.2.3.1-1.2.3.5).
                            Required: "true"
                        avoid_buggy_ips:
                            Type: TypeBool
                            Description: |-
                                If true, avoid using IPs ending in .0 or .255.
                                This avoids buggy consumer devices mistakenly dropping IPv4 traffic for those special IP addresses.
                            Optional: "true"
                        manual_assign:
                            Type: TypeString
                            Description: If true, prevent IP addresses from being automatically assigned.
                            Optional: "true"
                        pool:
                            Type: TypeString
                            Description: The name of the address pool.
                            Required: "true"
                asn:
                    Type: TypeInt
                    Description: |-
                        BGP autonomous system number (ASN) of the cluster.
                        This field can be updated after cluster creation.
                    Required: "true"
                bgp_peer_configs:
                    Type: TypeList
                    Description: |-
                        The list of BGP peers that the cluster will connect to.
                        At least one peer must be configured for each control plane node.
                        Control plane nodes will connect to these peers to advertise the control
                        plane VIP. The Services load balancer also uses these peers by default.
                        This field can be updated after cluster creation.
                    Required: "true"
                    Properties:
                        asn:
                            Type: TypeInt
                            Description: |-
                                BGP autonomous system number (ASN) for the network that contains the
                                external peer device.
                            Required: "true"
                        control_plane_nodes:
                            Type: TypeList
                            Description: |-
                                The IP address of the control plane node that connects to the external
                                peer.
                                If you don't specify any control plane nodes, all control plane nodes
                                can connect to the external peer. If you specify one or more IP addresses,
                                only the nodes specified participate in peering sessions.
                            Optional: "true"
                        ip_address:
                            Type: TypeString
                            Description: The IP address of the external peer device.
                            Required: "true"
                load_balancer_node_pool_config:
                    Type: TypeList
                    Description: |-
                        Specifies the node pool running data plane load balancing. L2 connectivity
                        is required among nodes in this pool. If missing, the control plane node
                        pool is used for data plane load balancing.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        node_pool_config:
                            Type: TypeList
                            Description: The generic configuration for a node pool running a load balancer.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                kubelet_config:
                                    Type: TypeList
                                    Description: The modifiable kubelet configurations for the baremetal machines.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        registry_burst:
                                            Type: TypeInt
                                            Description: |-
                                                The maximum size of bursty pulls, temporarily allows pulls to burst to this
                                                number, while still not exceeding registry_pull_qps.
                                                The value must not be a negative number.
                                                Updating this field may impact scalability by changing the amount of
                                                traffic produced by image pulls.
                                                Defaults to 10.
                                            Optional: "true"
                                        registry_pull_qps:
                                            Type: TypeInt
                                            Description: |-
                                                The limit of registry pulls per second.
                                                Setting this value to 0 means no limit.
                                                Updating this field may impact scalability by changing the amount of
                                                traffic produced by image pulls.
                                                Defaults to 5.
                                            Optional: "true"
                                        serialize_image_pulls_disabled:
                                            Type: TypeBool
                                            Description: |-
                                                Prevents the Kubelet from pulling multiple images at a time.
                                                We recommend *not* changing the default value on nodes that run docker
                                                daemon with version  < 1.9 or an Another Union File System (Aufs) storage
                                                backend. Issue https://github.com/kubernetes/kubernetes/issues/10959 has
                                                more details.
                                            Optional: "true"
                                labels:
                                    Type: TypeMap
                                    Description: |-
                                        The map of Kubernetes labels (key/value pairs) to be applied to
                                        each node. These will added in addition to any default label(s)
                                        that Kubernetes may apply to the node. In case of conflict in
                                        label keys, the applied set may differ depending on the Kubernetes
                                        version -- it's best to assume the behavior is undefined and
                                        conflicts should be avoided. For more information, including usage
                                        and the valid values, see:
                                          http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                        An object containing a list of "key": value pairs.
                                        Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                                    Optional: "true"
                                node_configs:
                                    Type: TypeList
                                    Description: The list of machine addresses in the Bare Metal Node Pool.
                                    Optional: "true"
                                    Properties:
                                        labels:
                                            Type: TypeMap
                                            Description: |-
                                                The map of Kubernetes labels (key/value pairs) to be applied to
                                                each node. These will added in addition to any default label(s)
                                                that Kubernetes may apply to the node. In case of conflict in
                                                label keys, the applied set may differ depending on the Kubernetes
                                                version -- it's best to assume the behavior is undefined and
                                                conflicts should be avoided. For more information, including usage
                                                and the valid values, see:
                                                  http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                                An object containing a list of "key": value pairs.
                                                Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                                            Optional: "true"
                                        node_ip:
                                            Type: TypeString
                                            Description: |-
                                                The default IPv4 address for SSH access and Kubernetes node.
                                                Example: 192.168.0.1
                                            Optional: "true"
                                operating_system:
                                    Type: TypeString
                                    Description: 'Specifies the nodes operating system (default: LINUX).'
                                    Optional: "true"
                                taints:
                                    Type: TypeList
                                    Description: The initial taints assigned to nodes of this node pool.
                                    Optional: "true"
                                    Properties:
                                        effect:
                                            Type: TypeString
                                            Description: 'Specifies the nodes operating system (default: LINUX). Possible values: ["EFFECT_UNSPECIFIED", "PREFER_NO_SCHEDULE", "NO_EXECUTE"]'
                                            Optional: "true"
                                        key:
                                            Type: TypeString
                                            Description: Key associated with the effect.
                                            Optional: "true"
                                        value:
                                            Type: TypeString
                                            Description: Value associated with the effect.
                                            Optional: "true"
        manual_lb_config:
            Type: TypeList
            Description: A nested object resource
            Optional: "true"
            ExactlyOneOf: load_balancer.0.metal_lb_config, load_balancer.0.manual_lb_config, load_balancer.0.bgp_lb_config
            MaxItems: "1"
            Properties:
                enabled:
                    Type: TypeBool
                    Description: Whether manual load balancing is enabled.
                    Required: "true"
        metal_lb_config:
            Type: TypeList
            Description: A nested object resource
            Optional: "true"
            ExactlyOneOf: load_balancer.0.metal_lb_config, load_balancer.0.manual_lb_config, load_balancer.0.bgp_lb_config
            MaxItems: "1"
            Properties:
                address_pools:
                    Type: TypeList
                    Description: |-
                        AddressPools is a list of non-overlapping IP pools used by load balancer
                        typed services. All addresses must be routable to load balancer nodes.
                        IngressVIP must be included in the pools.
                    Required: "true"
                    Properties:
                        addresses:
                            Type: TypeList
                            Description: The addresses that are part of this pool. Each address must be either in the CIDR form (1.2.3.0/24) or range form (1.2.3.1-1.2.3.5).
                            Required: "true"
                        avoid_buggy_ips:
                            Type: TypeBool
                            Description: |-
                                If true, avoid using IPs ending in .0 or .255.
                                This avoids buggy consumer devices mistakenly dropping IPv4 traffic for those special IP addresses.
                            Optional: "true"
                        manual_assign:
                            Type: TypeBool
                            Description: If true, prevent IP addresses from being automatically assigned.
                            Optional: "true"
                        pool:
                            Type: TypeString
                            Description: The name of the address pool.
                            Required: "true"
                load_balancer_node_pool_config:
                    Type: TypeList
                    Description: Specifies the load balancer's node pool configuration.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        node_pool_config:
                            Type: TypeList
                            Description: The generic configuration for a node pool running a load balancer.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                labels:
                                    Type: TypeMap
                                    Description: |-
                                        The map of Kubernetes labels (key/value pairs) to be applied to
                                        each node. These will added in addition to any default label(s)
                                        that Kubernetes may apply to the node. In case of conflict in
                                        label keys, the applied set may differ depending on the Kubernetes
                                        version -- it's best to assume the behavior is undefined and
                                        conflicts should be avoided. For more information, including usage
                                        and the valid values, see:
                                          http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                        An object containing a list of "key": value pairs.
                                        Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                                    Computed: "true"
                                    Optional: "true"
                                node_configs:
                                    Type: TypeList
                                    Description: The list of machine addresses in the Bare Metal Node Pool.
                                    Optional: "true"
                                    Properties:
                                        labels:
                                            Type: TypeMap
                                            Description: |-
                                                The map of Kubernetes labels (key/value pairs) to be applied to
                                                each node. These will added in addition to any default label(s)
                                                that Kubernetes may apply to the node. In case of conflict in
                                                label keys, the applied set may differ depending on the Kubernetes
                                                version -- it's best to assume the behavior is undefined and
                                                conflicts should be avoided. For more information, including usage
                                                and the valid values, see:
                                                  http://kubernetes.io/v1.1/docs/user-guide/labels.html
                                                An object containing a list of "key": value pairs.
                                                Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
                                            Optional: "true"
                                        node_ip:
                                            Type: TypeString
                                            Description: |-
                                                The default IPv4 address for SSH access and Kubernetes node.
                                                Example: 192.168.0.1
                                            Optional: "true"
                                operating_system:
                                    Type: TypeString
                                    Description: 'Specifies the nodes operating system (default: LINUX).'
                                    Computed: "true"
                                    Optional: "true"
                                taints:
                                    Type: TypeList
                                    Description: The initial taints assigned to nodes of this node pool.
                                    Computed: "true"
                                    Optional: "true"
                                    Properties:
                                        effect:
                                            Type: TypeString
                                            Description: 'Specifies the nodes operating system (default: LINUX). Possible values: ["EFFECT_UNSPECIFIED", "PREFER_NO_SCHEDULE", "NO_EXECUTE"]'
                                            Optional: "true"
                                        key:
                                            Type: TypeString
                                            Description: Key associated with the effect.
                                            Optional: "true"
                                        value:
                                            Type: TypeString
                                            Description: Value associated with the effect.
                                            Optional: "true"
        port_config:
            Type: TypeList
            Description: Specifies the load balancer ports.
            Required: "true"
            MaxItems: "1"
            Properties:
                control_plane_load_balancer_port:
                    Type: TypeInt
                    Description: The port that control plane hosted load balancers will listen on.
                    Required: "true"
        vip_config:
            Type: TypeList
            Description: Specified the Bare Metal Load Balancer Config
            Required: "true"
            MaxItems: "1"
            Properties:
                control_plane_vip:
                    Type: TypeString
                    Description: The VIP which you previously set aside for the Kubernetes API of this Bare Metal User Cluster.
                    Required: "true"
                ingress_vip:
                    Type: TypeString
                    Description: The VIP which you previously set aside for ingress traffic into this Bare Metal User Cluster.
                    Required: "true"
local_name:
    Type: TypeString
    Description: |-
        The object name of the Bare Metal Cluster custom resource on the
        associated admin cluster. This field is used to support conflicting
        names when enrolling existing clusters to the API. When used as a part of
        cluster enrollment, this field will differ from the ID in the resource
        name. For new clusters, this field will match the user provided cluster ID
        and be visible in the last component of the resource name. It is not
        modifiable.
        All users should use this name to access their cluster using gkectl or
        kubectl and should expect to see the local name when viewing admin
        cluster controller logs.
    Computed: "true"
location:
    Type: TypeString
    Description: The location of the resource.
    Required: "true"
maintenance_config:
    Type: TypeList
    Description: Specifies the workload node configurations.
    Optional: "true"
    MaxItems: "1"
    Properties:
        maintenance_address_cidr_blocks:
            Type: TypeList
            Description: |-
                All IPv4 address from these ranges will be placed into maintenance mode.
                Nodes in maintenance mode will be cordoned and drained. When both of these
                are true, the "baremetal.cluster.gke.io/maintenance" annotation will be set
                on the node resource.
            Required: "true"
name:
    Type: TypeString
    Description: The bare metal cluster name.
    Required: "true"
network_config:
    Type: TypeList
    Description: Network configuration.
    Required: "true"
    MaxItems: "1"
    Properties:
        advanced_networking:
            Type: TypeBool
            Description: |-
                Enables the use of advanced Anthos networking features, such as Bundled
                Load Balancing with BGP or the egress NAT gateway.
                Setting configuration for advanced networking features will automatically
                set this flag.
            Optional: "true"
        island_mode_cidr:
            Type: TypeList
            Description: A nested object resource
            Optional: "true"
            ExactlyOneOf: network_config.0.island_mode_cidr
            MaxItems: "1"
            Properties:
                pod_address_cidr_blocks:
                    Type: TypeList
                    Description: All pods in the cluster are assigned an RFC1918 IPv4 address from these ranges. This field cannot be changed after creation.
                    Required: "true"
                service_address_cidr_blocks:
                    Type: TypeList
                    Description: All services in the cluster are assigned an RFC1918 IPv4 address from these ranges. This field cannot be changed after creation.
                    Required: "true"
        multiple_network_interfaces_config:
            Type: TypeList
            Description: Configuration for multiple network interfaces.
            Optional: "true"
            MaxItems: "1"
            Properties:
                enabled:
                    Type: TypeBool
                    Description: |-
                        Whether to enable multiple network interfaces for your pods.
                        When set network_config.advanced_networking is automatically
                        set to true.
                    Optional: "true"
        sr_iov_config:
            Type: TypeList
            Description: Configuration for SR-IOV.
            Optional: "true"
            MaxItems: "1"
            Properties:
                enabled:
                    Type: TypeBool
                    Description: Whether to install the SR-IOV operator.
                    Optional: "true"
node_access_config:
    Type: TypeList
    Description: Specifies the node access related settings for the bare metal user cluster.
    Optional: "true"
    MaxItems: "1"
    Properties:
        login_user:
            Type: TypeString
            Description: |-
                LoginUser is the user name used to access node machines.
                It defaults to "root" if not set.
            Computed: "true"
            Optional: "true"
node_config:
    Type: TypeList
    Description: Specifies the workload node configurations.
    Optional: "true"
    MaxItems: "1"
    Properties:
        container_runtime:
            Type: TypeString
            Description: 'The available runtimes that can be used to run containers in a Bare Metal User Cluster. Possible values: ["CONTAINER_RUNTIME_UNSPECIFIED", "DOCKER", "CONTAINERD"]'
            Computed: "true"
            Optional: "true"
        max_pods_per_node:
            Type: TypeInt
            Description: |-
                The maximum number of pods a node can run. The size of the CIDR range
                assigned to the node will be derived from this parameter.
            Computed: "true"
            Optional: "true"
os_environment_config:
    Type: TypeList
    Description: OS environment related configurations.
    Optional: "true"
    MaxItems: "1"
    Properties:
        package_repo_excluded:
            Type: TypeBool
            Description: |-
                Whether the package repo should not be included when initializing
                bare metal machines.
            Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
proxy:
    Type: TypeList
    Description: Specifies the cluster proxy configuration.
    Optional: "true"
    MaxItems: "1"
    Properties:
        no_proxy:
            Type: TypeList
            Description: |-
                A list of IPs, hostnames, and domains that should skip the proxy.
                Examples: ["127.0.0.1", "example.com", ".corp", "localhost"].
            Optional: "true"
        uri:
            Type: TypeString
            Description: |-
                Specifies the address of your proxy server.
                Examples: http://domain
                WARNING: Do not provide credentials in the format
                http://(username:password@)domain these will be rejected by the server.
            Required: "true"
reconciling:
    Type: TypeBool
    Description: If set, there are currently changes in flight to the Bare Metal User Cluster.
    Computed: "true"
security_config:
    Type: TypeList
    Description: Specifies the security related settings for the Bare Metal User Cluster.
    Optional: "true"
    MaxItems: "1"
    Properties:
        authorization:
            Type: TypeList
            Description: Configures user access to the Bare Metal User cluster.
            Optional: "true"
            MaxItems: "1"
            Properties:
                admin_users:
                    Type: TypeList
                    Description: Users that will be granted the cluster-admin role on the cluster, providing full access to the cluster.
                    Required: "true"
                    Properties:
                        username:
                            Type: TypeString
                            Description: The name of the user, e.g. 'my-gcp-id@gmail.com'.
                            Required: "true"
state:
    Type: TypeString
    Description: The current state of this cluster.
    Computed: "true"
status:
    Type: TypeList
    Description: Specifies detailed cluster status.
    Computed: "true"
    Properties:
        conditions:
            Type: TypeList
            Description: ResourceConditions provide a standard mechanism for higher-level status reporting from user cluster controller.
            Computed: "true"
            Properties:
                last_transition_time:
                    Type: TypeString
                    Description: Last time the condition transit from one status to another.
                    Computed: "true"
                message:
                    Type: TypeString
                    Description: Human-readable message indicating details about last transition.
                    Optional: "true"
                reason:
                    Type: TypeString
                    Description: Machine-readable message indicating details about last transition.
                    Optional: "true"
                state:
                    Type: TypeString
                    Description: The lifecycle state of the condition.
                    Computed: "true"
                type:
                    Type: TypeString
                    Description: |-
                        Type of the condition.
                        (e.g., ClusterRunning, NodePoolRunning or ServerSidePreflightReady)
                    Optional: "true"
        error_message:
            Type: TypeString
            Description: |-
                Human-friendly representation of the error message from the user cluster
                controller. The error message can be temporary as the user cluster
                controller creates a cluster or node pool. If the error message persists
                for a longer period of time, it can be used to surface error message to
                indicate real problems requiring user intervention.
            Computed: "true"
storage:
    Type: TypeList
    Description: Specifies the cluster storage configuration.
    Required: "true"
    MaxItems: "1"
    Properties:
        lvp_node_mounts_config:
            Type: TypeList
            Description: |-
                Specifies the config for local PersistentVolumes backed
                by mounted node disks. These disks need to be formatted and mounted by the
                user, which can be done before or after cluster creation.
            Required: "true"
            MaxItems: "1"
            Properties:
                path:
                    Type: TypeString
                    Description: The host machine path.
                    Required: "true"
                storage_class:
                    Type: TypeString
                    Description: The StorageClass name that PVs will be created with.
                    Required: "true"
        lvp_share_config:
            Type: TypeList
            Description: |-
                Specifies the config for local PersistentVolumes backed by
                subdirectories in a shared filesystem. These subdirectores are
                automatically created during cluster creation.
            Required: "true"
            MaxItems: "1"
            Properties:
                lvp_config:
                    Type: TypeList
                    Description: Defines the machine path and storage class for the LVP Share.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        path:
                            Type: TypeString
                            Description: The host machine path.
                            Required: "true"
                        storage_class:
                            Type: TypeString
                            Description: The StorageClass name that PVs will be created with.
                            Required: "true"
                shared_path_pv_count:
                    Type: TypeInt
                    Description: The number of subdirectories to create under path.
                    Optional: "true"
uid:
    Type: TypeString
    Description: The unique identifier of the Bare Metal User Cluster.
    Computed: "true"
update_time:
    Type: TypeString
    Description: The time the cluster was last updated, in RFC3339 text format.
    Computed: "true"
upgrade_policy:
    Type: TypeList
    Description: The cluster upgrade policy.
    Optional: "true"
    MaxItems: "1"
    Properties:
        policy:
            Type: TypeString
            Description: 'Specifies which upgrade policy to use. Possible values: ["SERIAL", "CONCURRENT"]'
            Optional: "true"
validation_check:
    Type: TypeList
    Description: Specifies the security related settings for the Bare Metal User Cluster.
    Computed: "true"
    Properties:
        options:
            Type: TypeString
            Description: Options used for the validation check.
            Computed: "true"
        scenario:
            Type: TypeString
            Description: The scenario when the preflight checks were run..
            Computed: "true"
        status:
            Type: TypeList
            Description: Specifies the detailed validation check status
            Computed: "true"
            Properties:
                result:
                    Type: TypeList
                    Description: Individual checks which failed as part of the Preflight check execution.
                    Computed: "true"
                    Properties:
                        category:
                            Type: TypeString
                            Description: The category of the validation.
                            Computed: "true"
                        description:
                            Type: TypeString
                            Description: The description of the validation check.
                            Computed: "true"
                        details:
                            Type: TypeString
                            Description: Detailed failure information, which might be unformatted.
                            Computed: "true"
                        options:
                            Type: TypeString
                            Description: Options used for the validation check.
                            Computed: "true"
                        reason:
                            Type: TypeString
                            Description: A human-readable message of the check failure.
                            Computed: "true"

