auth_config:
    Type: TypeList
    Description: authConfig for the connection.
    Optional: "true"
    MaxItems: "1"
    Properties:
        additional_variable:
            Type: TypeList
            Description: List containing additional auth configs.
            Optional: "true"
            Properties:
                boolean_value:
                    Type: TypeBool
                    Description: Boolean Value of configVariable.
                    Optional: "true"
                encryption_key_value:
                    Type: TypeList
                    Description: Encription key value of configVariable.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        kms_key_name:
                            Type: TypeString
                            Description: |-
                                The [KMS key name] with which the content of the Operation is encrypted. The expected
                                format: projects/*/locations/*/keyRings/*/cryptoKeys/*.
                                Will be empty string if google managed.
                            Optional: "true"
                        type:
                            Type: TypeString
                            Description: 'Type of Encription Key Possible values: ["GOOGLE_MANAGED", "CUSTOMER_MANAGED"]'
                            Required: "true"
                integer_value:
                    Type: TypeInt
                    Description: Integer Value of configVariable.
                    Optional: "true"
                key:
                    Type: TypeString
                    Description: Key for the configVariable
                    Required: "true"
                secret_value:
                    Type: TypeList
                    Description: Secret value of configVariable.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: Secret version of Secret Value for Config variable.
                            Required: "true"
                string_value:
                    Type: TypeString
                    Description: String Value of configVariabley.
                    Optional: "true"
        auth_key:
            Type: TypeString
            Description: The type of authentication configured.
            Optional: "true"
        auth_type:
            Type: TypeString
            Description: 'authType of the Connection Possible values: ["USER_PASSWORD", "OAUTH2_JWT_BEARER", "OAUTH2_CLIENT_CREDENTIALS", "SSH_PUBLIC_KEY", "OAUTH2_AUTH_CODE_FLOW"]'
            Required: "true"
        oauth2_auth_code_flow:
            Type: TypeList
            Description: Parameters to support Oauth 2.0 Auth Code Grant Authentication.
            Optional: "true"
            ExactlyOneOf: auth_config.0.user_password, auth_config.0.oauth2_jwt_bearer, auth_config.0.oauth2_client_credentials, auth_config.0.ssh_public_key, auth_config.0.oauth2_auth_code_flow
            MaxItems: "1"
            Properties:
                auth_uri:
                    Type: TypeString
                    Description: Auth URL for Authorization Code Flow.
                    Optional: "true"
                client_id:
                    Type: TypeString
                    Description: Client ID for user-provided OAuth app.
                    Optional: "true"
                client_secret:
                    Type: TypeList
                    Description: Client secret for user-provided OAuth app.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
                enable_pkce:
                    Type: TypeBool
                    Description: Whether to enable PKCE when the user performs the auth code flow.
                    Optional: "true"
                scopes:
                    Type: TypeList
                    Description: Scopes the connection will request when the user performs the auth code flow.
                    Optional: "true"
        oauth2_client_credentials:
            Type: TypeList
            Description: OAuth3 Client Credentials for Authentication.
            Optional: "true"
            ExactlyOneOf: auth_config.0.user_password, auth_config.0.oauth2_jwt_bearer, auth_config.0.oauth2_client_credentials, auth_config.0.ssh_public_key, auth_config.0.oauth2_auth_code_flow
            MaxItems: "1"
            Properties:
                client_id:
                    Type: TypeString
                    Description: Secret version of Password for Authentication.
                    Required: "true"
                client_secret:
                    Type: TypeList
                    Description: Secret version reference containing the client secret.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
        oauth2_jwt_bearer:
            Type: TypeList
            Description: OAuth2 JWT Bearer for Authentication.
            Optional: "true"
            ExactlyOneOf: auth_config.0.user_password, auth_config.0.oauth2_jwt_bearer, auth_config.0.oauth2_client_credentials, auth_config.0.ssh_public_key, auth_config.0.oauth2_auth_code_flow
            MaxItems: "1"
            Properties:
                client_key:
                    Type: TypeList
                    Description: |-
                        Secret version reference containing a PKCS#8 PEM-encoded private key associated with the Client Certificate.
                        This private key will be used to sign JWTs used for the jwt-bearer authorization grant.
                        Specified in the form as: projects/*/secrets/*/versions/*.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
                jwt_claims:
                    Type: TypeList
                    Description: JwtClaims providers fields to generate the token.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        audience:
                            Type: TypeString
                            Description: Value for the "aud" claim.
                            Optional: "true"
                        issuer:
                            Type: TypeString
                            Description: Value for the "iss" claim.
                            Optional: "true"
                        subject:
                            Type: TypeString
                            Description: Value for the "sub" claim.
                            Optional: "true"
        ssh_public_key:
            Type: TypeList
            Description: SSH Public Key for Authentication.
            Optional: "true"
            ExactlyOneOf: auth_config.0.user_password, auth_config.0.oauth2_jwt_bearer, auth_config.0.oauth2_client_credentials, auth_config.0.ssh_public_key, auth_config.0.oauth2_auth_code_flow
            MaxItems: "1"
            Properties:
                cert_type:
                    Type: TypeString
                    Description: Format of SSH Client cert.
                    Optional: "true"
                ssh_client_cert:
                    Type: TypeList
                    Description: SSH Client Cert. It should contain both public and private key.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
                ssh_client_cert_pass:
                    Type: TypeList
                    Description: Password (passphrase) for ssh client certificate if it has one.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
                username:
                    Type: TypeString
                    Description: The user account used to authenticate.
                    Required: "true"
        user_password:
            Type: TypeList
            Description: User password for Authentication.
            Optional: "true"
            ExactlyOneOf: auth_config.0.user_password, auth_config.0.oauth2_jwt_bearer, auth_config.0.oauth2_client_credentials, auth_config.0.ssh_public_key, auth_config.0.oauth2_auth_code_flow
            MaxItems: "1"
            Properties:
                password:
                    Type: TypeList
                    Description: Password for Authentication.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        secret_version:
                            Type: TypeString
                            Description: |-
                                The resource name of the secret version in the format,
                                format as: projects/*/secrets/*/versions/*.
                            Required: "true"
                username:
                    Type: TypeString
                    Description: Username for Authentication.
                    Required: "true"
