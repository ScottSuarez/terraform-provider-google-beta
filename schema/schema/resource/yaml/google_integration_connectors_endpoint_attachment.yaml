create_time:
    Type: TypeString
    Description: Time the Namespace was created in UTC.
    Computed: "true"
description:
    Type: TypeString
    Description: Description of the resource.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
endpoint_ip:
    Type: TypeString
    Description: The Private Service Connect connection endpoint ip.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Resource labels to represent user provided metadata.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: Location in which Endpoint Attachment needs to be created.
    Required: "true"
name:
    Type: TypeString
    Description: Name of Endpoint Attachment needs to be created.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
service_attachment:
    Type: TypeString
    Description: The path of the service attachment.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the Namespace was updated in UTC.
    Computed: "true"

