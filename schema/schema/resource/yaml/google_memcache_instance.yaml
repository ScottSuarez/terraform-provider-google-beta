authorized_network:
    Type: TypeString
    Description: |-
        The full name of the GCE network to connect the instance to.  If not provided,
        'default' will be used.
    Computed: "true"
    Optional: "true"
create_time:
    Type: TypeString
    Description: Creation timestamp in RFC3339 text format.
    Computed: "true"
discovery_endpoint:
    Type: TypeString
    Description: Endpoint for Discovery API
    Computed: "true"
display_name:
    Type: TypeString
    Description: A user-visible name for the instance.
    Computed: "true"
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Resource labels to represent user-provided metadata.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
maintenance_policy:
    Type: TypeList
    Description: Maintenance policy for an instance.
    Optional: "true"
    MaxItems: "1"
    Properties:
        create_time:
            Type: TypeString
            Description: |-
                Output only. The time when the policy was created.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
                resolution and up to nine fractional digits
            Computed: "true"
        description:
            Type: TypeString
            Description: |-
                Optional. Description of what this policy is for.
                Create/Update methods return INVALID_ARGUMENT if the
                length is greater than 512.
            Optional: "true"
        update_time:
            Type: TypeString
            Description: |-
                Output only. The time when the policy was updated.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
                resolution and up to nine fractional digits.
            Computed: "true"
        weekly_maintenance_window:
            Type: TypeList
            Description: |-
                Required. Maintenance window that is applied to resources covered by this policy.
                Minimum 1. For the current version, the maximum number of weekly_maintenance_windows
                is expected to be one.
            Required: "true"
            Properties:
                day:
                    Type: TypeString
                    Description: |-
                        Required. The day of week that maintenance updates occur.
                        - DAY_OF_WEEK_UNSPECIFIED: The day of the week is unspecified.
                        - MONDAY: Monday
                        - TUESDAY: Tuesday
                        - WEDNESDAY: Wednesday
                        - THURSDAY: Thursday
                        - FRIDAY: Friday
                        - SATURDAY: Saturday
                        - SUNDAY: Sunday Possible values: ["DAY_OF_WEEK_UNSPECIFIED", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"]
                    Required: "true"
                duration:
                    Type: TypeString
                    Description: |-
                        Required. The length of the maintenance window, ranging from 3 hours to 8 hours.
                        A duration in seconds with up to nine fractional digits,
                        terminated by 's'. Example: "3.5s".
                    Required: "true"
                start_time:
                    Type: TypeList
                    Description: Required. Start time of the window in UTC time.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        hours:
                            Type: TypeInt
                            Description: |-
                                Hours of day in 24 hour format. Should be from 0 to 23.
                                An API may choose to allow the value "24:00:00" for scenarios like business closing time.
                            Optional: "true"
                        minutes:
                            Type: TypeInt
                            Description: Minutes of hour of day. Must be from 0 to 59.
                            Optional: "true"
                        nanos:
                            Type: TypeInt
                            Description: Fractions of seconds in nanoseconds. Must be from 0 to 999,999,999.
                            Optional: "true"
                        seconds:
                            Type: TypeInt
                            Description: |-
                                Seconds of minutes of the time. Must normally be from 0 to 59.
                                An API may allow the value 60 if it allows leap-seconds.
                            Optional: "true"
maintenance_schedule:
    Type: TypeList
    Description: Output only. Published maintenance schedule.
    Computed: "true"
    Properties:
        end_time:
            Type: TypeString
            Description: |-
                Output only. The end time of any upcoming scheduled maintenance for this instance.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
                resolution and up to nine fractional digits.
            Computed: "true"
        schedule_deadline_time:
            Type: TypeString
            Description: |-
                Output only. The deadline that the maintenance schedule start time
                can not go beyond, including reschedule.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
                resolution and up to nine fractional digits.
            Computed: "true"
        start_time:
            Type: TypeString
            Description: |-
                Output only. The start time of any upcoming scheduled maintenance for this instance.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond
                resolution and up to nine fractional digits.
            Computed: "true"
memcache_full_version:
    Type: TypeString
    Description: The full version of memcached server running on this instance.
    Computed: "true"
memcache_nodes:
    Type: TypeList
    Description: Additional information about the instance state, if available.
    Computed: "true"
    Properties:
        host:
            Type: TypeString
            Description: Hostname or IP address of the Memcached node used by the clients to connect to the Memcached server on this node.
            Computed: "true"
        node_id:
            Type: TypeString
            Description: Identifier of the Memcached node. The node id does not include project or location like the Memcached instance name.
            Computed: "true"
        port:
            Type: TypeInt
            Description: The port number of the Memcached server on this node.
            Computed: "true"
        state:
            Type: TypeString
            Description: Current state of the Memcached node.
            Computed: "true"
        zone:
            Type: TypeString
            Description: Location (GCP Zone) for the Memcached node.
            Computed: "true"
memcache_parameters:
    Type: TypeList
    Description: User-specified parameters for this memcache instance.
    Optional: "true"
    MaxItems: "1"
    Properties:
        id:
            Type: TypeString
            Description: This is a unique ID associated with this set of parameters.
            Computed: "true"
        params:
            Type: TypeMap
            Description: User-defined set of parameters to use in the memcache process.
            Optional: "true"
memcache_version:
    Type: TypeString
    Description: |-
        The major version of Memcached software. If not provided, latest supported version will be used.
        Currently the latest supported major version is MEMCACHE_1_5. The minor version will be automatically
        determined by our system based on the latest supported minor version. Default value: "MEMCACHE_1_5" Possible values: ["MEMCACHE_1_5", "MEMCACHE_1_6_15"]
    Optional: "true"
name:
    Type: TypeString
    Description: The resource name of the instance.
    Required: "true"
node_config:
    Type: TypeList
    Description: Configuration for memcache nodes.
    Required: "true"
    MaxItems: "1"
    Properties:
        cpu_count:
            Type: TypeInt
            Description: Number of CPUs per node.
            Required: "true"
        memory_size_mb:
            Type: TypeInt
            Description: Memory size in Mebibytes for each memcache node.
            Required: "true"
node_count:
    Type: TypeInt
    Description: Number of nodes in the memcache instance.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
region:
    Type: TypeString
    Description: The region of the Memcache instance. If it is not provided, the provider region is used.
    Computed: "true"
    Optional: "true"
reserved_ip_range_id:
    Type: TypeList
    Description: |-
        Contains the name of allocated IP address ranges associated with
        the private service access connection for example, "test-default"
        associated with IP range 10.0.0.0/29.
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
zones:
    Type: TypeSet
    Description: |-
        Zones where memcache nodes should be provisioned.  If not
        provided, all zones will be used.
    Computed: "true"
    Optional: "true"

