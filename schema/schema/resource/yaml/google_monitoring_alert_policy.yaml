alert_strategy:
    Type: TypeList
    Description: Control over how this alert policy's notification channels are notified.
    Optional: "true"
    MaxItems: "1"
    Properties:
        auto_close:
            Type: TypeString
            Description: If an alert policy that was active has no data for this long, any open incidents will close.
            Optional: "true"
        notification_channel_strategy:
            Type: TypeList
            Description: |-
                Control over how the notification channels in 'notification_channels'
                are notified when this alert fires, on a per-channel basis.
            Optional: "true"
            Properties:
                notification_channel_names:
                    Type: TypeList
                    Description: |-
                        The notification channels that these settings apply to. Each of these
                        correspond to the name field in one of the NotificationChannel objects
                        referenced in the notification_channels field of this AlertPolicy. The format is
                        'projects/[PROJECT_ID_OR_NUMBER]/notificationChannels/[CHANNEL_ID]'
                    Optional: "true"
                renotify_interval:
                    Type: TypeString
                    Description: The frequency at which to send reminder notifications for open incidents.
                    Optional: "true"
        notification_rate_limit:
            Type: TypeList
            Description: |-
                Required for alert policies with a LogMatch condition.
                This limit is not implemented for alert policies that are not log-based.
            Optional: "true"
            MaxItems: "1"
            Properties:
                period:
                    Type: TypeString
                    Description: Not more than one notification per period.
                    Optional: "true"
combiner:
    Type: TypeString
    Description: |-
        How to combine the results of multiple conditions to
        determine if an incident should be opened. Possible values: ["AND", "OR", "AND_WITH_MATCHING_RESOURCE"]
    Required: "true"
conditions:
    Type: TypeList
    Description: |-
        A list of conditions for the policy. The conditions are combined by
        AND or OR according to the combiner field. If the combined conditions
        evaluate to true, then an incident is created. A policy can have from
        one to six conditions.
    Required: "true"
    Properties:
        condition_absent:
            Type: TypeList
            Description: |-
                A condition that checks that a time series
                continues to receive new data points.
            Optional: "true"
            MaxItems: "1"
            Properties:
                aggregations:
                    Type: TypeList
                    Description: |-
                        Specifies the alignment of data points in
                        individual time series as well as how to
                        combine the retrieved time series together
                        (such as when aggregating multiple streams
                        on each resource to a single stream for each
                        resource or when aggregating streams across
                        all members of a group of resources).
                        Multiple aggregations are applied in the
                        order specified.
                    Optional: "true"
                    Properties:
                        alignment_period:
                            Type: TypeString
                            Description: |-
                                The alignment period for per-time
                                series alignment. If present,
                                alignmentPeriod must be at least
                                60 seconds. After per-time series
                                alignment, each time series will
                                contain data points only on the
                                period boundaries. If
                                perSeriesAligner is not specified
                                or equals ALIGN_NONE, then this
                                field is ignored. If
                                perSeriesAligner is specified and
                                does not equal ALIGN_NONE, then
                                this field must be defined;
                                otherwise an error is returned.
                            Optional: "true"
                        cross_series_reducer:
                            Type: TypeString
                            Description: |-
                                The approach to be used to combine
                                time series. Not all reducer
                                functions may be applied to all
                                time series, depending on the
                                metric type and the value type of
                                the original time series.
                                Reduction may change the metric
                                type of value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["REDUCE_NONE", "REDUCE_MEAN", "REDUCE_MIN", "REDUCE_MAX", "REDUCE_SUM", "REDUCE_STDDEV", "REDUCE_COUNT", "REDUCE_COUNT_TRUE", "REDUCE_COUNT_FALSE", "REDUCE_FRACTION_TRUE", "REDUCE_PERCENTILE_99", "REDUCE_PERCENTILE_95", "REDUCE_PERCENTILE_50", "REDUCE_PERCENTILE_05"]
                            Optional: "true"
                        group_by_fields:
                            Type: TypeList
                            Description: |-
                                The set of fields to preserve when
                                crossSeriesReducer is specified.
                                The groupByFields determine how
                                the time series are partitioned
                                into subsets prior to applying the
                                aggregation function. Each subset
                                contains time series that have the
                                same value for each of the
                                grouping fields. Each individual
                                time series is a member of exactly
                                one subset. The crossSeriesReducer
                                is applied to each subset of time
                                series. It is not possible to
                                reduce across different resource
                                types, so this field implicitly
                                contains resource.type. Fields not
                                specified in groupByFields are
                                aggregated away. If groupByFields
                                is not specified and all the time
                                series have the same resource
                                type, then the time series are
                                aggregated into a single output
                                time series. If crossSeriesReducer
                                is not defined, this field is
                                ignored.
                            Optional: "true"
                        per_series_aligner:
                            Type: TypeString
                            Description: |-
                                The approach to be used to align
                                individual time series. Not all
                                alignment functions may be applied
                                to all time series, depending on
                                the metric type and value type of
                                the original time series.
                                Alignment may change the metric
                                type or the value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["ALIGN_NONE", "ALIGN_DELTA", "ALIGN_RATE", "ALIGN_INTERPOLATE", "ALIGN_NEXT_OLDER", "ALIGN_MIN", "ALIGN_MAX", "ALIGN_MEAN", "ALIGN_COUNT", "ALIGN_SUM", "ALIGN_STDDEV", "ALIGN_COUNT_TRUE", "ALIGN_COUNT_FALSE", "ALIGN_FRACTION_TRUE", "ALIGN_PERCENTILE_99", "ALIGN_PERCENTILE_95", "ALIGN_PERCENTILE_50", "ALIGN_PERCENTILE_05", "ALIGN_PERCENT_CHANGE"]
                            Optional: "true"
                duration:
                    Type: TypeString
                    Description: |-
                        The amount of time that a time series must
                        fail to report new data to be considered
                        failing. Currently, only values that are a
                        multiple of a minute--e.g. 60s, 120s, or 300s
                        --are supported.
                    Required: "true"
                filter:
                    Type: TypeString
                    Description: |-
                        A filter that identifies which time series
                        should be compared with the threshold.The
                        filter is similar to the one that is
                        specified in the
                        MetricService.ListTimeSeries request (that
                        call is useful to verify the time series
                        that will be retrieved / processed) and must
                        specify the metric type and optionally may
                        contain restrictions on resource type,
                        resource labels, and metric labels. This
                        field may not exceed 2048 Unicode characters
                        in length.
                    Optional: "true"
                trigger:
                    Type: TypeList
                    Description: |-
                        The number/percent of time series for which
                        the comparison must hold in order for the
                        condition to trigger. If unspecified, then
                        the condition will trigger if the comparison
                        is true for any of the time series that have
                        been identified by filter and aggregations.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        count:
                            Type: TypeInt
                            Description: |-
                                The absolute number of time series
                                that must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
                        percent:
                            Type: TypeFloat
                            Description: |-
                                The percentage of time series that
                                must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
        condition_matched_log:
            Type: TypeList
            Description: |-
                A condition that checks for log messages matching given constraints.
                If set, no other conditions can be present.
            Optional: "true"
            MaxItems: "1"
            Properties:
                filter:
                    Type: TypeString
                    Description: A logs-based filter.
                    Required: "true"
                label_extractors:
                    Type: TypeMap
                    Description: |-
                        A map from a label key to an extractor expression, which is used to
                        extract the value for this label key. Each entry in this map is
                        a specification for how data should be extracted from log entries that
                        match filter. Each combination of extracted values is treated as
                        a separate rule for the purposes of triggering notifications.
                        Label keys and corresponding values can be used in notifications
                        generated by this condition.
                    Optional: "true"
        condition_monitoring_query_language:
            Type: TypeList
            Description: A Monitoring Query Language query that outputs a boolean stream
            Optional: "true"
            MaxItems: "1"
            Properties:
                duration:
                    Type: TypeString
                    Description: |-
                        The amount of time that a time series must
                        violate the threshold to be considered
                        failing. Currently, only values that are a
                        multiple of a minute--e.g., 0, 60, 120, or
                        300 seconds--are supported. If an invalid
                        value is given, an error will be returned.
                        When choosing a duration, it is useful to
                        keep in mind the frequency of the underlying
                        time series data (which may also be affected
                        by any alignments specified in the
                        aggregations field); a good duration is long
                        enough so that a single outlier does not
                        generate spurious alerts, but short enough
                        that unhealthy states are detected and
                        alerted on quickly.
                    Required: "true"
                evaluation_missing_data:
                    Type: TypeString
                    Description: |-
                        A condition control that determines how
                        metric-threshold conditions are evaluated when
                        data stops arriving. Possible values: ["EVALUATION_MISSING_DATA_INACTIVE", "EVALUATION_MISSING_DATA_ACTIVE", "EVALUATION_MISSING_DATA_NO_OP"]
                    Optional: "true"
                query:
                    Type: TypeString
                    Description: Monitoring Query Language query that outputs a boolean stream.
                    Required: "true"
                trigger:
                    Type: TypeList
                    Description: |-
                        The number/percent of time series for which
                        the comparison must hold in order for the
                        condition to trigger. If unspecified, then
                        the condition will trigger if the comparison
                        is true for any of the time series that have
                        been identified by filter and aggregations,
                        or by the ratio, if denominator_filter and
                        denominator_aggregations are specified.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        count:
                            Type: TypeInt
                            Description: |-
                                The absolute number of time series
                                that must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
                        percent:
                            Type: TypeFloat
                            Description: |-
                                The percentage of time series that
                                must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
        condition_prometheus_query_language:
            Type: TypeList
            Description: |-
                A condition type that allows alert policies to be defined using
                Prometheus Query Language (PromQL).

                The PrometheusQueryLanguageCondition message contains information
                from a Prometheus alerting rule and its associated rule group.
            Optional: "true"
            MaxItems: "1"
            Properties:
                alert_rule:
                    Type: TypeString
                    Description: |-
                        The alerting rule name of this alert in the corresponding Prometheus
                        configuration file.

                        Some external tools may require this field to be populated correctly
                        in order to refer to the original Prometheus configuration file.
                        The rule group name and the alert name are necessary to update the
                        relevant AlertPolicies in case the definition of the rule group changes
                        in the future.

                        This field is optional. If this field is not empty, then it must be a
                        valid Prometheus label name.
                    Optional: "true"
                duration:
                    Type: TypeString
                    Description: |-
                        Alerts are considered firing once their PromQL expression evaluated
                        to be "true" for this long. Alerts whose PromQL expression was not
                        evaluated to be "true" for long enough are considered pending. The
                        default value is zero. Must be zero or positive.
                    Optional: "true"
                evaluation_interval:
                    Type: TypeString
                    Description: |-
                        How often this rule should be evaluated. Must be a positive multiple
                        of 30 seconds or missing. The default value is 30 seconds. If this
                        PrometheusQueryLanguageCondition was generated from a Prometheus
                        alerting rule, then this value should be taken from the enclosing
                        rule group.
                    Optional: "true"
                labels:
                    Type: TypeMap
                    Description: |-
                        Labels to add to or overwrite in the PromQL query result. Label names
                        must be valid.

                        Label values can be templatized by using variables. The only available
                        variable names are the names of the labels in the PromQL result, including
                        "__name__" and "value". "labels" may be empty. This field is intended to be
                        used for organizing and identifying the AlertPolicy
                    Optional: "true"
                query:
                    Type: TypeString
                    Description: |-
                        The PromQL expression to evaluate. Every evaluation cycle this
                        expression is evaluated at the current time, and all resultant time
                        series become pending/firing alerts. This field must not be empty.
                    Required: "true"
                rule_group:
                    Type: TypeString
                    Description: |-
                        The rule group name of this alert in the corresponding Prometheus
                        configuration file.

                        Some external tools may require this field to be populated correctly
                        in order to refer to the original Prometheus configuration file.
                        The rule group name and the alert name are necessary to update the
                        relevant AlertPolicies in case the definition of the rule group changes
                        in the future. This field is optional.
                    Optional: "true"
        condition_threshold:
            Type: TypeList
            Description: |-
                A condition that compares a time series against a
                threshold.
            Optional: "true"
            MaxItems: "1"
            Properties:
                aggregations:
                    Type: TypeList
                    Description: |-
                        Specifies the alignment of data points in
                        individual time series as well as how to
                        combine the retrieved time series together
                        (such as when aggregating multiple streams
                        on each resource to a single stream for each
                        resource or when aggregating streams across
                        all members of a group of resources).
                        Multiple aggregations are applied in the
                        order specified.This field is similar to the
                        one in the MetricService.ListTimeSeries
                        request. It is advisable to use the
                        ListTimeSeries method when debugging this
                        field.
                    Optional: "true"
                    Properties:
                        alignment_period:
                            Type: TypeString
                            Description: |-
                                The alignment period for per-time
                                series alignment. If present,
                                alignmentPeriod must be at least
                                60 seconds. After per-time series
                                alignment, each time series will
                                contain data points only on the
                                period boundaries. If
                                perSeriesAligner is not specified
                                or equals ALIGN_NONE, then this
                                field is ignored. If
                                perSeriesAligner is specified and
                                does not equal ALIGN_NONE, then
                                this field must be defined;
                                otherwise an error is returned.
                            Optional: "true"
                        cross_series_reducer:
                            Type: TypeString
                            Description: |-
                                The approach to be used to combine
                                time series. Not all reducer
                                functions may be applied to all
                                time series, depending on the
                                metric type and the value type of
                                the original time series.
                                Reduction may change the metric
                                type of value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["REDUCE_NONE", "REDUCE_MEAN", "REDUCE_MIN", "REDUCE_MAX", "REDUCE_SUM", "REDUCE_STDDEV", "REDUCE_COUNT", "REDUCE_COUNT_TRUE", "REDUCE_COUNT_FALSE", "REDUCE_FRACTION_TRUE", "REDUCE_PERCENTILE_99", "REDUCE_PERCENTILE_95", "REDUCE_PERCENTILE_50", "REDUCE_PERCENTILE_05"]
                            Optional: "true"
                        group_by_fields:
                            Type: TypeList
                            Description: |-
                                The set of fields to preserve when
                                crossSeriesReducer is specified.
                                The groupByFields determine how
                                the time series are partitioned
                                into subsets prior to applying the
                                aggregation function. Each subset
                                contains time series that have the
                                same value for each of the
                                grouping fields. Each individual
                                time series is a member of exactly
                                one subset. The crossSeriesReducer
                                is applied to each subset of time
                                series. It is not possible to
                                reduce across different resource
                                types, so this field implicitly
                                contains resource.type. Fields not
                                specified in groupByFields are
                                aggregated away. If groupByFields
                                is not specified and all the time
                                series have the same resource
                                type, then the time series are
                                aggregated into a single output
                                time series. If crossSeriesReducer
                                is not defined, this field is
                                ignored.
                            Optional: "true"
                        per_series_aligner:
                            Type: TypeString
                            Description: |-
                                The approach to be used to align
                                individual time series. Not all
                                alignment functions may be applied
                                to all time series, depending on
                                the metric type and value type of
                                the original time series.
                                Alignment may change the metric
                                type or the value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["ALIGN_NONE", "ALIGN_DELTA", "ALIGN_RATE", "ALIGN_INTERPOLATE", "ALIGN_NEXT_OLDER", "ALIGN_MIN", "ALIGN_MAX", "ALIGN_MEAN", "ALIGN_COUNT", "ALIGN_SUM", "ALIGN_STDDEV", "ALIGN_COUNT_TRUE", "ALIGN_COUNT_FALSE", "ALIGN_FRACTION_TRUE", "ALIGN_PERCENTILE_99", "ALIGN_PERCENTILE_95", "ALIGN_PERCENTILE_50", "ALIGN_PERCENTILE_05", "ALIGN_PERCENT_CHANGE"]
                            Optional: "true"
                comparison:
                    Type: TypeString
                    Description: |-
                        The comparison to apply between the time
                        series (indicated by filter and aggregation)
                        and the threshold (indicated by
                        threshold_value). The comparison is applied
                        on each time series, with the time series on
                        the left-hand side and the threshold on the
                        right-hand side. Only COMPARISON_LT and
                        COMPARISON_GT are supported currently. Possible values: ["COMPARISON_GT", "COMPARISON_GE", "COMPARISON_LT", "COMPARISON_LE", "COMPARISON_EQ", "COMPARISON_NE"]
                    Required: "true"
                denominator_aggregations:
                    Type: TypeList
                    Description: |-
                        Specifies the alignment of data points in
                        individual time series selected by
                        denominatorFilter as well as how to combine
                        the retrieved time series together (such as
                        when aggregating multiple streams on each
                        resource to a single stream for each
                        resource or when aggregating streams across
                        all members of a group of resources).When
                        computing ratios, the aggregations and
                        denominator_aggregations fields must use the
                        same alignment period and produce time
                        series that have the same periodicity and
                        labels.This field is similar to the one in
                        the MetricService.ListTimeSeries request. It
                        is advisable to use the ListTimeSeries
                        method when debugging this field.
                    Optional: "true"
                    Properties:
                        alignment_period:
                            Type: TypeString
                            Description: |-
                                The alignment period for per-time
                                series alignment. If present,
                                alignmentPeriod must be at least
                                60 seconds. After per-time series
                                alignment, each time series will
                                contain data points only on the
                                period boundaries. If
                                perSeriesAligner is not specified
                                or equals ALIGN_NONE, then this
                                field is ignored. If
                                perSeriesAligner is specified and
                                does not equal ALIGN_NONE, then
                                this field must be defined;
                                otherwise an error is returned.
                            Optional: "true"
                        cross_series_reducer:
                            Type: TypeString
                            Description: |-
                                The approach to be used to combine
                                time series. Not all reducer
                                functions may be applied to all
                                time series, depending on the
                                metric type and the value type of
                                the original time series.
                                Reduction may change the metric
                                type of value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["REDUCE_NONE", "REDUCE_MEAN", "REDUCE_MIN", "REDUCE_MAX", "REDUCE_SUM", "REDUCE_STDDEV", "REDUCE_COUNT", "REDUCE_COUNT_TRUE", "REDUCE_COUNT_FALSE", "REDUCE_FRACTION_TRUE", "REDUCE_PERCENTILE_99", "REDUCE_PERCENTILE_95", "REDUCE_PERCENTILE_50", "REDUCE_PERCENTILE_05"]
                            Optional: "true"
                        group_by_fields:
                            Type: TypeList
                            Description: |-
                                The set of fields to preserve when
                                crossSeriesReducer is specified.
                                The groupByFields determine how
                                the time series are partitioned
                                into subsets prior to applying the
                                aggregation function. Each subset
                                contains time series that have the
                                same value for each of the
                                grouping fields. Each individual
                                time series is a member of exactly
                                one subset. The crossSeriesReducer
                                is applied to each subset of time
                                series. It is not possible to
                                reduce across different resource
                                types, so this field implicitly
                                contains resource.type. Fields not
                                specified in groupByFields are
                                aggregated away. If groupByFields
                                is not specified and all the time
                                series have the same resource
                                type, then the time series are
                                aggregated into a single output
                                time series. If crossSeriesReducer
                                is not defined, this field is
                                ignored.
                            Optional: "true"
                        per_series_aligner:
                            Type: TypeString
                            Description: |-
                                The approach to be used to align
                                individual time series. Not all
                                alignment functions may be applied
                                to all time series, depending on
                                the metric type and value type of
                                the original time series.
                                Alignment may change the metric
                                type or the value type of the time
                                series.Time series data must be
                                aligned in order to perform cross-
                                time series reduction. If
                                crossSeriesReducer is specified,
                                then perSeriesAligner must be
                                specified and not equal ALIGN_NONE
                                and alignmentPeriod must be
                                specified; otherwise, an error is
                                returned. Possible values: ["ALIGN_NONE", "ALIGN_DELTA", "ALIGN_RATE", "ALIGN_INTERPOLATE", "ALIGN_NEXT_OLDER", "ALIGN_MIN", "ALIGN_MAX", "ALIGN_MEAN", "ALIGN_COUNT", "ALIGN_SUM", "ALIGN_STDDEV", "ALIGN_COUNT_TRUE", "ALIGN_COUNT_FALSE", "ALIGN_FRACTION_TRUE", "ALIGN_PERCENTILE_99", "ALIGN_PERCENTILE_95", "ALIGN_PERCENTILE_50", "ALIGN_PERCENTILE_05", "ALIGN_PERCENT_CHANGE"]
                            Optional: "true"
                denominator_filter:
                    Type: TypeString
                    Description: |-
                        A filter that identifies a time series that
                        should be used as the denominator of a ratio
                        that will be compared with the threshold. If
                        a denominator_filter is specified, the time
                        series specified by the filter field will be
                        used as the numerator.The filter is similar
                        to the one that is specified in the
                        MetricService.ListTimeSeries request (that
                        call is useful to verify the time series
                        that will be retrieved / processed) and must
                        specify the metric type and optionally may
                        contain restrictions on resource type,
                        resource labels, and metric labels. This
                        field may not exceed 2048 Unicode characters
                        in length.
                    Optional: "true"
                duration:
                    Type: TypeString
                    Description: |-
                        The amount of time that a time series must
                        violate the threshold to be considered
                        failing. Currently, only values that are a
                        multiple of a minute--e.g., 0, 60, 120, or
                        300 seconds--are supported. If an invalid
                        value is given, an error will be returned.
                        When choosing a duration, it is useful to
                        keep in mind the frequency of the underlying
                        time series data (which may also be affected
                        by any alignments specified in the
                        aggregations field); a good duration is long
                        enough so that a single outlier does not
                        generate spurious alerts, but short enough
                        that unhealthy states are detected and
                        alerted on quickly.
                    Required: "true"
                evaluation_missing_data:
                    Type: TypeString
                    Description: |-
                        A condition control that determines how
                        metric-threshold conditions are evaluated when
                        data stops arriving. Possible values: ["EVALUATION_MISSING_DATA_INACTIVE", "EVALUATION_MISSING_DATA_ACTIVE", "EVALUATION_MISSING_DATA_NO_OP"]
                    Optional: "true"
                filter:
                    Type: TypeString
                    Description: |-
                        A filter that identifies which time series
                        should be compared with the threshold.The
                        filter is similar to the one that is
                        specified in the
                        MetricService.ListTimeSeries request (that
                        call is useful to verify the time series
                        that will be retrieved / processed) and must
                        specify the metric type and optionally may
                        contain restrictions on resource type,
                        resource labels, and metric labels. This
                        field may not exceed 2048 Unicode characters
                        in length.
                    Optional: "true"
                forecast_options:
                    Type: TypeList
                    Description: |-
                        When this field is present, the 'MetricThreshold'
                        condition forecasts whether the time series is
                        predicted to violate the threshold within the
                        'forecastHorizon'. When this field is not set, the
                        'MetricThreshold' tests the current value of the
                        timeseries against the threshold.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        forecast_horizon:
                            Type: TypeString
                            Description: |-
                                The length of time into the future to forecast
                                whether a timeseries will violate the threshold.
                                If the predicted value is found to violate the
                                threshold, and the violation is observed in all
                                forecasts made for the Configured 'duration',
                                then the timeseries is considered to be failing.
                            Required: "true"
                threshold_value:
                    Type: TypeFloat
                    Description: |-
                        A value against which to compare the time
                        series.
                    Optional: "true"
                trigger:
                    Type: TypeList
                    Description: |-
                        The number/percent of time series for which
                        the comparison must hold in order for the
                        condition to trigger. If unspecified, then
                        the condition will trigger if the comparison
                        is true for any of the time series that have
                        been identified by filter and aggregations,
                        or by the ratio, if denominator_filter and
                        denominator_aggregations are specified.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        count:
                            Type: TypeInt
                            Description: |-
                                The absolute number of time series
                                that must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
                        percent:
                            Type: TypeFloat
                            Description: |-
                                The percentage of time series that
                                must fail the predicate for the
                                condition to be triggered.
                            Optional: "true"
        display_name:
            Type: TypeString
            Description: |-
                A short name or phrase used to identify the
                condition in dashboards, notifications, and
                incidents. To avoid confusion, don't use the same
                display name for multiple conditions in the same
                policy.
            Required: "true"
        name:
            Type: TypeString
            Description: |-
                The unique resource name for this condition.
                Its syntax is:
                projects/[PROJECT_ID]/alertPolicies/[POLICY_ID]/conditions/[CONDITION_ID]
                [CONDITION_ID] is assigned by Stackdriver Monitoring when
                the condition is created as part of a new or updated alerting
                policy.
            Computed: "true"
creation_record:
    Type: TypeList
    Description: |-
        A read-only record of the creation of the alerting policy.
        If provided in a call to create or update, this field will
        be ignored.
    Computed: "true"
    Properties:
        mutate_time:
            Type: TypeString
            Description: When the change occurred.
            Computed: "true"
        mutated_by:
            Type: TypeString
            Description: The email address of the user making the change.
            Computed: "true"
display_name:
    Type: TypeString
    Description: |-
        A short name or phrase used to identify the policy in
        dashboards, notifications, and incidents. To avoid confusion, don't use
        the same display name for multiple policies in the same project. The
        name is limited to 512 Unicode characters.
    Required: "true"
documentation:
    Type: TypeList
    Description: |-
        Documentation that is included with notifications and incidents related
        to this policy. Best practice is for the documentation to include information
        to help responders understand, mitigate, escalate, and correct the underlying
        problems detected by the alerting policy. Notification channels that have
        limited capacity might not show this documentation.
    Optional: "true"
    MaxItems: "1"
    Properties:
        content:
            Type: TypeString
            Description: |-
                The text of the documentation, interpreted according to mimeType.
                The content may not exceed 8,192 Unicode characters and may not
                exceed more than 10,240 bytes when encoded in UTF-8 format,
                whichever is smaller.
            Optional: "true"
            AtLeastOneOf: documentation.0.content, documentation.0.mime_type, documentation.0.subject
        mime_type:
            Type: TypeString
            Description: |-
                The format of the content field. Presently, only the value
                "text/markdown" is supported.
            Optional: "true"
            AtLeastOneOf: documentation.0.content, documentation.0.mime_type, documentation.0.subject
        subject:
            Type: TypeString
            Description: |-
                The subject line of the notification. The subject line may not
                exceed 10,240 bytes. In notifications generated by this policy the contents
                of the subject line after variable expansion will be truncated to 255 bytes
                or shorter at the latest UTF-8 character boundary.
            Optional: "true"
            AtLeastOneOf: documentation.0.content, documentation.0.mime_type, documentation.0.subject
enabled:
    Type: TypeBool
    Description: Whether or not the policy is enabled. The default is true.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        The unique resource name for this policy.
        Its syntax is: projects/[PROJECT_ID]/alertPolicies/[ALERT_POLICY_ID]
    Computed: "true"
notification_channels:
    Type: TypeList
    Description: |-
        Identifies the notification channels to which notifications should be
        sent when incidents are opened or closed or when new violations occur
        on an already opened incident. Each element of this array corresponds
        to the name field in each of the NotificationChannel objects that are
        returned from the notificationChannels.list method. The syntax of the
        entries in this field is
        'projects/[PROJECT_ID]/notificationChannels/[CHANNEL_ID]'
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
severity:
    Type: TypeString
    Description: |-
        The severity of an alert policy indicates how important incidents generated
        by that policy are. The severity level will be displayed on the Incident
        detail page and in notifications. Possible values: ["CRITICAL", "ERROR", "WARNING"]
    Optional: "true"
user_labels:
    Type: TypeMap
    Description: |-
        This field is intended to be used for organizing and identifying the AlertPolicy
        objects.The field can contain up to 64 entries. Each key and value is limited
        to 63 Unicode characters or 128 bytes, whichever is smaller. Labels and values
        can contain only lowercase letters, numerals, underscores, and dashes. Keys
        must begin with a letter.
    Optional: "true"

