basic_sli:
    Type: TypeList
    Description: |-
        Basic Service-Level Indicator (SLI) on a well-known service type.
        Performance will be computed on the basis of pre-defined metrics.

        SLIs are used to measure and calculate the quality of the Service's
        performance with respect to a single aspect of service quality.

        Exactly one of the following must be set:
        'basic_sli', 'request_based_sli', 'windows_based_sli'
    Optional: "true"
    ExactlyOneOf: basic_sli, request_based_sli, windows_based_sli
    MaxItems: "1"
    Properties:
        availability:
            Type: TypeList
            Description: Availability based SLI, dervied from count of requests made to this service that return successfully.
            Optional: "true"
            ExactlyOneOf: basic_sli.0.latency, basic_sli.0.availability
            MaxItems: "1"
            Properties:
                enabled:
                    Type: TypeBool
                    Description: Whether an availability SLI is enabled or not. Must be set to true. Defaults to 'true'.
                    Optional: "true"
        latency:
            Type: TypeList
            Description: Parameters for a latency threshold SLI.
            Optional: "true"
            ExactlyOneOf: basic_sli.0.latency, basic_sli.0.availability
            MaxItems: "1"
            Properties:
                threshold:
                    Type: TypeString
                    Description: |-
                        A duration string, e.g. 10s.
                        Good service is defined to be the count of requests made to
                        this service that return in no more than threshold.
                    Required: "true"
        location:
            Type: TypeSet
            Description: |-
                An optional set of locations to which this SLI is relevant.
                Telemetry from other locations will not be used to calculate
                performance for this SLI. If omitted, this SLI applies to all
                locations in which the Service has activity. For service types
                that don't support breaking down by location, setting this
                field will result in an error.
            Optional: "true"
        method:
            Type: TypeSet
            Description: |-
                An optional set of RPCs to which this SLI is relevant.
                Telemetry from other methods will not be used to calculate
                performance for this SLI. If omitted, this SLI applies to all
                the Service's methods. For service types that don't support
                breaking down by method, setting this field will result in an
                error.
            Optional: "true"
        version:
            Type: TypeSet
            Description: |-
                The set of API versions to which this SLI is relevant.
                Telemetry from other API versions will not be used to
                calculate performance for this SLI. If omitted,
                this SLI applies to all API versions. For service types
                that don't support breaking down by version, setting this
                field will result in an error.
            Optional: "true"
calendar_period:
    Type: TypeString
    Description: |-
        A calendar period, semantically "since the start of the current
        <calendarPeriod>". Possible values: ["DAY", "WEEK", "FORTNIGHT", "MONTH"]
    Optional: "true"
    ExactlyOneOf: rolling_period_days, calendar_period
display_name:
    Type: TypeString
    Description: Name used for UI elements listing this SLO.
    Optional: "true"
goal:
    Type: TypeFloat
    Description: |-
        The fraction of service that must be good in order for this objective
        to be met. 0 < goal <= 0.999
    Required: "true"
name:
    Type: TypeString
    Description: |-
        The full resource name for this service. The syntax is:
        projects/[PROJECT_ID_OR_NUMBER]/services/[SERVICE_ID]/serviceLevelObjectives/[SLO_NAME]
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
request_based_sli:
    Type: TypeList
    Description: |-
        A request-based SLI defines a SLI for which atomic units of
        service are counted directly.

        A SLI describes a good service.
        It is used to measure and calculate the quality of the Service's
        performance with respect to a single aspect of service quality.
        Exactly one of the following must be set:
        'basic_sli', 'request_based_sli', 'windows_based_sli'
    Optional: "true"
    ExactlyOneOf: basic_sli, request_based_sli, windows_based_sli
    MaxItems: "1"
    Properties:
        distribution_cut:
            Type: TypeList
            Description: |-
                Used when good_service is defined by a count of values aggregated in a
                Distribution that fall into a good range. The total_service is the
                total count of all values aggregated in the Distribution.
                Defines a distribution TimeSeries filter and thresholds used for
                measuring good service and total service.

                Exactly one of 'distribution_cut' or 'good_total_ratio' can be set.
            Optional: "true"
            ExactlyOneOf: request_based_sli.0.good_total_ratio, request_based_sli.0.distribution_cut
            MaxItems: "1"
            Properties:
                distribution_filter:
                    Type: TypeString
                    Description: |-
                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        aggregating values to quantify the good service provided.

                        Must have ValueType = DISTRIBUTION and
                        MetricKind = DELTA or MetricKind = CUMULATIVE.
                    Required: "true"
                range:
                    Type: TypeList
                    Description: |-
                        Range of numerical values. The computed good_service
                        will be the count of values x in the Distribution such
                        that range.min <= x <= range.max. inclusive of min and
                        max. Open ranges can be defined by setting
                        just one of min or max.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        max:
                            Type: TypeFloat
                            Description: |-
                                max value for the range (inclusive). If not given,
                                will be set to 0
                            Optional: "true"
                            AtLeastOneOf: request_based_sli.0.distribution_cut.0.range.0.min, request_based_sli.0.distribution_cut.0.range.0.max
                        min:
                            Type: TypeFloat
                            Description: |-
                                Min value for the range (inclusive). If not given,
                                will be set to 0
                            Optional: "true"
                            AtLeastOneOf: request_based_sli.0.distribution_cut.0.range.0.min, request_based_sli.0.distribution_cut.0.range.0.max
        good_total_ratio:
            Type: TypeList
            Description: |-
                A means to compute a ratio of 'good_service' to 'total_service'.
                Defines computing this ratio with two TimeSeries [monitoring filters](https://cloud.google.com/monitoring/api/v3/filters)
                Must specify exactly two of good, bad, and total service filters.
                The relationship good_service + bad_service = total_service
                will be assumed.

                Exactly one of 'distribution_cut' or 'good_total_ratio' can be set.
            Optional: "true"
            ExactlyOneOf: request_based_sli.0.good_total_ratio, request_based_sli.0.distribution_cut
            MaxItems: "1"
            Properties:
                bad_service_filter:
                    Type: TypeString
                    Description: |-
                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        quantifying bad service provided, either demanded service that
                        was not provided or demanded service that was of inadequate
                        quality.

                        Must have ValueType = DOUBLE or ValueType = INT64 and
                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.

                        Exactly two of 'good_service_filter','bad_service_filter','total_service_filter'
                        must be set (good + bad = total is assumed).
                    Optional: "true"
                    AtLeastOneOf: request_based_sli.0.good_total_ratio.0.good_service_filter, request_based_sli.0.good_total_ratio.0.bad_service_filter, request_based_sli.0.good_total_ratio.0.total_service_filter
                good_service_filter:
                    Type: TypeString
                    Description: |-
                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        quantifying good service provided.
                        Must have ValueType = DOUBLE or ValueType = INT64 and
                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.

                        Exactly two of 'good_service_filter','bad_service_filter','total_service_filter'
                        must be set (good + bad = total is assumed).
                    Optional: "true"
                    AtLeastOneOf: request_based_sli.0.good_total_ratio.0.good_service_filter, request_based_sli.0.good_total_ratio.0.bad_service_filter, request_based_sli.0.good_total_ratio.0.total_service_filter
                total_service_filter:
                    Type: TypeString
                    Description: |-
                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        quantifying total demanded service.

                        Must have ValueType = DOUBLE or ValueType = INT64 and
                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.

                        Exactly two of 'good_service_filter','bad_service_filter','total_service_filter'
                        must be set (good + bad = total is assumed).
                    Optional: "true"
                    AtLeastOneOf: request_based_sli.0.good_total_ratio.0.good_service_filter, request_based_sli.0.good_total_ratio.0.bad_service_filter, request_based_sli.0.good_total_ratio.0.total_service_filter
rolling_period_days:
    Type: TypeInt
    Description: |-
        A rolling time period, semantically "in the past X days".
        Must be between 1 to 30 days, inclusive.
    Optional: "true"
    ExactlyOneOf: rolling_period_days, calendar_period
service:
    Type: TypeString
    Description: ID of the service to which this SLO belongs.
    Required: "true"
slo_id:
    Type: TypeString
    Description: The id to use for this ServiceLevelObjective. If omitted, an id will be generated instead.
    Computed: "true"
    Optional: "true"
user_labels:
    Type: TypeMap
    Description: |-
        This field is intended to be used for organizing and identifying the AlertPolicy
        objects.The field can contain up to 64 entries. Each key and value is limited
        to 63 Unicode characters or 128 bytes, whichever is smaller. Labels and values
        can contain only lowercase letters, numerals, underscores, and dashes. Keys
        must begin with a letter.
    Optional: "true"
windows_based_sli:
    Type: TypeList
    Description: |-
        A windows-based SLI defines the criteria for time windows.
        good_service is defined based off the count of these time windows
        for which the provided service was of good quality.

        A SLI describes a good service. It is used to measure and calculate
        the quality of the Service's performance with respect to a single
        aspect of service quality.

        Exactly one of the following must be set:
        'basic_sli', 'request_based_sli', 'windows_based_sli'
    Optional: "true"
    ExactlyOneOf: basic_sli, request_based_sli, windows_based_sli
    MaxItems: "1"
    Properties:
        good_bad_metric_filter:
            Type: TypeString
            Description: |-
                A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                with ValueType = BOOL. The window is good if any true values
                appear in the window. One of 'good_bad_metric_filter',
                'good_total_ratio_threshold', 'metric_mean_in_range',
                'metric_sum_in_range' must be set for 'windows_based_sli'.
            Optional: "true"
            ExactlyOneOf: windows_based_sli.0.good_bad_metric_filter, windows_based_sli.0.good_total_ratio_threshold, windows_based_sli.0.metric_mean_in_range, windows_based_sli.0.metric_sum_in_range
        good_total_ratio_threshold:
            Type: TypeList
            Description: |-
                Criterion that describes a window as good if its performance is
                high enough. One of 'good_bad_metric_filter',
                'good_total_ratio_threshold', 'metric_mean_in_range',
                'metric_sum_in_range' must be set for 'windows_based_sli'.
            Optional: "true"
            ExactlyOneOf: windows_based_sli.0.good_bad_metric_filter, windows_based_sli.0.good_total_ratio_threshold, windows_based_sli.0.metric_mean_in_range, windows_based_sli.0.metric_sum_in_range
            MaxItems: "1"
            Properties:
                basic_sli_performance:
                    Type: TypeList
                    Description: Basic SLI to evaluate to judge window quality.
                    Optional: "true"
                    ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance, windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance
                    MaxItems: "1"
                    Properties:
                        availability:
                            Type: TypeList
                            Description: Availability based SLI, dervied from count of requests made to this service that return successfully.
                            Optional: "true"
                            ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance.0.latency, windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance.0.availability
                            MaxItems: "1"
                            Properties:
                                enabled:
                                    Type: TypeBool
                                    Description: Whether an availability SLI is enabled or not. Must be set to 'true. Defaults to 'true'.
                                    Optional: "true"
                        latency:
                            Type: TypeList
                            Description: Parameters for a latency threshold SLI.
                            Optional: "true"
                            ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance.0.latency, windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance.0.availability
                            MaxItems: "1"
                            Properties:
                                threshold:
                                    Type: TypeString
                                    Description: |-
                                        A duration string, e.g. 10s.
                                        Good service is defined to be the count of requests made to
                                        this service that return in no more than threshold.
                                    Required: "true"
                        location:
                            Type: TypeSet
                            Description: |-
                                An optional set of locations to which this SLI is relevant.
                                Telemetry from other locations will not be used to calculate
                                performance for this SLI. If omitted, this SLI applies to all
                                locations in which the Service has activity. For service types
                                that don't support breaking down by location, setting this
                                field will result in an error.
                            Optional: "true"
                        method:
                            Type: TypeSet
                            Description: |-
                                An optional set of RPCs to which this SLI is relevant.
                                Telemetry from other methods will not be used to calculate
                                performance for this SLI. If omitted, this SLI applies to all
                                the Service's methods. For service types that don't support
                                breaking down by method, setting this field will result in an
                                error.
                            Optional: "true"
                        version:
                            Type: TypeSet
                            Description: |-
                                The set of API versions to which this SLI is relevant.
                                Telemetry from other API versions will not be used to
                                calculate performance for this SLI. If omitted,
                                this SLI applies to all API versions. For service types
                                that don't support breaking down by version, setting this
                                field will result in an error.
                            Optional: "true"
                performance:
                    Type: TypeList
                    Description: Request-based SLI to evaluate to judge window quality.
                    Optional: "true"
                    ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance, windows_based_sli.0.good_total_ratio_threshold.0.basic_sli_performance
                    MaxItems: "1"
                    Properties:
                        distribution_cut:
                            Type: TypeList
                            Description: |-
                                Used when good_service is defined by a count of values aggregated in a
                                Distribution that fall into a good range. The total_service is the
                                total count of all values aggregated in the Distribution.
                                Defines a distribution TimeSeries filter and thresholds used for
                                measuring good service and total service.
                            Optional: "true"
                            ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut
                            MaxItems: "1"
                            Properties:
                                distribution_filter:
                                    Type: TypeString
                                    Description: |-
                                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                                        aggregating values to quantify the good service provided.

                                        Must have ValueType = DISTRIBUTION and
                                        MetricKind = DELTA or MetricKind = CUMULATIVE.
                                    Required: "true"
                                range:
                                    Type: TypeList
                                    Description: |-
                                        Range of numerical values. The computed good_service
                                        will be the count of values x in the Distribution such
                                        that range.min <= x <= range.max. inclusive of min and
                                        max. Open ranges can be defined by setting
                                        just one of min or max.
                                    Required: "true"
                                    MaxItems: "1"
                                    Properties:
                                        max:
                                            Type: TypeFloat
                                            Description: |-
                                                max value for the range (inclusive). If not given,
                                                will be set to 0
                                            Optional: "true"
                                            AtLeastOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut.0.range.0.min, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut.0.range.0.max
                                        min:
                                            Type: TypeFloat
                                            Description: |-
                                                Min value for the range (inclusive). If not given,
                                                will be set to 0
                                            Optional: "true"
                                            AtLeastOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut.0.range.0.min, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut.0.range.0.max
                        good_total_ratio:
                            Type: TypeList
                            Description: |-
                                A means to compute a ratio of 'good_service' to 'total_service'.
                                Defines computing this ratio with two TimeSeries [monitoring filters](https://cloud.google.com/monitoring/api/v3/filters)
                                Must specify exactly two of good, bad, and total service filters.
                                The relationship good_service + bad_service = total_service
                                will be assumed.
                            Optional: "true"
                            ExactlyOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.distribution_cut
                            MaxItems: "1"
                            Properties:
                                bad_service_filter:
                                    Type: TypeString
                                    Description: |-
                                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                                        quantifying bad service provided, either demanded service that
                                        was not provided or demanded service that was of inadequate
                                        quality. Exactly two of
                                        good, bad, or total service filter must be defined (where
                                        good + bad = total is assumed)

                                        Must have ValueType = DOUBLE or ValueType = INT64 and
                                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.
                                    Optional: "true"
                                    AtLeastOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.good_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.bad_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.total_service_filter
                                good_service_filter:
                                    Type: TypeString
                                    Description: |-
                                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                                        quantifying good service provided. Exactly two of
                                        good, bad, or total service filter must be defined (where
                                        good + bad = total is assumed)

                                        Must have ValueType = DOUBLE or ValueType = INT64 and
                                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.
                                    Optional: "true"
                                    AtLeastOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.good_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.bad_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.total_service_filter
                                total_service_filter:
                                    Type: TypeString
                                    Description: |-
                                        A TimeSeries [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                                        quantifying total demanded service. Exactly two of
                                        good, bad, or total service filter must be defined (where
                                        good + bad = total is assumed)

                                        Must have ValueType = DOUBLE or ValueType = INT64 and
                                        must have MetricKind = DELTA or MetricKind = CUMULATIVE.
                                    Optional: "true"
                                    AtLeastOneOf: windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.good_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.bad_service_filter, windows_based_sli.0.good_total_ratio_threshold.0.performance.0.good_total_ratio.0.total_service_filter
                threshold:
                    Type: TypeFloat
                    Description: |-
                        If window performance >= threshold, the window is counted
                        as good.
                    Optional: "true"
        metric_mean_in_range:
            Type: TypeList
            Description: |-
                Criterion that describes a window as good if the metric's value
                is in a good range, *averaged* across returned streams.
                One of 'good_bad_metric_filter',

                'good_total_ratio_threshold', 'metric_mean_in_range',
                'metric_sum_in_range' must be set for 'windows_based_sli'.
                Average value X of 'time_series' should satisfy
                'range.min <= X <= range.max' for a good window.
            Optional: "true"
            ExactlyOneOf: windows_based_sli.0.good_bad_metric_filter, windows_based_sli.0.good_total_ratio_threshold, windows_based_sli.0.metric_mean_in_range, windows_based_sli.0.metric_sum_in_range
            MaxItems: "1"
            Properties:
                range:
                    Type: TypeList
                    Description: |-
                        Range of numerical values. The computed good_service
                        will be the count of values x in the Distribution such
                        that range.min <= x <= range.max. inclusive of min and
                        max. Open ranges can be defined by setting
                        just one of min or max. Mean value 'X' of 'time_series'
                        values should satisfy 'range.min <= X <= range.max' for a
                        good service.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        max:
                            Type: TypeFloat
                            Description: |-
                                max value for the range (inclusive). If not given,
                                will be set to "infinity", defining an open range
                                ">= range.min"
                            Optional: "true"
                            AtLeastOneOf: windows_based_sli.0.metric_mean_in_range.0.range.0.min, windows_based_sli.0.metric_mean_in_range.0.range.0.max
                        min:
                            Type: TypeFloat
                            Description: |-
                                Min value for the range (inclusive). If not given,
                                will be set to "-infinity", defining an open range
                                "< range.max"
                            Optional: "true"
                            AtLeastOneOf: windows_based_sli.0.metric_mean_in_range.0.range.0.min, windows_based_sli.0.metric_mean_in_range.0.range.0.max
                time_series:
                    Type: TypeString
                    Description: |-
                        A [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        specifying the TimeSeries to use for evaluating window
                        The provided TimeSeries must have ValueType = INT64 or
                        ValueType = DOUBLE and MetricKind = GAUGE. Mean value 'X'
                        should satisfy 'range.min <= X <= range.max'
                        under good service.
                    Required: "true"
        metric_sum_in_range:
            Type: TypeList
            Description: |-
                Criterion that describes a window as good if the metric's value
                is in a good range, *summed* across returned streams.
                Summed value 'X' of 'time_series' should satisfy
                'range.min <= X <= range.max' for a good window.

                One of 'good_bad_metric_filter',
                'good_total_ratio_threshold', 'metric_mean_in_range',
                'metric_sum_in_range' must be set for 'windows_based_sli'.
            Optional: "true"
            ExactlyOneOf: windows_based_sli.0.good_bad_metric_filter, windows_based_sli.0.good_total_ratio_threshold, windows_based_sli.0.metric_mean_in_range, windows_based_sli.0.metric_sum_in_range
            MaxItems: "1"
            Properties:
                range:
                    Type: TypeList
                    Description: |-
                        Range of numerical values. The computed good_service
                        will be the count of values x in the Distribution such
                        that range.min <= x <= range.max. inclusive of min and
                        max. Open ranges can be defined by setting
                        just one of min or max. Summed value 'X' should satisfy
                        'range.min <= X <= range.max' for a good window.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        max:
                            Type: TypeFloat
                            Description: |-
                                max value for the range (inclusive). If not given,
                                will be set to "infinity", defining an open range
                                ">= range.min"
                            Optional: "true"
                            AtLeastOneOf: windows_based_sli.0.metric_sum_in_range.0.range.0.min, windows_based_sli.0.metric_sum_in_range.0.range.0.max
                        min:
                            Type: TypeFloat
                            Description: |-
                                Min value for the range (inclusive). If not given,
                                will be set to "-infinity", defining an open range
                                "< range.max"
                            Optional: "true"
                            AtLeastOneOf: windows_based_sli.0.metric_sum_in_range.0.range.0.min, windows_based_sli.0.metric_sum_in_range.0.range.0.max
                time_series:
                    Type: TypeString
                    Description: |-
                        A [monitoring filter](https://cloud.google.com/monitoring/api/v3/filters)
                        specifying the TimeSeries to use for evaluating window
                        quality. The provided TimeSeries must have
                        ValueType = INT64 or ValueType = DOUBLE and
                        MetricKind = GAUGE.

                        Summed value 'X' should satisfy
                        'range.min <= X <= range.max' for a good window.
                    Required: "true"
        window_period:
            Type: TypeString
            Description: |-
                Duration over which window quality is evaluated, given as a
                duration string "{X}s" representing X seconds. Must be an
                integer fraction of a day and at least 60s.
            Optional: "true"

