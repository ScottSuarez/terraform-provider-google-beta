crypto_key_name:
    Type: TypeString
    Description: 'Resource name of the KMS key to use. Only regional keys are supported. Format: ''projects/{{project}}/locations/{{location}}/keyRings/{{key_ring}}/cryptoKeys/{{key}}''.'
    Required: "true"
description:
    Type: TypeString
    Description: Description for the CMEK policy.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
instructions:
    Type: TypeString
    Description: |-
        Access to the key needs to be granted. The instructions contain gcloud commands to run to grant access.

        To make the policy work, a CMEK policy check is required, which verifies key access.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels as key value pairs. Example: '{ "owner": "Bob", "department": "finance", "purpose": "testing" }'.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: Name of the policy location. CMEK policies apply to the whole region.
    Required: "true"
name:
    Type: TypeString
    Description: Name of the CMEK policy.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
service_account:
    Type: TypeString
    Description: The Service account which needs to have access to the  provided KMS key.
    Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"

