active_directory:
    Type: TypeString
    Description: |-
        Specifies the Active Directory policy to be used. Format: 'projects/{{project}}/locations/{{location}}/activeDirectories/{{name}}'.
        The policy needs to be in the same location as the storage pool.
    Optional: "true"
capacity_gib:
    Type: TypeString
    Description: Capacity of the storage pool (in GiB).
    Required: "true"
description:
    Type: TypeString
    Description: An optional description of this resource.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
encryption_type:
    Type: TypeString
    Description: Reports if volumes in the pool are encrypted using a Google-managed encryption key or CMEK.
    Computed: "true"
kms_config:
    Type: TypeString
    Description: |-
        Specifies the CMEK policy to be used for volume encryption. Format: 'projects/{{project}}/locations/{{location}}/kmsConfigs/{{name}}'.
        The policy needs to be in the same location as the storage pool.
    Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels as key value pairs. Example: '{ "owner": "Bob", "department": "finance", "purpose": "testing" }'.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
ldap_enabled:
    Type: TypeBool
    Description: |-
        When enabled, the volumes uses Active Directory as LDAP name service for UID/GID lookups. Required to enable extended group support for NFSv3,
        using security identifiers for NFSv4.1 or principal names for kerberized NFSv4.1.
    Optional: "true"
location:
    Type: TypeString
    Description: Name of the location. Usually a region name, expect for some STANDARD service level pools which require a zone name.
    Required: "true"
name:
    Type: TypeString
    Description: The resource name of the storage pool. Needs to be unique per location.
    Required: "true"
network:
    Type: TypeString
    Description: 'VPC network name with format: ''projects/{{project}}/global/networks/{{network}}'''
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
service_level:
    Type: TypeString
    Description: 'Service level of the storage pool. Possible values: ["PREMIUM", "EXTREME", "STANDARD"]'
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
volume_capacity_gib:
    Type: TypeString
    Description: Size allocated to volumes in the storage pool (in GiB).
    Computed: "true"
volume_count:
    Type: TypeInt
    Description: Number of volume in the storage pool.
    Computed: "true"

