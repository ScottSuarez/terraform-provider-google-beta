capacity:
    Type: TypeInt
    Description: Capacity of the Address Group.
    Required: "true"
create_time:
    Type: TypeString
    Description: |-
        The timestamp when the resource was created.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z"
    Computed: "true"
description:
    Type: TypeString
    Description: Free-text description of the resource.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
items:
    Type: TypeList
    Description: List of items.
    Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        Set of label tags associated with the AddressGroup resource.
        An object containing a list of "key": value pairs. Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: |-
        The location of the gateway security policy.
        The default value is 'global'.
    Required: "true"
name:
    Type: TypeString
    Description: Name of the AddressGroup resource.
    Required: "true"
parent:
    Type: TypeString
    Description: 'The name of the parent this address group belongs to. Format: organizations/{organization_id} or projects/{project_id}.'
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
type:
    Type: TypeString
    Description: 'The type of the Address Group. Possible values are "IPV4" or "IPV6". Possible values: ["IPV4", "IPV6"]'
    Required: "true"
update_time:
    Type: TypeString
    Description: |-
        The timestamp when the resource was updated.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits.
        Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

