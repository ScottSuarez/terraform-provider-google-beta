action:
    Type: TypeString
    Description: 'The action to take when a rule match is found. Possible values are "ALLOW" or "DENY". Possible values: ["ALLOW", "DENY"]'
    Required: "true"
create_time:
    Type: TypeString
    Description: Time the AuthorizationPolicy was created in UTC.
    Computed: "true"
description:
    Type: TypeString
    Description: A free-text description of the resource. Max length 1024 characters.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Set of label tags associated with the AuthorizationPolicy resource.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: |-
        The location of the authorization policy.
        The default value is 'global'.
    Optional: "true"
name:
    Type: TypeString
    Description: Name of the AuthorizationPolicy resource.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
rules:
    Type: TypeList
    Description: |-
        List of rules to match. Note that at least one of the rules must match in order for the action specified in the 'action' field to be taken.
        A rule is a match if there is a matching source and destination. If left blank, the action specified in the action field will be applied on every request.
    Optional: "true"
    Properties:
        destinations:
            Type: TypeList
            Description: |-
                List of attributes for the traffic destination. All of the destinations must match. A destination is a match if a request matches all the specified hosts, ports, methods and headers.
                If not set, the action specified in the 'action' field will be applied without any rule checks for the destination.
            Optional: "true"
            Properties:
                hosts:
                    Type: TypeList
                    Description: List of host names to match. Matched against the ":authority" header in http requests. At least one host should match. Each host can be an exact match, or a prefix match (example "mydomain.*") or a suffix match (example "*.myorg.com") or a presence (any) match "*".
                    Required: "true"
                http_header_match:
                    Type: TypeList
                    Description: |-
                        Match against key:value pair in http header. Provides a flexible match based on HTTP headers, for potentially advanced use cases. At least one header should match.
                        Avoid using header matches to make authorization decisions unless there is a strong guarantee that requests arrive through a trusted client or proxy.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        header_name:
                            Type: TypeString
                            Description: The name of the HTTP header to match. For matching against the HTTP request's authority, use a headerMatch with the header name ":authority". For matching a request's method, use the headerName ":method".
                            Required: "true"
                        regex_match:
                            Type: TypeString
                            Description: 'The value of the header must match the regular expression specified in regexMatch. For regular expression grammar, please see: en.cppreference.com/w/cpp/regex/ecmascript For matching against a port specified in the HTTP request, use a headerMatch with headerName set to Host and a regular expression that satisfies the RFC2616 Host header''s port specifier.'
                            Required: "true"
                methods:
                    Type: TypeList
                    Description: A list of HTTP methods to match. At least one method should match. Should not be set for gRPC services.
                    Required: "true"
                ports:
                    Type: TypeList
                    Description: List of destination ports to match. At least one port should match.
                    Required: "true"
        sources:
            Type: TypeList
            Description: |-
                List of attributes for the traffic source. All of the sources must match. A source is a match if both principals and ipBlocks match.
                If not set, the action specified in the 'action' field will be applied without any rule checks for the source.
            Optional: "true"
            Properties:
                ip_blocks:
                    Type: TypeList
                    Description: |-
                        List of CIDR ranges to match based on source IP address. At least one IP block should match. Single IP (e.g., "1.2.3.4") and CIDR (e.g., "1.2.3.0/24") are supported. Authorization based on source IP alone should be avoided.
                        The IP addresses of any load balancers or proxies should be considered untrusted.
                    Optional: "true"
                principals:
                    Type: TypeList
                    Description: |-
                        List of peer identities to match for authorization. At least one principal should match. Each peer can be an exact match, or a prefix match (example, "namespace/*") or a suffix match (example, "*/service-account") or a presence match "*".
                        Authorization based on the principal name without certificate validation (configured by ServerTlsPolicy resource) is considered insecure.
                    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the AuthorizationPolicy was updated in UTC.
    Computed: "true"

