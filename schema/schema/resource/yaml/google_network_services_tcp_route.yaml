create_time:
    Type: TypeString
    Description: Time the TcpRoute was created in UTC.
    Computed: "true"
description:
    Type: TypeString
    Description: A free-text description of the resource. Max length 1024 characters.
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
gateways:
    Type: TypeList
    Description: |-
        Gateways defines a list of gateways this TcpRoute is attached to, as one of the routing rules to route the requests served by the gateway.
        Each gateway reference should match the pattern: projects/*/locations/global/gateways/<gateway_name>
    Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        Set of label tags associated with the TcpRoute resource.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
meshes:
    Type: TypeList
    Description: |-
        Meshes defines a list of meshes this TcpRoute is attached to, as one of the routing rules to route the requests served by the mesh.
        Each mesh reference should match the pattern: projects/*/locations/global/meshes/<mesh_name>
        The attached Mesh should be of a type SIDECAR
    Optional: "true"
name:
    Type: TypeString
    Description: Name of the TcpRoute resource.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
rules:
    Type: TypeList
    Description: |-
        Rules that define how traffic is routed and handled. At least one RouteRule must be supplied.
        If there are multiple rules then the action taken will be the first rule to match.
    Required: "true"
    Properties:
        action:
            Type: TypeList
            Description: A detailed rule defining how to route traffic.
            Required: "true"
            MaxItems: "1"
            Properties:
                destinations:
                    Type: TypeList
                    Description: The destination services to which traffic should be forwarded. At least one destination service is required.
                    Optional: "true"
                    Properties:
                        service_name:
                            Type: TypeString
                            Description: The URL of a BackendService to route traffic to.
                            Optional: "true"
                        weight:
                            Type: TypeInt
                            Description: |-
                                Specifies the proportion of requests forwarded to the backend referenced by the serviceName field. This is computed as: weight/Sum(weights in this destination list). For non-zero values, there may be some epsilon from the exact proportion defined here depending on the precision an implementation supports.
                                If only one serviceName is specified and it has a weight greater than 0, 100% of the traffic is forwarded to that backend.
                                If weights are specified for any one service name, they need to be specified for all of them.
                                If weights are unspecified for all services, then, traffic is distributed in equal proportions to all of them.
                            Optional: "true"
                original_destination:
                    Type: TypeBool
                    Description: If true, Router will use the destination IP and port of the original connection as the destination of the request.
                    Optional: "true"
        matches:
            Type: TypeList
            Description: |-
                RouteMatch defines the predicate used to match requests to a given action. Multiple match types are "OR"ed for evaluation.
                If no routeMatch field is specified, this rule will unconditionally match traffic.
            Optional: "true"
            Properties:
                address:
                    Type: TypeString
                    Description: |-
                        Must be specified in the CIDR range format. A CIDR range consists of an IP Address and a prefix length to construct the subnet mask.
                        By default, the prefix length is 32 (i.e. matches a single IP address). Only IPV4 addresses are supported. Examples: "10.0.0.1" - matches against this exact IP address. "10.0.0.0/8" - matches against any IP address within the 10.0.0.0 subnet and 255.255.255.0 mask. "0.0.0.0/0" - matches against any IP address'.
                    Required: "true"
                port:
                    Type: TypeString
                    Description: Specifies the destination port to match against.
                    Required: "true"
self_link:
    Type: TypeString
    Description: Server-defined URL of this resource.
    Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Time the TcpRoute was updated in UTC.
    Computed: "true"

