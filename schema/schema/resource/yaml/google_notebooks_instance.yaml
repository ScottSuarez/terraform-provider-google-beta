accelerator_config:
    Type: TypeList
    Description: |-
        The hardware accelerator used on this instance. If you use accelerators,
        make sure that your configuration has enough vCPUs and memory to support the
        machineType you have selected.
    Optional: "true"
    MaxItems: "1"
    Properties:
        core_count:
            Type: TypeInt
            Description: Count of cores of this accelerator.
            Required: "true"
        type:
            Type: TypeString
            Description: 'Type of this accelerator. Possible values: ["ACCELERATOR_TYPE_UNSPECIFIED", "NVIDIA_TESLA_K80", "NVIDIA_TESLA_P100", "NVIDIA_TESLA_V100", "NVIDIA_TESLA_P4", "NVIDIA_TESLA_T4", "NVIDIA_TESLA_T4_VWS", "NVIDIA_TESLA_P100_VWS", "NVIDIA_TESLA_P4_VWS", "NVIDIA_TESLA_A100", "TPU_V2", "TPU_V3"]'
            Required: "true"
boot_disk_size_gb:
    Type: TypeInt
    Description: |-
        The size of the boot disk in GB attached to this instance,
        up to a maximum of 64000 GB (64 TB). The minimum recommended value is 100 GB.
        If not specified, this defaults to 100.
    Optional: "true"
boot_disk_type:
    Type: TypeString
    Description: 'Possible disk types for notebook instances. Possible values: ["DISK_TYPE_UNSPECIFIED", "PD_STANDARD", "PD_SSD", "PD_BALANCED", "PD_EXTREME"]'
    Optional: "true"
container_image:
    Type: TypeList
    Description: Use a container image to start the notebook instance.
    Optional: "true"
    ExactlyOneOf: vm_image, container_image
    MaxItems: "1"
    Properties:
        repository:
            Type: TypeString
            Description: |-
                The path to the container image repository.
                For example: gcr.io/{project_id}/{imageName}
            Required: "true"
        tag:
            Type: TypeString
            Description: The tag of the container image. If not specified, this defaults to the latest tag.
            Optional: "true"
create_time:
    Type: TypeString
    Description: Instance creation time
    Computed: "true"
    Optional: "true"
custom_gpu_driver_path:
    Type: TypeString
    Description: |-
        Specify a custom Cloud Storage path where the GPU driver is stored.
        If not specified, we'll automatically choose from official GPU drivers.
    Optional: "true"
data_disk_size_gb:
    Type: TypeInt
    Description: |-
        The size of the data disk in GB attached to this instance,
        up to a maximum of 64000 GB (64 TB).
        You can choose the size of the data disk based on how big your notebooks and data are.
        If not specified, this defaults to 100.
    Optional: "true"
data_disk_type:
    Type: TypeString
    Description: 'Possible disk types for notebook instances. Possible values: ["DISK_TYPE_UNSPECIFIED", "PD_STANDARD", "PD_SSD", "PD_BALANCED", "PD_EXTREME"]'
    Optional: "true"
disk_encryption:
    Type: TypeString
    Description: 'Disk encryption method used on the boot and data disks, defaults to GMEK. Possible values: ["DISK_ENCRYPTION_UNSPECIFIED", "GMEK", "CMEK"]'
    Optional: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
install_gpu_driver:
    Type: TypeBool
    Description: |-
        Whether the end user authorizes Google Cloud to install GPU driver
        on this instance. If this field is empty or set to false, the GPU driver
        won't be installed. Only applicable to instances with GPUs.
    Optional: "true"
instance_owners:
    Type: TypeList
    Description: |-
        The list of owners of this instance after creation.
        Format: alias@example.com.
        Currently supports one owner only.
        If not specified, all of the service account users of
        your VM instance's service account can use the instance.
    Optional: "true"
kms_key:
    Type: TypeString
    Description: |-
        The KMS key used to encrypt the disks, only applicable if diskEncryption is CMEK.
        Format: projects/{project_id}/locations/{location}/keyRings/{key_ring_id}/cryptoKeys/{key_id}
    Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels to apply to this instance. These can be later modified by the setLabels method.
        An object containing a list of "key": value pairs. Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: A reference to the zone where the machine resides.
    Required: "true"
machine_type:
    Type: TypeString
    Description: A reference to a machine type which defines VM kind.
    Required: "true"
metadata:
    Type: TypeMap
    Description: |-
        Custom metadata to apply to this instance.
        An object containing a list of "key": value pairs. Example: { "name": "wrench", "mass": "1.3kg", "count": "3" }.
    Optional: "true"
name:
    Type: TypeString
    Description: The name specified for the Notebook instance.
    Required: "true"
network:
    Type: TypeString
    Description: |-
        The name of the VPC that this instance is in.
        Format: projects/{project_id}/global/networks/{network_id}
    Computed: "true"
    Optional: "true"
nic_type:
    Type: TypeString
    Description: 'The type of vNIC driver. Possible values: ["UNSPECIFIED_NIC_TYPE", "VIRTIO_NET", "GVNIC"]'
    Optional: "true"
no_proxy_access:
    Type: TypeBool
    Description: The notebook instance will not register with the proxy..
    Optional: "true"
no_public_ip:
    Type: TypeBool
    Description: No public IP will be assigned to this instance.
    Optional: "true"
no_remove_data_disk:
    Type: TypeBool
    Description: If true, the data disk will not be auto deleted when deleting the instance.
    Optional: "true"
post_startup_script:
    Type: TypeString
    Description: |-
        Path to a Bash script that automatically runs after a
        notebook instance fully boots up. The path must be a URL
        or Cloud Storage path (gs://path-to-file/file-name).
    Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
proxy_uri:
    Type: TypeString
    Description: |-
        The proxy endpoint that is used to access the Jupyter notebook.
        Only returned when the resource is in a 'PROVISIONED' state. If
        needed you can utilize 'terraform apply -refresh-only' to await
        the population of this value.
    Computed: "true"
reservation_affinity:
    Type: TypeList
    Description: Reservation Affinity for consuming Zonal reservation.
    Optional: "true"
    MaxItems: "1"
    Properties:
        consume_reservation_type:
            Type: TypeString
            Description: 'The type of Compute Reservation. Possible values: ["NO_RESERVATION", "ANY_RESERVATION", "SPECIFIC_RESERVATION"]'
            Required: "true"
        key:
            Type: TypeString
            Description: Corresponds to the label key of reservation resource.
            Optional: "true"
        values:
            Type: TypeList
            Description: Corresponds to the label values of reservation resource.
            Optional: "true"
service_account:
    Type: TypeString
    Description: |-
        The service account on this instance, giving access to other
        Google Cloud services. You can use any service account within
        the same project, but you must have the service account user
        permission to use the instance. If not specified,
        the Compute Engine default service account is used.
    Computed: "true"
    Optional: "true"
service_account_scopes:
    Type: TypeList
    Description: |-
        Optional. The URIs of service account scopes to be included in Compute Engine instances.
        If not specified, the following scopes are defined:
        - https://www.googleapis.com/auth/cloud-platform
        - https://www.googleapis.com/auth/userinfo.email
    Optional: "true"
shielded_instance_config:
    Type: TypeList
    Description: |-
        A set of Shielded Instance options. Check [Images using supported Shielded VM features]
        Not all combinations are valid
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enable_integrity_monitoring:
            Type: TypeBool
            Description: |-
                Defines whether the instance has integrity monitoring enabled. Enables monitoring and attestation of the
                boot integrity of the instance. The attestation is performed against the integrity policy baseline.
                This baseline is initially derived from the implicitly trusted boot image when the instance is created.
                Enabled by default.
            Optional: "true"
        enable_secure_boot:
            Type: TypeBool
            Description: |-
                Defines whether the instance has Secure Boot enabled. Secure Boot helps ensure that the system only runs
                authentic software by verifying the digital signature of all boot components, and halting the boot process
                if signature verification fails.
                Disabled by default.
            Optional: "true"
        enable_vtpm:
            Type: TypeBool
            Description: |-
                Defines whether the instance has the vTPM enabled.
                Enabled by default.
            Optional: "true"
state:
    Type: TypeString
    Description: The state of this instance.
    Computed: "true"
subnet:
    Type: TypeString
    Description: |-
        The name of the subnet that this instance is in.
        Format: projects/{project_id}/regions/{region}/subnetworks/{subnetwork_id}
    Computed: "true"
    Optional: "true"
tags:
    Type: TypeList
    Description: The Compute Engine tags to add to instance.
    Optional: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: Instance update time.
    Computed: "true"
    Optional: "true"
vm_image:
    Type: TypeList
    Description: Use a Compute Engine VM image to start the notebook instance.
    Optional: "true"
    ExactlyOneOf: vm_image, container_image
    MaxItems: "1"
    Properties:
        image_family:
            Type: TypeString
            Description: Use this VM image family to find the image; the newest image in this family will be used.
            Optional: "true"
        image_name:
            Type: TypeString
            Description: Use VM image name to find the image.
            Optional: "true"
        project:
            Type: TypeString
            Description: |-
                The name of the Google Cloud project that this VM image belongs to.
                Format: projects/{project_id}
            Required: "true"

