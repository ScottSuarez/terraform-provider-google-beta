condition:
    Type: TypeList
    Optional: "true"
    MaxItems: "1"
    Properties:
        description:
            Type: TypeString
            Optional: "true"
        expression:
            Type: TypeString
            Required: "true"
        title:
            Type: TypeString
            Required: "true"
etag:
    Type: TypeString
    Computed: "true"
member:
    Type: TypeString
    Required: "true"
org_id:
    Type: TypeString
    Description: The numeric ID of the organization in which you want to manage the audit logging config.
    Required: "true"
role:
    Type: TypeString
    Required: "true"

