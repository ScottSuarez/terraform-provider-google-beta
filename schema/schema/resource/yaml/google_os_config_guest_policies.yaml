assignment:
    Type: TypeList
    Description: |-
        Specifies the VM instances that are assigned to this policy. This allows you to target sets
        or groups of VM instances by different parameters such as labels, names, OS, or zones.
        If left empty, all VM instances underneath this policy are targeted.
        At the same level in the resource hierarchy (that is within a project), the service prevents
        the creation of multiple policies that conflict with each other.
        For more information, see how the service
        [handles assignment conflicts](https://cloud.google.com/compute/docs/os-config-management/create-guest-policy#handle-conflicts).
    Required: "true"
    MaxItems: "1"
    Properties:
        group_labels:
            Type: TypeList
            Description: |-
                Targets instances matching at least one of these label sets. This allows an assignment to target disparate groups,
                for example "env=prod or env=staging".
            Optional: "true"
            AtLeastOneOf: assignment.0.group_labels, assignment.0.zones, assignment.0.instances, assignment.0.instance_name_prefixes, assignment.0.os_types
            Properties:
                labels:
                    Type: TypeMap
                    Description: Google Compute Engine instance labels that must be present for an instance to be included in this assignment group.
                    Required: "true"
        instance_name_prefixes:
            Type: TypeList
            Description: |-
                Targets VM instances whose name starts with one of these prefixes.
                Like labels, this is another way to group VM instances when targeting configs,
                for example prefix="prod-".
                Only supported for project-level policies.
            Optional: "true"
            AtLeastOneOf: assignment.0.group_labels, assignment.0.zones, assignment.0.instances, assignment.0.instance_name_prefixes, assignment.0.os_types
        instances:
            Type: TypeList
            Description: |-
                Targets any of the instances specified. Instances are specified by their URI in the form
                zones/[ZONE]/instances/[INSTANCE_NAME].
                Instance targeting is uncommon and is supported to facilitate the management of changes
                by the instance or to target specific VM instances for development and testing.
                Only supported for project-level policies and must reference instances within this project.
            Optional: "true"
            AtLeastOneOf: assignment.0.group_labels, assignment.0.zones, assignment.0.instances, assignment.0.instance_name_prefixes, assignment.0.os_types
        os_types:
            Type: TypeList
            Description: |-
                Targets VM instances matching at least one of the following OS types.
                VM instances must match all supplied criteria for a given OsType to be included.
            Optional: "true"
            AtLeastOneOf: assignment.0.group_labels, assignment.0.zones, assignment.0.instances, assignment.0.instance_name_prefixes, assignment.0.os_types
            Properties:
                os_architecture:
                    Type: TypeString
                    Description: Targets VM instances with OS Inventory enabled and having the following OS architecture.
                    Optional: "true"
                os_short_name:
                    Type: TypeString
                    Description: Targets VM instances with OS Inventory enabled and having the following OS short name, for example "debian" or "windows".
                    Optional: "true"
                os_version:
                    Type: TypeString
                    Description: Targets VM instances with OS Inventory enabled and having the following following OS version.
                    Optional: "true"
        zones:
            Type: TypeList
            Description: |-
                Targets instances in any of these zones. Leave empty to target instances in any zone.
                Zonal targeting is uncommon and is supported to facilitate the management of changes by zone.
            Optional: "true"
            AtLeastOneOf: assignment.0.group_labels, assignment.0.zones, assignment.0.instances, assignment.0.instance_name_prefixes, assignment.0.os_types
create_time:
    Type: TypeString
    Description: |-
        Time this guest policy was created. A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds.
        Example: "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
description:
    Type: TypeString
    Description: Description of the guest policy. Length of the description is limited to 1024 characters.
    Optional: "true"
etag:
    Type: TypeString
    Description: The etag for this guest policy. If this is provided on update, it must match the server's etag.
    Computed: "true"
    Optional: "true"
guest_policy_id:
    Type: TypeString
    Description: |-
        The logical name of the guest policy in the project with the following restrictions:
        * Must contain only lowercase letters, numbers, and hyphens.
        * Must start with a letter.
        * Must be between 1-63 characters.
        * Must end with a number or a letter.
        * Must be unique within the project.
    Required: "true"
name:
    Type: TypeString
    Description: 'Unique name of the resource in this project using one of the following forms: projects/{project_number}/guestPolicies/{guestPolicyId}.'
    Computed: "true"
package_repositories:
    Type: TypeList
    Description: |-
        A list of package repositories to configure on the VM instance.
        This is done before any other configs are applied so they can use these repos.
        Package repositories are only configured if the corresponding package manager(s) are available.
    Optional: "true"
    Properties:
        apt:
            Type: TypeList
            Description: An Apt Repository.
            Optional: "true"
            MaxItems: "1"
            Properties:
                archive_type:
                    Type: TypeString
                    Description: 'Type of archive files in this repository. The default behavior is DEB. Default value: "DEB" Possible values: ["DEB", "DEB_SRC"]'
                    Optional: "true"
                components:
                    Type: TypeList
                    Description: List of components for this repository. Must contain at least one item.
                    Required: "true"
                distribution:
                    Type: TypeString
                    Description: Distribution of this repository.
                    Required: "true"
                gpg_key:
                    Type: TypeString
                    Description: |-
                        URI of the key file for this repository. The agent maintains a keyring at
                        /etc/apt/trusted.gpg.d/osconfig_agent_managed.gpg containing all the keys in any applied guest policy.
                    Optional: "true"
                uri:
                    Type: TypeString
                    Description: URI for this repository.
                    Required: "true"
        goo:
            Type: TypeList
            Description: A Goo Repository.
            Optional: "true"
            MaxItems: "1"
            Properties:
                name:
                    Type: TypeString
                    Description: The name of the repository.
                    Required: "true"
                url:
                    Type: TypeString
                    Description: The url of the repository.
                    Required: "true"
        yum:
            Type: TypeList
            Description: A Yum Repository.
            Optional: "true"
            MaxItems: "1"
            Properties:
                base_url:
                    Type: TypeString
                    Description: The location of the repository directory.
                    Required: "true"
                display_name:
                    Type: TypeString
                    Description: The display name of the repository.
                    Optional: "true"
                gpg_keys:
                    Type: TypeList
                    Description: URIs of GPG keys.
                    Optional: "true"
                id:
                    Type: TypeString
                    Description: |-
                        A one word, unique name for this repository. This is the repo id in the Yum config file and also the displayName
                        if displayName is omitted. This id is also used as the unique identifier when checking for guest policy conflicts.
                    Required: "true"
        zypper:
            Type: TypeList
            Description: A Zypper Repository.
            Optional: "true"
            MaxItems: "1"
            Properties:
                base_url:
                    Type: TypeString
                    Description: The location of the repository directory.
                    Required: "true"
                display_name:
                    Type: TypeString
                    Description: The display name of the repository.
                    Optional: "true"
                gpg_keys:
                    Type: TypeList
                    Description: URIs of GPG keys.
                    Optional: "true"
                id:
                    Type: TypeString
                    Description: |-
                        A one word, unique name for this repository. This is the repo id in the zypper config file and also the displayName
                        if displayName is omitted. This id is also used as the unique identifier when checking for guest policy conflicts.
                    Required: "true"
packages:
    Type: TypeList
    Description: The software packages to be managed by this policy.
    Optional: "true"
    Properties:
        desired_state:
            Type: TypeString
            Description: 'The desiredState the agent should maintain for this package. The default is to ensure the package is installed. Possible values: ["INSTALLED", "UPDATED", "REMOVED"]'
            Optional: "true"
        manager:
            Type: TypeString
            Description: |-
                Type of package manager that can be used to install this package. If a system does not have the package manager,
                the package is not installed or removed no error message is returned. By default, or if you specify ANY,
                the agent attempts to install and remove this package using the default package manager.
                This is useful when creating a policy that applies to different types of systems.
                The default behavior is ANY. Default value: "ANY" Possible values: ["ANY", "APT", "YUM", "ZYPPER", "GOO"]
            Optional: "true"
        name:
            Type: TypeString
            Description: |-
                The name of the package. A package is uniquely identified for conflict validation
                by checking the package name and the manager(s) that the package targets.
            Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
recipes:
    Type: TypeList
    Description: A list of Recipes to install on the VM instance.
    Optional: "true"
    Properties:
        artifacts:
            Type: TypeList
            Description: Resources available to be used in the steps in the recipe.
            Optional: "true"
            Properties:
                allow_insecure:
                    Type: TypeBool
                    Description: |-
                        Defaults to false. When false, recipes are subject to validations based on the artifact type:
                        Remote: A checksum must be specified, and only protocols with transport-layer security are permitted.
                        GCS: An object generation number must be specified.
                    Optional: "true"
                gcs:
                    Type: TypeList
                    Description: A Google Cloud Storage artifact.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        bucket:
                            Type: TypeString
                            Description: |-
                                Bucket of the Google Cloud Storage object. Given an example URL: https://storage.googleapis.com/my-bucket/foo/bar#1234567
                                this value would be my-bucket.
                            Optional: "true"
                        generation:
                            Type: TypeInt
                            Description: |-
                                Must be provided if allowInsecure is false. Generation number of the Google Cloud Storage object.
                                https://storage.googleapis.com/my-bucket/foo/bar#1234567 this value would be 1234567.
                            Optional: "true"
                        object:
                            Type: TypeString
                            Description: |-
                                Name of the Google Cloud Storage object. Given an example URL: https://storage.googleapis.com/my-bucket/foo/bar#1234567
                                this value would be foo/bar.
                            Optional: "true"
                id:
                    Type: TypeString
                    Description: |-
                        Id of the artifact, which the installation and update steps of this recipe can reference.
                        Artifacts in a recipe cannot have the same id.
                    Required: "true"
                remote:
                    Type: TypeList
                    Description: A generic remote artifact.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        check_sum:
                            Type: TypeString
                            Description: |-
                                Must be provided if allowInsecure is false. SHA256 checksum in hex format, to compare to the checksum of the artifact.
                                If the checksum is not empty and it doesn't match the artifact then the recipe installation fails before running any
                                of the steps.
                            Optional: "true"
                        uri:
                            Type: TypeString
                            Description: URI from which to fetch the object. It should contain both the protocol and path following the format {protocol}://{location}.
                            Optional: "true"
        desired_state:
            Type: TypeString
            Description: |-
                Default is INSTALLED. The desired state the agent should maintain for this recipe.

                INSTALLED: The software recipe is installed on the instance but won't be updated to new versions.
                INSTALLED_KEEP_UPDATED: The software recipe is installed on the instance. The recipe is updated to a higher version,
                if a higher version of the recipe is assigned to this instance.
                REMOVE: Remove is unsupported for software recipes and attempts to create or update a recipe to the REMOVE state is rejected. Default value: "INSTALLED" Possible values: ["INSTALLED", "UPDATED", "REMOVED"]
            Optional: "true"
        install_steps:
            Type: TypeList
            Description: |-
                Actions to be taken for installing this recipe. On failure it stops executing steps and does not attempt another installation.
                Any steps taken (including partially completed steps) are not rolled back.
            Optional: "true"
            Properties:
                archive_extraction:
                    Type: TypeList
                    Description: Extracts an archive into the specified directory.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        destination:
                            Type: TypeString
                            Description: Directory to extract archive to. Defaults to / on Linux or C:\ on Windows.
                            Computed: "true"
                            Optional: "true"
                        type:
                            Type: TypeString
                            Description: 'The type of the archive to extract. Possible values: ["TAR", "TAR_GZIP", "TAR_BZIP", "TAR_LZMA", "TAR_XZ", "ZIP"]'
                            Required: "true"
                dpkg_installation:
                    Type: TypeList
                    Description: Installs a deb file via dpkg.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                file_copy:
                    Type: TypeList
                    Description: Copies a file onto the instance.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        destination:
                            Type: TypeString
                            Description: The absolute path on the instance to put the file.
                            Required: "true"
                        overwrite:
                            Type: TypeBool
                            Description: |-
                                Whether to allow this step to overwrite existing files.If this is false and the file already exists the file
                                is not overwritten and the step is considered a success. Defaults to false.
                            Optional: "true"
                        permissions:
                            Type: TypeString
                            Description: |-
                                Consists of three octal digits which represent, in order, the permissions of the owner, group, and other users
                                for the file (similarly to the numeric mode used in the linux chmod utility). Each digit represents a three bit
                                number with the 4 bit corresponding to the read permissions, the 2 bit corresponds to the write bit, and the one
                                bit corresponds to the execute permission. Default behavior is 755.

                                Below are some examples of permissions and their associated values:
                                read, write, and execute: 7 read and execute: 5 read and write: 6 read only: 4
                            Optional: "true"
                file_exec:
                    Type: TypeList
                    Description: Executes an artifact or local file.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeString
                            Description: A list of possible return values that the program can return to indicate a success. Defaults to [0].
                            Computed: "true"
                            Optional: "true"
                        args:
                            Type: TypeList
                            Description: Arguments to be passed to the provided executable.
                            Optional: "true"
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: The absolute path of the file on the local filesystem.
                            Optional: "true"
                msi_installation:
                    Type: TypeList
                    Description: Installs an MSI file.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeList
                            Description: Return codes that indicate that the software installed or updated successfully. Behaviour defaults to [0]
                            Computed: "true"
                            Optional: "true"
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        flags:
                            Type: TypeList
                            Description: The flags to use when installing the MSI. Defaults to the install flag.
                            Computed: "true"
                            Optional: "true"
                rpm_installation:
                    Type: TypeList
                    Description: Installs an rpm file via the rpm utility.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                script_run:
                    Type: TypeList
                    Description: Runs commands in a shell.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeList
                            Description: Return codes that indicate that the software installed or updated successfully. Behaviour defaults to [0]
                            Computed: "true"
                            Optional: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script is executed directly,
                                which likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        script:
                            Type: TypeString
                            Description: The shell script to be executed.
                            Required: "true"
        name:
            Type: TypeString
            Description: |-
                Unique identifier for the recipe. Only one recipe with a given name is installed on an instance.
                Names are also used to identify resources which helps to determine whether guest policies have conflicts.
                This means that requests to create multiple recipes with the same name and version are rejected since they
                could potentially have conflicting assignments.
            Required: "true"
        update_steps:
            Type: TypeList
            Description: |-
                Actions to be taken for updating this recipe. On failure it stops executing steps and does not attempt another update for this recipe.
                Any steps taken (including partially completed steps) are not rolled back.
            Optional: "true"
            Properties:
                archive_extraction:
                    Type: TypeList
                    Description: Extracts an archive into the specified directory.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        destination:
                            Type: TypeString
                            Description: Directory to extract archive to. Defaults to / on Linux or C:\ on Windows.
                            Computed: "true"
                            Optional: "true"
                        type:
                            Type: TypeString
                            Description: 'The type of the archive to extract. Possible values: ["TAR", "TAR_GZIP", "TAR_BZIP", "TAR_LZMA", "TAR_XZ", "ZIP"]'
                            Required: "true"
                dpkg_installation:
                    Type: TypeList
                    Description: Installs a deb file via dpkg.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                file_copy:
                    Type: TypeList
                    Description: Copies a file onto the instance.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        destination:
                            Type: TypeString
                            Description: The absolute path on the instance to put the file.
                            Required: "true"
                        overwrite:
                            Type: TypeBool
                            Description: |-
                                Whether to allow this step to overwrite existing files.If this is false and the file already exists the file
                                is not overwritten and the step is considered a success. Defaults to false.
                            Optional: "true"
                        permissions:
                            Type: TypeString
                            Description: |-
                                Consists of three octal digits which represent, in order, the permissions of the owner, group, and other users
                                for the file (similarly to the numeric mode used in the linux chmod utility). Each digit represents a three bit
                                number with the 4 bit corresponding to the read permissions, the 2 bit corresponds to the write bit, and the one
                                bit corresponds to the execute permission. Default behavior is 755.

                                Below are some examples of permissions and their associated values:
                                read, write, and execute: 7 read and execute: 5 read and write: 6 read only: 4
                            Optional: "true"
                file_exec:
                    Type: TypeList
                    Description: Executes an artifact or local file.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeList
                            Description: A list of possible return values that the program can return to indicate a success. Defaults to [0].
                            Computed: "true"
                            Optional: "true"
                        args:
                            Type: TypeList
                            Description: Arguments to be passed to the provided executable.
                            Optional: "true"
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: The absolute path of the file on the local filesystem.
                            Optional: "true"
                msi_installation:
                    Type: TypeList
                    Description: Installs an MSI file.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeList
                            Description: Return codes that indicate that the software installed or updated successfully. Behaviour defaults to [0]
                            Computed: "true"
                            Optional: "true"
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                        flags:
                            Type: TypeList
                            Description: The flags to use when installing the MSI. Defaults to the install flag.
                            Computed: "true"
                            Optional: "true"
                rpm_installation:
                    Type: TypeList
                    Description: Installs an rpm file via the rpm utility.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        artifact_id:
                            Type: TypeString
                            Description: The id of the relevant artifact in the recipe.
                            Required: "true"
                script_run:
                    Type: TypeList
                    Description: Runs commands in a shell.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        allowed_exit_codes:
                            Type: TypeList
                            Description: Return codes that indicate that the software installed or updated successfully. Behaviour defaults to [0]
                            Computed: "true"
                            Optional: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script is executed directly,
                                which likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        script:
                            Type: TypeString
                            Description: The shell script to be executed.
                            Required: "true"
        version:
            Type: TypeString
            Description: The version of this software recipe. Version can be up to 4 period separated numbers (e.g. 12.34.56.78).
            Optional: "true"
update_time:
    Type: TypeString
    Description: |-
        Last time this guest policy was updated. A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds.
        Example: "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

