                                                    Required: "true"
                                                generation:
                                                    Type: TypeInt
                                                    Description: Generation number of the Cloud Storage object.
                                                    Optional: "true"
                                                object:
                                                    Type: TypeString
                                                    Description: Name of the Cloud Storage object.
                                                    Required: "true"
                                        local_path:
                                            Type: TypeString
                                            Description: A local path within the VM to use.
                                            Optional: "true"
                                        remote:
                                            Type: TypeList
                                            Description: A generic remote file.
                                            Optional: "true"
                                            MaxItems: "1"
                                            Properties:
                                                sha256_checksum:
                                                    Type: TypeString
                                                    Description: SHA256 checksum of the remote file.
                                                    Optional: "true"
                                                uri:
                                                    Type: TypeString
                                                    Description: URI from which to fetch the object. It should contain both the protocol and path following the format '{protocol}://{location}'.
                                                    Required: "true"
                                path:
                                    Type: TypeString
                                    Description: The absolute path of the file within the VM.
                                    Required: "true"
                                permissions:
                                    Type: TypeString
                                    Description: |-
                                        Consists of three octal digits which represent, in order, the permissions of the owner, group, and other users for the file (similarly to the numeric mode used in the linux chmod utility). Each digit represents a three bit number with the 4 bit corresponding to the read permissions, the 2 bit corresponds to the write bit, and the one bit corresponds to the execute permission. Default behavior is 755.
                                        Below are some examples of permissions and their associated values: read, write, and execute: 7 read and execute: 5 read and write: 6 read only: 4
                                    Computed: "true"
                                state:
                                    Type: TypeString
                                    Description: 'Desired state of the file. Possible values: ["DESIRED_STATE_UNSPECIFIED", "PRESENT", "ABSENT", "CONTENTS_MATCH"]'
                                    Required: "true"
                        id:
                            Type: TypeString
                            Description: |-
                                The id of the resource with the following restrictions:
                                * Must contain only lowercase letters, numbers, and hyphens.
                                * Must start with a letter.
                                * Must be between 1-63 characters.
                                * Must end with a number or a letter.
                                * Must be unique within the OS policy.
                            Required: "true"
                        pkg:
                            Type: TypeList
                            Description: Package resource
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                apt:
                                    Type: TypeList
                                    Description: A package managed by Apt.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        name:
                                            Type: TypeString
                                            Description: Package name.
                                            Required: "true"
                                deb:
                                    Type: TypeList
                                    Description: A deb package file.
                                    Optional: "true"
                                    MaxItems: "1"
                                    Properties:
                                        pull_deps:
                                            Type: TypeBool
                                            Description: 'Whether dependencies should also be installed. - install when false: ''dpkg -i package'' - install when true: ''apt-get update && apt-get -y install package.deb'''
                                            Optional: "true"
                                        source:
                                            Type: TypeList
                                            Description: A deb package.
                                            Required: "true"
                                            MaxItems: "1"
