create_time:
    Type: TypeString
    Description: |-
        Time the patch deployment was created. Timestamp is in RFC3339 text format.
        A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
description:
    Type: TypeString
    Description: Description of the patch deployment. Length of the description is limited to 1024 characters.
    Optional: "true"
duration:
    Type: TypeString
    Description: |-
        Duration of the patch. After the duration ends, the patch times out.
        A duration in seconds with up to nine fractional digits, terminated by 's'. Example: "3.5s"
    Optional: "true"
instance_filter:
    Type: TypeList
    Description: VM instances to patch.
    Required: "true"
    MaxItems: "1"
    Properties:
        all:
            Type: TypeBool
            Description: Target all VM instances in the project. If true, no other criteria is permitted.
            Optional: "true"
            AtLeastOneOf: instance_filter.0.all, instance_filter.0.group_labels, instance_filter.0.zones, instance_filter.0.instances, instance_filter.0.instance_name_prefixes
        group_labels:
            Type: TypeList
            Description: Targets VM instances matching ANY of these GroupLabels. This allows targeting of disparate groups of VM instances.
            Optional: "true"
            AtLeastOneOf: instance_filter.0.all, instance_filter.0.group_labels, instance_filter.0.zones, instance_filter.0.instances, instance_filter.0.instance_name_prefixes
            Properties:
                labels:
                    Type: TypeMap
                    Description: Compute Engine instance labels that must be present for a VM instance to be targeted by this filter
                    Required: "true"
        instance_name_prefixes:
            Type: TypeList
            Description: |-
                Targets VMs whose name starts with one of these prefixes. Similar to labels, this is another way to group
                VMs when targeting configs, for example prefix="prod-".
            Optional: "true"
            AtLeastOneOf: instance_filter.0.all, instance_filter.0.group_labels, instance_filter.0.zones, instance_filter.0.instances, instance_filter.0.instance_name_prefixes
        instances:
            Type: TypeList
            Description: |-
                Targets any of the VM instances specified. Instances are specified by their URI in the 'form zones/{{zone}}/instances/{{instance_name}}',
                'projects/{{project_id}}/zones/{{zone}}/instances/{{instance_name}}', or
                'https://www.googleapis.com/compute/v1/projects/{{project_id}}/zones/{{zone}}/instances/{{instance_name}}'
            Optional: "true"
            AtLeastOneOf: instance_filter.0.all, instance_filter.0.group_labels, instance_filter.0.zones, instance_filter.0.instances, instance_filter.0.instance_name_prefixes
        zones:
            Type: TypeList
            Description: Targets VM instances in ANY of these zones. Leave empty to target VM instances in any zone.
            Optional: "true"
            AtLeastOneOf: instance_filter.0.all, instance_filter.0.group_labels, instance_filter.0.zones, instance_filter.0.instances, instance_filter.0.instance_name_prefixes
last_execute_time:
    Type: TypeString
    Description: |-
        The last time a patch job was started by this deployment. Timestamp is in RFC3339 text format.
        A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
name:
    Type: TypeString
    Description: |-
        Unique name for the patch deployment resource in a project.
        The patch deployment name is in the form: projects/{project_id}/patchDeployments/{patchDeploymentId}.
    Computed: "true"
one_time_schedule:
    Type: TypeList
    Description: Schedule a one-time execution.
    Optional: "true"
    ExactlyOneOf: one_time_schedule, recurring_schedule
    MaxItems: "1"
    Properties:
        execute_time:
            Type: TypeString
            Description: |-
                The desired patch job execution time. A timestamp in RFC3339 UTC "Zulu" format,
                accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
            Required: "true"
patch_config:
    Type: TypeList
    Description: Patch configuration that is applied.
    Optional: "true"
    MaxItems: "1"
    Properties:
        apt:
            Type: TypeList
            Description: Apt update settings. Use this setting to override the default apt patch rules.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                excludes:
                    Type: TypeList
                    Description: List of packages to exclude from update. These packages will be excluded.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.apt.0.type, patch_config.0.apt.0.excludes, patch_config.0.apt.0.exclusive_packages
                exclusive_packages:
                    Type: TypeList
                    Description: |-
                        An exclusive list of packages to be updated. These are the only packages that will be updated.
                        If these packages are not installed, they will be ignored. This field cannot be specified with
                        any other patch configuration fields.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.apt.0.type, patch_config.0.apt.0.excludes, patch_config.0.apt.0.exclusive_packages
                type:
                    Type: TypeString
                    Description: 'By changing the type to DIST, the patching is performed using apt-get dist-upgrade instead. Possible values: ["DIST", "UPGRADE"]'
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.apt.0.type, patch_config.0.apt.0.excludes, patch_config.0.apt.0.exclusive_packages
        goo:
            Type: TypeList
            Description: goo update settings. Use this setting to override the default goo patch rules.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                enabled:
                    Type: TypeBool
                    Description: goo update settings. Use this setting to override the default goo patch rules.
                    Required: "true"
        mig_instances_allowed:
            Type: TypeBool
            Description: Allows the patch job to run on Managed instance groups (MIGs).
            Optional: "true"
        post_step:
            Type: TypeList
            Description: The ExecStep to run after the patch update.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                linux_exec_step_config:
                    Type: TypeList
                    Description: The ExecStepConfig for all Linux VMs targeted by the PatchJob.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.post_step.0.linux_exec_step_config, patch_config.0.post_step.0.windows_exec_step_config
                    MaxItems: "1"
                    Properties:
                        allowed_success_codes:
                            Type: TypeList
                            Description: Defaults to [0]. A list of possible return values that the execution can return to indicate a success.
                            Optional: "true"
                        gcs_object:
                            Type: TypeList
                            Description: A Cloud Storage object containing the executable.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.post_step.0.linux_exec_step_config.0.local_path, patch_config.0.post_step.0.linux_exec_step_config.0.gcs_object
                            MaxItems: "1"
                            Properties:
                                bucket:
                                    Type: TypeString
                                    Description: Bucket of the Cloud Storage object.
                                    Required: "true"
                                generation_number:
                                    Type: TypeString
                                    Description: Generation number of the Cloud Storage object. This is used to ensure that the ExecStep specified by this PatchJob does not change.
                                    Required: "true"
                                object:
                                    Type: TypeString
                                    Description: Name of the Cloud Storage object.
                                    Required: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script will
                                be executed directly, which will likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: An absolute path to the executable on the VM.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.post_step.0.linux_exec_step_config.0.local_path, patch_config.0.post_step.0.linux_exec_step_config.0.gcs_object
                windows_exec_step_config:
                    Type: TypeList
                    Description: The ExecStepConfig for all Windows VMs targeted by the PatchJob.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.post_step.0.linux_exec_step_config, patch_config.0.post_step.0.windows_exec_step_config
                    MaxItems: "1"
                    Properties:
                        allowed_success_codes:
                            Type: TypeList
                            Description: Defaults to [0]. A list of possible return values that the execution can return to indicate a success.
                            Optional: "true"
                        gcs_object:
                            Type: TypeList
                            Description: A Cloud Storage object containing the executable.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.post_step.0.windows_exec_step_config.0.local_path, patch_config.0.post_step.0.windows_exec_step_config.0.gcs_object
                            MaxItems: "1"
                            Properties:
                                bucket:
                                    Type: TypeString
                                    Description: Bucket of the Cloud Storage object.
                                    Required: "true"
                                generation_number:
                                    Type: TypeString
                                    Description: Generation number of the Cloud Storage object. This is used to ensure that the ExecStep specified by this PatchJob does not change.
                                    Required: "true"
                                object:
                                    Type: TypeString
                                    Description: Name of the Cloud Storage object.
                                    Required: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script will
                                be executed directly, which will likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: An absolute path to the executable on the VM.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.post_step.0.windows_exec_step_config.0.local_path, patch_config.0.post_step.0.windows_exec_step_config.0.gcs_object
        pre_step:
            Type: TypeList
            Description: The ExecStep to run before the patch update.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                linux_exec_step_config:
                    Type: TypeList
                    Description: The ExecStepConfig for all Linux VMs targeted by the PatchJob.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.pre_step.0.linux_exec_step_config, patch_config.0.pre_step.0.windows_exec_step_config
                    MaxItems: "1"
                    Properties:
                        allowed_success_codes:
                            Type: TypeList
                            Description: Defaults to [0]. A list of possible return values that the execution can return to indicate a success.
                            Optional: "true"
                        gcs_object:
                            Type: TypeList
                            Description: A Cloud Storage object containing the executable.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.pre_step.0.linux_exec_step_config.0.local_path, patch_config.0.pre_step.0.linux_exec_step_config.0.gcs_object
                            MaxItems: "1"
                            Properties:
                                bucket:
                                    Type: TypeString
                                    Description: Bucket of the Cloud Storage object.
                                    Required: "true"
                                generation_number:
                                    Type: TypeString
                                    Description: Generation number of the Cloud Storage object. This is used to ensure that the ExecStep specified by this PatchJob does not change.
                                    Required: "true"
                                object:
                                    Type: TypeString
                                    Description: Name of the Cloud Storage object.
                                    Required: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script will
                                be executed directly, which will likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: An absolute path to the executable on the VM.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.pre_step.0.linux_exec_step_config.0.local_path, patch_config.0.pre_step.0.linux_exec_step_config.0.gcs_object
                windows_exec_step_config:
                    Type: TypeList
                    Description: The ExecStepConfig for all Windows VMs targeted by the PatchJob.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.pre_step.0.linux_exec_step_config, patch_config.0.pre_step.0.windows_exec_step_config
                    MaxItems: "1"
                    Properties:
                        allowed_success_codes:
                            Type: TypeList
                            Description: Defaults to [0]. A list of possible return values that the execution can return to indicate a success.
                            Optional: "true"
                        gcs_object:
                            Type: TypeList
                            Description: A Cloud Storage object containing the executable.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.pre_step.0.windows_exec_step_config.0.local_path, patch_config.0.pre_step.0.windows_exec_step_config.0.gcs_object
                            MaxItems: "1"
                            Properties:
                                bucket:
                                    Type: TypeString
                                    Description: Bucket of the Cloud Storage object.
                                    Required: "true"
                                generation_number:
                                    Type: TypeString
                                    Description: Generation number of the Cloud Storage object. This is used to ensure that the ExecStep specified by this PatchJob does not change.
                                    Required: "true"
                                object:
                                    Type: TypeString
                                    Description: Name of the Cloud Storage object.
                                    Required: "true"
                        interpreter:
                            Type: TypeString
                            Description: |-
                                The script interpreter to use to run the script. If no interpreter is specified the script will
                                be executed directly, which will likely only succeed for scripts with shebang lines. Possible values: ["SHELL", "POWERSHELL"]
                            Optional: "true"
                        local_path:
                            Type: TypeString
                            Description: An absolute path to the executable on the VM.
                            Optional: "true"
                            ExactlyOneOf: patch_config.0.pre_step.0.windows_exec_step_config.0.local_path, patch_config.0.pre_step.0.windows_exec_step_config.0.gcs_object
        reboot_config:
            Type: TypeString
            Description: 'Post-patch reboot settings. Possible values: ["DEFAULT", "ALWAYS", "NEVER"]'
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
        windows_update:
            Type: TypeList
            Description: Windows update settings. Use this setting to override the default Windows patch rules.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                classifications:
                    Type: TypeList
                    Description: 'Only apply updates of these windows update classifications. If empty, all updates are applied. Possible values: ["CRITICAL", "SECURITY", "DEFINITION", "DRIVER", "FEATURE_PACK", "SERVICE_PACK", "TOOL", "UPDATE_ROLLUP", "UPDATE"]'
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.windows_update.0.classifications, patch_config.0.windows_update.0.excludes, patch_config.0.windows_update.0.exclusive_patches
                    ConflictsWith: patch_config.0.windows_update.0.exclusive_patches
                excludes:
                    Type: TypeList
                    Description: List of KBs to exclude from update.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.windows_update.0.classifications, patch_config.0.windows_update.0.excludes, patch_config.0.windows_update.0.exclusive_patches
                    ConflictsWith: patch_config.0.windows_update.0.exclusive_patches
                exclusive_patches:
                    Type: TypeList
                    Description: |-
                        An exclusive list of kbs to be updated. These are the only patches that will be updated.
                        This field must not be used with other patch configurations.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.windows_update.0.classifications, patch_config.0.windows_update.0.excludes, patch_config.0.windows_update.0.exclusive_patches
                    ConflictsWith: patch_config.0.windows_update.0.classifications, patch_config.0.windows_update.0.excludes
        yum:
            Type: TypeList
            Description: Yum update settings. Use this setting to override the default yum patch rules.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                excludes:
                    Type: TypeList
                    Description: List of packages to exclude from update. These packages will be excluded.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.yum.0.security, patch_config.0.yum.0.minimal, patch_config.0.yum.0.excludes, patch_config.0.yum.0.exclusive_packages
                exclusive_packages:
                    Type: TypeList
                    Description: |-
                        An exclusive list of packages to be updated. These are the only packages that will be updated.
                        If these packages are not installed, they will be ignored. This field cannot be specified with
                        any other patch configuration fields.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.yum.0.security, patch_config.0.yum.0.minimal, patch_config.0.yum.0.excludes, patch_config.0.yum.0.exclusive_packages
                minimal:
                    Type: TypeBool
                    Description: Will cause patch to run yum update-minimal instead.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.yum.0.security, patch_config.0.yum.0.minimal, patch_config.0.yum.0.excludes, patch_config.0.yum.0.exclusive_packages
                security:
                    Type: TypeBool
                    Description: Adds the --security flag to yum update. Not supported on all platforms.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.yum.0.security, patch_config.0.yum.0.minimal, patch_config.0.yum.0.excludes, patch_config.0.yum.0.exclusive_packages
        zypper:
            Type: TypeList
            Description: zypper update settings. Use this setting to override the default zypper patch rules.
            Optional: "true"
            AtLeastOneOf: patch_config.0.reboot_config, patch_config.0.apt, patch_config.0.yum, patch_config.0.goo, patch_config.0.zypper, patch_config.0.windows_update, patch_config.0.pre_step, patch_config.0.post_step
            MaxItems: "1"
            Properties:
                categories:
                    Type: TypeList
                    Description: Install only patches with these categories. Common categories include security, recommended, and feature.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
                excludes:
                    Type: TypeList
                    Description: List of packages to exclude from update.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
                exclusive_patches:
                    Type: TypeList
                    Description: |-
                        An exclusive list of patches to be updated. These are the only patches that will be installed using 'zypper patch patch:' command.
                        This field must not be used with any other patch configuration fields.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
                severities:
                    Type: TypeList
                    Description: Install only patches with these severities. Common severities include critical, important, moderate, and low.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
                with_optional:
                    Type: TypeBool
                    Description: Adds the --with-optional flag to zypper patch.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
                with_update:
                    Type: TypeBool
                    Description: Adds the --with-update flag, to zypper patch.
                    Optional: "true"
                    AtLeastOneOf: patch_config.0.zypper.0.with_optional, patch_config.0.zypper.0.with_update, patch_config.0.zypper.0.categories, patch_config.0.zypper.0.severities, patch_config.0.zypper.0.excludes, patch_config.0.zypper.0.exclusive_patches
patch_deployment_id:
    Type: TypeString
    Description: |-
        A name for the patch deployment in the project. When creating a name the following rules apply:
        * Must contain only lowercase letters, numbers, and hyphens.
        * Must start with a letter.
        * Must be between 1-63 characters.
        * Must end with a number or a letter.
        * Must be unique within the project.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
recurring_schedule:
    Type: TypeList
    Description: Schedule recurring executions.
    Optional: "true"
    ExactlyOneOf: one_time_schedule, recurring_schedule
    MaxItems: "1"
    Properties:
        end_time:
            Type: TypeString
            Description: |-
                The end time at which a recurring patch deployment schedule is no longer active.
                A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
            Optional: "true"
        last_execute_time:
            Type: TypeString
            Description: |-
                The time the last patch job ran successfully.
                A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
            Computed: "true"
        monthly:
            Type: TypeList
            Description: Schedule with monthly executions.
            Optional: "true"
            MaxItems: "1"
            Properties:
                month_day:
                    Type: TypeInt
                    Description: |-
                        One day of the month. 1-31 indicates the 1st to the 31st day. -1 indicates the last day of the month.
                        Months without the target day will be skipped. For example, a schedule to run "every month on the 31st"
                        will not run in February, April, June, etc.
                    Optional: "true"
                    ExactlyOneOf: recurring_schedule.0.monthly.0.week_day_of_month, recurring_schedule.0.monthly.0.month_day
                week_day_of_month:
                    Type: TypeList
                    Description: Week day in a month.
                    Optional: "true"
                    ExactlyOneOf: recurring_schedule.0.monthly.0.week_day_of_month, recurring_schedule.0.monthly.0.month_day
                    MaxItems: "1"
                    Properties:
                        day_of_week:
                            Type: TypeString
                            Description: 'A day of the week. Possible values: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"]'
                            Required: "true"
                        day_offset:
                            Type: TypeInt
                            Description: Represents the number of days before or after the given week day of month that the patch deployment is scheduled for.
                            Optional: "true"
                        week_ordinal:
                            Type: TypeInt
                            Description: Week number in a month. 1-4 indicates the 1st to 4th week of the month. -1 indicates the last week of the month.
                            Required: "true"
        next_execute_time:
            Type: TypeString
            Description: |-
                The time the next patch job is scheduled to run.
                A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
            Computed: "true"
        start_time:
            Type: TypeString
            Description: |-
                The time that the recurring schedule becomes effective. Defaults to createTime of the patch deployment.
                A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
            Optional: "true"
        time_of_day:
            Type: TypeList
            Description: Time of the day to run a recurring deployment.
            Required: "true"
            MaxItems: "1"
            Properties:
                hours:
                    Type: TypeInt
                    Description: |-
                        Hours of day in 24 hour format. Should be from 0 to 23.
                        An API may choose to allow the value "24:00:00" for scenarios like business closing time.
                    Optional: "true"
                    AtLeastOneOf: recurring_schedule.0.time_of_day.0.hours, recurring_schedule.0.time_of_day.0.minutes, recurring_schedule.0.time_of_day.0.seconds, recurring_schedule.0.time_of_day.0.nanos
                minutes:
                    Type: TypeInt
                    Description: Minutes of hour of day. Must be from 0 to 59.
                    Optional: "true"
                    AtLeastOneOf: recurring_schedule.0.time_of_day.0.hours, recurring_schedule.0.time_of_day.0.minutes, recurring_schedule.0.time_of_day.0.seconds, recurring_schedule.0.time_of_day.0.nanos
                nanos:
                    Type: TypeInt
                    Description: Fractions of seconds in nanoseconds. Must be from 0 to 999,999,999.
                    Optional: "true"
                    AtLeastOneOf: recurring_schedule.0.time_of_day.0.hours, recurring_schedule.0.time_of_day.0.minutes, recurring_schedule.0.time_of_day.0.seconds, recurring_schedule.0.time_of_day.0.nanos
                seconds:
                    Type: TypeInt
                    Description: Seconds of minutes of the time. Must normally be from 0 to 59. An API may allow the value 60 if it allows leap-seconds.
                    Optional: "true"
                    AtLeastOneOf: recurring_schedule.0.time_of_day.0.hours, recurring_schedule.0.time_of_day.0.minutes, recurring_schedule.0.time_of_day.0.seconds, recurring_schedule.0.time_of_day.0.nanos
        time_zone:
            Type: TypeList
            Description: |-
                Defines the time zone that timeOfDay is relative to. The rules for daylight saving time are
                determined by the chosen time zone.
            Required: "true"
            MaxItems: "1"
            Properties:
                id:
                    Type: TypeString
                    Description: IANA Time Zone Database time zone, e.g. "America/New_York".
                    Required: "true"
                version:
                    Type: TypeString
                    Description: IANA Time Zone Database version number, e.g. "2019a".
                    Optional: "true"
        weekly:
            Type: TypeList
            Description: Schedule with weekly executions.
            Optional: "true"
            MaxItems: "1"
            Properties:
                day_of_week:
                    Type: TypeString
                    Description: 'IANA Time Zone Database time zone, e.g. "America/New_York". Possible values: ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"]'
                    Required: "true"
rollout:
    Type: TypeList
    Description: Rollout strategy of the patch job.
    Optional: "true"
    MaxItems: "1"
    Properties:
        disruption_budget:
            Type: TypeList
            Description: |-
                The maximum number (or percentage) of VMs per zone to disrupt at any given moment. The number of VMs calculated from multiplying the percentage by the total number of VMs in a zone is rounded up.
                During patching, a VM is considered disrupted from the time the agent is notified to begin until patching has completed. This disruption time includes the time to complete reboot and any post-patch steps.
                A VM contributes to the disruption budget if its patching operation fails either when applying the patches, running pre or post patch steps, or if it fails to respond with a success notification before timing out. VMs that are not running or do not have an active agent do not count toward this disruption budget.
                For zone-by-zone rollouts, if the disruption budget in a zone is exceeded, the patch job stops, because continuing to the next zone requires completion of the patch process in the previous zone.
                For example, if the disruption budget has a fixed value of 10, and 8 VMs fail to patch in the current zone, the patch job continues to patch 2 VMs at a time until the zone is completed. When that zone is completed successfully, patching begins with 10 VMs at a time in the next zone. If 10 VMs in the next zone fail to patch, the patch job stops.
            Required: "true"
            MaxItems: "1"
            Properties:
                fixed:
                    Type: TypeInt
                    Description: Specifies a fixed value.
                    Optional: "true"
                    ExactlyOneOf: rollout.0.disruption_budget.0.fixed, rollout.0.disruption_budget.0.percentage
                percentage:
                    Type: TypeInt
                    Description: Specifies the relative value defined as a percentage, which will be multiplied by a reference value.
                    Optional: "true"
                    ExactlyOneOf: rollout.0.disruption_budget.0.fixed, rollout.0.disruption_budget.0.percentage
        mode:
            Type: TypeString
            Description: 'Mode of the patch rollout. Possible values: ["ZONE_BY_ZONE", "CONCURRENT_ZONES"]'
            Required: "true"
update_time:
    Type: TypeString
    Description: |-
        Time the patch deployment was last updated. Timestamp is in RFC3339 text format.
        A timestamp in RFC3339 UTC "Zulu" format, accurate to nanoseconds. Example: "2014-10-02T15:01:23.045123456Z".
    Computed: "true"

