effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
issuance_policy:
    Type: TypeList
    Description: The IssuancePolicy to control how Certificates will be issued from this CaPool.
    Optional: "true"
    MaxItems: "1"
    Properties:
        allowed_issuance_modes:
            Type: TypeList
            Description: IssuanceModes specifies the allowed ways in which Certificates may be requested from this CaPool.
            Optional: "true"
            MaxItems: "1"
            Properties:
                allow_config_based_issuance:
                    Type: TypeBool
                    Description: When true, allows callers to create Certificates by specifying a CertificateConfig.
                    Required: "true"
                allow_csr_based_issuance:
                    Type: TypeBool
                    Description: When true, allows callers to create Certificates by specifying a CSR.
                    Required: "true"
        allowed_key_types:
            Type: TypeList
            Description: |-
                If any AllowedKeyType is specified, then the certificate request's public key must match one of the key types listed here.
                Otherwise, any key may be used.
            Optional: "true"
            Properties:
                elliptic_curve:
                    Type: TypeList
                    Description: Represents an allowed Elliptic Curve key type.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        signature_algorithm:
                            Type: TypeString
                            Description: 'The algorithm used. Possible values: ["ECDSA_P256", "ECDSA_P384", "EDDSA_25519"]'
                            Required: "true"
                rsa:
                    Type: TypeList
                    Description: Describes an RSA key that may be used in a Certificate issued from a CaPool.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        max_modulus_size:
                            Type: TypeString
                            Description: |-
                                The maximum allowed RSA modulus size, in bits. If this is not set, or if set to zero, the
                                service will not enforce an explicit upper bound on RSA modulus sizes.
                            Optional: "true"
                        min_modulus_size:
                            Type: TypeString
                            Description: |-
                                The minimum allowed RSA modulus size, in bits. If this is not set, or if set to zero, the
                                service-level min RSA modulus size will continue to apply.
                            Optional: "true"
        baseline_values:
            Type: TypeList
            Description: |-
                A set of X.509 values that will be applied to all certificates issued through this CaPool. If a certificate request
                includes conflicting values for the same properties, they will be overwritten by the values defined here. If a certificate
                request uses a CertificateTemplate that defines conflicting predefinedValues for the same properties, the certificate
                issuance request will fail.
            Optional: "true"
            MaxItems: "1"
            Properties:
                additional_extensions:
                    Type: TypeList
                    Description: Specifies an X.509 extension, which may be used in different parts of X.509 objects like certificates, CSRs, and CRLs.
                    Optional: "true"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: |-
                                Indicates whether or not this extension is critical (i.e., if the client does not know how to
                                handle this extension, the client should consider this to be an error).
                            Required: "true"
                        object_id:
                            Type: TypeList
                            Description: Describes values that are relevant in a CA certificate.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Required: "true"
                        value:
                            Type: TypeString
                            Description: The value of this X.509 extension. A base64-encoded string.
                            Required: "true"
                aia_ocsp_servers:
                    Type: TypeList
                    Description: |-
                        Describes Online Certificate Status Protocol (OCSP) endpoint addresses that appear in the
                        "Authority Information Access" extension in the certificate.
                    Optional: "true"
                ca_options:
                    Type: TypeList
                    Description: Describes values that are relevant in a CA certificate.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        is_ca:
                            Type: TypeBool
                            Description: When true, the "CA" in Basic Constraints extension will be set to true.
                            Optional: "true"
                        max_issuer_path_length:
                            Type: TypeInt
                            Description: |-
                                Refers to the "path length constraint" in Basic Constraints extension. For a CA certificate, this value describes the depth of
                                subordinate CA certificates that are allowed. If this value is less than 0, the request will fail.
                            Optional: "true"
                        non_ca:
                            Type: TypeBool
                            Description: |-
                                When true, the "CA" in Basic Constraints extension will be set to false.
                                If both 'is_ca' and 'non_ca' are unset, the extension will be omitted from the CA certificate.
                            Optional: "true"
                        zero_max_issuer_path_length:
                            Type: TypeBool
                            Description: |-
                                When true, the "path length constraint" in Basic Constraints extension will be set to 0.
                                if both 'max_issuer_path_length' and 'zero_max_issuer_path_length' are unset,
                                the max path length will be omitted from the CA certificate.
                            Optional: "true"
                key_usage:
                    Type: TypeList
                    Description: Indicates the intended use for keys that correspond to a certificate.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        base_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                cert_sign:
                                    Type: TypeBool
                                    Description: The key may be used to sign certificates.
                                    Optional: "true"
                                content_commitment:
                                    Type: TypeBool
                                    Description: The key may be used for cryptographic commitments. Note that this may also be referred to as "non-repudiation".
                                    Optional: "true"
                                crl_sign:
                                    Type: TypeBool
                                    Description: The key may be used sign certificate revocation lists.
                                    Optional: "true"
                                data_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher data.
                                    Optional: "true"
                                decipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to decipher only.
                                    Optional: "true"
                                digital_signature:
                                    Type: TypeBool
                                    Description: The key may be used for digital signatures.
                                    Optional: "true"
                                encipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to encipher only.
                                    Optional: "true"
                                key_agreement:
                                    Type: TypeBool
                                    Description: The key may be used in a key agreement protocol.
                                    Optional: "true"
                                key_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher other keys.
                                    Optional: "true"
                        extended_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                client_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.2. Officially described as "TLS WWW client authentication", though regularly used for non-WWW TLS.
                                    Optional: "true"
                                code_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.3. Officially described as "Signing of downloadable executable code client authentication".
                                    Optional: "true"
                                email_protection:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.4. Officially described as "Email protection".
                                    Optional: "true"
                                ocsp_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.9. Officially described as "Signing OCSP responses".
                                    Optional: "true"
                                server_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.1. Officially described as "TLS WWW server authentication", though regularly used for non-WWW TLS.
                                    Optional: "true"
                                time_stamping:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.8. Officially described as "Binding the hash of an object to a time".
                                    Optional: "true"
                        unknown_extended_key_usages:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Optional: "true"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Required: "true"
                name_constraints:
                    Type: TypeList
                    Description: Describes the X.509 name constraints extension.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: Indicates whether or not the name constraints are marked critical.
                            Required: "true"
                        excluded_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains excluded DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Optional: "true"
                        excluded_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the excluded email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Optional: "true"
                        excluded_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the excluded IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Optional: "true"
                        excluded_uris:
                            Type: TypeList
                            Description: |-
                                Contains the excluded URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Optional: "true"
                        permitted_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains permitted DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Optional: "true"
                        permitted_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the permitted email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Optional: "true"
                        permitted_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the permitted IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Optional: "true"
                        permitted_uris:
                            Type: TypeList
                            Description: |-
                                Contains the permitted URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Optional: "true"
                policy_ids:
                    Type: TypeList
                    Description: Describes the X.509 certificate policy object identifiers, per https://tools.ietf.org/html/rfc5280#section-4.2.1.4.
                    Optional: "true"
                    Properties:
                        object_id_path:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Required: "true"
        identity_constraints:
            Type: TypeList
            Description: |-
                Describes constraints on identities that may appear in Certificates issued through this CaPool.
                If this is omitted, then this CaPool will not add restrictions on a certificate's identity.
            Optional: "true"
            MaxItems: "1"
            Properties:
                allow_subject_alt_names_passthrough:
                    Type: TypeBool
                    Description: |-
                        If this is set, the SubjectAltNames extension may be copied from a certificate request into the signed certificate.
                        Otherwise, the requested SubjectAltNames will be discarded.
                    Required: "true"
                allow_subject_passthrough:
                    Type: TypeBool
                    Description: |-
                        If this is set, the Subject field may be copied from a certificate request into the signed certificate.
                        Otherwise, the requested Subject will be discarded.
                    Required: "true"
                cel_expression:
                    Type: TypeList
                    Description: |-
                        A CEL expression that may be used to validate the resolved X.509 Subject and/or Subject Alternative Name before a
                        certificate is signed. To see the full allowed syntax and some examples,
                        see https://cloud.google.com/certificate-authority-service/docs/cel-guide
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        description:
                            Type: TypeString
                            Description: Description of the expression. This is a longer text which describes the expression, e.g. when hovered over it in a UI.
                            Optional: "true"
                        expression:
                            Type: TypeString
                            Description: Textual representation of an expression in Common Expression Language syntax.
                            Required: "true"
                        location:
                            Type: TypeString
                            Description: String indicating the location of the expression for error reporting, e.g. a file name and a position in the file.
                            Optional: "true"
                        title:
                            Type: TypeString
                            Description: Title for the expression, i.e. a short string describing its purpose. This can be used e.g. in UIs which allow to enter the expression.
                            Optional: "true"
        maximum_lifetime:
            Type: TypeString
            Description: |-
                The maximum lifetime allowed for issued Certificates. Note that if the issuing CertificateAuthority
                expires before a Certificate's requested maximumLifetime, the effective lifetime will be explicitly truncated to match it.
            Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels with user-defined metadata.

        An object containing a list of "key": value pairs. Example: { "name": "wrench", "mass":
        "1.3kg", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: |-
        Location of the CaPool. A full list of valid locations can be found by
        running 'gcloud privateca locations list'.
    Required: "true"
name:
    Type: TypeString
    Description: The name for this CaPool.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
publishing_options:
    Type: TypeList
    Description: The PublishingOptions to follow when issuing Certificates from any CertificateAuthority in this CaPool.
    Optional: "true"
    MaxItems: "1"
    Properties:
        encoding_format:
            Type: TypeString
            Description: |-
                Specifies the encoding format of each CertificateAuthority's CA
                certificate and CRLs. If this is omitted, CA certificates and CRLs
                will be published in PEM. Possible values: ["PEM", "DER"]
            Optional: "true"
        publish_ca_cert:
            Type: TypeBool
            Description: |-
                When true, publishes each CertificateAuthority's CA certificate and includes its URL in the "Authority Information Access"
                X.509 extension in all issued Certificates. If this is false, the CA certificate will not be published and the corresponding
                X.509 extension will not be written in issued certificates.
            Required: "true"
        publish_crl:
            Type: TypeBool
            Description: |-
                When true, publishes each CertificateAuthority's CRL and includes its URL in the "CRL Distribution Points" X.509 extension
                in all issued Certificates. If this is false, CRLs will not be published and the corresponding X.509 extension will not
                be written in issued certificates. CRLs will expire 7 days from their creation. However, we will rebuild daily. CRLs are
                also rebuilt shortly after a certificate is revoked.
            Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
tier:
    Type: TypeString
    Description: 'The Tier of this CaPool. Possible values: ["ENTERPRISE", "DEVOPS"]'
    Required: "true"

