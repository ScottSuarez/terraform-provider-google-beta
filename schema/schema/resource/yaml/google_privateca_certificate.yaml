certificate_authority:
    Type: TypeString
    Description: |-
        The Certificate Authority ID that should issue the certificate. For example, to issue a Certificate from
        a Certificate Authority with resource name 'projects/my-project/locations/us-central1/caPools/my-pool/certificateAuthorities/my-ca',
        argument 'pool' should be set to 'projects/my-project/locations/us-central1/caPools/my-pool', argument 'certificate_authority'
        should be set to 'my-ca'.
    Optional: "true"
certificate_description:
    Type: TypeList
    Description: Output only. Details regarding the revocation of this Certificate. This Certificate is considered revoked if and only if this field is present.
    Computed: "true"
    Properties:
        aia_issuing_certificate_urls:
            Type: TypeList
            Description: Describes lists of issuer CA certificate URLs that appear in the "Authority Information Access" extension in the certificate.
            Computed: "true"
        authority_key_id:
            Type: TypeList
            Description: Identifies the subjectKeyId of the parent certificate, per https://tools.ietf.org/html/rfc5280#section-4.2.1.1
            Computed: "true"
            Properties:
                key_id:
                    Type: TypeString
                    Description: Optional. The value of this KeyId encoded in lowercase hexadecimal. This is most likely the 160 bit SHA-1 hash of the public key.
                    Computed: "true"
        cert_fingerprint:
            Type: TypeList
            Description: The hash of the x.509 certificate.
            Computed: "true"
            Properties:
                sha256_hash:
                    Type: TypeString
                    Description: The SHA 256 hash, encoded in hexadecimal, of the DER x509 certificate.
                    Computed: "true"
        crl_distribution_points:
            Type: TypeList
            Description: Describes a list of locations to obtain CRL information, i.e. the DistributionPoint.fullName described by https://tools.ietf.org/html/rfc5280#section-4.2.1.13
            Computed: "true"
        public_key:
            Type: TypeList
            Description: A PublicKey describes a public key.
            Computed: "true"
            Properties:
                format:
                    Type: TypeString
                    Description: The format of the public key. Currently, only PEM format is supported.
                    Computed: "true"
                key:
                    Type: TypeString
                    Description: Required. A public key. When this is specified in a request, the padding and encoding can be any of the options described by the respective 'KeyType' value. When this is generated by the service, it will always be an RFC 5280 SubjectPublicKeyInfo structure containing an algorithm identifier and a key. A base64-encoded string.
                    Computed: "true"
        subject_description:
            Type: TypeList
            Description: Describes some of the values in a certificate that are related to the subject and lifetime.
            Computed: "true"
            Properties:
                hex_serial_number:
                    Type: TypeString
                    Description: The serial number encoded in lowercase hexadecimal.
                    Computed: "true"
                lifetime:
                    Type: TypeString
                    Description: For convenience, the actual lifetime of an issued certificate. Corresponds to 'notAfterTime' - 'notBeforeTime'.
                    Computed: "true"
                not_after_time:
                    Type: TypeString
                    Description: The time at which the certificate expires.
                    Computed: "true"
                not_before_time:
                    Type: TypeString
                    Description: The time at which the certificate becomes valid.
                    Computed: "true"
                subject:
                    Type: TypeList
                    Description: Contains distinguished name fields such as the location and organization.
                    Computed: "true"
                    Properties:
                        common_name:
                            Type: TypeString
                            Description: The "common name" of the distinguished name.
                            Computed: "true"
                        country_code:
                            Type: TypeString
                            Description: The country code of the subject.
                            Computed: "true"
                        locality:
                            Type: TypeString
                            Description: The locality or city of the subject.
                            Computed: "true"
                        organization:
                            Type: TypeString
                            Description: The organization of the subject.
                            Computed: "true"
                        organizational_unit:
                            Type: TypeString
                            Description: The organizationalUnit of the subject.
                            Computed: "true"
                        postal_code:
                            Type: TypeString
                            Description: The postalCode or city of the subject.
                            Computed: "true"
                        province:
                            Type: TypeString
                            Description: The province of the subject.
                            Computed: "true"
                        street_address:
                            Type: TypeString
                            Description: The streetAddress or city of the subject.
                            Computed: "true"
                subject_alt_name:
                    Type: TypeList
                    Description: The subject alternative name fields.
                    Computed: "true"
                    Properties:
                        custom_sans:
                            Type: TypeList
                            Description: Contains additional subject alternative name values.
                            Computed: "true"
                            Properties:
                                critical:
                                    Type: TypeBool
                                    Description: Required. Indicates whether or not this extension is critical (i.e., if the client does not know how to handle this extension, the client should consider this to be an error).
                                    Computed: "true"
                                obect_id:
                                    Type: TypeList
                                    Description: Describes how some of the technical fields in a certificate should be populated.
                                    Computed: "true"
                                    Properties:
                                        object_id_path:
                                            Type: TypeList
                                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                            Computed: "true"
                                value:
                                    Type: TypeString
                                    Description: The value of this X.509 extension.
                                    Computed: "true"
                        dns_names:
                            Type: TypeList
                            Description: Contains only valid, fully-qualified host names.
                            Computed: "true"
                        email_addresses:
                            Type: TypeList
                            Description: Contains only valid RFC 2822 E-mail addresses.
                            Computed: "true"
                        ip_addresses:
                            Type: TypeList
                            Description: Contains only valid 32-bit IPv4 addresses or RFC 4291 IPv6 addresses.
                            Computed: "true"
                        uris:
                            Type: TypeList
                            Description: Contains only valid RFC 3986 URIs.
                            Computed: "true"
        subject_key_id:
            Type: TypeList
            Description: Provides a means of identifiying certificates that contain a particular public key, per https://tools.ietf.org/html/rfc5280#section-4.2.1.2.
            Computed: "true"
            Properties:
                key_id:
                    Type: TypeString
                    Description: Optional. The value of this KeyId encoded in lowercase hexadecimal. This is most likely the 160 bit SHA-1 hash of the public key.
                    Computed: "true"
        x509_description:
            Type: TypeList
            Description: A structured description of the issued X.509 certificate.
            Computed: "true"
            Properties:
                additional_extensions:
                    Type: TypeList
                    Description: Describes custom X.509 extensions.
                    Computed: "true"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: |-
                                Indicates whether or not this extension is critical (i.e., if the client does not know how to
                                handle this extension, the client should consider this to be an error).
                            Computed: "true"
                        object_id:
                            Type: TypeList
                            Description: Describes values that are relevant in a CA certificate.
                            Computed: "true"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Computed: "true"
                        value:
                            Type: TypeString
                            Description: The value of this X.509 extension. A base64-encoded string.
                            Optional: "true"
                aia_ocsp_servers:
                    Type: TypeList
                    Description: |-
                        Describes Online Certificate Status Protocol (OCSP) endpoint addresses that appear in the
                        "Authority Information Access" extension in the certificate.
                    Computed: "true"
                ca_options:
                    Type: TypeList
                    Description: Describes values that are relevant in a CA certificate.
                    Computed: "true"
                    Properties:
                        is_ca:
                            Type: TypeBool
                            Description: When true, the "CA" in Basic Constraints extension will be set to true.
                            Computed: "true"
                        max_issuer_path_length:
                            Type: TypeInt
                            Description: |-
                                Refers to the "path length constraint" in Basic Constraints extension. For a CA certificate, this value describes the depth of
                                subordinate CA certificates that are allowed. If this value is less than 0, the request will fail.
                            Computed: "true"
                key_usage:
                    Type: TypeList
                    Description: Indicates the intended use for keys that correspond to a certificate.
                    Computed: "true"
                    Properties:
                        base_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Computed: "true"
                            Properties:
                                cert_sign:
                                    Type: TypeBool
                                    Description: The key may be used to sign certificates.
                                    Computed: "true"
                                content_commitment:
                                    Type: TypeBool
                                    Description: The key may be used for cryptographic commitments. Note that this may also be referred to as "non-repudiation".
                                    Computed: "true"
                                crl_sign:
                                    Type: TypeBool
                                    Description: The key may be used sign certificate revocation lists.
                                    Computed: "true"
                                data_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher data.
                                    Computed: "true"
                                decipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to decipher only.
                                    Computed: "true"
                                digital_signature:
                                    Type: TypeBool
                                    Description: The key may be used for digital signatures.
                                    Computed: "true"
                                encipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to encipher only.
                                    Computed: "true"
                                key_agreement:
                                    Type: TypeBool
                                    Description: The key may be used in a key agreement protocol.
                                    Computed: "true"
                                key_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher other keys.
                                    Computed: "true"
                        extended_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Computed: "true"
                            Properties:
                                client_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.2. Officially described as "TLS WWW client authentication", though regularly used for non-WWW TLS.
                                    Computed: "true"
                                code_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.3. Officially described as "Signing of downloadable executable code client authentication".
                                    Computed: "true"
                                email_protection:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.4. Officially described as "Email protection".
                                    Computed: "true"
                                ocsp_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.9. Officially described as "Signing OCSP responses".
                                    Computed: "true"
                                server_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.1. Officially described as "TLS WWW server authentication", though regularly used for non-WWW TLS.
                                    Computed: "true"
                                time_stamping:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.8. Officially described as "Binding the hash of an object to a time".
                                    Computed: "true"
                        unknown_extended_key_usages:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Computed: "true"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Computed: "true"
                name_constraints:
                    Type: TypeList
                    Description: Describes the X.509 name constraints extension.
                    Computed: "true"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: Indicates whether or not the name constraints are marked critical.
                            Computed: "true"
                        excluded_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains excluded DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Computed: "true"
                        excluded_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the excluded email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Computed: "true"
                        excluded_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the excluded IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Computed: "true"
                        excluded_uris:
                            Type: TypeList
                            Description: |-
                                Contains the excluded URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Computed: "true"
                        permitted_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains permitted DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Computed: "true"
                        permitted_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the permitted email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Computed: "true"
                        permitted_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the permitted IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Computed: "true"
                        permitted_uris:
                            Type: TypeList
                            Description: |-
                                Contains the permitted URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Computed: "true"
                policy_ids:
                    Type: TypeList
                    Description: Describes the X.509 certificate policy object identifiers, per https://tools.ietf.org/html/rfc5280#section-4.2.1.4.
                    Computed: "true"
                    Properties:
                        object_id_path:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Computed: "true"
certificate_template:
    Type: TypeString
    Description: |-
        The resource name for a CertificateTemplate used to issue this certificate,
        in the format 'projects/*/locations/*/certificateTemplates/*'. If this is specified,
        the caller must have the necessary permission to use this template. If this is
        omitted, no template will be used. This template must be in the same location
        as the Certificate.
    Optional: "true"
config:
    Type: TypeList
    Description: The config used to create a self-signed X.509 certificate or CSR.
    Optional: "true"
    ExactlyOneOf: pem_csr, config
    MaxItems: "1"
    Properties:
        public_key:
            Type: TypeList
            Description: A PublicKey describes a public key.
            Required: "true"
            MaxItems: "1"
            Properties:
                format:
                    Type: TypeString
                    Description: 'The format of the public key. Currently, only PEM format is supported. Possible values: ["KEY_TYPE_UNSPECIFIED", "PEM"]'
                    Required: "true"
                key:
                    Type: TypeString
                    Description: Required. A public key. When this is specified in a request, the padding and encoding can be any of the options described by the respective 'KeyType' value. When this is generated by the service, it will always be an RFC 5280 SubjectPublicKeyInfo structure containing an algorithm identifier and a key. A base64-encoded string.
                    Optional: "true"
        subject_config:
            Type: TypeList
            Description: Specifies some of the values in a certificate that are related to the subject.
            Required: "true"
            MaxItems: "1"
            Properties:
                subject:
                    Type: TypeList
                    Description: Contains distinguished name fields such as the location and organization.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        common_name:
                            Type: TypeString
                            Description: The common name of the distinguished name.
                            Required: "true"
                        country_code:
                            Type: TypeString
                            Description: The country code of the subject.
                            Optional: "true"
                        locality:
                            Type: TypeString
                            Description: The locality or city of the subject.
                            Optional: "true"
                        organization:
                            Type: TypeString
                            Description: The organization of the subject.
                            Required: "true"
                        organizational_unit:
                            Type: TypeString
                            Description: The organizational unit of the subject.
                            Optional: "true"
                        postal_code:
                            Type: TypeString
                            Description: The postal code of the subject.
                            Optional: "true"
                        province:
                            Type: TypeString
                            Description: The province, territory, or regional state of the subject.
                            Optional: "true"
                        street_address:
                            Type: TypeString
                            Description: The street address of the subject.
                            Optional: "true"
                subject_alt_name:
                    Type: TypeList
                    Description: The subject alternative name fields.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        dns_names:
                            Type: TypeList
                            Description: Contains only valid, fully-qualified host names.
                            Optional: "true"
                            AtLeastOneOf: config.0.subject_config.0.subject_alt_name.0.dns_names, config.0.subject_config.0.subject_alt_name.0.uris, config.0.subject_config.0.subject_alt_name.0.email_addresses, config.0.subject_config.0.subject_alt_name.0.ip_addresses
                        email_addresses:
                            Type: TypeList
                            Description: Contains only valid RFC 2822 E-mail addresses.
                            Optional: "true"
                            AtLeastOneOf: config.0.subject_config.0.subject_alt_name.0.dns_names, config.0.subject_config.0.subject_alt_name.0.uris, config.0.subject_config.0.subject_alt_name.0.email_addresses, config.0.subject_config.0.subject_alt_name.0.ip_addresses
                        ip_addresses:
                            Type: TypeList
                            Description: Contains only valid 32-bit IPv4 addresses or RFC 4291 IPv6 addresses.
                            Optional: "true"
                            AtLeastOneOf: config.0.subject_config.0.subject_alt_name.0.dns_names, config.0.subject_config.0.subject_alt_name.0.uris, config.0.subject_config.0.subject_alt_name.0.email_addresses, config.0.subject_config.0.subject_alt_name.0.ip_addresses
                        uris:
                            Type: TypeList
                            Description: Contains only valid RFC 3986 URIs.
                            Optional: "true"
                            AtLeastOneOf: config.0.subject_config.0.subject_alt_name.0.dns_names, config.0.subject_config.0.subject_alt_name.0.uris, config.0.subject_config.0.subject_alt_name.0.email_addresses, config.0.subject_config.0.subject_alt_name.0.ip_addresses
        x509_config:
            Type: TypeList
            Description: Describes how some of the technical X.509 fields in a certificate should be populated.
            Required: "true"
            MaxItems: "1"
            Properties:
                additional_extensions:
                    Type: TypeList
                    Description: Specifies an X.509 extension, which may be used in different parts of X.509 objects like certificates, CSRs, and CRLs.
                    Optional: "true"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: |-
                                Indicates whether or not this extension is critical (i.e., if the client does not know how to
                                handle this extension, the client should consider this to be an error).
                            Required: "true"
                        object_id:
                            Type: TypeList
                            Description: Describes values that are relevant in a CA certificate.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Required: "true"
                        value:
                            Type: TypeString
                            Description: The value of this X.509 extension. A base64-encoded string.
                            Required: "true"
                aia_ocsp_servers:
                    Type: TypeList
                    Description: |-
                        Describes Online Certificate Status Protocol (OCSP) endpoint addresses that appear in the
                        "Authority Information Access" extension in the certificate.
                    Optional: "true"
                ca_options:
                    Type: TypeList
                    Description: Describes values that are relevant in a CA certificate.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        is_ca:
                            Type: TypeBool
                            Description: When true, the "CA" in Basic Constraints extension will be set to true.
                            Optional: "true"
                        max_issuer_path_length:
                            Type: TypeInt
                            Description: |-
                                Refers to the "path length constraint" in Basic Constraints extension. For a CA certificate, this value describes the depth of
                                subordinate CA certificates that are allowed. If this value is less than 0, the request will fail.
                            Optional: "true"
                        non_ca:
                            Type: TypeBool
                            Description: |-
                                When true, the "CA" in Basic Constraints extension will be set to false.
                                If both 'is_ca' and 'non_ca' are unset, the extension will be omitted from the CA certificate.
                            Optional: "true"
                        zero_max_issuer_path_length:
                            Type: TypeBool
                            Description: |-
                                When true, the "path length constraint" in Basic Constraints extension will be set to 0.
                                if both 'max_issuer_path_length' and 'zero_max_issuer_path_length' are unset,
                                the max path length will be omitted from the CA certificate.
                            Optional: "true"
                key_usage:
                    Type: TypeList
                    Description: Indicates the intended use for keys that correspond to a certificate.
                    Required: "true"
                    MaxItems: "1"
                    Properties:
                        base_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                cert_sign:
                                    Type: TypeBool
                                    Description: The key may be used to sign certificates.
                                    Optional: "true"
                                content_commitment:
                                    Type: TypeBool
                                    Description: The key may be used for cryptographic commitments. Note that this may also be referred to as "non-repudiation".
                                    Optional: "true"
                                crl_sign:
                                    Type: TypeBool
                                    Description: The key may be used sign certificate revocation lists.
                                    Optional: "true"
                                data_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher data.
                                    Optional: "true"
                                decipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to decipher only.
                                    Optional: "true"
                                digital_signature:
                                    Type: TypeBool
                                    Description: The key may be used for digital signatures.
                                    Optional: "true"
                                encipher_only:
                                    Type: TypeBool
                                    Description: The key may be used to encipher only.
                                    Optional: "true"
                                key_agreement:
                                    Type: TypeBool
                                    Description: The key may be used in a key agreement protocol.
                                    Optional: "true"
                                key_encipherment:
                                    Type: TypeBool
                                    Description: The key may be used to encipher other keys.
                                    Optional: "true"
                        extended_key_usage:
                            Type: TypeList
                            Description: Describes high-level ways in which a key may be used.
                            Required: "true"
                            MaxItems: "1"
                            Properties:
                                client_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.2. Officially described as "TLS WWW client authentication", though regularly used for non-WWW TLS.
                                    Optional: "true"
                                code_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.3. Officially described as "Signing of downloadable executable code client authentication".
                                    Optional: "true"
                                email_protection:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.4. Officially described as "Email protection".
                                    Optional: "true"
                                ocsp_signing:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.9. Officially described as "Signing OCSP responses".
                                    Optional: "true"
                                server_auth:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.1. Officially described as "TLS WWW server authentication", though regularly used for non-WWW TLS.
                                    Optional: "true"
                                time_stamping:
                                    Type: TypeBool
                                    Description: Corresponds to OID 1.3.6.1.5.5.7.3.8. Officially described as "Binding the hash of an object to a time".
                                    Optional: "true"
                        unknown_extended_key_usages:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Optional: "true"
                            Properties:
                                object_id_path:
                                    Type: TypeList
                                    Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                                    Required: "true"
                name_constraints:
                    Type: TypeList
                    Description: Describes the X.509 name constraints extension.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        critical:
                            Type: TypeBool
                            Description: Indicates whether or not the name constraints are marked critical.
                            Required: "true"
                        excluded_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains excluded DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Optional: "true"
                        excluded_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the excluded email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Optional: "true"
                        excluded_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the excluded IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Optional: "true"
                        excluded_uris:
                            Type: TypeList
                            Description: |-
                                Contains the excluded URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Optional: "true"
                        permitted_dns_names:
                            Type: TypeList
                            Description: |-
                                Contains permitted DNS names. Any DNS name that can be
                                constructed by simply adding zero or more labels to
                                the left-hand side of the name satisfies the name constraint.
                                For example, 'example.com', 'www.example.com', 'www.sub.example.com'
                                would satisfy 'example.com' while 'example1.com' does not.
                            Optional: "true"
                        permitted_email_addresses:
                            Type: TypeList
                            Description: |-
                                Contains the permitted email addresses. The value can be a particular
                                email address, a hostname to indicate all email addresses on that host or
                                a domain with a leading period (e.g. '.example.com') to indicate
                                all email addresses in that domain.
                            Optional: "true"
                        permitted_ip_ranges:
                            Type: TypeList
                            Description: |-
                                Contains the permitted IP ranges. For IPv4 addresses, the ranges
                                are expressed using CIDR notation as specified in RFC 4632.
                                For IPv6 addresses, the ranges are expressed in similar encoding as IPv4
                                addresses.
                            Optional: "true"
                        permitted_uris:
                            Type: TypeList
                            Description: |-
                                Contains the permitted URIs that apply to the host part of the name.
                                The value can be a hostname or a domain with a
                                leading period (like '.example.com')
                            Optional: "true"
                policy_ids:
                    Type: TypeList
                    Description: Describes the X.509 certificate policy object identifiers, per https://tools.ietf.org/html/rfc5280#section-4.2.1.4.
                    Optional: "true"
                    Properties:
                        object_id_path:
                            Type: TypeList
                            Description: An ObjectId specifies an object identifier (OID). These provide context and describe types in ASN.1 messages.
                            Required: "true"
create_time:
    Type: TypeString
    Description: |-
        The time that this resource was created on the server.
        This is in RFC3339 text format.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
issuer_certificate_authority:
    Type: TypeString
    Description: The resource name of the issuing CertificateAuthority in the format 'projects/*/locations/*/caPools/*/certificateAuthorities/*'.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Labels with user-defined metadata to apply to this resource.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
lifetime:
    Type: TypeString
    Description: |-
        The desired lifetime of the CA certificate. Used to create the "notBeforeTime" and
        "notAfterTime" fields inside an X.509 certificate. A duration in seconds with up to nine
        fractional digits, terminated by 's'. Example: "3.5s".
    Optional: "true"
location:
    Type: TypeString
    Description: |-
        Location of the Certificate. A full list of valid locations can be found by
        running 'gcloud privateca locations list'.
    Required: "true"
name:
    Type: TypeString
    Description: The name for this Certificate.
    Required: "true"
pem_certificate:
    Type: TypeString
    Description: Output only. The pem-encoded, signed X.509 certificate.
    Computed: "true"
pem_certificate_chain:
    Type: TypeList
    Description: The chain that may be used to verify the X.509 certificate. Expected to be in issuer-to-root order according to RFC 5246.
    Computed: "true"
pem_csr:
    Type: TypeString
    Description: Immutable. A pem-encoded X.509 certificate signing request (CSR).
    Optional: "true"
    ExactlyOneOf: pem_csr, config
pool:
    Type: TypeString
    Description: The name of the CaPool this Certificate belongs to.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
revocation_details:
    Type: TypeList
    Description: |-
        Output only. Details regarding the revocation of this Certificate. This Certificate is
        considered revoked if and only if this field is present.
    Computed: "true"
    Properties:
        revocation_state:
            Type: TypeString
            Description: Indicates why a Certificate was revoked.
            Computed: "true"
        revocation_time:
            Type: TypeString
            Description: The time at which this Certificate was revoked.
            Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
update_time:
    Type: TypeString
    Description: |-
        Output only. The time at which this CertificateAuthority was updated.
        This is in RFC3339 text format.
    Computed: "true"

