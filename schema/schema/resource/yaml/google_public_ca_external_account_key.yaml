b64_mac_key:
    Type: TypeString
    Description: |-
        Base64-URL-encoded HS256 key. It is generated by the PublicCertificateAuthorityService
        when the ExternalAccountKey is created.
    Computed: "true"
key_id:
    Type: TypeString
    Description: It is generated by the PublicCertificateAuthorityService when the ExternalAccountKey is created.
    Computed: "true"
location:
    Type: TypeString
    Description: Location for the externalAccountKey. Currently only 'global' is supported.
    Optional: "true"
name:
    Type: TypeString
    Description: Resource name. projects/{project}/locations/{location}/externalAccountKeys/{keyId}.
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"

