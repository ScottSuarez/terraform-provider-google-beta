annotations:
    Type: TypeMap
    Description: |-
        Custom metadata about the secret.

        Annotations are distinct from various forms of labels. Annotations exist to allow
        client tools to store their own state information without requiring a database.

        Annotation keys must be between 1 and 63 characters long, have a UTF-8 encoding of
        maximum 128 bytes, begin and end with an alphanumeric character ([a-z0-9A-Z]), and
        may have dashes (-), underscores (_), dots (.), and alphanumerics in between these
        symbols.

        The total size of annotation keys and values must be less than 16KiB.

        An object containing a list of "key": value pairs. Example:
        { "name": "wrench", "mass": "1.3kg", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the annotations present in your configuration.
        Please refer to the field 'effective_annotations' for all of the annotations present on the resource.
    Optional: "true"
create_time:
    Type: TypeString
    Description: The time at which the Secret was created.
    Computed: "true"
effective_annotations:
    Type: TypeMap
    Description: All of annotations (key/value pairs) present on the resource in GCP, including the annotations configured through Terraform, other clients and services.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
expire_time:
    Type: TypeString
    Description: |-
        Timestamp in UTC when the Secret is scheduled to expire. This is always provided on output, regardless of what was sent on input.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits. Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
        Only one of 'expire_time' or 'ttl' can be provided.
    Computed: "true"
    Optional: "true"
labels:
    Type: TypeMap
    Description: |-
        The labels assigned to this Secret.

        Label keys must be between 1 and 63 characters long, have a UTF-8 encoding of maximum 128 bytes,
        and must conform to the following PCRE regular expression: [\p{Ll}\p{Lo}][\p{Ll}\p{Lo}\p{N}_-]{0,62}

        Label values must be between 0 and 63 characters long, have a UTF-8 encoding of maximum 128 bytes,
        and must conform to the following PCRE regular expression: [\p{Ll}\p{Lo}\p{N}_-]{0,63}

        No more than 64 labels can be assigned to a given resource.

        An object containing a list of "key": value pairs. Example:
        { "name": "wrench", "mass": "1.3kg", "count": "3" }.


        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        The resource name of the Secret. Format:
        'projects/{{project}}/secrets/{{secret_id}}'
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
replication:
    Type: TypeList
    Description: |-
        The replication policy of the secret data attached to the Secret. It cannot be changed
        after the Secret has been created.
    Required: "true"
    MaxItems: "1"
    Properties:
        auto:
            Type: TypeList
            Description: The Secret will automatically be replicated without any restrictions.
            Optional: "true"
            ExactlyOneOf: replication.0.user_managed, replication.0.auto
            MaxItems: "1"
            Properties:
                customer_managed_encryption:
                    Type: TypeList
                    Description: |-
                        The customer-managed encryption configuration of the Secret.
                        If no configuration is provided, Google-managed default
                        encryption is used.
                    Optional: "true"
                    MaxItems: "1"
                    Properties:
                        kms_key_name:
                            Type: TypeString
                            Description: The resource name of the Cloud KMS CryptoKey used to encrypt secret payloads.
                            Required: "true"
        user_managed:
            Type: TypeList
            Description: The Secret will be replicated to the regions specified by the user.
            Optional: "true"
            ExactlyOneOf: replication.0.user_managed, replication.0.auto
            MaxItems: "1"
            Properties:
                replicas:
                    Type: TypeList
                    Description: The list of Replicas for this Secret. Cannot be empty.
                    Required: "true"
                    MinItems: "1"
                    Properties:
                        customer_managed_encryption:
                            Type: TypeList
                            Description: Customer Managed Encryption for the secret.
                            Optional: "true"
                            MaxItems: "1"
                            Properties:
                                kms_key_name:
                                    Type: TypeString
                                    Description: Describes the Cloud KMS encryption key that will be used to protect destination secret.
                                    Required: "true"
                        location:
                            Type: TypeString
                            Description: 'The canonical IDs of the location to replicate data. For example: "us-east1".'
                            Required: "true"
rotation:
    Type: TypeList
    Description: The rotation time and period for a Secret. At 'next_rotation_time', Secret Manager will send a Pub/Sub notification to the topics configured on the Secret. 'topics' must be set to configure rotation.
    Optional: "true"
    RequiredWith: topics
    MaxItems: "1"
    Properties:
        next_rotation_time:
            Type: TypeString
            Description: |-
                Timestamp in UTC at which the Secret is scheduled to rotate.
                A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine fractional digits. Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
            Optional: "true"
            RequiredWith: rotation.0.rotation_period
        rotation_period:
            Type: TypeString
            Description: |-
                The Duration between rotation notifications. Must be in seconds and at least 3600s (1h) and at most 3153600000s (100 years).
                If rotationPeriod is set, 'next_rotation_time' must be set. 'next_rotation_time' will be advanced by this period when the service automatically sends rotation notifications.
            Optional: "true"
secret_id:
    Type: TypeString
    Description: This must be unique within the project.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
topics:
    Type: TypeList
    Description: A list of up to 10 Pub/Sub topics to which messages are published when control plane operations are called on the secret or its versions.
    Optional: "true"
    Properties:
        name:
            Type: TypeString
            Description: |-
                The resource name of the Pub/Sub topic that will be published to, in the following format: projects/*/topics/*.
                For publication to succeed, the Secret Manager Service Agent service account must have pubsub.publisher permissions on the topic.
            Required: "true"
ttl:
    Type: TypeString
    Description: |-
        The TTL for the Secret.
        A duration in seconds with up to nine fractional digits, terminated by 's'. Example: "3.5s".
        Only one of 'ttl' or 'expire_time' can be provided.
    Optional: "true"
version_aliases:
    Type: TypeMap
    Description: |-
        Mapping from version alias to version name.

        A version alias is a string with a maximum length of 63 characters and can contain
        uppercase and lowercase letters, numerals, and the hyphen (-) and underscore ('_')
        characters. An alias string must start with a letter and cannot be the string
        'latest' or 'NEW'. No more than 50 aliases can be assigned to a given secret.

        An object containing a list of "key": value pairs. Example:
        { "name": "wrench", "mass": "1.3kg", "count": "3" }.
    Optional: "true"

