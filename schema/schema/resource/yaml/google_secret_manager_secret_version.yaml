create_time:
    Type: TypeString
    Description: The time at which the Secret was created.
    Computed: "true"
deletion_policy:
    Type: TypeString
    Description: |-
        The deletion policy for the secret version. Setting 'ABANDON' allows the resource
        to be abandoned rather than deleted. Setting 'DISABLE' allows the resource to be
        disabled rather than deleted. Default is 'DELETE'. Possible values are:
          * DELETE
          * DISABLE
          * ABANDON
    Optional: "true"
destroy_time:
    Type: TypeString
    Description: The time at which the Secret was destroyed. Only present if state is DESTROYED.
    Computed: "true"
enabled:
    Type: TypeBool
    Description: The current state of the SecretVersion.
    Optional: "true"
is_secret_data_base64:
    Type: TypeBool
    Description: If set to 'true', the secret data is expected to be base64-encoded string and would be sent as is.
    Optional: "true"
name:
    Type: TypeString
    Description: |-
        The resource name of the SecretVersion. Format:
        'projects/{{project}}/secrets/{{secret_id}}/versions/{{version}}'
    Computed: "true"
secret:
    Type: TypeString
    Description: Secret Manager secret resource
    Required: "true"
secret_data:
    Type: TypeString
    Description: The secret data. Must be no larger than 64KiB.
    Required: "true"
version:
    Type: TypeString
    Description: The version of the Secret.
    Computed: "true"

