database_dialect:
    Type: TypeString
    Description: |-
        The dialect of the Cloud Spanner Database.
        If it is not provided, "GOOGLE_STANDARD_SQL" will be used. Possible values: ["GOOGLE_STANDARD_SQL", "POSTGRESQL"]
    Computed: "true"
    Optional: "true"
ddl:
    Type: TypeList
    Description: |-
        An optional list of DDL statements to run inside the newly created
        database. Statements can create tables, indexes, etc. These statements
        execute atomically with the creation of the database: if there is an
        error in any statement, the database is not created.
    Optional: "true"
deletion_protection:
    Type: TypeBool
    Description: |-
        Whether or not to allow Terraform to destroy the database. Defaults to true. Unless this field is set to false
        in Terraform state, a 'terraform destroy' or 'terraform apply' that would delete the database will fail.
    Optional: "true"
enable_drop_protection:
    Type: TypeBool
    Description: |-
        Whether drop protection is enabled for this database. Defaults to false.
        Drop protection is different from
        the "deletion_protection" attribute in the following ways:
        (1) "deletion_protection" only protects the database from deletions in Terraform.
        whereas setting “enableDropProtection” to true protects the database from deletions in all interfaces.
        (2) Setting "enableDropProtection" to true also prevents the deletion of the parent instance containing the database.
        "deletion_protection" attribute does not provide protection against the deletion of the parent instance.
    Optional: "true"
encryption_config:
    Type: TypeList
    Description: Encryption configuration for the database
    Optional: "true"
    MaxItems: "1"
    Properties:
        kms_key_name:
            Type: TypeString
            Description: |-
                Fully qualified name of the KMS key to use to encrypt this database. This key must exist
                in the same location as the Spanner Database.
            Required: "true"
instance:
    Type: TypeString
    Description: The instance to create the database on.
    Required: "true"
name:
    Type: TypeString
    Description: |-
        A unique identifier for the database, which cannot be changed after
        the instance is created. Values are of the form [a-z][-a-z0-9]*[a-z0-9].
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
state:
    Type: TypeString
    Description: An explanation of the status of the database.
    Computed: "true"
version_retention_period:
    Type: TypeString
    Description: |-
        The retention period for the database. The retention period must be between 1 hour
        and 7 days, and can be specified in days, hours, minutes, or seconds. For example,
        the values 1d, 24h, 1440m, and 86400s are equivalent. Default value is 1h.
        If this property is used, you must avoid adding new DDL statements to 'ddl' that
        update the database's version_retention_period.
    Computed: "true"
    Optional: "true"

