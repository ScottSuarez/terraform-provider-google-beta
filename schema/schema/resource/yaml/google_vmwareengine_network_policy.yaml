create_time:
    Type: TypeString
    Description: |-
        Creation time of this resource.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and
        up to nine fractional digits. Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
description:
    Type: TypeString
    Description: User-provided description for this network policy.
    Optional: "true"
edge_services_cidr:
    Type: TypeString
    Description: |-
        IP address range in CIDR notation used to create internet access and external IP access.
        An RFC 1918 CIDR block, with a "/26" prefix, is required. The range cannot overlap with any
        prefixes either in the consumer VPC network or in use by the private clouds attached to that VPC network.
    Required: "true"
external_ip:
    Type: TypeList
    Description: |-
        Network service that allows External IP addresses to be assigned to VMware workloads.
        This service can only be enabled when internetAccess is also enabled.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enabled:
            Type: TypeBool
            Description: True if the service is enabled; false otherwise.
            Optional: "true"
        state:
            Type: TypeString
            Description: State of the service. New values may be added to this enum when appropriate.
            Computed: "true"
internet_access:
    Type: TypeList
    Description: Network service that allows VMware workloads to access the internet.
    Computed: "true"
    Optional: "true"
    MaxItems: "1"
    Properties:
        enabled:
            Type: TypeBool
            Description: True if the service is enabled; false otherwise.
            Optional: "true"
        state:
            Type: TypeString
            Description: State of the service. New values may be added to this enum when appropriate.
            Computed: "true"
location:
    Type: TypeString
    Description: |-
        The resource name of the location (region) to create the new network policy in.
        Resource names are schemeless URIs that follow the conventions in https://cloud.google.com/apis/design/resource_names.
        For example: projects/my-project/locations/us-central1
    Required: "true"
name:
    Type: TypeString
    Description: The ID of the Network Policy.
    Required: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
uid:
    Type: TypeString
    Description: System-generated unique identifier for the resource.
    Computed: "true"
update_time:
    Type: TypeString
    Description: |-
        Last updated time of this resource.
        A timestamp in RFC3339 UTC "Zulu" format, with nanosecond resolution and up to nine
        fractional digits. Examples: "2014-10-02T15:01:23Z" and "2014-10-02T15:01:23.045123456Z".
    Computed: "true"
vmware_engine_network:
    Type: TypeString
    Description: |-
        The relative resource name of the VMware Engine network. Specify the name in the following form:
        projects/{project}/locations/{location}/vmwareEngineNetworks/{vmwareEngineNetworkId} where {project}
        can either be a project number or a project ID.
    Required: "true"
vmware_engine_network_canonical:
    Type: TypeString
    Description: |-
        The canonical name of the VMware Engine network in the form:
        projects/{project_number}/locations/{location}/vmwareEngineNetworks/{vmwareEngineNetworkId}
    Computed: "true"

