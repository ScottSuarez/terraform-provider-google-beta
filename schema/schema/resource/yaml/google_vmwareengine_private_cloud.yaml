description:
    Type: TypeString
    Description: User-provided description for this private cloud.
    Optional: "true"
hcx:
    Type: TypeList
    Description: Details about a HCX Cloud Manager appliance.
    Computed: "true"
    Properties:
        fqdn:
            Type: TypeString
            Description: Fully qualified domain name of the appliance.
            Optional: "true"
        internal_ip:
            Type: TypeString
            Description: Internal IP address of the appliance.
            Optional: "true"
        state:
            Type: TypeString
            Description: 'State of the appliance. Possible values: ["ACTIVE", "CREATING"]'
            Optional: "true"
        version:
            Type: TypeString
            Description: Version of the appliance.
            Optional: "true"
location:
    Type: TypeString
    Description: The location where the PrivateCloud should reside.
    Required: "true"
management_cluster:
    Type: TypeList
    Description: The management cluster for this private cloud. This used for creating and managing the default cluster.
    Required: "true"
    MaxItems: "1"
    Properties:
        cluster_id:
            Type: TypeString
            Description: |-
                The user-provided identifier of the new Cluster. The identifier must meet the following requirements:
                  * Only contains 1-63 alphanumeric characters and hyphens
                  * Begins with an alphabetical character
                  * Ends with a non-hyphen character
                  * Not formatted as a UUID
                  * Complies with RFC 1034 (https://datatracker.ietf.org/doc/html/rfc1034) (section 3.5)
            Required: "true"
        node_type_configs:
            Type: TypeSet
            Description: |-
                The map of cluster node types in this cluster,
                where the key is canonical identifier of the node type (corresponds to the NodeType).
            Optional: "true"
            Properties:
                custom_core_count:
                    Type: TypeInt
                    Description: |-
                        Customized number of cores available to each node of the type.
                        This number must always be one of 'nodeType.availableCustomCoreCounts'.
                        If zero is provided max value from 'nodeType.availableCustomCoreCounts' will be used.
                        This cannot be changed once the PrivateCloud is created.
                    Optional: "true"
                node_count:
                    Type: TypeInt
                    Description: The number of nodes of this type in the cluster.
                    Required: "true"
                node_type_id:
                    Type: TypeString
                    Required: "true"
name:
    Type: TypeString
    Description: The ID of the PrivateCloud.
    Required: "true"
network_config:
    Type: TypeList
    Description: Network configuration in the consumer project with which the peering has to be done.
    Required: "true"
    MaxItems: "1"
    Properties:
        dns_server_ip:
            Type: TypeString
            Description: DNS Server IP of the Private Cloud.
            Computed: "true"
        management_cidr:
            Type: TypeString
            Description: Management CIDR used by VMware management appliances.
            Required: "true"
        management_ip_address_layout_version:
            Type: TypeInt
            Description: |-
                The IP address layout version of the management IP address range.
                Possible versions include:
                * managementIpAddressLayoutVersion=1: Indicates the legacy IP address layout used by some existing private clouds. This is no longer supported for new private clouds
                as it does not support all features.
                * managementIpAddressLayoutVersion=2: Indicates the latest IP address layout
                used by all newly created private clouds. This version supports all current features.
            Computed: "true"
        vmware_engine_network:
            Type: TypeString
            Description: |-
                The relative resource name of the VMware Engine network attached to the private cloud.
                Specify the name in the following form: projects/{project}/locations/{location}/vmwareEngineNetworks/{vmwareEngineNetworkId}
                where {project} can either be a project number or a project ID.
            Optional: "true"
        vmware_engine_network_canonical:
            Type: TypeString
            Description: |-
                The canonical name of the VMware Engine network in
                the form: projects/{project_number}/locations/{location}/vmwareEngineNetworks/{vmwareEngineNetworkId}
            Computed: "true"
nsx:
    Type: TypeList
    Description: Details about a NSX Manager appliance.
    Computed: "true"
    Properties:
        fqdn:
            Type: TypeString
            Description: Fully qualified domain name of the appliance.
            Optional: "true"
        internal_ip:
            Type: TypeString
            Description: Internal IP address of the appliance.
            Optional: "true"
        state:
            Type: TypeString
            Description: 'State of the appliance. Possible values: ["ACTIVE", "CREATING"]'
            Optional: "true"
        version:
            Type: TypeString
            Description: Version of the appliance.
            Optional: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
state:
    Type: TypeString
    Description: State of the resource. New values may be added to this enum when appropriate.
    Computed: "true"
type:
    Type: TypeString
    Description: 'Initial type of the private cloud. Possible values: ["STANDARD", "TIME_LIMITED"]'
    Optional: "true"
uid:
    Type: TypeString
    Description: System-generated unique identifier for the resource.
    Computed: "true"
vcenter:
    Type: TypeList
    Description: Details about a vCenter Server management appliance.
    Computed: "true"
    Properties:
        fqdn:
            Type: TypeString
            Description: Fully qualified domain name of the appliance.
            Optional: "true"
        internal_ip:
            Type: TypeString
            Description: Internal IP address of the appliance.
            Optional: "true"
        state:
            Type: TypeString
            Description: 'State of the appliance. Possible values: ["ACTIVE", "CREATING"]'
            Optional: "true"
        version:
            Type: TypeString
            Description: Version of the appliance.
            Optional: "true"

