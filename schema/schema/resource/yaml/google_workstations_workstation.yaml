annotations:
    Type: TypeMap
    Description: |-
        Client-specified annotations. This is distinct from labels.

        **Note**: This field is non-authoritative, and will only manage the annotations present in your configuration.
        Please refer to the field 'effective_annotations' for all of the annotations present on the resource.
    Optional: "true"
create_time:
    Type: TypeString
    Description: Time when this resource was created.
    Computed: "true"
display_name:
    Type: TypeString
    Description: Human-readable name for this resource.
    Optional: "true"
effective_annotations:
    Type: TypeMap
    Description: All of annotations (key/value pairs) present on the resource in GCP, including the annotations configured through Terraform, other clients and services.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
env:
    Type: TypeMap
    Description: '''Client-specified environment variables passed to the workstation container''s entrypoint.'''
    Optional: "true"
host:
    Type: TypeString
    Description: |-
        Host to which clients can send HTTPS traffic that will be received by the workstation.
        Authorized traffic will be received to the workstation as HTTP on port 80.
        To send traffic to a different port, clients may prefix the host with the destination port in the format "{port}-{host}".
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Client-specified labels that are applied to the resource and that are also propagated to the underlying Compute Engine resources.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: The location where the workstation parent resources reside.
    Required: "true"
name:
    Type: TypeString
    Description: Full name of this resource.
    Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
state:
    Type: TypeString
    Description: Current state of the workstation.
    Computed: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
uid:
    Type: TypeString
    Description: A system-assigned unique identified for this resource.
    Computed: "true"
workstation_cluster_id:
    Type: TypeString
    Description: The ID of the parent workstation cluster.
    Required: "true"
workstation_config_id:
    Type: TypeString
    Description: The ID of the parent workstation cluster config.
    Required: "true"
workstation_id:
    Type: TypeString
    Description: ID to use for the workstation.
    Required: "true"

