annotations:
    Type: TypeMap
    Description: |-
        Client-specified annotations. This is distinct from labels.

        **Note**: This field is non-authoritative, and will only manage the annotations present in your configuration.
        Please refer to the field 'effective_annotations' for all of the annotations present on the resource.
    Optional: "true"
conditions:
    Type: TypeList
    Description: Status conditions describing the current resource state.
    Computed: "true"
    Properties:
        code:
            Type: TypeInt
            Description: The status code, which should be an enum value of google.rpc.Code.
            Computed: "true"
        details:
            Type: TypeList
            Description: A list of messages that carry the error details.
            Computed: "true"
        message:
            Type: TypeString
            Description: Human readable message indicating details about the current status.
            Computed: "true"
create_time:
    Type: TypeString
    Description: Time when this resource was created.
    Computed: "true"
degraded:
    Type: TypeBool
    Description: |-
        Whether this resource is in degraded mode, in which case it may require user action to restore full functionality.
        Details can be found in the conditions field.
    Computed: "true"
display_name:
    Type: TypeString
    Description: Human-readable name for this resource.
    Optional: "true"
domain_config:
    Type: TypeList
    Description: Configuration options for a custom domain.
    Optional: "true"
    MaxItems: "1"
    Properties:
        domain:
            Type: TypeString
            Description: Domain used by Workstations for HTTP ingress.
            Required: "true"
effective_annotations:
    Type: TypeMap
    Description: All of annotations (key/value pairs) present on the resource in GCP, including the annotations configured through Terraform, other clients and services.
    Computed: "true"
effective_labels:
    Type: TypeMap
    Description: All of labels (key/value pairs) present on the resource in GCP, including the labels configured through Terraform, other clients and services.
    Computed: "true"
etag:
    Type: TypeString
    Description: |-
        Checksum computed by the server.
        May be sent on update and delete requests to ensure that the client has an up-to-date value before proceeding.
    Computed: "true"
labels:
    Type: TypeMap
    Description: |-
        Client-specified labels that are applied to the resource and that are also propagated to the underlying Compute Engine resources.

        **Note**: This field is non-authoritative, and will only manage the labels present in your configuration.
        Please refer to the field 'effective_labels' for all of the labels present on the resource.
    Optional: "true"
location:
    Type: TypeString
    Description: The location where the workstation cluster should reside.
    Optional: "true"
name:
    Type: TypeString
    Description: The name of the cluster resource.
    Computed: "true"
network:
    Type: TypeString
    Description: |-
        The relative resource name of the VPC network on which the instance can be accessed.
        It is specified in the following form: "projects/{projectNumber}/global/networks/{network_id}".
    Required: "true"
private_cluster_config:
    Type: TypeList
    Description: Configuration for private cluster.
    Optional: "true"
    MaxItems: "1"
    Properties:
        allowed_projects:
            Type: TypeList
            Description: |-
                Additional project IDs that are allowed to attach to the workstation cluster's service attachment.
                By default, the workstation cluster's project and the VPC host project (if different) are allowed.
            Computed: "true"
            Optional: "true"
        cluster_hostname:
            Type: TypeString
            Description: |-
                Hostname for the workstation cluster.
                This field will be populated only when private endpoint is enabled.
                To access workstations in the cluster, create a new DNS zone mapping this domain name to an internal IP address and a forwarding rule mapping that address to the service attachment.
            Computed: "true"
        enable_private_endpoint:
            Type: TypeBool
            Description: Whether Workstations endpoint is private.
            Required: "true"
        service_attachment_uri:
            Type: TypeString
            Description: |-
                Service attachment URI for the workstation cluster.
                The service attachment is created when private endpoint is enabled.
                To access workstations in the cluster, configure access to the managed service using (Private Service Connect)[https://cloud.google.com/vpc/docs/configure-private-service-connect-services].
            Computed: "true"
project:
    Type: TypeString
    Computed: "true"
    Optional: "true"
subnetwork:
    Type: TypeString
    Description: |-
        Name of the Compute Engine subnetwork in which instances associated with this cluster will be created.
        Must be part of the subnetwork specified for this cluster.
    Required: "true"
terraform_labels:
    Type: TypeMap
    Description: |-
        The combination of labels configured directly on the resource
         and default labels configured on the provider.
    Computed: "true"
uid:
    Type: TypeString
    Description: The system-generated UID of the resource.
    Computed: "true"
workstation_cluster_id:
    Type: TypeString
    Description: ID to use for the workstation cluster.
    Required: "true"

